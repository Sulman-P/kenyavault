    // ─── HELPERS ──────────────────────────────────────────────
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            id: params.get('id'),

            email: params.get('email')
        };
    }

    function formatCurrency(amount) {
        return 'KES ' + Number(amount).toLocaleString();
    }

    function getFileIcon(filename) {
        if (!filename) return '<i class="bi bi-file-earmark"></i>';
        const ext = filename.split('.').pop().toLowerCase();
        const icons = {
            'pdf': 'bi-file-earmark-pdf',
            'doc': 'bi-file-earmark-word',
            'docx': 'bi-file-earmark-word',
            'xls': 'bi-file-earmark-excel',

            'rar': 'bi-file-earmark-zip'
        };
        return '<i class="bi ' + (icons[ext] || 'bi-file-earmark') + '"></i>';
    }

    function getFileColor(filename) {
        if (!filename) return 'default';
        const ext = filename.split('.').pop().toLowerCase();
        const colors = {
            'pdf': 'pdf',
            'doc': 'doc',
            'docx': 'doc',
            'xls': 'xls',
            'xlsx': 'xls',
            'ppt': 'ppt',
            'pptx': 'ppt'
        };
        return colors[ext] || 'default';
    }

    // ─── SUPABASE FETCH ──────────────────────────────────────
    async function fetchFromSupabase(table, options = {}) {
        const { select = '*', filter = null, order = null, limit = null } = options;
        let url = SUPABASE_URL + '/rest/v1/' + table + '?select=' + select;
        
        if (filter) {
            url += '&' + filter;
        }
        if (order) {
            url += '&order=' + order;
        }
        if (limit) {
            url += '&limit=' + limit;
        }
        
        const response = await fetch(url, {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            }
        });
        
        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }
        return response.json();
    }

    async function checkPurchaseStatus(documentId, userId) {
        try {
            // Check if user has a completed transaction for this document
            const transactions = await fetchFromSupabase('transactions', {
                select: 'id,status,amount,created_at',
                filter: 'document_id=eq.' + documentId + '&user_id=eq.' + userId + '&status=eq.completed'
            });

            if (transactions && transactions.length > 0) {
                return { purchased: true, transaction: transactions[0] };
            }

            // Check if document is free
            const doc = await getDocumentDetails(documentId);
            if (doc && (doc.is_free || doc.price === 0)) {

            return { purchased: false };

        } catch (error) {
            console.error('[Download] Error checking purchase:', error);
            return { purchased: false, error: error.message };
        }
    }

    // ─── GET DOCUMENT DETAILS ────────────────────────────────
    async function getDocumentDetails(documentId) {
        try {
            const docs = await fetchFromSupabase('documents', {
                select: 'id,title,filename,file_url,price,is_free,download_count,created_at,category_title,level_title,grade_title,term,description',
                filter: 'id=eq.' + documentId
            });

            if (!docs || docs.length === 0) {
                return null;
            }

            return docs[0];
        } catch (error) {
            console.error('[Download] Error fetching document:', error);
            return null;
        }
    }

    // ─── GET USER INFO ──────────────────────────────────────
    function getUserInfo() {
        try {
            const session = localStorage.getItem('kv_user_session');
            if (session) {
                return JSON.parse(session);
            }
            // Check for admin session as fallback
            const adminSession = localStorage.getItem('kv_admin_session');
            if (adminSession) {
                return JSON.parse(adminSession);
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    // ─── INCREMENT DOWNLOAD COUNT ────────────────────────────
    async function incrementDownloadCount(documentId) {
        try {
            const response = await fetch(SUPABASE_URL + '/rest/v1/documents?id=eq.' + documentId, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    download_count: { increment: 1 }
                })
            });
            return response.ok;
        } catch (error) {
            console.error('[Download] Error incrementing download count:', error);
            return false;
        }
    }

    // ─── UPDATE UI STATES ─────────────────────────────────────
    function updateUI(state, data) {
        const doc = data?.document || null;
        const user = data?.user || null;
        const transaction = data?.transaction || null;
        
        // Update document info
        if (doc) {
            const iconHtml = getFileIcon(doc.filename);
            const iconColor = getFileColor(doc.filename);
            docTitle.textContent = doc.title || 'Unknown Document';
            docId.textContent = '# ' + (doc.id || '---');
            
            // Update icon in doc box
            const iconEl = docInfoBox.querySelector('i');
            if (iconEl) {
                iconEl.outerHTML = '<span class="file-icon ' + iconColor + '">' + iconHtml + '</span>';
            }
        }

        // Update user info
        if (user) {
            userInfo.classList.remove('hidden');
            userName.textContent = user.name || user.email || user.full_name || 'User';
            userEmail.textContent = user.email || '';
        }

        // Reset all buttons
        downloadBtn.style.display = 'none';
        whatsappBtn.style.display = 'none';
        retryBtn.style.display = 'none';
        backToShopBtn.style.display = 'none';
        viewItemBtn.style.display = 'none';

        // Reset progress bar
        progressBar.className = 'progress-bar';
        
        switch (state) {
            case 'success':
            case 'free':
                const isFree = state === 'free';
                iconWrap.className = 'icon-wrap icon-wrap--success';
                iconWrap.innerHTML = '<i class="bi bi-check-circle-fill"></i>';
                statusBadge.className = 'status-badge status-badge--success';
                statusBadge.innerHTML = '<i class="bi bi-check-circle"></i> ' + (isFree ? 'Free Download' : 'Ready for Download');
                statusTitle.className = 'download-title download-title--success';
                statusTitle.textContent = isFree ? 'Free Resource Available!' : 'Your Document is Ready!';
                statusMessage.textContent = isFree 
                    ? 'This is a free resource. Click the button below to download it instantly.'
                    : 'You have successfully purchased this document. Click the button below to download it.';
                
                progressBar.className = 'progress-bar animate';
                
                // Show payment status
                paymentStatus.classList.remove('hidden');
                if (isFree) {
                    paymentStatus.className = 'payment-status payment-status--free';
                    paymentStatus.innerHTML = '<i class="bi bi-gift-fill"></i> <span id="paymentStatusText">✓ Free Resource</span>';
                } else if (transaction) {
                    paymentStatus.className = 'payment-status payment-status--paid';
                    paymentStatus.innerHTML = '<i class="bi bi-check-circle-fill"></i> <span id="paymentStatusText">✓ Paid &amp; Verified</span>';
                } else {
                    paymentStatus.className = 'payment-status payment-status--pending';
                    paymentStatus.innerHTML = '<i class="bi bi-clock"></i> <span id="paymentStatusText">Processing...</span>';
                }
                
                downloadBtn.style.display = 'flex';
                downloadBtn.textContent = isFree ? '<i class="bi bi-download"></i> Download Free' : '<i class="bi bi-download"></i> Download Now';
                backToShopBtn.style.display = 'inline-block';
                viewItemBtn.style.display = 'inline-block';
                if (doc && doc.id) {
                    viewItemBtn.href = '/item.html?id=' + doc.id;
                }
                
                // Set up download button
                downloadBtn.onclick = async function() {
                    statusMessage.textContent = 'Starting download...';
                    downloadBtn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Downloading...';
                    downloadBtn.disabled = true;
                    
                    // Increment download count
                    if (doc && doc.id) {
                        await incrementDownloadCount(doc.id);
                    }
                    
                    // Trigger download
                    if (doc && doc.file_url) {
                        window.open(doc.file_url, '_blank');
                        statusMessage.textContent = 'Download started! Your file is being saved.';
                        downloadBtn.innerHTML = '<i class="bi bi-check-circle"></i> Downloaded';
                        downloadBtn.disabled = false;
                    } else {
                        statusMessage.textContent = 'Error: File not available. Please contact support.';
                        downloadBtn.innerHTML = '<i class="bi bi-exclamation-circle"></i> Error';
                        downloadBtn.disabled = false;
                        showSupportOptions(doc);
                    }
                };
                break;

            case 'pending':
                iconWrap.className = 'icon-wrap icon-wrap--pending';
                iconWrap.innerHTML = '<div class="spinner"></div>';
                statusBadge.className = 'status-badge status-badge--pending';
                statusBadge.innerHTML = '<i class="bi bi-clock-history"></i> Verifying';
                statusTitle.className = 'download-title download-title--pending';
                statusTitle.textContent = 'Verifying Your Purchase';
                statusMessage.textContent = 'Please wait while we verify your purchase and prepare your document...';
                progressBar.style.width = '65%';
                paymentStatus.classList.remove('hidden');
                paymentStatus.className = 'payment-status payment-status--pending';
                paymentStatus.innerHTML = '<i class="bi bi-clock"></i> <span id="paymentStatusText">Checking purchase status...</span>';
                retryBtn.style.display = 'inline-block';
                retryBtn.textContent = 'Check Status';
                retryBtn.onclick = function() {
                    location.reload();
                };
                break;

            case 'missing':
                iconWrap.className = 'icon-wrap icon-wrap--error';
                iconWrap.innerHTML = '<i class="bi bi-file-earmark-excel"></i>';
                statusBadge.className = 'status-badge status-badge--error';
                statusBadge.innerHTML = '<i class="bi bi-exclamation-triangle"></i> File Unavailable';
                statusTitle.className = 'download-title download-title--error';
                statusTitle.textContent = 'File Synchronizing';
                statusMessage.innerHTML = 'The file for your purchased document is being refreshed. You have already paid and can download it immediately below.';
                progressBar.style.width = '0%';
                paymentStatus.classList.remove('hidden');
                paymentStatus.className = 'payment-status payment-status--paid';
                paymentStatus.innerHTML = '<i class="bi bi-check-circle-fill"></i> <span id="paymentStatusText">✓ Paid</span>';
                showSupportOptions(doc);
                break;

            case 'not_purchased':
                iconWrap.className = 'icon-wrap icon-wrap--error';
                iconWrap.innerHTML = '<i class="bi bi-x-circle-fill"></i>';
                statusBadge.className = 'status-badge status-badge--error';
                statusBadge.innerHTML = '<i class="bi bi-exclamation-circle"></i> Access Denied';
                statusTitle.className = 'download-title download-title--error';
                statusTitle.textContent = 'Document Not Purchased';
                statusMessage.innerHTML = 'You have not purchased this document. Please purchase it first to download.';
                progressBar.style.width = '0%';
                paymentStatus.classList.add('hidden');
                backToShopBtn.style.display = 'inline-block';
                viewItemBtn.style.display = 'inline-block';
                if (doc && doc.id) {
                    viewItemBtn.href = '/item.html?id=' + doc.id;
                }
                break;

            case 'error':
            default:
                iconWrap.className = 'icon-wrap icon-wrap--error';
                iconWrap.innerHTML = '<i class="bi bi-x-circle-fill"></i>';
                statusBadge.className = 'status-badge status-badge--error';
                statusBadge.innerHTML = '<i class="bi bi-exclamation-circle"></i> Error';
                statusTitle.className = 'download-title download-title--error';
                statusTitle.textContent = 'Access Denied';
                statusMessage.innerHTML = 'An error occurred. Please try again or contact support.';
                progressBar.style.width = '0%';
                paymentStatus.classList.add('hidden');
                showSupportOptions(doc);
                break;
        }
    }

    function showSupportOptions(doc) {
        const supportPhone = '254768515494';
        const docTitle = doc ? doc.title : 'Document';
        const docId = doc ? doc.id : 'unknown';
        const waMsg = encodeURIComponent(
            'Hello KenyaVault Support, I need help with Document #' + docId + 
            ' ("' + docTitle.substring(0, 40) + '"). Please assist me.'
        );
        whatsappBtn.href = 'https://wa.me/' + supportPhone + '?text=' + waMsg;
        whatsappBtn.style.display = 'flex';
        retryBtn.style.display = 'inline-block';
        retryBtn.textContent = 'Click here to retry download';
        retryBtn.onclick = function() {
            location.reload();
        };
        backToShopBtn.style.display = 'inline-block';
        if (doc && doc.id) {
            viewItemBtn.href = '/item.html?id=' + doc.id;
            viewItemBtn.style.display = 'inline-block';
        }
    }

    // ─── MAIN PROCESS ─────────────────────────────────────────
    async function processDownload() {
        const params = getUrlParams();
        const documentId = params.id;
        
        // Check if we have a document ID
        if (!documentId) {
            updateUI('error', { document: { title: 'No Document Specified' } });
            return;
        }

        try {
            // Get document details
            const document = await getDocumentDetails(documentId);
            
            if (!document) {
                updateUI('error', { document: { id: documentId, title: 'Document Not Found' } });
                return;
            }

            // Check if document is free
            if (document.is_free || document.price === 0) {
                updateUI('free', { document: document, user: null });
                return;
            }

            // Get user info
            const user = getUserInfo();
            
            if (!user) {
                // User not logged in - check if there's a token
                if (params.token && params.email) {
                    // Token-based download (from shareable link)
                    updateUI('pending', { document: document, user: { email: params.email, name: params.email.split('@')[0] } });
                    // Simulate token validation
                    setTimeout(() => {
                        updateUI('success', { 
                            document: document, 
                            user: { email: params.email, name: params.email.split('@')[0] },
                            transaction: { status: 'completed' }
                        });
                    }, 1500);
                    return;
                }
                
                // User not logged in and no token - show login prompt
                updateUI('error', { document: document, user: null });
                statusMessage.textContent = 'Please login to download this document.';
                return;
            }

            // User is logged in - check purchase status
            updateUI('pending', { document: document, user: user });

            const purchase = await checkPurchaseStatus(documentId, user.id);

            if (purchase.purchased) {
                // User has purchased or document is free
                updateUI('success', { 
                    document: document, 
                    user: user,
                    transaction: purchase.transaction || null
                });
            } else {
                // User has not purchased
                updateUI('not_purchased', { document: document, user: user });
            }

        } catch (error) {
            console.error('[Download] Process error:', error);
            updateUI('error', { document: { id: documentId, title: 'Error' } });
            statusMessage.textContent = 'An error occurred: ' + error.message;
        }
    }

    // ─── INIT ──────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
        // Check for URL params
        const params = getUrlParams();
        
        // If no id param, try to get from session
        if (!params.id) {
            // Check if there's a pending download in session
            const pendingDownload = sessionStorage.getItem('kv_pending_download');
            if (pendingDownload) {
                try {
                    const data = JSON.parse(pendingDownload);
                    if (data.id) {
                        // Redirect with id
                        window.location.href = '/download.html?id=' + data.id;
                        return;
                    }
                } catch(e) {}
            }
            
            // Show error
            updateUI('error', { document: { title: 'No Document Specified' } });
            statusMessage.textContent = 'Please specify a document ID to download.';
            return;
        }

        processDownload();
    });

})();
</script>
