<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tutor Portal — KenyaVault Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ════════════════════════════════════════════════
           DESIGN TOKENS
           ════════════════════════════════════════════════ */
        :root {
            --navy: #0B2340;
            --navy-2: #123059;
            --navy-3: #1a3a5a;
            --ink: #101828;
            --muted: #5B6472;
            --muted-soft: #8A93A3;
            --line: #E7E2D6;
            --paper: #F7F5F0;
            --surface: #FFFFFF;

            --gold: #C9971F;
            --gold-light: #E8B94A;
            --gold-soft: #F7EBD0;

            --green: #1F7A3A;
            --green-soft: #E3F3E7;
            --red: #C0392B;
            --red-soft: #FBEAE7;
            --blue: #2A5C8A;
            --blue-soft: #E7EEF5;
            --purple: #6B4FA0;
            --purple-soft: #EFEAF7;

            --r-sm: 8px;
            --r: 10px;
            --r-lg: 16px;
            --r-xl: 20px;

            --shadow-sm: 0 1px 2px rgba(11,35,64,0.06), 0 1px 1px rgba(11,35,64,0.04);
            --shadow-md: 0 6px 20px rgba(11,35,64,0.08);
            --shadow-lg: 0 16px 48px rgba(11,35,64,0.16);

            --font-display: 'Sora', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

            --sidebar-w: 272px;
            --topbar-h: 64px;
            --safe-b: env(safe-area-inset-bottom, 0px);

            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark {
            --navy: #0B2340;
            --ink: #EAECF0;
            --muted: #98A2B3;
            --muted-soft: #667085;
            --line: #26344A;
            --paper: #0D1626;
            --surface: #14213A;
            --gold-soft: rgba(201,151,31,0.14);
            --green-soft: rgba(31,122,58,0.16);
            --red-soft: rgba(192,57,43,0.16);
            --blue-soft: rgba(42,92,138,0.2);
            --purple-soft: rgba(107,79,160,0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--ink);
            transition: background 0.25s var(--ease), color 0.25s var(--ease);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; }
        button, input, select, textarea { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #2c3c56; }

        .numeric { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

        /* ════════════════════════════════════════════════
           PRIMITIVES
           ════════════════════════════════════════════════ */
        .btn-gold {
            background: var(--gold);
            color: var(--navy);
            padding: 12px 28px;
            border: none;
            border-radius: var(--r);
            font-weight: 700;
            font-size: 0.92rem;
            transition: all 0.2s var(--ease);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-body);
            box-shadow: var(--shadow-sm);
        }
        .btn-gold:hover:not(:disabled) {
            background: var(--gold-light);
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(201,151,31,0.28);
        }
        .btn-gold:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .btn-outline {
            padding: 11px 20px;
            border: 1.5px solid var(--line);
            border-radius: var(--r);
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

        .btn-link {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s var(--ease);
        }
        .btn-link:hover { text-decoration: underline; color: var(--gold-light); }

        .btn-sm {
            padding: 7px 16px;
            border-radius: 7px;
            border: none;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            background: var(--gold);
            color: var(--navy);
            font-family: var(--font-body);
        }
        .btn-sm:hover { background: var(--gold-light); }
        .btn-sm.outline { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }
        .btn-sm.outline:hover { background: var(--gold); color: var(--navy); }
        .btn-sm.green { background: var(--green); color: #fff; }
        .btn-sm.green:hover { background: #16692e; }
        .btn-sm.blue { background: var(--blue); color: #fff; }
        .btn-sm.blue:hover { background: #234a70; }

        .btn-danger {
            padding: 6px 14px;
            border-radius: 7px;
            border: none;
            background: var(--red-soft);
            color: var(--red);
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        .btn-danger:hover { background: #f6d3cc; }
        .dark .btn-danger:hover { background: rgba(192,57,43,0.28); }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--line);
            border-radius: var(--r);
            font-size: 0.9rem;
            font-family: var(--font-body);
            transition: all 0.2s var(--ease);
            background: var(--surface);
            color: var(--ink);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201,151,31,0.12);
        }
        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 0.1px;
        }
        .req { color: var(--red); }

        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            display: inline-block;
            letter-spacing: 0.2px;
        }
        .status-badge.approved, .status-badge.paid, .status-badge.live, .status-badge.completed.ok { background: var(--green-soft); color: var(--green); }
        .status-badge.pending, .status-badge.scheduled { background: var(--gold-soft); color: #9A7415; }
        .status-badge.rejected, .status-badge.cancelled { background: var(--red-soft); color: var(--red); }
        .status-badge.completed { background: var(--blue-soft); color: var(--blue); }
        .status-badge.draft { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }

        /* ════════════════════════════════════════════════
           LOGIN PAGE
           ════════════════════════════════════════════════ */
        .login-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            background: var(--paper);
        }
        @media (max-width: 900px) {
            .login-shell { grid-template-columns: 1fr; }
            .login-aside { display: none; }
        }

        .login-aside {
            background: linear-gradient(160deg, var(--navy) 0%, var(--navy-3) 60%, #24507c 100%);
            position: relative;
            overflow: hidden;
            padding: 56px 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .login-aside::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cpath d='M45 15L15 32l30 17 30-17-30-17zm0 0l-18 10 18 10 18-10-18-10zM15 32v26l30 17 30-17V32l-30 17-30-17z' stroke='%23FFFFFF' stroke-opacity='0.05' stroke-width='1'/%3E%3C/g%3E%3C/svg%3E");
            background-size: 90px 90px;
            pointer-events: none;
        }
        .login-aside .aside-top { position: relative; z-index: 1; }
        .login-aside .brandmark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .login-aside .brandmark .mark {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.05rem; color: var(--navy);
            font-family: var(--font-display);
        }
        .login-aside .brandmark .name {
            font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: #fff;
        }
        .login-aside .brandmark .name span { color: var(--gold-light); }

        .login-aside .aside-headline {
            position: relative; z-index: 1;
            margin-top: 64px;
        }
        .login-aside .aside-headline h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(1.6rem, 2.6vw, 2.1rem);
            color: #fff;
            line-height: 1.25;
            max-width: 420px;
        }
        .login-aside .aside-headline p {
            margin-top: 14px;
            color: rgba(255,255,255,0.6);
            font-size: 0.92rem;
            max-width: 380px;
            line-height: 1.6;
        }
        .aside-stats {
            position: relative; z-index: 1;
            display: flex;
            gap: 28px;
            margin-top: 40px;
        }
        .aside-stats .stat .n { font-family: var(--font-mono); font-weight: 700; font-size: 1.4rem; color: var(--gold-light); }
        .aside-stats .stat .l { font-size: 0.7rem; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }

        .login-aside .aside-foot {
            position: relative; z-index: 1;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.35);
        }

        .login-main {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            position: relative;
        }
        .dark-toggle {
            position: absolute;
            top: 20px; right: 20px;
            padding: 9px 12px;
            border-radius: var(--r);
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s var(--ease);
        }
        .dark-toggle:hover { border-color: var(--gold); color: var(--gold); }

        .login-form-wrap { width: 100%; max-width: 440px; }
        .login-form-wrap .mobile-brand {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        @media (max-width: 900px) {
            .login-form-wrap .mobile-brand { display: flex; }
        }
        .login-form-wrap .mobile-brand .mark {
            width: 36px; height: 36px; border-radius: 9px; background: var(--navy);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: var(--gold); font-family: var(--font-display);
        }
        .login-form-wrap .mobile-brand .name { font-family: var(--font-display); font-weight: 800; color: var(--navy); font-size: 1.1rem; }
        .dark .login-form-wrap .mobile-brand .name { color: #fff; }

        .login-form-wrap h2 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--ink);
        }
        .login-form-wrap .sub { color: var(--muted); font-size: 0.88rem; margin-top: 4px; margin-bottom: 24px; }

        .auth-tabs {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px 20px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        .auth-tab:hover { background: var(--gold-soft); }
        .auth-tab.active { background: var(--gold); color: var(--navy); }

        .alert {
            padding: 11px 14px;
            border-radius: var(--r);
            font-size: 0.83rem;
            margin-bottom: 16px;
            border: 1px solid;
        }
        .alert.error { background: var(--red-soft); border-color: rgba(192,57,43,0.25); color: var(--red); }
        .alert.success { background: var(--green-soft); border-color: rgba(31,122,58,0.25); color: var(--green); }

        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }
        .field { margin-bottom: 16px; }

        .password-strength { display: flex; gap: 4px; margin-top: 6px; }
        .password-strength .bar { flex: 1; height: 3px; border-radius: 99px; background: var(--line); transition: all 0.3s var(--ease); }
        .password-strength .bar.active.weak { background: var(--red); }
        .password-strength .bar.active.medium { background: var(--gold); }
        .password-strength .bar.active.strong { background: var(--green); }

        .forgot-row { text-align: center; margin-top: 16px; }

        .reset-modal {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(11,35,64,0.55);
            backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .reset-modal.open { display: flex; }
        .reset-modal-box {
            background: var(--surface);
            border-radius: var(--r-lg);
            padding: 28px;
            max-width: 400px; width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .reset-modal-box h4 { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; text-align: center; }
        .reset-modal-box p { font-size: 0.84rem; color: var(--muted); text-align: center; margin: 6px 0 16px; }
        .reset-modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .reset-modal-actions .btn-outline, .reset-modal-actions .btn-gold { flex: 1; }

        /* ════════════════════════════════════════════════
           DASHBOARD SHELL
           ════════════════════════════════════════════════ */
        .dashboard-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--navy);
            color: #fff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s var(--ease);
        }
        .dark .sidebar { background: #0a1830; }

        .sidebar-logo {
            padding: 22px 22px 18px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .sidebar-logo .brand { display: flex; align-items: center; gap: 10px; }
        .sidebar-logo .mark {
            width: 34px; height: 34px; border-radius: 8px;
            background: var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: var(--navy); font-family: var(--font-display); font-size: 0.9rem;
        }
        .sidebar-logo .name { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
        .sidebar-logo .name span { color: var(--gold-light); }
        .sidebar-close-btn {
            display: none; background: none; border: none; color: #fff; font-size: 1.3rem;
            cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm);
        }
        .sidebar-close-btn:hover { background: rgba(255,255,255,0.1); }

        .sidebar-status-chip {
            margin: 0 22px 18px;
            padding: 10px 12px;
            border-radius: var(--r);
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .sidebar-status-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .sidebar-status-chip.approved { background: rgba(31,122,58,0.18); color: #6ee7a0; }
        .sidebar-status-chip.approved .dot { background: #34d399; }
        .sidebar-status-chip.pending { background: rgba(201,151,31,0.16); color: var(--gold-light); }
        .sidebar-status-chip.pending .dot { background: var(--gold-light); animation: pulse-dot 1.6s infinite; }
        .sidebar-status-chip.rejected { background: rgba(192,57,43,0.18); color: #f5988c; }
        .sidebar-status-chip.rejected .dot { background: #f5988c; }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

        .sidebar-menu { flex: 1; padding: 4px 12px; }
        .sidebar-menu .menu-label {
            font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1.4px;
            color: rgba(255,255,255,0.28); padding: 12px 12px 6px;
        }
        .sidebar-menu .menu-item {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; border-radius: var(--r);
            color: rgba(255,255,255,0.62); cursor: pointer;
            transition: all 0.18s var(--ease); margin-bottom: 2px;
            border: none; background: transparent; width: 100%;
            font-size: 0.87rem; font-weight: 500; text-align: left;
            font-family: var(--font-body); position: relative;
        }
        .sidebar-menu .menu-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .sidebar-menu .menu-item.active {
            background: rgba(201,151,31,0.16); color: var(--gold-light);
        }
        .sidebar-menu .menu-item.active::before {
            content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
            background: var(--gold); border-radius: 0 3px 3px 0;
        }
        .sidebar-menu .menu-item.locked { opacity: 0.38; cursor: not-allowed; }
        .sidebar-menu .menu-item.locked:hover { background: transparent; color: rgba(255,255,255,0.62); }
        .sidebar-menu .menu-item i { width: 18px; font-size: 0.95rem; text-align: center; }
        .sidebar-menu .menu-item .badge {
            margin-left: auto; background: rgba(201,151,31,0.22); color: var(--gold-light);
            font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 12px;
        }
        .sidebar-menu .menu-item .lock-ico { margin-left: auto; font-size: 0.72rem; opacity: 0.6; }

        .sidebar-footer {
            padding: 16px 20px calc(16px + var(--safe-b));
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: auto;
        }
        .sidebar-footer .tutor-row { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
        .sidebar-footer .avatar {
            width: 38px; height: 38px; border-radius: 50%; background: var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.95rem; color: var(--navy); flex-shrink: 0;
        }
        .sidebar-footer .tname { font-weight: 600; font-size: 0.87rem; }
        .sidebar-footer .temail { font-size: 0.68rem; color: rgba(255,255,255,0.4); }
        .logout-btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 14px; border-radius: var(--r); color: #f5988c;
            background: rgba(192,57,43,0.14); border: none; cursor: pointer;
            transition: all 0.2s var(--ease); font-weight: 600; font-size: 0.83rem;
        }
        .logout-btn:hover { background: rgba(192,57,43,0.24); }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(11,35,64,0.5); backdrop-filter: blur(4px);
            z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease);
        }
        .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

        .main-content { flex: 1; margin-left: var(--sidebar-w); min-height: 100vh; min-width: 0; }

        .top-navbar {
            background: rgba(247,245,240,0.85);
            border-bottom: 1px solid var(--line);
            padding: 0 24px; height: var(--topbar-h);
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px);
        }
        .dark .top-navbar { background: rgba(13,22,38,0.85); }
        .top-navbar .page-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
        .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

        .topbar-clock {
            font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500;
            background: var(--surface); padding: 6px 13px; border-radius: 99px;
            border: 1px solid var(--line); display: flex; align-items: center; gap: 7px;
        }
        .topbar-clock .clock-icon { color: var(--gold); font-size: 0.72rem; }
        .topbar-clock .sep { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .topbar-clock .clock-date { font-weight: 400; font-size: 0.68rem; opacity: 0.65; margin-left: 2px; }

        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
            cursor: pointer; color: var(--muted); transition: all 0.2s var(--ease); flex-shrink: 0;
        }
        .icon-btn:hover { border-color: var(--gold); color: var(--gold); }

            const [orders, setOrders] = useState([]);
            const [classes, setClasses] = useState([]);
            const [loading, setLoading] = useState(true);

            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [debugInfo, setDebugInfo] = useState([]);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 900);
            const [payoutRequests, setPayoutRequests] = useState([]);

                localStorage.setItem('tutor-dark-mode', darkMode);
                if (darkMode) document.documentElement.classList.add('dark');

            useEffect(() => {
                const tutorId = sessionStorage.getItem('tutor_id');
                if (tutorId) loadTutorData(tutorId);

                    setIsMobile(window.innerWidth <= 900);

                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);

                setDebugInfo(prev => [...prev, { message, type, timestamp: new Date().toLocaleTimeString() }]);

            };

            const loadTutorData = async (tutorId) => {
                setLoading(true);
                setDebugInfo([]);
                try {
                    const tRes = await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${tutorId}&select=*`, {
                        headers: { 
                            'apikey': SUPABASE_ANON_KEY, 
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'

                    if (tRes.ok) {
                        const data = await tRes.json();

                            setTutor(data[0]);

                            addDebug('❌ No tutor found with ID: ' + tutorId, 'error');

                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        if (rRes.ok) {
                            const data = await rRes.json();
                            setResources(data || []);
                            addDebug(`✅ Loaded ${data.length} resources`, 'success');
                        } else {
                            addDebug('❌ Failed to load resources: ' + rRes.status, 'error');

                    } catch (e) { 
                        addDebug('❌ Error loading resources: ' + e.message, 'error');
                    }

                    try {
                        const oRes = await fetch(`${SUPABASE_URL}/rest/v1/orders?tutor_id=eq.${tutorId}&select=*&order=created_at.desc`, {
                            headers: { 
                                'apikey': SUPABASE_ANON_KEY, 
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        if (oRes.ok) {
                            const data = await oRes.json();
                            const processedOrders = data.map(o => ({
                                ...o,
                                tutor_share: o.tutor_share || Math.round((o.total_amount || o.item_price || 0) * 0.8)
                            }));
                            setOrders(processedOrders);
                            addDebug(`✅ Loaded ${processedOrders.length} orders with tutor shares`, 'success');
                        } else {
                            addDebug('❌ Failed to load orders: ' + oRes.status, 'error');
                        }
                    } catch (e) { 
                        addDebug('❌ Error loading orders: ' + e.message, 'error');
                    }

                    try {
                        const cRes = await fetch(`${SUPABASE_URL}/rest/v1/classes?tutor_id=eq.${tutorId}&select=*`, {
                            headers: { 
                                'apikey': SUPABASE_ANON_KEY, 
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        if (cRes.ok) {
                            const data = await cRes.json();
                            setClasses(data || []);
                            addDebug(`✅ Loaded ${data.length} classes`, 'success');
                        } else {
                            addDebug('❌ Failed to load classes: ' + cRes.status, 'error');
                        }
                    } catch (e) { 
                        addDebug('❌ Error loading classes: ' + e.message, 'error');
                    }

                    try {
                        const pRes = await fetch(`${SUPABASE_URL}/rest/v1/tutor_payouts?tutor_id=eq.${tutorId}&select=*&order=created_at.desc`, {
                            headers: { 
                                'apikey': SUPABASE_ANON_KEY, 
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        if (pRes.ok) {
                            const data = await pRes.json();
                            setPayoutRequests(data || []);
                            addDebug(`✅ Loaded ${data.length} payout requests`, 'success');
                        } else if (pRes.status === 404) {
                            addDebug('ℹ️ Payouts table not found, using localStorage fallback', 'info');
                            const savedPayouts = localStorage.getItem('kv_tutor_payouts');
                            if (savedPayouts) {
                                try {
                                    const parsed = JSON.parse(savedPayouts);
                                    setPayoutRequests(parsed || []);
                                    addDebug(`✅ Loaded ${parsed.length} payout requests from localStorage`, 'success');

                            if (savedPayouts) {
                                try {
                                    const parsed = JSON.parse(savedPayouts);
                                    setPayoutRequests(parsed || []);
                                    addDebug(`✅ Loaded ${parsed.length} payout requests from localStorage`, 'success');
                                } catch (e) {}
                            }
                        }
                    } catch (e) { 
                        addDebug(`⚠️ Payouts load error: ${e.message}`, 'warning');
                        const savedPayouts = localStorage.getItem('kv_tutor_payouts');
                        if (savedPayouts) {
                            try {
                                const parsed = JSON.parse(savedPayouts);
                                setPayoutRequests(parsed || []);
                                addDebug(`✅ Loaded ${parsed.length} payout requests from localStorage`, 'success');
                            } catch (e) {}
                        }
                    }

                } catch (e) { 
                    console.error('Load error:', e); 
                    addDebug('❌ Error loading data: ' + e.message, 'error');
                }
                setLoading(false);
            };

            const refreshData = () => {
                const tutorId = sessionStorage.getItem('tutor_id');
                if (tutorId) loadTutorData(tutorId);
            };

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const logout = () => {
                sessionStorage.removeItem('tutor_id');
                sessionStorage.removeItem('tutor_email');
                sessionStorage.removeItem('tutor_name');
                setIsLoggedIn(false);
                setTutor(null);
                setResources([]);
                setOrders([]);
                setClasses([]);
                setPayoutRequests([]);
                setActiveTab('dashboard');
                setDebugInfo([]);
                showNotification('Logged out successfully', 'success');
                setTimeout(() => { window.location.href = '/'; }, 500);
            };

            const toggleDarkMode = () => setDarkMode(!darkMode);
            const toggleSidebar = () => setSidebarOpen(!sidebarOpen);
            const closeSidebar = () => setSidebarOpen(false);

            const calculateEarnings = () => {
                let total = 0, pending = 0, completed = 0;
                orders.forEach(o => {
                    const share = o.tutor_share || Math.round((o.total_amount || o.item_price || 0) * 0.8);
                    total += share;
                    const status = o.status || o.payment_status || 'pending';
                    if (status === 'pending' || status === 'processing' || status === 'initiated') {
                        pending += share;
                    } else if (status === 'completed' || status === 'paid' || status === 'approved' || status === 'success' || status === 'confirmed') {
                        completed += share;
                    }
                });
                const paidOut = payoutRequests
                    .filter(p => p.status === 'paid')
                    .reduce((sum, p) => sum + (p.amount || 0), 0);
                return { total, pending, completed, paidOut };
            };

            const requestPayout = async (amount) => {
                const tutorId = sessionStorage.getItem('tutor_id');
                if (!tutorId) return null;
                
                try {
                    const payoutData = {
                        tutor_id: tutorId,
                        tutor_name: tutor?.name || sessionStorage.getItem('tutor_name') || 'Tutor',
                        amount: amount,
                        phone: tutor?.mpesa_number || '',
                        status: 'pending',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    
                    try {
                        const response = await fetch(`${SUPABASE_URL}/rest/v1/tutor_payouts`, {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=representation'
                            },
                            body: JSON.stringify(payoutData)
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            const newPayout = data[0] || data;
                            setPayoutRequests(prev => [newPayout, ...prev]);
                            const updated = [newPayout, ...payoutRequests];
                            localStorage.setItem('kv_tutor_payouts', JSON.stringify(updated));
                            return newPayout;
                        } else if (response.status === 404) {
                            addDebug('ℹ️ Payouts table not found, using localStorage', 'info');
                        } else {
                            addDebug(`⚠️ Payout API returned: ${response.status}`, 'warning');
                        }
                    } catch (e) {
                        console.warn('⚠️ Could not save payout to Supabase:', e.message);
                        addDebug(`⚠️ Payout API error: ${e.message}`, 'warning');
                    }
                    
                    const newPayout = { 
                        ...payoutData, 
                        id: 'local_' + Date.now(),
                        status: 'pending',
                        created_at: new Date().toISOString()
                    };
                    const updated = [newPayout, ...payoutRequests];
                    setPayoutRequests(updated);
                    localStorage.setItem('kv_tutor_payouts', JSON.stringify(updated));
                    addDebug(`📝 Payout saved to localStorage (ID: ${newPayout.id})`, 'info');
                    return newPayout;
                    
                } catch (e) {
                    console.error('Payout request error:', e);
                    addDebug(`❌ Payout error: ${e.message}`, 'error');
                    return null;
                }
            };

            const createClass = async (classData) => {
                const tutorId = sessionStorage.getItem('tutor_id');
                if (!tutorId) return null;
                
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/classes`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify({
                            ...classData,
                            tutor_id: tutorId,
                            tutor_name: tutor?.name || sessionStorage.getItem('tutor_name') || 'Tutor',
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString(),
                            status: 'scheduled',
                            attendees: 0
                        })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        const newClass = data[0] || data;
                        setClasses(prev => [newClass, ...prev]);
                        return newClass;
                    }
                    return null;
                } catch (e) {
                    console.error('Create class error:', e);
                    return null;
                }
            };

            const updateClassStatus = async (classId, status) => {
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/classes?id=eq.${classId}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            status: status,
                            updated_at: new Date().toISOString()
                        })
                    });
                    
                    if (response.ok) {
                        setClasses(prev => prev.map(c => 
                            c.id === classId ? { ...c, status: status } : c
                        ));
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('Update class error:', e);
                    return false;
                }
            };

            const deleteClass = async (classId) => {
                if (!confirm('Delete this class?')) return false;
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/classes?id=eq.${classId}`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    
                    if (response.ok) {
                        setClasses(prev => prev.filter(c => c.id !== classId));
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('Delete class error:', e);
                    return false;
                }
            };

            const uploadResource = async (file, title, price, level, subject, description, resourceType, isFree, curriculum) => {
                const tutorId = sessionStorage.getItem('tutor_id');
                if (!tutorId) return null;
                
                try {
                    const fileExt = file.name.split('.').pop().toLowerCase();
                    const safeFileName = `${Date.now()}.${fileExt}`;
                    const filePath = `resources/${level}/${subject}/${safeFileName}`;

                    const formData = new FormData();
                    formData.append('file', file);

                    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/kenyavault-resources/${filePath}`, {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        },
                        body: formData
                    });

                    if (!uploadRes.ok) {
                        const errorText = await uploadRes.text();
                        throw new Error(`Upload failed: ${uploadRes.status} - ${errorText}`);
                    }

                    const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/kenyavault-resources/${filePath}`;

                    const resourceData = {
                        title: title,
                        price: isFree ? 0 : parseInt(price) || 0,
                        level: level,
                        subject: subject,
                        description: description || '',
                        resource_type: resourceType || 'lesson-plan',
                        curriculum: curriculum || 'cbc',
                        file_url: fileUrl,
                        file_name: file.name,
                        file_size: file.size,
                        file_type: file.type || 'application/octet-stream',
                        is_free: isFree,
                        tutor_id: tutorId,
                        tutor_name: sessionStorage.getItem('tutor_name') || 'Tutor',
                        status: 'pending_review',
                        download_count: 0,
                        total_earnings: 0,
                        created_at: new Date().toISOString()
                    };

                    const saveRes = await fetch(`${SUPABASE_URL}/rest/v1/resources`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(resourceData)
                    });

                    if (!saveRes.ok) {
                        const errorText = await saveRes.text();
                        throw new Error(`Failed to save resource: ${saveRes.status} - ${errorText}`);
                    }

                    const result = await saveRes.json();
                    const newResource = result[0] || result;
                    setResources(prev => [newResource, ...prev]);
                    return newResource;

                } catch (e) {
                    console.error('Upload error:', e);
                    throw e;
                }
            };

            const updateProfileData = async (patch) => {
                const tutorId = sessionStorage.getItem('tutor_id');
                if (!tutorId) return false;
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${tutorId}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(patch)
                    });
                    if (response.ok) {
                        setTutor(prev => prev ? { ...prev, ...patch } : prev);
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('Profile update error:', e);
                    return false;
                }
            };

            return (
                <TutorContext.Provider value={{
                    darkMode, toggleDarkMode,
                    isLoggedIn, setIsLoggedIn,
                    tutor, setTutor,
                    resources, setResources,
                    orders, setOrders,
                    classes, setClasses,
                    payoutRequests, setPayoutRequests,
                    loading, setLoading,
                    notification, showNotification,
                    activeTab, setActiveTab,
                    logout,
                    loadTutorData,
                    refreshData,
                    sidebarOpen, toggleSidebar, closeSidebar,
                    debugInfo, addDebug,
                    isMobile,
                    calculateEarnings,
                    requestPayout,
                    createClass,
                    updateClassStatus,
                    deleteClass,
                    uploadResource,
                    updateProfileData,
                }}>
                    {children}
                </TutorContext.Provider>
            );
        }

        function useTutor() {
            const context = useContext(TutorContext);
            if (!context) throw new Error('useTutor must be used within TutorProvider');
            return context;
        }

        // ────────────────────────────────────────────────
        // LOGIN PAGE
        // ────────────────────────────────────────────────
        function LoginPage() {
            const { setIsLoggedIn, setTutor, showNotification, loadTutorData, darkMode, toggleDarkMode, addDebug } = useTutor();
            const [activeAuth, setActiveAuth] = useState('login');
            const [loginPhone, setLoginPhone] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [showResetModal, setShowResetModal] = useState(false);
            const [resetPhone, setResetPhone] = useState('');
            const [resetLoading, setResetLoading] = useState(false);
            const [resetMessage, setResetMessage] = useState('');
            const [debugInfo, setDebugInfo] = useState([]);

            const [signupData, setSignupData] = useState({
                name: '', email: '', phone: '', mpesa: '', password: '', confirmPassword: '',
                subjects: [], levels: [], bio: ''
            });
            const [signupLoading, setSignupLoading] = useState(false);
            const [signupError, setSignupError] = useState('');
            const [passwordStrength, setPasswordStrength] = useState(0);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                setDebugInfo([]);
                
                if (!loginPhone || !loginPassword) {
                    setLoginError('Please enter both phone number and password.');
                    return;
                }

                setLoginLoading(true);
                addDebug(`Attempting login with phone: ${loginPhone}`);

                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/tutors?phone=eq.${loginPhone}&select=*`, {
                        headers: { 
                            'apikey': SUPABASE_ANON_KEY, 
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!res.ok) {
                        addDebug(`Query failed: ${res.status}`, 'error');
                        setLoginError('Error connecting to database.');
                        setLoginLoading(false);
                        return;
                    }

                    const data = await res.json();

                    if (data.length === 0) {
                        addDebug('No tutor found', 'error');
                        setLoginError('No account found with this phone number.');
                        setLoginLoading(false);
                        return;
                    }

                    const tutor = data[0];

                    if (tutor.password !== loginPassword) {
                        addDebug('Password mismatch', 'error');
                        setLoginError('Invalid password.');
                        setLoginLoading(false);
                        return;
                    }

                    addDebug('Login successful!', 'success');
                    sessionStorage.setItem('tutor_id', tutor.id);
                    sessionStorage.setItem('tutor_email', tutor.email);
                    sessionStorage.setItem('tutor_name', tutor.name);
                    setIsLoggedIn(true);
                    setTutor(tutor);
                    await loadTutorData(tutor.id);
                    showNotification(`Welcome back, ${tutor.name}! 🎉`, 'success');

                } catch (e) {
                    addDebug(`Error: ${e.message}`, 'error');
                    setLoginError('Error logging in. Please try again.');
                }
                setLoginLoading(false);
            };

            const handleForgotPassword = async () => {
                if (!resetPhone) {
                    setResetMessage('Please enter your phone number.');
                    return;
                }
                setResetLoading(true);
                setResetMessage('');

                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/tutors?phone=eq.${resetPhone}&select=id,name`, {
                        headers: { 
                            'apikey': SUPABASE_ANON_KEY, 
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    const data = await res.json();

                    if (data.length === 0) {
                        setResetMessage('No account found with this phone number.');
                        setResetLoading(false);
                        return;
                    }

                    const tempPassword = 'temp' + Math.floor(1000 + Math.random() * 9000);
                    
                    const updateRes = await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${data[0].id}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ password: tempPassword })
                    });

                    if (updateRes.ok) {
                        setResetMessage(`✅ Password reset successful! Your temporary password is: ${tempPassword}`);
                        window.open(`https://wa.me/254${resetPhone.replace(/^0+/, '')}?text=Your%20KenyaVault%20temporary%20password%20is%3A%20${tempPassword}`, '_blank');
                    } else {
                        setResetMessage('Failed to reset password.');
                    }
                } catch (e) {
                    setResetMessage('Error: ' + e.message);
                }
                setResetLoading(false);
            };

            const checkPasswordStrength = (pass) => {
                let score = 0;
                if (pass.length >= 6) score++;
                if (pass.length >= 8) score++;
                if (/[a-z]/.test(pass) && /[A-Z]/.test(pass)) score++;
                if (/[0-9]/.test(pass)) score++;
                setPasswordStrength(score);
                return score;
            };

            const handleSignup = async (e) => {
                e.preventDefault();
                const { name, email, phone, mpesa, password, confirmPassword, subjects, levels, bio } = signupData;
                setSignupError('');
                setDebugInfo([]);

                if (!name || !email || !phone || !mpesa || !password || !confirmPassword || subjects.length === 0 || levels.length === 0) {
                    setSignupError('Please fill all required fields.');
                    return;
                }
                if (password.length < 6) {
                    setSignupError('Password must be at least 6 characters.');
                    return;
                }
                if (password !== confirmPassword) {
                    setSignupError('Passwords do not match.');
                    return;
                }

                setSignupLoading(true);
                addDebug(`Creating account for ${name}`);

                try {
                    const checkPhone = await fetch(`${SUPABASE_URL}/rest/v1/tutors?phone=eq.${phone}&select=id`, {
                        headers: { 
                            'apikey': SUPABASE_ANON_KEY, 
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    const existing = await checkPhone.json();
                    if (existing.length > 0) {
                        setSignupError('A tutor with this phone number already exists.');
                        setSignupLoading(false);
                        return;
                    }

                    const tutorData = {
                        name, email, phone, 
                        mpesa_number: mpesa,
                        password, subjects, levels, 
                        bio: bio || '',
                        status: 'pending',
                        total_earnings: 0, pending_earnings: 0, total_paid_out: 0,
                        created_at: new Date().toISOString()
                    };

                    const res = await fetch(`${SUPABASE_URL}/rest/v1/tutors`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(tutorData)
                    });

                    if (!res.ok) throw new Error('Signup failed');

                    const data = await res.json();
                    const tutor = data[0];
                    addDebug('Account created!', 'success');

                    sessionStorage.setItem('tutor_id', tutor.id);
                    sessionStorage.setItem('tutor_email', tutor.email);
                    sessionStorage.setItem('tutor_name', tutor.name);
                    setIsLoggedIn(true);
                    setTutor(tutor);
                    await loadTutorData(tutor.id);
                    showNotification('Application submitted successfully! 🎉', 'success');

                } catch (e) {
                    addDebug(`Error: ${e.message}`, 'error');
                    setSignupError('Error submitting application: ' + e.message);
                }
                setSignupLoading(false);
            };

            return (
                <div className="login-shell">
                    <aside className="login-aside">
                        <div className="aside-top">
                            <div className="brandmark">
                                <div className="mark">KV</div>
                                <div className="name">Kenya<span>Vault</span></div>
                            </div>
                        </div>
                        <div className="aside-headline">
                            <h1>Teach once. Get paid every time it helps another learner.</h1>
                            <p>Upload lesson plans, revision papers and schemes of work — KenyaVault handles discovery, M-PESA payment, and delivery. You keep 80% of every sale.</p>
                        </div>
                        <div className="aside-stats">
                            <div className="stat"><div className="n">80%</div><div className="l">Tutor share</div></div>
                            <div className="stat"><div className="n">M-PESA</div><div className="l">Instant payout</div></div>
                            <div className="stat"><div className="n">21</div><div className="l">Levels covered</div></div>
                        </div>
                        <div className="aside-foot">🇰🇪 Built for Kenyan educators, CBC to University.</div>
                    </aside>

                    <div className="login-main">
                        <button onClick={toggleDarkMode} className="dark-toggle">{darkMode ? '☀️' : '🌙'}</button>
                        <div className="login-form-wrap">
                            <div className="mobile-brand">
                                <div className="mark">KV</div>
                                <div className="name">Kenya<span style={{color:'var(--gold)'}}>Vault</span></div>
                            </div>
                            <h2>{activeAuth === 'login' ? 'Welcome back' : 'Become a tutor'}</h2>
                            <p className="sub">{activeAuth === 'login' ? 'Log in to manage your resources and earnings.' : 'Submit your application — most reviews take 1–2 business days.'}</p>

                            <div className="auth-tabs">
                                <button onClick={() => {setActiveAuth('login'); setDebugInfo([]);}} className={`auth-tab ${activeAuth === 'login' ? 'active' : ''}`}>🔑 Login</button>
                                <button onClick={() => {setActiveAuth('signup'); setDebugInfo([]);}} className={`auth-tab ${activeAuth === 'signup' ? 'active' : ''}`}>📝 Sign Up</button>
                            </div>

                            {activeAuth === 'login' ? (
                                <form onSubmit={handleLogin}>
                                    {loginError && <div className="alert error">{loginError}</div>}
                                    <div className="field">
                                        <label className="form-label">Phone Number <span className="req">*</span></label>
                                        <input type="tel" value={loginPhone} onChange={(e) => setLoginPhone(e.target.value)} className="form-input" placeholder="0712 345 678" required />
                                    </div>
                                    <div className="field">
                                        <label className="form-label">Password <span className="req">*</span></label>
                                        <input type="password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} className="form-input" placeholder="Enter your password" required />
                                    </div>
                                    <button type="submit" disabled={loginLoading} className="btn-gold" style={{width:'100%'}}>
                                        {loginLoading ? '⏳ Logging in...' : '🔑 Log In'}
                                    </button>
                                    <div className="forgot-row">
                                        <button type="button" className="btn-link" onClick={() => setShowResetModal(true)}>Forgot your password?</button>
                                    </div>
                                    {debugInfo.length > 0 && (
                                        <div className="debug-info" style={{marginTop:'16px'}}>
                                            {debugInfo.map((d, i) => (
                                                <div key={i} className={d.type === 'error' ? 'error' : d.type === 'success' ? 'success' : ''}>
                                                    [{d.timestamp}] {d.message}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </form>
                            ) : (
                                <form onSubmit={handleSignup}>
                                    {signupError && <div className="alert error">{signupError}</div>}
                                    <div className="field-row">
                                        <div className="field">
                                            <label className="form-label">Full Name <span className="req">*</span></label>
                                            <input type="text" value={signupData.name} onChange={(e) => setSignupData({...signupData, name: e.target.value})} className="form-input" placeholder="Dr. John Mwangi" required />
                                        </div>
                                        <div className="field">
                                            <label className="form-label">Email <span className="req">*</span></label>
                                            <input type="email" value={signupData.email} onChange={(e) => setSignupData({...signupData, email: e.target.value})} className="form-input" placeholder="you@example.com" required />
                                        </div>
                                    </div>
                                    <div className="field-row">
                                        <div className="field">
                                            <label className="form-label">Phone Number <span className="req">*</span></label>
                                            <input type="tel" value={signupData.phone} onChange={(e) => setSignupData({...signupData, phone: e.target.value})} className="form-input" placeholder="0712 345 678" required />
                                        </div>
                                        <div className="field">
                                            <label className="form-label">M-PESA Number <span className="req">*</span></label>
                                            <input type="tel" value={signupData.mpesa} onChange={(e) => setSignupData({...signupData, mpesa: e.target.value})} className="form-input" placeholder="0712 345 678" required />
                                        </div>
                                    </div>
                                    <div className="field-row">
                                        <div className="field">
                                            <label className="form-label">Password <span className="req">*</span></label>
                                            <input type="password" value={signupData.password} onChange={(e) => {
                                                setSignupData({...signupData, password: e.target.value});
                                                checkPasswordStrength(e.target.value);
                                            }} className="form-input" placeholder="Min 6 characters" required />
                                            <div className="password-strength">
                                                {[1,2,3,4].map(i => (

                                        <div className="field">
                                            <label className="form-label">Subjects <span className="req">*</span></label>

                                            <span style={{fontSize:'0.7rem',color:'var(--muted)',marginTop:'4px',display:'block'}}>Hold Ctrl (Cmd) to select multiple</span>

                                    <div className="field">
                                        <label className="form-label">About You / Experience</label>

                                        <div className="debug-info" style={{marginTop:'16px'}}>
                                            {debugInfo.map((d, i) => (
                                                <div key={i} className={d.type === 'error' ? 'error' : d.type === 'success' ? 'success' : ''}>

                                    )}
                                </form>
                            )}

                    <div className={`reset-modal ${showResetModal ? 'open' : ''}`} onClick={(e) => { if (e.target === e.currentTarget) setShowResetModal(false); }}>
                        <div className="reset-modal-box">
                            <h4>🔑 Reset Password</h4>
                            <p>Enter your phone number to reset your password.</p>
                            {resetMessage && (
                                <div className={`alert ${resetMessage.startsWith('✅') ? 'success' : 'error'}`}>{resetMessage}</div>

                            <input type="tel" value={resetPhone} onChange={(e) => setResetPhone(e.target.value)} className="form-input" placeholder="0712 345 678" />
                            <div className="reset-modal-actions">
                                <button onClick={() => setShowResetModal(false)} className="btn-outline">Cancel</button>
                                <button onClick={handleForgotPassword} disabled={resetLoading} className="btn-gold">

                                </button>
                            </div>
                        </div>
                    </div>

        // ────────────────────────────────────────────────
        // APPROVAL GATE — shown instead of the full dashboard
        // while a tutor's application is pending or rejected.
        // ────────────────────────────────────────────────
        function ApprovalGate() {
            const { tutor, setActiveTab } = useTutor();
            const status = tutor?.status || 'pending';
            const submitted = tutor?.created_at ? new Date(tutor.created_at) : null;
            const submittedLabel = submitted ? submitted.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';

            if (status === 'approved') return null;

            return (
                <div className="gate-wrap">
                    <div className="gate-hero">
                        <div className="eyebrow">Application Status</div>
                        <h2>{status === 'rejected' ? 'Your application needs another look' : 'Your application is under review'}</h2>
                        <p className="lede">
                            {status === 'rejected'
                                ? 'Our team reviewed your submission and it wasn\u2019t approved this time. You can update your profile details and reach out to support for specifics.'
                                : 'Uploading, live classes and payouts unlock automatically the moment an admin approves your account — no action needed from you in the meantime.'}
                        </p>

                        <div className="timeline">
                            <div className="tl-step">
                                <div className="tl-node-col">
                                    <div className="tl-node done"><i className="fas fa-check"></i></div>
                                    <div className="tl-line done"></div>
                                </div>
                                <div className="tl-body">
                                    <div className="tt">Application submitted</div>
                                    <div className="td">Your tutor profile, subjects and levels were received.</div>
                                    <div className="tmeta">{submittedLabel}</div>
                                </div>
                            </div>

                            <div className="tl-step">
                                <div className="tl-node-col">
                                    <div className={`tl-node ${status === 'rejected' ? 'done' : 'current'}`}>
                                        {status === 'rejected' ? <i className="fas fa-check"></i> : <i className="fas fa-hourglass-half"></i>}
                                    </div>
                                    <div className={`tl-line ${status === 'rejected' ? 'done' : ''}`}></div>
                                </div>
                                <div className="tl-body">
                                    <div className="tt">Under review by KenyaVault admin</div>
                                    <div className="td">An admin checks your subjects, levels and teaching background.</div>
                                </div>
                            </div>

                            <div className="tl-step">
                                <div className="tl-node-col">
                                    <div className={`tl-node ${status === 'rejected' ? 'blocked' : ''}`}>
                                        {status === 'rejected' ? <i className="fas fa-xmark"></i> : <i className="fas fa-unlock"></i>}
                                    </div>
                                </div>
                                <div className="tl-body">
                                    <div className="tt">{status === 'rejected' ? 'Not approved' : 'Decision — full access unlocks'}</div>
                                    <div className="td">
                                        {status === 'rejected'
                                            ? 'You can update your profile and contact support to ask about reapplying.'
                                            : 'Upload resources, schedule live classes, and request M-PESA payouts.'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="gate-actions">
                            <button className="btn-gold" onClick={() => setActiveTab('profile')}>
                                <i className="fas fa-user-pen"></i> Review your profile
                            </button>
                            <a href="mailto:adminnexalearn@gmail.com" className="btn-outline" style={{textDecoration:'none', display:'inline-flex', alignItems:'center', gap:'8px'}}>
                                <i className="fas fa-envelope"></i> Contact support
                            </a>
                        </div>

                        {status === 'rejected' ? (
                            <div className="gate-note reject">
                                <i className="fas fa-circle-info"></i>&nbsp; If you believe this was a mistake, reply with your subjects and any certificates to <strong>adminnexalearn@gmail.com</strong> and we'll take another look.
                            </div>
                        ) : (
                            <div className="gate-note">
                                <i className="fas fa-circle-info"></i>&nbsp; Reviews typically take 1–2 business days. This page updates automatically once a decision is made — feel free to check back or refresh.
