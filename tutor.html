                </div>
            );
        }

        // ────────────────────────────────────────────────
        // DASHBOARD
        // ────────────────────────────────────────────────
        function Dashboard() {
            const { 
                tutor, resources, orders, classes, 
                activeTab, setActiveTab, 
                refreshData,
                darkMode, toggleDarkMode,
                logout,
                sidebarOpen, toggleSidebar, closeSidebar,
                debugInfo,
            } = useTutor();

            const isApproved = tutor?.status === 'approved';
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (date) => {
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                const s = String(date.getSeconds()).padStart(2, '0');
                return `${h}:${m}:${s}`;
            };
            const formatDate = (date) => date.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

            const menuItems = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard', alwaysOn: true },
                { id: 'resources', icon: 'fa-book', label: 'Resources', badge: resources.length },
                { id: 'classes', icon: 'fa-video', label: 'Live Classes', badge: classes.filter(c => c.status === 'live' || c.status === 'scheduled').length },
                { id: 'orders', icon: 'fa-shopping-bag', label: 'Orders', badge: orders.length },
                { id: 'earnings', icon: 'fa-coins', label: 'Earnings' },
                { id: 'upload', icon: 'fa-upload', label: 'Upload Resource' },
                { id: 'promote', icon: 'fa-share-alt', label: 'Promote' },
                { id: 'profile', icon: 'fa-user', label: 'Profile', alwaysOn: true },
            ];

            const goTo = (id, locked) => {
                if (locked) return;
                setActiveTab(id);
                closeSidebar();
            };

            const renderContent = () => {
                if (!isApproved && !['dashboard', 'profile'].includes(activeTab)) {
                    return <ApprovalGate />;
                }
                switch(activeTab) {
                    case 'dashboard': return isApproved ? <DashboardContent /> : <ApprovalGate />;
                    case 'resources': return <ResourcesTab />;
                    case 'classes': return <ClassesTab />;
                    case 'orders': return <OrdersTab />;
                    case 'earnings': return <EarningsTab />;
                    case 'upload': return <UploadTab />;
                    case 'promote': return <PromoteTab />;
                    case 'profile': return <ProfileTab />;
                    default: return isApproved ? <DashboardContent /> : <ApprovalGate />;
                }
            };

            const getPageTitle = () => {
                if (!isApproved && !['dashboard', 'profile'].includes(activeTab)) return 'Application Status';
                if (!isApproved && activeTab === 'dashboard') return 'Application Status';
                const item = menuItems.find(m => m.id === activeTab);
                return item ? item.label : 'Dashboard';
            };

            const hasErrors = debugInfo.some(d => d.type === 'error');
            const statusChipClass = tutor?.status === 'approved' ? 'approved' : tutor?.status === 'rejected' ? 'rejected' : 'pending';
            const statusChipLabel = tutor?.status === 'approved' ? 'Approved tutor' : tutor?.status === 'rejected' ? 'Application rejected' : 'Pending admin approval';

            return (
                <div className="dashboard-wrapper">
                    <div className={`sidebar-overlay ${sidebarOpen ? 'open' : ''}`} onClick={closeSidebar}></div>

                    <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                        <div className="sidebar-logo">
                            <div className="brand">
                                <div className="mark">KV</div>
                                <div className="name">Kenya<span>Vault</span></div>
                            </div>
                            <button className="sidebar-close-btn" onClick={closeSidebar}>✕</button>
                        </div>

                        <div className={`sidebar-status-chip ${statusChipClass}`}>
                            <span className="dot"></span>
                            <span>{statusChipLabel}</span>
                        </div>

                        <div className="sidebar-menu">
                            <div className="menu-label">Main</div>
                            {menuItems.map(item => {
                                const locked = !isApproved && !item.alwaysOn;
                                return (
                                    <button
                                        key={item.id}
                                        className={`menu-item ${activeTab === item.id ? 'active' : ''} ${locked ? 'locked' : ''}`}
                                        onClick={() => goTo(item.id, locked)}
                                        title={locked ? 'Unlocks once your account is approved' : undefined}
                                    >
                                        <i className={`fas ${item.icon}`}></i>
                                        <span>{item.label}</span>
                                        {locked ? (
                                            <i className="fas fa-lock lock-ico"></i>
                                        ) : item.badge !== undefined && item.badge > 0 ? (
                                            <span className="badge">{item.badge}</span>
                                        ) : null}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="sidebar-footer">
                            <div className="tutor-row">
                                <div className="avatar">{tutor?.name ? tutor.name.charAt(0).toUpperCase() : 'T'}</div>
                                <div style={{minWidth:0}}>
                                    <div className="tname">{tutor?.name || 'Tutor'}</div>
                                    <div className="temail" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{tutor?.email || ''}</div>
                                </div>
                            </div>
                            <button className="logout-btn" onClick={logout}>
                                <i className="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>

                    <div className="main-content">
                        <div className="top-navbar">
                            <div className="topbar-left">
                                <button className="mobile-menu-toggle" onClick={toggleSidebar}><i className="fas fa-bars"></i></button>
                                <span className="page-title">{getPageTitle()}</span>
                            </div>
                            <div className="nav-actions">
                                <div className="topbar-clock">
                                    <span className="clock-icon"><i className="fas fa-clock"></i></span>
                                    <span className="numeric">{formatTime(currentTime)}</span>
                                    <span className="sep">|</span>
                                    <span className="clock-date">{formatDate(currentTime)}</span>
                                </div>
                                <button className="icon-btn" onClick={toggleDarkMode} title="Toggle dark mode">
                                    <i className={`fas ${darkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                                </button>
                                <button onClick={refreshData} className="refresh-link">
                                    <i className="fas fa-rotate"></i> Refresh
                                </button>
                            </div>
                        </div>

                        <div className="page-content">
                            {hasErrors && (
                                <div className="debug-info" style={{marginBottom: '16px'}}>
                                    <strong>⚠️ Debug Info:</strong>
                                    {debugInfo.map((d, i) => (
                                        <div key={i} className={d.type === 'error' ? 'error' : d.type === 'success' ? 'success' : ''}>
                                            [{d.timestamp}] {d.message}
                                        </div>
                                    ))}
                                </div>
                            )}
                            {renderContent()}
                        </div>
                    </div>
                </div>
            );
        }

        // ── DASHBOARD CONTENT (approved tutors) ──
        function DashboardContent() {
            const { tutor, resources, orders, classes, setActiveTab, calculateEarnings } = useTutor();
            const chartRef = useRef(null);

            const earnings = calculateEarnings();

            const now = new Date();
            const months = [];
            const monthlyData = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const monthKey = d.toISOString().slice(0, 7);
                months.push(d.toLocaleString('default', { month: 'short' }));
                let sum = 0;
                orders.forEach(o => {
                    const orderDate = new Date(o.created_at);
                    const oKey = orderDate.toISOString().slice(0, 7);
                    if (oKey === monthKey) {
                        sum += o.tutor_share || Math.round((o.total_amount || o.item_price || 0) * 0.8);
                    }
                });
                monthlyData.push(sum);
            }

            const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            let thisMonthEarnings = 0;
            orders.forEach(o => {
                const orderDate = new Date(o.created_at);
                if (orderDate >= thisMonthStart) {
                    thisMonthEarnings += o.tutor_share || Math.round((o.total_amount || o.item_price || 0) * 0.8);
                }
            });

            useEffect(() => {
                if (typeof Chart === 'undefined') return;
                const ctx = document.getElementById('earningsChart')?.getContext('2d');
                if (!ctx) return;
                if (chartRef.current) chartRef.current.destroy();

                const isDark = document.documentElement.classList.contains('dark');
                const textColor = isDark ? '#98A2B3' : '#5B6472';
                const gridColor = isDark ? 'rgba(38,52,74,0.6)' : 'rgba(231,226,214,0.8)';

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Monthly Earnings (KES)',
                            data: monthlyData,
                            borderColor: '#C9971F',
                            backgroundColor: 'rgba(201,151,31,0.1)',
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#C9971F',
                            pointBorderColor: isDark ? '#14213A' : '#ffffff',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: true,
                        plugins: {
                            legend: { labels: { color: textColor, font: { family: "'IBM Plex Mono'" } } },
                            tooltip: { callbacks: { label: (c) => 'KES ' + c.parsed.y.toLocaleString() } }
                        },
                        scales: {
                            y: { beginAtZero: true, ticks: { callback: (v) => 'KES ' + v.toLocaleString(), color: textColor, font: { family: "'IBM Plex Mono'" } }, grid: { color: gridColor } },
                            x: { ticks: { color: textColor }, grid: { display: false } }
                        },
                        interaction: { intersect: false, mode: 'index' }
                    }
                });
            }, [orders, months, monthlyData]);

            return (
                <>
                    <div className="content-card">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap' }}>
                            <div className="profile-avatar">{tutor?.name ? tutor.name.charAt(0).toUpperCase() : 'T'}</div>
                            <div>
                                <h2 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '1.35rem' }}>
                                    Welcome back, {tutor?.name || 'Tutor'} 👋
                                </h2>
                                <p style={{ color: 'var(--muted)', fontSize:'0.88rem', marginTop:'2px' }}>
                                    <span className="status-badge approved">✅ Approved</span>
                                    &nbsp;— your resources are visible in the shop.
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="stat-grid">
                        <div className="stat-card">
                            <div className="stat-icon">💰</div>
                            <div className="stat-number gold numeric">KES {earnings.total.toLocaleString()}</div>
                            <div className="stat-label">Total Earnings</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">📅</div>
                            <div className="stat-number purple numeric">KES {thisMonthEarnings.toLocaleString()}</div>
                            <div className="stat-label">This Month</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">⏳</div>
                            <div className="stat-number blue numeric">KES {earnings.pending.toLocaleString()}</div>
                            <div className="stat-label">Pending Payout</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">📦</div>
                            <div className="stat-number green numeric">{orders.length}</div>
                            <div className="stat-label">Resources Sold</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">📚</div>
                            <div className="stat-number numeric">{resources.filter(r => r.status === 'live' || r.published !== false).length}</div>
                            <div className="stat-label">Active Resources</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-icon">🎥</div>
                            <div className="stat-number numeric">{classes.filter(c => c.status === 'live' || c.status === 'scheduled').length}</div>
                            <div className="stat-label">Live Classes</div>
                        </div>
                    </div>

                    <div className="chart-container">
                        <div className="chart-title">📈 Monthly Earnings</div>
                        <canvas id="earningsChart"></canvas>
                    </div>

                    <div className="content-card">
                        <div className="card-header"><h3>⚡ Quick Actions</h3></div>
                        <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                            <button onClick={() => setActiveTab('upload')} className="btn-gold"><i className="fas fa-upload"></i> Upload Resource</button>
                            <button onClick={() => setActiveTab('classes')} className="btn-gold" style={{ background: 'var(--purple)', color: '#fff' }}><i className="fas fa-video"></i> Create Class</button>
                            <button onClick={() => setActiveTab('promote')} className="btn-gold" style={{ background: 'var(--navy)', color: '#fff' }}><i className="fas fa-share-alt"></i> Promote</button>
                            <button onClick={() => setActiveTab('earnings')} className="btn-gold" style={{ background: 'var(--green)', color: '#fff' }}><i className="fas fa-coins"></i> Request Payout</button>
                        </div>
                    </div>

                    <div className="content-card">
                        <div className="card-header"><h3>📊 Performance Insights</h3></div>
                        <div className="stat-grid">
                            <div className="panel">
                                <div style={{fontSize:'0.7rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.5px'}}>🏆 Best Selling</div>
                                <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:'0.92rem',marginTop:'4px',color:'var(--gold)'}}>
                                    {resources.length > 0 
                                        ? resources.reduce((a, b) => (a.download_count || 0) > (b.download_count || 0) ? a : b).title 
                                        : 'No data yet'}
                                </div>
                            </div>
                            <div className="panel">
                                <div style={{fontSize:'0.7rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.5px'}}>📚 Top Level</div>
                                <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:'0.92rem',marginTop:'4px'}}>
                                    {orders.length > 0 
                                        ? (() => {
                                            const levelCounts = {};
                                            orders.forEach(o => { const l = o.level || 'unknown'; levelCounts[l] = (levelCounts[l] || 0) + 1; });
                                            const top = Object.entries(levelCounts).sort((a, b) => b[1] - a[1])[0];
                                            return top ? LEVELS.find(l => l.value === top[0])?.label || top[0] : 'N/A';
                                        })()
                                        : 'No data yet'}
                                </div>
                            </div>
                            <div className="panel">
                                <div style={{fontSize:'0.7rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.5px'}}>🎯 Avg Class Booking</div>
                                <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:'0.92rem',marginTop:'4px',color:'var(--gold)'}}>
                                    {classes.length > 0 
                                        ? 'KES ' + Math.round(classes.reduce((sum, c) => sum + (c.booking_price || 0), 0) / classes.length).toLocaleString()
                                        : 'Not set'}
                                </div>
                            </div>
                            <div className="panel">
                                <div style={{fontSize:'0.7rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.5px'}}>💡 Tip</div>
                                <div style={{fontSize:'0.82rem',marginTop:'4px'}}>
                                    {resources.length === 0 
                                        ? 'Upload your first resource to start earning!' 
                                        : orders.length === 0 
                                            ? 'Promote your resources on social media to increase sales.' 
                                            : 'Keep uploading new resources to grow your earnings!'}
                                </div>
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        // ── RESOURCES TAB ──
        function ResourcesTab() {
            const { resources, showNotification, refreshData } = useTutor();

            const deleteResource = async (id) => {
                if (!confirm('Delete this resource permanently?')) return;
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${id}`, {
                        method: 'DELETE',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    if (res.ok) { showNotification('Resource deleted', 'success'); refreshData(); }
                } catch (e) { showNotification('Error deleting', 'error'); }
            };

            if (resources.length === 0) {
                return (
                    <div className="content-card">
                        <div className="empty-state">
                            <div className="ico">📤</div>
                            <div className="t1">No resources uploaded yet</div>

                    const result = await createClass({
                        title: formData.title, description: formData.description, level: formData.level, subject: formData.subject,
                        booking_price: parseInt(formData.booking_price) || 500,
                        class_date: formData.class_date, class_time: formData.class_time,

                });
                if (ok) { showNotification('✅ Profile updated successfully!', 'success'); setEditMode(false); refreshData(); }
                else showNotification('❌ Failed to update profile', 'error');
                setUpdating(false);
            };

            const updatePassword = async () => {
                if (newPassword.length < 6) { showNotification('Password must be at least 6 characters.', 'error'); return; }
                if (newPassword !== confirmPassword) { showNotification('Passwords do not match.', 'error'); return; }
                const tutorId = sessionStorage.getItem('tutor_id');
                if (!tutorId) return;
                setUpdating(true);
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${tutorId}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: newPassword })
                    });
                    if (res.ok) {
                        showNotification('Password updated successfully! 🔒', 'success');
                        setChangingPassword(false); setNewPassword(''); setConfirmPassword('');
                    } else showNotification('Failed to update password.', 'error');
                } catch (e) { showNotification('Error: ' + e.message, 'error'); }
                setUpdating(false);
            };

            if (!tutor) return <div>Loading...</div>;

            const statusClass = tutor.status === 'approved' ? 'approved' : tutor.status === 'pending' ? 'pending' : 'rejected';
            const statusLabel = tutor.status === 'approved' ? '✅ Approved' : tutor.status === 'pending' ? '⏳ Pending' : '❌ Rejected';

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>👤 Profile</h3>
                        {!editMode && <button onClick={() => setEditMode(true)} className="btn-sm">✏️ Edit Profile</button>}
                    </div>

                    <div style={{ display: 'flex', gap: '24px', flexWrap: 'wrap' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div className="profile-avatar" style={{ margin: '0 auto' }}>{tutor.name ? tutor.name.charAt(0).toUpperCase() : 'T'}</div>
                            <span className={`status-badge ${statusClass}`} style={{ marginTop: '8px', display: 'inline-block' }}>{statusLabel}</span>
                        </div>

                        <div style={{ flex: 1, minWidth: '260px' }}>
                            {editMode ? (
                                <>
                                    <div className="field-row">
                                        <div className="field"><label className="form-label">Full Name *</label><input type="text" value={editData.name} onChange={(e) => setEditData({...editData, name: e.target.value})} className="form-input" /></div>
                                        <div className="field"><label className="form-label">Email *</label><input type="email" value={editData.email} onChange={(e) => setEditData({...editData, email: e.target.value})} className="form-input" /></div>
                                        <div className="field"><label className="form-label">Phone</label><input type="tel" value={editData.phone} onChange={(e) => setEditData({...editData, phone: e.target.value})} className="form-input" /></div>
                                        <div className="field"><label className="form-label">M-PESA Number *</label><input type="tel" value={editData.mpesa_number} onChange={(e) => setEditData({...editData, mpesa_number: e.target.value})} className="form-input" placeholder="0712 345 678" /></div>
                                    </div>
                                    <div className="field"><label className="form-label">Bio</label><textarea value={editData.bio} onChange={(e) => setEditData({...editData, bio: e.target.value})} className="form-input" rows="3" /></div>
                                    <div style={{display:'flex', gap:'10px'}}>
                                        <button onClick={updateProfile} disabled={updating} className="btn-gold">{updating ? '⏳ Saving...' : '💾 Save Changes'}</button>
                                        <button onClick={() => setEditMode(false)} className="btn-outline">Cancel</button>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px' }}>
                                        <div><label className="form-label">Full Name</label><p style={{ fontWeight: 600 }}>{tutor.name}</p></div>
                                        <div><label className="form-label">Email</label><p style={{ fontWeight: 600 }}>{tutor.email}</p></div>
                                        <div><label className="form-label">Phone</label><p style={{ fontWeight: 600 }}>{tutor.phone}</p></div>
                                        <div><label className="form-label">M-PESA Number</label><p style={{ fontWeight: 600 }}>{tutor.mpesa_number || 'Not set'}</p></div>
                                    </div>

                                    <div style={{ marginTop: '16px' }}>
                                        <label className="form-label">📚 Subjects</label>
                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px' }}>
                                            {tutor.subjects?.map(s => <span key={s} className="tag-pill subj">{s.replace(/-/g,' ')}</span>)}
                                        </div>
                                    </div>

                                    <div style={{ marginTop: '12px' }}>
                                        <label className="form-label">🎓 Levels</label>
                                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px' }}>
                                            {tutor.levels?.map(l => <span key={l} className="tag-pill lvl">{LEVELS.find(lev => lev.value === l)?.label || l}</span>)}
                                        </div>
                                    </div>

                                    {tutor.bio && (
                                        <div style={{ marginTop: '12px' }}>
                                            <label className="form-label">📝 About</label>
                                            <p style={{ fontSize: '0.88rem', color: 'var(--muted)' }}>{tutor.bio}</p>
                                        </div>
                                    )}

                                    <div style={{ marginTop: '20px', borderTop: '1px solid var(--line)', paddingTop: '16px' }}>
                                        <button onClick={() => setChangingPassword(!changingPassword)} className="btn-link">🔑 {changingPassword ? 'Cancel' : 'Change Password'}</button>
                                        {changingPassword && (
                                            <div style={{ marginTop: '12px', display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                                                <div style={{ flex: 1, minWidth: '180px' }}><label className="form-label">New Password</label><input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="form-input" placeholder="Min 6 characters" /></div>
                                                <div style={{ flex: 1, minWidth: '180px' }}><label className="form-label">Confirm Password</label><input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="form-input" placeholder="Confirm" /></div>
                                                <button onClick={updatePassword} disabled={updating} className="btn-sm" style={{ alignSelf: 'flex-end' }}>{updating ? '⏳ Updating...' : 'Update'}</button>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ── UPLOAD TAB ──
        function UploadTab() {
            const { showNotification, refreshData, uploadResource } = useTutor();
            const [title, setTitle] = useState('');
            const [price, setPrice] = useState(30);
            const [level, setLevel] = useState('');
            const [subject, setSubject] = useState('');
            const [description, setDescription] = useState('');
            const [resourceType, setResourceType] = useState('lesson-plan');
            const [selectedFile, setSelectedFile] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [isFree, setIsFree] = useState(false);
            const [curriculum, setCurriculum] = useState('cbc');
            const fileInputRef = useRef(null);

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 50 * 1024 * 1024) { showNotification('⚠️ File too large. Maximum size is 50MB.', 'error'); return; }
                    setSelectedFile(file);
                    showNotification(`✅ ${file.name} selected`, 'success');
                }
            };

            const handleUpload = async () => {
                if (!title || !level || !subject || !selectedFile) { showNotification('Please fill in title, level, subject and select a file', 'error'); return; }
                const tutorId = sessionStorage.getItem('tutor_id');
                if (!tutorId) { showNotification('You must be logged in to upload', 'error'); return; }

                setUploading(true); setProgress(20);
                try {
                    await uploadResource(selectedFile, title, price, level, subject, description, resourceType, isFree, curriculum);
                    setProgress(100);
                    showNotification(`✅ "${title}" uploaded successfully!`, 'success');
                    setTitle(''); setPrice(30); setLevel(''); setSubject(''); setDescription(''); setSelectedFile(null);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                    refreshData();
                } catch (e) {
                    showNotification('❌ Upload failed: ' + e.message, 'error');
                }
                setUploading(false); setProgress(0);
            };

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>📤 Upload Resource</h3>
                        <span style={{ fontSize: '0.75rem', color: 'var(--muted)' }}><i className="fas fa-check-circle" style={{color:'var(--green)'}}></i> Quick &amp; Simple</span>
                    </div>

                    <p style={{ color: 'var(--muted)', marginBottom: '16px', fontSize:'0.88rem' }}>
                        Upload your resource in seconds. You'll earn <strong style={{ color: 'var(--gold)' }}>80%</strong> of each sale once approved.
                        <br />
                        <span style={{ fontSize: '0.78rem' }}>✅ PDF, Word, Excel, PowerPoint, Images, Video, Audio, ZIP &nbsp;·&nbsp; 📏 Max 50 MB</span>
                    </p>

                    <div className="upload-simple-grid">
                        <div className="field">
                            <label className="form-label">Resource Title <span className="req">*</span></label>
                            <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} className="form-input" placeholder="e.g., Grade 7 Mathematics Notes" />
                        </div>
                        <div className="field">
                            <label className="form-label">Price (KES) <span className="req">*</span></label>
                            <input type="number" value={price} onChange={(e) => setPrice(e.target.value)} className="form-input" min="0" disabled={isFree} />
                            <label style={{display:'flex',alignItems:'center',gap:'8px',marginTop:'6px',fontSize:'0.82rem',color:'var(--muted)'}}>
                                <input type="checkbox" checked={isFree} onChange={(e) => setIsFree(e.target.checked)} /> This is a free resource
                            </label>
                        </div>
                        <div className="field">
                            <label className="form-label">Grade Level <span className="req">*</span></label>
                            <select value={level} onChange={(e) => setLevel(e.target.value)} className="form-input">
                                <option value="">Select level...</option>
                                {LEVELS.map(l => <option key={l.value} value={l.value}>{l.label}</option>)}
                            </select>
                        </div>
                        <div className="field">
                            <label className="form-label">Subject <span className="req">*</span></label>
                            <select value={subject} onChange={(e) => setSubject(e.target.value)} className="form-input">
                                <option value="">Select subject...</option>
                                {SUBJECTS.map(s => <option key={s} value={s}>{s.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="field" style={{marginTop:'12px'}}>
                        <label className="form-label">Description</label>
                        <textarea value={description} onChange={(e) => setDescription(e.target.value)} className="form-input" rows="2" placeholder="Brief description of the resource..." />
                    </div>

                    <div className="field" style={{marginTop:'4px'}}>
                        <label className="form-label">File <span className="req">*</span></label>
                        <div className="upload-drop-zone" onClick={() => fileInputRef.current?.click()}>
                            <input type="file" ref={fileInputRef} onChange={handleFileSelect} style={{display:'none'}} />
                            <div className="icon">📎</div>
                            <div className="text">{selectedFile ? selectedFile.name : 'Click to upload your file'}</div>
                            <div className="sub">{selectedFile ? (selectedFile.size / 1024 / 1024).toFixed(2) + ' MB' : 'PDF, Word, Excel, PPT, Images, Video, Audio, ZIP'}</div>
                        </div>
                    </div>

                    {uploading && (
                        <div style={{marginTop:'14px'}}>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.82rem',color:'var(--muted)',marginBottom:'4px'}}>
                                <span>Uploading...</span><span className="numeric">{progress}%</span>
                            </div>
                            <div className="progress-track"><div id="uploadBar" style={{ width: progress + '%' }}></div></div>
                        </div>
                    )}

                    <button onClick={handleUpload} disabled={uploading} className="btn-gold" style={{ marginTop: '16px' }}>
                        {uploading ? '⏳ Uploading...' : '⬆️ Upload Resource'}
                    </button>
                </div>
            );
        }

        // ────────────────────────────────────────────────
        // MAIN APP
        // ────────────────────────────────────────────────
        function App() {
            const { isLoggedIn, notification } = useTutor();
            return (
                <div>
                    {isLoggedIn ? <Dashboard /> : <LoginPage />}
                    {notification && (
                        <div className={`toast-notification show ${notification.type === 'error' ? 'error' : 'success'}`}>
                            <span>{notification.type === 'error' ? '❌' : '✅'}</span>
                            <span>{notification.msg}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TutorProvider><App /></TutorProvider>);
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
