<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KenyaVault · Tutor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --kv-navy: #0B1A2E;
            --kv-navy-light: #1A2F44;
            --kv-gold: #D4A017;
            --kv-gold-light: #FCD34D;
            --kv-green: #1F7A3A;
            --kv-green-light: #34D399;
            --kv-white: #FFFFFF;
            --kv-bg: #F1F4F9;
            --kv-text: #111827;
            --kv-muted: #6B7A8F;
            --kv-border: #E2E8F0;
            --kv-radius: 16px;
            --kv-radius-sm: 10px;
            --kv-shadow: 0 8px 30px rgba(11, 26, 46, 0.06);
            --kv-shadow-lg: 0 20px 60px rgba(11, 26, 46, 0.10);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--kv-bg);
            color: var(--kv-text);
            min-height: 100vh;
        }
        .dark {
            --kv-bg: #0F172A;
            --kv-text: #F1F5F9;
            --kv-muted: #94A3B8;
            --kv-border: #1E293B;
            --kv-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --kv-shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .dark body {
            background: #0F172A;
        }

        /* ── LOGIN PAGE ── */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--kv-navy), var(--kv-navy-light));
            padding: 20px;
            position: relative;
        }
        .login-box {
            background: #fff;
            border-radius: var(--kv-radius);
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--kv-shadow-lg);
        }
        .dark .login-box {
            background: #1E293B;
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-box .logo h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: var(--kv-navy);
        }
        .dark .login-box .logo h1 {
            color: #fff;
        }
        .login-box .logo h1 span {
            color: var(--kv-gold);
        }
        .login-box .logo p {
            color: var(--kv-muted);
            font-size: 0.85rem;
        }
        .login-box .form-group {
            margin-bottom: 16px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--kv-text);
            margin-bottom: 4px;
        }
        .dark .login-box label {
            color: #E2E8F0;
        }
        .login-box input,
        .login-box select,
        .login-box textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--kv-border);
            border-radius: var(--kv-radius-sm);
            font-size: 0.9rem;
            background: #fff;
            color: var(--kv-text);
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .dark .login-box input,
        .dark .login-box select,
        .dark .login-box textarea {
            background: #0F172A;
            border-color: #334155;
            color: #E2E8F0;
        }
        .login-box input:focus,
        .login-box select:focus,
        .login-box textarea:focus {
            outline: none;
            border-color: var(--kv-gold);
            box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.1);
        }
        .login-box select[multiple] {
            height: 80px;
        }
        .login-box .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--kv-gold);
            border: none;
            border-radius: var(--kv-radius-sm);
            font-weight: 700;
            font-size: 1rem;
            color: var(--kv-navy);
            cursor: pointer;
            transition: 0.2s;
        }
        .login-box .btn-login:hover {
            background: var(--kv-gold-light);
            transform: translateY(-2px);
        }
        .login-box .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-box .error-msg {
            background: #FEE2E2;
            color: #DC2626;
            padding: 10px 14px;
            border-radius: var(--kv-radius-sm);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        .dark .login-box .error-msg {
            background: #7F1D1D;
            color: #FCA5A5;
        }
        .login-box .auth-toggle {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--kv-muted);
        }
        .login-box .auth-toggle button {
            background: none;
            border: none;
            color: var(--kv-gold);
            font-weight: 600;
            cursor: pointer;
        }
        .login-box .auth-toggle button:hover {
            text-decoration: underline;
        }
        .login-box .debug-info {
            background: #F1F5F9;
            padding: 10px;
            border-radius: var(--kv-radius-sm);
            font-size: 0.7rem;
            font-family: monospace;
            margin-top: 12px;
            max-height: 120px;
            overflow-y: auto;
            color: #475569;
        }
        .dark .login-box .debug-info {
            background: #1E293B;
            color: #94A3B8;
        }
        .login-box .debug-info .error {
            color: #DC2626;
        }
        .login-box .debug-info .success {
            color: var(--kv-green-light);
        }
        .hidden {
            display: none !important;
        }

        /* ── DASHBOARD ── */
        .dashboard-wrapper {
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--kv-navy);
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
        }
        .sidebar-brand .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--kv-gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: var(--kv-navy);
        }
        .sidebar-brand .brand-text {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
        }
        .sidebar-brand .brand-text span {
            color: var(--kv-gold-light);
        }
        .sidebar-brand .brand-sub {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sidebar-nav .nav-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.25);
            padding: 8px 12px 6px;
            font-weight: 600;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: var(--kv-radius-sm);
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: none;
            background: transparent;
            width: 100%;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .sidebar-nav a i {
            width: 20px;
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.35);
        }
        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .sidebar-nav a:hover i {
            color: var(--kv-gold-light);
        }
        .sidebar-nav a.active {
            background: rgba(212, 160, 23, 0.12);
            color: var(--kv-gold-light);
            border-left: 3px solid var(--kv-gold);
        }
        .sidebar-nav a.active i {
            color: var(--kv-gold-light);
        }
        .sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
            margin-top: 8px;
        }
        .sidebar-footer .tutor-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--kv-radius-sm);
            background: rgba(255, 255, 255, 0.04);
        }
        .sidebar-footer .tutor-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--kv-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--kv-navy);
            flex-shrink: 0;
        }
        .sidebar-footer .tutor-info .name {
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .sidebar-footer .tutor-info .status {
            font-size: 0.7rem;
            color: var(--kv-green-light);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sidebar-footer .logout-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--kv-radius-sm);
            background: rgba(239, 68, 68, 0.08);
            color: #F87171;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .sidebar-footer .logout-btn:hover {
            background: rgba(239, 68, 68, 0.18);
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 28px 36px 40px;
            overflow-y: auto;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar .greeting h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: var(--kv-text);
        }
        .topbar .greeting h1 span {
            color: var(--kv-gold);
        }
        .topbar .greeting p {
            color: var(--kv-muted);
            font-weight: 500;
            font-size: 0.95rem;
            margin-top: 2px;
        }
        .topbar .greeting p i {
            color: var(--kv-gold);
            margin-right: 4px;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .topbar-actions .clock {
            background: var(--kv-white);
            padding: 6px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--kv-text);
            border: 1px solid var(--kv-border);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--kv-shadow);
        }
        .dark .topbar-actions .clock {
            background: #1E293B;
            border-color: #334155;
            color: #E2E8F0;
        }
        .topbar-actions .clock i {
            color: var(--kv-gold);
        }
        .topbar-actions .dark-toggle {
            background: var(--kv-white);
            border: 1px solid var(--kv-border);
            border-radius: 60px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--kv-text);
            transition: 0.2s;
            box-shadow: var(--kv-shadow);
        }
        .dark .topbar-actions .dark-toggle {
            background: #1E293B;
            border-color: #334155;
            color: #E2E8F0;
        }
        .topbar-actions .dark-toggle:hover {
            background: var(--kv-gold);
            color: var(--kv-navy);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--kv-white);
            padding: 20px 22px;
            border-radius: var(--kv-radius);
            border: 1px solid var(--kv-border);
            box-shadow: var(--kv-shadow);
        }
        .dark .stat-card {
            background: #1E293B;
            border-color: #334155;
        }
        .stat-card .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .stat-card .stat-number {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            color: var(--kv-text);
        }
        .dark .stat-card .stat-number {
            color: #F1F5F9;
        }
        .stat-card .stat-number.gold {
            color: var(--kv-gold);
        }
        .stat-card .stat-number.green {
            color: var(--kv-green-light);
        }
        .stat-card .stat-number.purple {
            color: #8B5CF6;
        }
        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--kv-muted);
            font-weight: 500;
            margin-top: 2px;
        }

        /* Revenue */
        .revenue-section {
            background: var(--kv-white);
            border-radius: var(--kv-radius);
            border: 1px solid var(--kv-border);
            padding: 24px 28px;
            margin-bottom: 32px;
            box-shadow: var(--kv-shadow);
        }
        .dark .revenue-section {
            background: #1E293B;
            border-color: #334155;
        }
        .revenue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .revenue-header h2 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .revenue-header h2 i {
            color: var(--kv-gold);
        }
        .revenue-grid {
            display: grid;
            grid-template-columns: 2.2fr 1.4fr;
            gap: 28px;
            align-items: start;
        }
        .chart-wrapper {
            background: var(--kv-bg);
            border-radius: var(--kv-radius-sm);
            padding: 16px 12px;
            border: 1px solid var(--kv-border);
            height: 200px;
            display: flex;
            align-items: flex-end;
        }
        .dark .chart-wrapper {
            background: #0F172A;
            border-color: #1E293B;
        }
        .chart-bars {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            height: 100%;
            gap: 6px;
        }
        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
        }
        .bar-item .bar {
            width: 100%;
            background: var(--kv-gold);
            border-radius: 6px 6px 2px 2px;
            min-height: 12px;
            max-height: 100%;
            transition: 0.2s;
        }
        .bar-item .bar-label {
            font-size: 0.6rem;
            color: var(--kv-muted);
            margin-top: 6px;
            font-weight: 600;
        }
        .revenue-metrics {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--kv-border);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .dark .metric-row {
            border-color: #334155;
        }
        .metric-row .gold {
            color: var(--kv-gold);
            font-weight: 700;
        }
        .metric-row .green {
            color: var(--kv-green-light);
            font-weight: 700;
        }
        .top-resources {
            background: var(--kv-bg);
            border-radius: var(--kv-radius-sm);
            padding: 12px 16px;
            border: 1px solid var(--kv-border);
            margin-top: 4px;
        }
        .dark .top-resources {
            background: #0F172A;
            border-color: #1E293B;
        }
        .top-resources p {
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--kv-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-resources ul {
            list-style: none;
            margin-top: 6px;
        }
        .top-resources ul li {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 3px 0;
            color: var(--kv-muted);
        }
        .top-resources ul li .gold {
            color: var(--kv-gold);
            font-weight: 600;
        }

        /* Upload + Resources */
        .action-grid {
            display: grid;
            grid-template-columns: 1.4fr 2.6fr;
            gap: 24px;
            margin-top: 4px;
        }
        .upload-card {
            background: var(--kv-navy);
            border-radius: var(--kv-radius);
            padding: 28px 24px;
            color: #fff;
            box-shadow: var(--kv-shadow-lg);
        }
        .upload-card h3 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .upload-card h3 i {
            color: var(--kv-gold);
        }
        .upload-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 18px;
        }
        .upload-form .field {
            margin-bottom: 12px;
        }
        .upload-form label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .upload-form input,
        .upload-form select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--kv-radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-weight: 500;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .upload-form input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .upload-form input:focus,
        .upload-form select:focus {
            border-color: var(--kv-gold);
            background: rgba(255, 255, 255, 0.08);
        }
        .upload-form .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-upload {
            background: var(--kv-gold);
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--kv-navy);
            margin-top: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 0 #b07d14;
        }
        .btn-upload:hover {
            background: var(--kv-gold-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b07d14;
        }

        .resource-table {
            background: var(--kv-white);
            border-radius: var(--kv-radius);
            padding: 20px 22px;
            border: 1px solid var(--kv-border);
            box-shadow: var(--kv-shadow);
        }
        .dark .resource-table {
            background: #1E293B;
            border-color: #334155;
        }
        .resource-table h4 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .resource-table h4 span {
            font-weight: 400;
            font-size: 0.8rem;
            color: var(--kv-muted);
        }
        .resource-item {
            display: grid;
            grid-template-columns: 2.2fr 1fr 0.8fr 0.8fr 0.8fr 0.6fr;
            padding: 10px 0;
            border-bottom: 1px solid var(--kv-border);
            font-size: 0.85rem;
            align-items: center;
            gap: 6px;
        }
        .dark .resource-item {
            border-color: #334155;
        }
        .resource-item:last-child {
            border: none;
        }
        .resource-item .title {
            font-weight: 600;
            color: var(--kv-text);
        }
        .dark .resource-item .title {
            color: #F1F5F9;
        }
        .resource-item .status {
            padding: 2px 12px;
            border-radius: 60px;
            font-size: 0.65rem;
            font-weight: 700;
            width: fit-content;
        }
        .status.live {
            background: #DCFCE7;
            color: #166534;
        }
        .status.draft {
            background: #F1F5F9;
            color: #475569;
        }
        .status.pending {
            background: #FEF3C7;
            color: #92400E;
        }
        .dark .status.live {
            background: #064E3B;
            color: #6EE7B7;
        }
        .dark .status.draft {
            background: #1E293B;
            color: #94A3B8;
        }
        .dark .status.pending {
            background: #451A03;
            color: #FBBF24;
        }
        .resource-item .gold {
            color: var(--kv-gold);

        // ─── RENDER APP ───
        function renderApp() {
            if (!state.authChecked) {
                app.innerHTML =
                    `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--kv-muted);">Loading...</div>`;
                return;
            }
            if (!state.session) {
                app.innerHTML = renderLogin();
                attachLoginListeners();
                return;
            }
            if (!state.tutor) {
                app.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;">
                        <i class="fas fa-exclamation-triangle" style="font-size:2.5rem;color:var(--kv-gold);"></i>
                        <p style="color:var(--kv-muted);font-size:1.1rem;">Your account does not have tutor access.</p>
                        <button class="btn-login" style="width:auto;padding:10px 30px;" id="redirectBtn">Go to Home</button>
                    </div>
                `;
                document.getElementById('redirectBtn')?.addEventListener('click', () => {
                    window.location.href = '/';
                });
                return;
            }
            app.innerHTML = renderDashboard();
            attachDashboardListeners();
            updateClock();
            setInterval(updateClock, 1000);
            setupDarkMode();
        }

        // ─── CLOCK ───
        function updateClock() {
            const el = document.getElementById('clockDisplay');
            if (el) {
                const now = new Date();
                el.textContent = now.toTimeString().slice(0, 8);
            }
        }

        // ─── DARK MODE ───
        function setupDarkMode() {
            const toggle = document.getElementById('darkToggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    state.darkMode = !state.darkMode;
                    document.documentElement.classList.toggle('dark', state.darkMode);
                    localStorage.setItem('kv-tutor-dark', state.darkMode);
                    toggle.innerHTML = `<i class="fas ${state.darkMode ? 'fa-sun' : 'fa-moon'}"></i>`;
                });
            }
            document.documentElement.classList.toggle('dark', state.darkMode);
        }

        // ─── TAB SWITCHING ───
        function switchTab(tab) {
            state.activeTab = tab;
            renderApp();
        }

        // ─── AUTH ───
        async function checkAuth() {
            state.loading = true;
            state.debugInfo = [];
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;

                if (!session) {
                    state.session = null;
                    state.tutor = null;
                    state.authChecked = true;
                    renderApp();
                    return;
                }

                state.session = session;
                const userId = session.user.id;
                addDebug(`Auth user: ${userId}`, 'info');

                const { data: tutorData, error: tutorError } = await supabase
                    .from('tutors')
                    .select('*')
                    .eq('user_id', userId)
                    .maybeSingle();

                if (tutorError) {
                    addDebug(`Tutor lookup error: ${tutorError.message}`, 'error');
                    state.tutor = null;
                    state.authChecked = true;
                    renderApp();
                    return;
                }

                if (!tutorData) {
                    const { data: emailMatch, error: emailError } = await supabase
                        .from('tutors')
                        .select('*')
                        .eq('email', session.user.email)
                        .maybeSingle();

                    if (emailMatch && !emailError) {
                        await supabase
                            .from('tutors')
                            .update({ user_id: userId })
                            .eq('id', emailMatch.id);
                        state.tutor = emailMatch;
                        addDebug(`Linked existing tutor to auth user: ${emailMatch.name}`, 'success');
                    } else {
                        state.tutor = null;
                        addDebug('No tutor record found for this user', 'error');
                    }
                } else {
                    state.tutor = tutorData;
                    addDebug(`Tutor found: ${tutorData.name}`, 'success');
                }

                if (state.tutor) {
                    await loadTutorData(state.tutor.id);
                }

            } catch (e) {
                addDebug(`Auth error: ${e.message}`, 'error');
                state.session = null;
                state.tutor = null;
            }
            state.authChecked = true;
            renderApp();
        }

        function addDebug(msg, type = 'info') {
            state.debugInfo.push({ message: msg, type, timestamp: new Date().toLocaleTimeString() });
            console.log(`[${type}] ${msg}`);
        }

        // ─── LOAD TUTOR DATA ───
        async function loadTutorData(tutorId) {
            try {
                const { data: resources, error: rErr } = await supabase
                    .from('resources')
                    .select('*')
                    .eq('tutor_id', tutorId);

                if (rErr) throw rErr;
                state.resources = resources || [];

                const { data: orders, error: oErr } = await supabase
                    .from('orders')
                    .select('*')
                    .eq('tutor_id', tutorId);

                if (oErr) throw oErr;
                state.orders = orders || [];

                const { data: classes, error: cErr } = await supabase
                    .from('classes')
                    .select('*')
                    .eq('tutor_id', tutorId);

                if (cErr) throw cErr;
                state.classes = classes || [];

                addDebug(`Loaded ${state.resources.length} resources, ${state.orders.length} orders, ${state.classes.length} classes`, 'success');
            } catch (e) {
                addDebug(`Data load error: ${e.message}`, 'error');
            }
        }

        // ─── LOGIN ───
        async function handleLogin(phone, password) {
            try {
                const { data: tutors, error: findErr } = await supabase
                    .from('tutors')
                    .select('*')
                    .eq('phone', phone);

                if (findErr) throw findErr;
                if (!tutors || tutors.length === 0) {
                    addDebug('No tutor found with this phone', 'error');
                    return { success: false, message: 'No account found with this phone number.' };
                }

                const tutor = tutors[0];
                if (tutor.password !== password) {
                    addDebug('Password mismatch', 'error');
                    return { success: false, message: 'Invalid password.' };
                }

                let authUser = null;
                if (tutor.user_id) {
                    try {
                        const { data: user, error: userErr } = await supabase.auth.admin.getUserById(tutor.user_id);
                        if (!userErr && user) {
                            authUser = user;
                        } else {
                            const { data: newUser, error: createErr } = await supabase.auth.signUp({
                                email: tutor.email || `${phone}@kenyavault.co.ke`,
                                password: password,
                                phone: phone,
                                options: { data: { name: tutor.name } }
                            });
                            if (createErr) throw createErr;
                            authUser = newUser.user;
                            await supabase.from('tutors').update({ user_id: authUser.id }).eq('id', tutor.id);
                        }
                    } catch (e) {
                        const { data: newUser, error: createErr } = await supabase.auth.signUp({
                            email: tutor.email || `${phone}@kenyavault.co.ke`,
                            password: password,
                            phone: phone,
                            options: { data: { name: tutor.name } }
                        });
                        if (createErr) throw createErr;
                        authUser = newUser.user;
                        await supabase.from('tutors').update({ user_id: authUser.id }).eq('id', tutor.id);
                    }
                } else {
                    const { data: newUser, error: createErr } = await supabase.auth.signUp({
                        email: tutor.email || `${phone}@kenyavault.co.ke`,
                        password: password,
                        phone: phone,
                        options: { data: { name: tutor.name } }
                    });
                    if (createErr) throw createErr;
                    authUser = newUser.user;
                    await supabase.from('tutors').update({ user_id: authUser.id }).eq('id', tutor.id);
                }

                const { error: signInErr } = await supabase.auth.signInWithPassword({
                    phone: phone,
                    password: password
                });

                if (signInErr) {
                    const { error: emailErr } = await supabase.auth.signInWithPassword({
                        email: tutor.email || `${phone}@kenyavault.co.ke`,
                        password: password
                    });
                    if (emailErr) throw emailErr;
                }

                return { success: true };

            } catch (e) {
                addDebug(`Login error: ${e.message}`, 'error');
                return { success: false, message: e.message || 'Login failed. Please try again.' };
            }
        }

        // ─── SIGNUP ───
        async function handleSignup(data) {
            try {
                const { data: existing, error: existErr } = await supabase
                    .from('tutors')
                    .select('id')
                    .eq('phone', data.phone);

                if (existErr) throw existErr;
                if (existing && existing.length > 0) {
                    return { success: false, message: 'A tutor with this phone already exists.' };
                }

                const { data: authData, error: authErr } = await supabase.auth.signUp({
                    email: data.email,
                    password: data.password,
                    phone: data.phone,
                    options: { data: { name: data.name } }
                });

                if (authErr) throw authErr;

                const tutorData = {
                    name: data.name,
                    email: data.email,
                    phone: data.phone,
                    mpesa_number: data.mpesa,
                    password: data.password,
                    subjects: data.subjects,
                    levels: data.levels,
                    bio: data.bio || '',
                    status: 'pending',
                    user_id: authData.user.id,
                    total_earnings: 0,
                    pending_earnings: 0,
                    total_paid_out: 0,
                    created_at: new Date().toISOString()
                };

                const { error: insertErr } = await supabase
                    .from('tutors')
                    .insert(tutorData);

                if (insertErr) throw insertErr;

                await supabase.auth.signInWithPassword({
                    phone: data.phone,
                    password: data.password
                });

                return { success: true };

            } catch (e) {
                addDebug(`Signup error: ${e.message}`, 'error');
                return { success: false, message: e.message || 'Signup failed. Please try again.' };
            }
        }

        async function handleUpload() {
            const title = document.getElementById('uploadTitle').value;
            const subject = document.getElementById('uploadSubject').value;
            const level = document.getElementById('uploadLevel').value;
            const description = document.getElementById('uploadDescription').value;
            const price = document.getElementById('uploadPrice').value;
            const category = document.getElementById('uploadCategory').value;

            if (!title || !subject || !level || !selectedFile) {
                showToast('Please fill all required fields and select a PDF', 'error');
                return;
            }

            const tutorId = state.tutor?.id || sessionStorage.getItem('tutor_id');
            if (!tutorId) {
                showToast('You must be logged in to upload', 'error');
                return;
            }

            const progressEl = document.getElementById('uploadProgress');
            const barEl = document.getElementById('uploadBar');
            const textEl = document.getElementById('progressText');
            progressEl.style.display = 'block';

            try {
                const fileExt = selectedFile.name.split('.').pop();
                const filePath = `resources/${level}/${subject}/${Date.now()}.${fileExt}`;

                barEl.style.width = '30%';
                textEl.textContent = '30%';

                const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/kenyavault-resources/${filePath}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: selectedFile
                });

                if (!uploadRes.ok) throw new Error('PDF upload failed');
                const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/kenyavault-resources/${filePath}`;

                barEl.style.width = '60%';
                textEl.textContent = '60%';

                let coverUrl = null;
                if (selectedCover) {
                    const coverExt = selectedCover.name.split('.').pop();
                    const coverPath = `covers/${level}/${subject}/${Date.now()}.${coverExt}`;
                    const coverRes = await fetch(`${SUPABASE_URL}/storage/v1/object/kenyavault-resources/${coverPath}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                        body: selectedCover
                    });
                    if (coverRes.ok) {
                        coverUrl = `${SUPABASE_URL}/storage/v1/object/public/kenyavault-resources/${coverPath}`;
                    }
                }

                barEl.style.width = '80%';
                textEl.textContent = '80%';

                const resourceData = {
                    title,
                    subject,
                    level,
                    description,
                    price: parseInt(price) || 0,
                    resource_type: category,
                    file_url: fileUrl,
                    cover_image_url: coverUrl,
                    tutor_id: tutorId,
                    tutor_name: state.tutor?.name || sessionStorage.getItem('tutor_name') || 'Tutor',
                    status: 'pending',
                    download_count: 0,
                    sales_count: 0,
                    total_earnings: 0,
                    created_at: new Date().toISOString()
                };

                const saveRes = await fetch(`${SUPABASE_URL}/rest/v1/resources`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(resourceData)
                });

                if (!saveRes.ok) throw new Error('Failed to save resource');

                barEl.style.width = '100%';
                textEl.textContent = '100%';

                showToast('Resource uploaded successfully! It will be reviewed by admin.', 'success');

                document.getElementById('uploadTitle').value = '';
                document.getElementById('uploadSubject').value = '';
                document.getElementById('uploadLevel').value = '';
                document.getElementById('uploadDescription').value = '';
                document.getElementById('uploadPrice').value = '';
                document.getElementById('fileLabel').textContent = '📄 Click to upload PDF';
                document.getElementById('coverLabel').textContent = '🖼️ Click to upload cover';
                document.getElementById('coverPreview').innerHTML = '';
                document.getElementById('fileInput').value = '';
                document.getElementById('coverInput').value = '';
                selectedFile = null;
                selectedCover = null;
                setTimeout(() => { progressEl.style.display = 'none'; }, 1000);

                await loadTutorData(tutorId);

            } catch (e) {
                console.error('Upload error:', e);
                showToast('Upload failed: ' + e.message, 'error');
                progressEl.style.display = 'none';
            }
        }

        // ─── DELETE RESOURCE ───
        async function deleteResource(id) {
            if (!confirm('Delete this resource permanently?')) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (res.ok) {
                    showToast('Resource deleted', 'success');
                    const tutorId = state.tutor?.id || sessionStorage.getItem('tutor_id');
                    await loadTutorData(tutorId);
                    renderApp();
                }
            } catch (e) { showToast('Error deleting', 'error'); }
        }

        // ─── UPDATE PASSWORD ───
        async function updatePassword() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const tutorId = state.tutor?.id || sessionStorage.getItem('tutor_id');

            if (newPass.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }
            if (newPass !== confirmPass) {
                showToast('Passwords do not match.', 'error');
                return;
            }

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${tutorId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPass })
                });
                if (res.ok) {
                    showToast('Password updated successfully! 🔒', 'success');
                    document.getElementById('passwordForm').classList.add('hidden');
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                } else {
                    showToast('Failed to update password.', 'error');
                }
            } catch (e) { showToast('Error: ' + e.message, 'error'); }
        }

        // ─── TOAST ───
        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast-notification show ${type === 'error' ? 'error' : type === 'info' ? 'info' : 'success'}`;
            toast.innerHTML = `<span>${type === 'error' ? '❌' : type === 'info' ? 'ℹ️' : '✅'}</span><span>${msg}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ─── ATTACH LISTENERS ───
        function attachLoginListeners() {
            const loginBtn = document.getElementById('loginBtn');
            const phoneInput = document.getElementById('loginPhone');
            const passInput = document.getElementById('loginPassword');
            const errorEl = document.getElementById('loginError');
            const showSignup = document.getElementById('showSignup');
            const showLogin = document.getElementById('showLogin');
            const signupBtn = document.getElementById('signupBtn');

            if (loginBtn) {
                loginBtn.addEventListener('click', async () => {
                    const phone = phoneInput.value.trim();
                    const password = passInput.value.trim();
                    if (!phone || !password) {
                        errorEl.textContent = 'Please enter phone and password.';
                        errorEl.classList.remove('hidden');
                        return;
                    }
                    errorEl.classList.add('hidden');
                    loginBtn.disabled = true;
                    loginBtn.textContent = '⏳ Logging in...';
                    const result = await handleLogin(phone, password);
                    loginBtn.disabled = false;
                    loginBtn.textContent = '🔑 Login';
                    if (result.success) {
                        await checkAuth();
                    } else {
                        errorEl.textContent = result.message || 'Login failed.';
                        errorEl.classList.remove('hidden');
                    }
                });
            }

            if (showSignup) {
                showSignup.addEventListener('click', () => {
                    document.getElementById('loginForm').classList.add('hidden');
                    document.getElementById('signupForm').classList.remove('hidden');
                });
            }
            if (showLogin) {
                showLogin.addEventListener('click', () => {
                    document.getElementById('signupForm').classList.add('hidden');
                    document.getElementById('loginForm').classList.remove('hidden');
                });
            }

            if (signupBtn) {
                signupBtn.addEventListener('click', async () => {
                    const name = document.getElementById('signupName').value.trim();
                    const email = document.getElementById('signupEmail').value.trim();
                    const phone = document.getElementById('signupPhone').value.trim();
                    const mpesa = document.getElementById('signupMpesa').value.trim();
                    const password = document.getElementById('signupPassword').value;
                    const confirm = document.getElementById('signupConfirm').value;
                    const subjects = Array.from(document.getElementById('signupSubjects').selectedOptions).map(o => o
                    .value);
                    const levels = Array.from(document.getElementById('signupLevels').selectedOptions).map(o => o.value);
                    const bio = document.getElementById('signupBio').value.trim();
                    const errEl = document.getElementById('signupError');

                    if (!name || !email || !phone || !mpesa || !password || !confirm || subjects.length === 0 || levels
                        .length === 0) {
                        errEl.textContent = 'Please fill all required fields.';
                        errEl.classList.remove('hidden');
                        return;
                    }
                    if (password.length < 6) {
                        errEl.textContent = 'Password must be at least 6 characters.';
                        errEl.classList.remove('hidden');
                        return;
                    }
                    if (password !== confirm) {
                        errEl.textContent = 'Passwords do not match.';
                        errEl.classList.remove('hidden');
                        return;
                    }
                    errEl.classList.add('hidden');
                    signupBtn.disabled = true;
                    signupBtn.textContent = '⏳ Submitting...';
                    const result = await handleSignup({ name, email, phone, mpesa, password, subjects, levels, bio });
                    signupBtn.disabled = false;
                    signupBtn.textContent = '📤 Submit Application';
                    if (result.success) {
                        await checkAuth();
                    } else {
                        errEl.textContent = result.message || 'Signup failed.';
                        errEl.classList.remove('hidden');
                    }
                });
            }

            document.querySelectorAll('#loginForm input').forEach(inp => {
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') document.getElementById('loginBtn')?.click();
                });
            });
            document.querySelectorAll('#signupForm input, #signupForm textarea').forEach(inp => {
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') document.getElementById('signupBtn')?.click();
                });
            });
        }
