        // ── ORDERS MODULE ──
        function OrdersModule() {
            const { orders, loadOrders, showToast, newOrderIds, pendingOrderCount, openOrderDetails } = useApp();
            const [filter, setFilter] = useState('all');
            const [loadingOrderId, setLoadingOrderId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const interval = setInterval(() => loadOrders(), 10000);
                return () => clearInterval(interval);
            }, []);

            const getStatusBadge = (status) => {
                const map = { 'pending': 'pending', 'pending_verification': 'pending', 'confirmed': 'confirmed', 'paid': 'paid', 'completed': 'paid', 'cancelled': 'rejected', 'rejected': 'rejected' };
                return map[status] || 'pending';
            };
            const getStatusLabel = (status) => {
                const map = { 'pending': '⏳ Pending', 'pending_verification': '⏳ Pending Approval', 'confirmed': '✅ Confirmed', 'paid': '✅ Paid', 'completed': '✅ Paid', 'cancelled': '❌ Cancelled', 'rejected': '❌ Rejected' };
                return map[status] || '⏳ Pending';
            };
            const isPending = (o) => o.payment_status === 'pending' || o.status === 'pending';

            const handleConfirmOrder = async (order) => {
                if (!confirm(`Confirm order #${order.order_ref || order.id.slice(0,8)}?`)) return;
                setLoadingOrderId(order.id);
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payment_status: 'confirmed', status: 'confirmed' })
                    });
                    showToast('✅ Order confirmed');
                    await loadOrders();
                } catch (e) { showToast('❌ Error: ' + e.message, 'error'); }
                setLoadingOrderId(null);
            };

            const handleRejectOrder = async (order) => {
                if (!confirm(`Reject order #${order.order_ref || order.id.slice(0,8)}?`)) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payment_status: 'rejected', status: 'rejected' })
                    });
                    showToast('❌ Order rejected');
                    await loadOrders();
                } catch (e) { showToast('❌ Error: ' + e.message, 'error'); }
            };

            const filteredOrders = orders.filter(o => {
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    if (!(o.order_ref || '').toLowerCase().includes(s) && !(o.customer_name || '').toLowerCase().includes(s) && !(o.phone || '').includes(s)) return false;
                }
                if (filter === 'pending') return isPending(o);
                if (filter === 'confirmed') return o.payment_status === 'confirmed' || o.status === 'confirmed';
                if (filter === 'paid') return o.payment_status === 'paid' || o.status === 'paid';
                if (filter === 'cancelled') return o.payment_status === 'cancelled' || o.payment_status === 'rejected';
                return true;
            });

            const totalRevenue = orders.reduce((s, o) => s + (o.total_amount || 0), 0);
            const pendingRevenue = orders.filter(o => isPending(o)).reduce((s, o) => s + (o.total_amount || 0), 0);
            const confirmedRevenue = orders.filter(o => o.payment_status === 'confirmed' || o.status === 'confirmed').reduce((s, o) => s + (o.total_amount || 0), 0);

            const hasCartItems = (order) => {
                return order.cart_items && Array.isArray(order.cart_items) && order.cart_items.length > 0;
            };

            const getItemCount = (order) => {
                if (hasCartItems(order)) {
                    return order.cart_items.reduce((sum, item) => sum + (item.quantity || 1), 0);
                }
                return 1;
            };

            return (
                <div className="fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div className="stat-card"><p className="stat-number gold">KES {totalRevenue.toLocaleString()}</p><p className="stat-label">Total Revenue</p></div>
                        <div className="stat-card"><p className="stat-number" style={{color:'#f59e0b'}}>KES {pendingRevenue.toLocaleString()}</p><p className="stat-label">Pending Revenue</p></div>
                        <div className="stat-card"><p className="stat-number green">KES {confirmedRevenue.toLocaleString()}</p><p className="stat-label">Confirmed Revenue</p></div>
                        <div className="stat-card"><p className="stat-number purple">KES {Math.round(confirmedRevenue * 0.2).toLocaleString()}</p><p className="stat-label">Platform Fee (20%)</p></div>
                    </div>

                    <div className="content-card">
                        <div className="card-header">
                            <h2 className="text-xl font-bold">📦 Orders ({orders.length}) {pendingOrderCount>0 && <span className="ml-2 text-xs bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 px-2 py-0.5 rounded-full animate-pulse">{pendingOrderCount} pending</span>}</h2>
                            <button onClick={() => loadOrders()} className="px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-lg text-xs">🔄 Refresh</button>
                        </div>
                        <div className="flex gap-2 flex-wrap mb-4">
                            <button onClick={() => setFilter('all')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'all' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>All</button>
                            <button onClick={() => setFilter('pending')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'pending' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>⏳ Pending</button>
                            <button onClick={() => setFilter('confirmed')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'confirmed' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>✅ Confirmed</button>
                            <button onClick={() => setFilter('paid')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'paid' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>💳 Paid</button>
                        </div>
                        <div className="mb-4"><input type="text" placeholder="🔍 Search by ref, customer, phone..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="form-input" /></div>
                        <div className="table-wrapper">
                            <table>
                                <thead><tr><th>Reference</th><th>Customer</th><th>Phone</th><th>Type</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody>
                                    {filteredOrders.map(o => {
                                        const pending = isPending(o);
                                        const ref = o.order_ref || o.id.slice(0,8).toUpperCase();
                                        const isNew = newOrderIds.includes(o.id);
                                        const isCart = hasCartItems(o);
                                        const itemCount = getItemCount(o);
                                        return (
                                            <tr key={o.id} className={pending ? 'bg-amber-50 dark:bg-amber-900/10' : ''}>
                                                <td className="font-medium">#{ref}</td>
                                                <td className="text-gray-600 dark:text-gray-400">{o.customer_name || 'N/A'}</td>
                                                <td className="text-gray-600 dark:text-gray-400 font-mono text-sm">{o.phone || '—'}</td>
                                                <td><span className={`order-badge ${isCart ? 'cart' : 'single'}`}>{isCart ? '🛒 Cart' : '📄 Single'}</span></td>
                                                <td className="text-gray-600 dark:text-gray-400">{itemCount}</td>
                                                <td className="font-semibold text-[#D4A72C]">KES {o.total_amount || 0}</td>
                                                <td><span className={`status-badge ${getStatusBadge(o.payment_status || o.status)}`}>{getStatusLabel(o.payment_status || o.status)}</span>{isNew && <span className="ml-1 text-xs text-green-500 font-bold">NEW</span>}</td>
                                                <td>
                                                    <div className="flex gap-2 flex-wrap">
                                                        <button onClick={() => openOrderDetails(o)} className="px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-lg text-xs hover:bg-blue-200 transition">📋 Details</button>
                                                        {pending && (
                                                            <>
                                                                <button onClick={() => handleConfirmOrder(o)} disabled={loadingOrderId === o.id} className="px-3 py-1 bg-green-100 dark:bg-green-900/30 text-green-600 rounded-lg text-xs hover:bg-green-200 transition disabled:opacity-50">{loadingOrderId === o.id ? '⏳' : '✅ Confirm'}</button>
                                                                <button onClick={() => handleRejectOrder(o)} className="px-3 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 rounded-lg text-xs hover:bg-red-200 transition">❌ Reject</button>
                                                            </>
                                                        )}
                                                        {(o.payment_status === 'confirmed' || o.status === 'confirmed') && <span className="text-xs text-green-600 dark:text-green-400">✅ Confirmed</span>}
                                                        {(o.payment_status === 'paid' || o.payment_status === 'completed') && <span className="text-xs text-blue-600 dark:text-blue-400">💳 Paid</span>}
                                                        {(o.payment_status === 'cancelled' || o.payment_status === 'rejected') && <span className="text-xs text-red-600 dark:text-red-400">✗ Cancelled</span>}
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <OrderDetailsModal />
                </div>
            );
        }

        // ── ORDER DETAILS MODAL ──
        function OrderDetailsModal() {
            const { selectedOrder, showOrderModal, closeOrderDetails } = useApp();
            if (!showOrderModal || !selectedOrder) return null;

            const order = selectedOrder;
            const isCart = order.cart_items && Array.isArray(order.cart_items) && order.cart_items.length > 0;
            const cartItems = isCart ? order.cart_items : [];
            const itemCount = isCart ? cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0) : 1;
            const subtotal = isCart ? cartItems.reduce((sum, item) => sum + (item.price || 0) * (item.quantity || 1), 0) : (order.item_price || order.total_amount || 0);
            const total = order.total_amount || subtotal;

            const getStatusBadge = (status) => {
                const map = { 'pending': 'pending', 'pending_verification': 'pending', 'confirmed': 'confirmed', 'paid': 'paid', 'completed': 'paid', 'cancelled': 'rejected', 'rejected': 'rejected' };
                return map[status] || 'pending';
            };
            const getStatusLabel = (status) => {
                const map = { 'pending': '⏳ Pending', 'pending_verification': '⏳ Pending Approval', 'confirmed': '✅ Confirmed', 'paid': '✅ Paid', 'completed': '✅ Paid', 'cancelled': '❌ Cancelled', 'rejected': '❌ Rejected' };
                return map[status] || '⏳ Pending';
            };

            return (
                <div className="modal-overlay open" onClick={closeOrderDetails}>
                    <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-xl font-bold text-gray-800 dark:text-white">📋 Order Details</h3>
                            <button onClick={closeOrderDetails} className="text-gray-500 hover:text-gray-700 text-xl">✕</button>
                        </div>
                        <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4 mb-4">
                            <div className="grid grid-cols-2 gap-3">
                                <div><div className="text-xs text-gray-500">Order Reference</div><div className="font-semibold">#{order.order_ref || order.id.slice(0,8).toUpperCase()}</div></div>
                                <div><div className="text-xs text-gray-500">Status</div><span className={`status-badge ${getStatusBadge(order.payment_status || order.status)}`}>{getStatusLabel(order.payment_status || order.status)}</span></div>
                                <div><div className="text-xs text-gray-500">Customer</div><div className="font-semibold">{order.customer_name || 'N/A'}</div></div>
                                <div><div className="text-xs text-gray-500">Phone</div><div className="font-semibold">{order.phone || 'N/A'}</div></div>
                                <div><div className="text-xs text-gray-500">Order Type</div><span className={`order-badge ${isCart ? 'cart' : 'single'}`}>{isCart ? '🛒 Cart Order' : '📄 Single Item'}</span></div>
                                <div><div className="text-xs text-gray-500">Item Count</div><div className="font-semibold">{itemCount} item{itemCount > 1 ? 's' : ''}</div></div>
                                <div><div className="text-xs text-gray-500">Date</div><div className="font-semibold">{order.created_at ? new Date(order.created_at).toLocaleString() : 'N/A'}</div></div>
                                <div><div className="text-xs text-gray-500">Payment Method</div><div className="font-semibold">{order.payment_method || 'STK Push'}</div></div>
                            </div>
                        </div>
                        <div className="mb-4">
                            <h4 className="font-semibold mb-2">{isCart ? '🛒 Cart Items' : '📄 Item Details'}</h4>
                            {isCart ? (
                                <div className="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                                    <div className="cart-item-row header"><div>Item</div><div>Qty</div><div>Price</div><div>Total</div><div></div></div>
                                    {cartItems.map((item, index) => (
                                        <div key={index} className="cart-item-row">
                                            <div className="item-title">{item.title || 'Unknown Item'}</div>
                                            <div>{item.quantity || 1}</div>
                                            <div className="item-price">KES {item.price || 0}</div>
                                            <div className="item-total">KES {(item.price || 0) * (item.quantity || 1)}</div>
                                            <div>{item.subject && <span className="text-xs text-gray-500 dark:text-gray-400">{item.subject}</span>}</div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4">
                                    <div className="order-detail-item"><span className="order-detail-label">Item Title</span><span className="order-detail-value">{order.item_title || 'N/A'}</span></div>
                                    {order.resource_id && <div className="order-detail-item"><span className="order-detail-label">Resource ID</span><span className="order-detail-value">{order.resource_id}</span></div>}
                                </div>
                            )}
                        </div>
                        <div className="order-summary-box">
                            <div className="order-summary-row"><span className="summary-label">Subtotal</span><span className="summary-value">KES {subtotal.toLocaleString()}</span></div>
                            {isCart && cartItems.length > 0 && <div className="order-summary-row"><span className="summary-label">Items</span><span className="summary-value">{itemCount} item{itemCount > 1 ? 's' : ''}</span></div>}
                            <div className="order-summary-row total"><span className="summary-label">Total</span><span className="summary-value">KES {total.toLocaleString()}</span></div>
                        </div>
                        {(order.mpesa_transaction_id || order.transaction_id || order.mpesa_receipt) && (
                            <div className="mt-4 bg-green-50 dark:bg-green-900/20 rounded-lg p-4 border border-green-200 dark:border-green-800">
                                <h4 className="font-semibold text-green-700 dark:text-green-400 mb-2">💳 Payment Details</h4>
                                {order.mpesa_transaction_id && <div className="order-detail-item"><span className="order-detail-label">Transaction ID</span><span className="order-detail-value text-green-700 dark:text-green-400">{order.mpesa_transaction_id}</span></div>}
                                {order.transaction_id && <div className="order-detail-item"><span className="order-detail-label">Transaction ID</span><span className="order-detail-value text-green-700 dark:text-green-400">{order.transaction_id}</span></div>}
                                {order.mpesa_receipt && <div className="order-detail-item"><span className="order-detail-label">M-Pesa Receipt</span><span className="order-detail-value text-green-700 dark:text-green-400">{order.mpesa_receipt}</span></div>}
                            </div>
                        )}
                        <div className="flex gap-3 mt-4">
                            <button onClick={closeOrderDetails} className="btn-gold px-6 py-2 rounded-lg font-semibold">Close</button>
                            {order.file_delivered && <span className="px-4 py-2 bg-green-100 dark:bg-green-900/20 text-green-700 dark:text-green-400 rounded-lg font-semibold">✅ File Delivered</span>}
                        </div>
                    </div>
                </div>
            );
        }

        // ── FINANCE MODULE ──
        function FinanceModule() {
            const { orders, tutors, payments, setPayments, TUTOR_PAYOUT_PERCENTAGE } = useApp();
            const [selectedTutor, setSelectedTutor] = useState(null);
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [paymentAmount, setPaymentAmount] = useState(0);
            const [showAuditModal, setShowAuditModal] = useState(false);
            const [auditData, setAuditData] = useState({ marketing_spent: 0, tutor_payouts_total: 0, notes: '' });
            const [financeSummary, setFinanceSummary] = useState({ total_revenue: 0, platform_fee: 0, tutor_payouts: 0, marketing_spent: 0, actual_balance: 0, pending_payouts: 0, inflow: 0, outflow: 0 });

            const loadPayments = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/tutor_payments?select=*&order=created_at.desc`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    if (res.ok) setPayments(await res.json());
                } catch (e) { console.error(e); }
            };
            useEffect(() => { loadPayments(); }, []);

            useEffect(() => {
                const totalRevenue = orders.reduce((s, o) => s + (o.total_amount || 0), 0);
                const platformFee = totalRevenue * 0.2;
                const tutorPayouts = totalRevenue * 0.8;
                const pendingPayouts = orders.filter(o => o.payment_status === 'confirmed' || o.status === 'confirmed').reduce((s, o) => s + Math.round((o.total_amount || 0) * 0.8), 0);
                const paidPayouts = payments.filter(p => p.status === 'paid').reduce((s, p) => s + (p.amount || 0), 0);
                const marketingSpent = auditData.marketing_spent || 0;
                const actualBalance = totalRevenue - marketingSpent - paidPayouts;
                const inflow = totalRevenue;
                const outflow = marketingSpent + paidPayouts;
                setFinanceSummary({ total_revenue: totalRevenue, platform_fee: platformFee, tutor_payouts: tutorPayouts, marketing_spent: marketingSpent, actual_balance: actualBalance, pending_payouts: pendingPayouts, inflow: inflow, outflow: outflow });
            }, [orders, payments, auditData]);

            const calculateTutorEarnings = (tutorId) => {
                const tutorOrders = orders.filter(o => o.tutor_id === tutorId);
                const totalRevenue = tutorOrders.reduce((s, o) => s + (o.total_amount || 0), 0);
                const completedRevenue = tutorOrders.filter(o => o.payment_status === 'confirmed' || o.status === 'confirmed').reduce((s, o) => s + (o.total_amount || 0), 0);
                return { totalRevenue, completedRevenue, tutorPayout: totalRevenue * (TUTOR_PAYOUT_PERCENTAGE / 100), completedPayout: completedRevenue * (TUTOR_PAYOUT_PERCENTAGE / 100), ordersCount: tutorOrders.length };
            };

            const getTutorPaymentStatus = (tutorId) => {
                const tutorPayments = payments.filter(p => p.tutor_id === tutorId);
                const totalPaid = tutorPayments.filter(p => p.status === 'paid').reduce((s, p) => s + (p.amount || 0), 0);
                return { totalPaid };
            };

            const handleProcessPayment = (tutor) => {
                const earnings = calculateTutorEarnings(tutor.id);
                const pendingAmount = earnings.completedPayout - getTutorPaymentStatus(tutor.id).totalPaid;
                if (pendingAmount <= 0) { alert('No pending earnings'); return; }
                setSelectedTutor(tutor); setPaymentAmount(pendingAmount); setShowPaymentModal(true);
            };

            const confirmPayment = async () => {
                if (!selectedTutor) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/tutor_payments`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tutor_id: selectedTutor.id, tutor_name: selectedTutor.name, amount: paymentAmount, status: 'paid', payment_date: new Date().toISOString(), created_at: new Date().toISOString() })
                    });
                    alert('✅ Payment processed');
                    setShowPaymentModal(false);
                    loadPayments();
                } catch (e) { alert('❌ Failed'); }
            };

            const openAuditModal = () => { setAuditData({ marketing_spent: financeSummary.marketing_spent, tutor_payouts_total: financeSummary.tutor_payouts, notes: '' }); setShowAuditModal(true); };
            const saveAudit = () => {
                localStorage.setItem('kv_finance_audit', JSON.stringify(auditData));
                setFinanceSummary(prev => ({ ...prev, marketing_spent: auditData.marketing_spent, tutor_payouts: auditData.tutor_payouts_total }));
                setShowAuditModal(false);
                alert('✅ Audit saved');
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="stat-card"><p className="stat-number gold">KES {financeSummary.inflow.toLocaleString()}</p><p className="stat-label">💰 Total Revenue (Inflow)</p></div>
                        <div className="stat-card"><p className="stat-number red">KES {financeSummary.outflow.toLocaleString()}</p><p className="stat-label">📤 Total Outflow</p><p className="text-xs text-gray-500">Marketing + Tutor Payouts</p></div>
                        <div className="stat-card"><p className="stat-number" style={{color:'#f59e0b'}}>KES {financeSummary.pending_payouts.toLocaleString()}</p><p className="stat-label">Pending Payouts</p></div>
                        <div className="stat-card"><p className="stat-number green">KES {financeSummary.actual_balance.toLocaleString()}</p><p className="stat-label">💰 Actual Balance</p></div>
                    </div>

                    <div className="content-card">
                        <div className="card-header"><h3>📊 Financial Breakdown</h3><button onClick={openAuditModal} className="btn-gold px-4 py-2 rounded-lg text-sm">🔍 Audit Account</button></div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <div className="flex justify-between py-2 border-b"><span>Total Revenue (Inflow)</span><span className="font-semibold text-green-600">KES {financeSummary.inflow.toLocaleString()}</span></div>
                                <div className="flex justify-between py-2 border-b"><span>Platform Fee (20%)</span><span className="font-semibold text-blue-600">KES {financeSummary.platform_fee.toLocaleString()}</span></div>
                                <div className="flex justify-between py-2 border-b"><span>Tutor Payouts (80%)</span><span className="font-semibold text-amber-600">KES {financeSummary.tutor_payouts.toLocaleString()}</span></div>
                            </div>
                            <div>
                                <div className="flex justify-between py-2 border-b"><span>Marketing Spent</span><span className="font-semibold text-red-600">KES {financeSummary.marketing_spent.toLocaleString()}</span></div>
                                <div className="flex justify-between py-2 border-b"><span>Pending Payouts</span><span className="font-semibold text-amber-600">KES {financeSummary.pending_payouts.toLocaleString()}</span></div>
                                <div className="flex justify-between py-2 border-b"><span>Total Outflow</span><span className="font-semibold text-red-600">KES {financeSummary.outflow.toLocaleString()}</span></div>
                                <div className="flex justify-between py-2 bg-green-50 dark:bg-green-900/20 rounded-lg px-3 mt-1"><span className="font-bold">💰 Actual Balance</span><span className="font-bold text-green-600">KES {financeSummary.actual_balance.toLocaleString()}</span></div>
                            </div>
                        </div>
                    </div>

                    <div className="content-card">
                        <div className="card-header"><h3>🧑‍🏫 Tutor Payouts ({TUTOR_PAYOUT_PERCENTAGE}% of Revenue)</h3></div>
                        <div className="table-wrapper">
                            <table>
                                <thead><tr><th>Tutor</th><th>Orders</th><th>Total Revenue</th><th>Payout (80%)</th><th>Paid</th><th>Actions</th></tr></thead>
                                <tbody>
                                    {tutors.filter(t => t.status === 'active').map(t => {
                                        const earnings = calculateTutorEarnings(t.id);
                                        const { totalPaid } = getTutorPaymentStatus(t.id);
                                        const pendingAmount = earnings.completedPayout - totalPaid;
                                        return (
                                            <tr key={t.id}>
                                                <td className="font-medium">{t.name}</td>
                                                <td>{earnings.ordersCount}</td>
                                                <td>KES {earnings.totalRevenue.toLocaleString()}</td>
                                                <td className="font-semibold text-[#D4A72C]">KES {earnings.tutorPayout.toLocaleString()}</td>
                                                <td>KES {totalPaid.toLocaleString()}</td>
                                                <td>{pendingAmount > 0 && <button onClick={() => handleProcessPayment(t)} className="px-3 py-1 bg-green-100 dark:bg-green-900/30 text-green-600 rounded-lg text-xs">💰 Pay KES {pendingAmount.toLocaleString()}</button>}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showPaymentModal && <div className="modal-overlay open" onClick={() => setShowPaymentModal(false)}><div className="modal-box" onClick={(e) => e.stopPropagation()}><h3 className="text-lg font-bold mb-4">💳 Process Payment</h3><p><strong>Tutor:</strong> {selectedTutor?.name}</p><p><strong>Amount:</strong> KES {paymentAmount.toLocaleString()}</p><div className="flex gap-3 mt-4"><button onClick={confirmPayment} className="btn-gold px-6 py-2 rounded-lg">✅ Confirm</button><button onClick={() => setShowPaymentModal(false)} className="px-6 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg">Cancel</button></div></div></div>}

                    {showAuditModal && <div className="modal-overlay open" onClick={() => setShowAuditModal(false)}><div className="modal-box" onClick={(e) => e.stopPropagation()}><h3 className="text-lg font-bold mb-4">🔍 Audit Account</h3>
                        <div className="space-y-4">
                            <input type="number" placeholder="Marketing Spent" value={auditData.marketing_spent} onChange={(e) => setAuditData({...auditData, marketing_spent: parseFloat(e.target.value)||0})} className="form-input" />
                            <input type="number" placeholder="Tutor Payouts Total" value={auditData.tutor_payouts_total} onChange={(e) => setAuditData({...auditData, tutor_payouts_total: parseFloat(e.target.value)||0})} className="form-input" />
                            <textarea placeholder="Notes" value={auditData.notes} onChange={(e) => setAuditData({...auditData, notes: e.target.value})} className="form-input" rows="2"></textarea>
                            <div className="flex gap-3"><button onClick={saveAudit} className="btn-gold px-6 py-2 rounded-lg">💾 Save Audit</button><button onClick={() => setShowAuditModal(false)} className="px-6 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg">Cancel</button></div>
                        </div>
                    </div></div>}
                </div>
            );
        }

        // ── PROMOTE MODULE ──
        function PromoteModule() {
            const { resources, showToast } = useApp();
            const [selectedCategories, setSelectedCategories] = useState({
                'lesson-plan': true,
                'scheme-work': true,
                'revision-paper': true,
                'exam-paper': true
            });
            const [campaignSource, setCampaignSource] = useState('whatsapp');
            const [trackingSlug, setTrackingSlug] = useState('');
            const [couponCode, setCouponCode] = useState('');
            const [generatedLinks, setGeneratedLinks] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [generating, setGenerating] = useState(false);

            const categoryLabels = {
                'lesson-plan': '📝 Lesson Plans',
                'scheme-work': '📋 Schemes of Work',
                'revision-paper': '📖 Revision Papers',
                'exam-paper': '📊 Exam Papers'
            };

            const categoryIcons = {
                'lesson-plan': '📝',
                'scheme-work': '📋',
                'revision-paper': '📖',
                'exam-paper': '📊'
            };

            const sourceLabels = {
                'whatsapp': 'WhatsApp',
                'telegram': 'Telegram',
                'facebook': 'Facebook',
                'email': 'Email'
            };

            const promoMessages = {
                'whatsapp': "📚 *KenyaVault Academy* — Your trusted source for KICD-aligned educational resources! 🎓\n\n📖 *What's included:*\n✅ Schemes of Work & Lesson Plans\n✅ Revision & Exam Papers\n✅ Interactive & Audio Lessons\n✅ Instant download via M-PESA\n\n🔗 *Get your resources here:* ",
                'telegram': "📚 *KenyaVault Academy* — KICD-aligned CBC resources! 🎓\n\n📖 *Features:*\n• Schemes of Work & Lesson Plans\n• Revision & Exam Papers\n• Interactive & Audio Lessons\n• Instant M-PESA download\n\n🔗 *Access now:* ",
                'facebook': "📚 KenyaVault Academy — Your trusted source for KICD-aligned CBC resources! 🎓\n\n📖 What's included:\n✅ Schemes of Work & Lesson Plans\n✅ Revision & Exam Papers\n✅ Interactive & Audio Lessons\n✅ Instant download via M-PESA\n\n🔗 Get your resources here: ",
                'email': "📚 KenyaVault Academy — Your Trusted Education Partner 🇰🇪\n\nDear Educator,\n\nWe're excited to share KenyaVault Academy's comprehensive collection of KICD-aligned CBC resources! 🎓\n\n📖 Our Resources Include:\n• Schemes of Work & Lesson Plans\n• Revision Papers & Exam Papers\n• Interactive & Audio Lessons\n• Instant download via M-PESA\n\n🔗 Access your resources: "
            };

            const getCategoryResources = (category) => {
                const catMap = {
                    'lesson-plan': ['lesson-plan', 'lesson plan'],
                    'scheme-work': ['scheme-work', 'scheme of work'],
                    'revision-paper': ['revision-paper', 'revision paper', 'revision'],
                    'exam-paper': ['exam-paper', 'exam paper', 'exam']
                };
                const keywords = catMap[category] || [category];
                return resources.filter(r => {
                    const type = (r.resource_type || r.type || '').toLowerCase().replace(/\s+/g, '-');
                    return keywords.some(k => type.includes(k) || type === k);
                });
            };

            const getCategoryCount = (category) => {
                return getCategoryResources(category).length;
            };

            const getTotalSelected = () => {
                let total = 0;
                Object.keys(selectedCategories).forEach(cat => {
                    if (selectedCategories[cat]) total += getCategoryCount(cat);
                });
                return total;
            };

            const toggleCategory = (category) => {
                setSelectedCategories(prev => ({
                    ...prev,
                    [category]: !prev[category]
                }));
            };

            const generateLinks = () => {
                const baseUrl = window.location.origin;
                const selected = Object.keys(selectedCategories).filter(cat => selectedCategories[cat]);
                
                if (selected.length === 0) {
                    showToast('⚠️ Please select at least one category', 'error');
                    return;
                }

                setGenerating(true);
                const links = [];
                const timestamp = Date.now();

                selected.forEach(cat => {
                    const count = getCategoryCount(cat);
                    if (count === 0) return;

                    const slug = trackingSlug || cat.replace('-', '_');
                    const source = campaignSource;
                    const couponParam = couponCode ? `&coupon=${encodeURIComponent(couponCode)}` : '';
                    const url = `${baseUrl}/shop.html?category=${cat}&utm_source=${source}&utm_medium=promo&utm_campaign=${slug}&ref=kv_promo${couponParam}`;
                    
                    const shortCode = `KV-${source.toUpperCase()}-${cat.slice(0, 3).toUpperCase()}-${timestamp.toString().slice(-4)}`;
                    
                    const message = promoMessages[source] || promoMessages.whatsapp;
                    const fullMessage = `${message}${url}`;

                    links.push({
                        category: cat,
                        label: categoryLabels[cat] || cat,
                        count: count,
                        url: url,
                        shortCode: shortCode,
                        message: fullMessage
                    });
                });

                setGeneratedLinks(links);
                setGenerating(false);
                showToast(`✅ ${links.length} promo links generated!`, 'success');
            };

            const copyToClipboard = async (text) => {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('📋 Copied to clipboard!', 'success');
                } catch (err) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('📋 Copied to clipboard!', 'success');
                }
            };

            const copyAllLinks = () => {
                const text = generatedLinks.map(l => 
                    `${l.label} (${l.count} resources)\n${l.url}\n`
                ).join('\n');
                copyToClipboard(text);
            };

            const copyFullMessage = (index) => {
                const link = generatedLinks[index];
                if (link) copyToClipboard(link.message);
            };

            const openModal = () => setShowModal(true);
            const closeModal = () => {
                setShowModal(false);
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="content-card">
                        <div className="flex justify-between items-center">
                            <h3 className="text-lg font-semibold">📢 Bulk Promotion Link Generator</h3>
                            <button onClick={openModal} className="btn-gold px-6 py-2 rounded-lg text-sm">
                                <i className="fas fa-link mr-2"></i> Generate Promo Links
                            </button>
                        </div>
                        <p className="text-gray-500 dark:text-gray-400 text-sm mt-2">
                            Create optimized tracking links for selected resource categories to share on Kenyan social channels.
                        </p>
                    </div>

                    {generatedLinks.length > 0 && (
                        <div className="content-card">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-lg font-semibold">🔗 Generated Promo Links</h3>
                                <div className="flex gap-2">
                                    <button onClick={copyAllLinks} className="btn-sm blue">📋 Copy All</button>
                                    <button onClick={() => setGeneratedLinks([])} className="btn-sm red">Clear</button>
                                </div>
                            </div>
                            <div className="generated-links-container">
                                {generatedLinks.map((link, index) => (
                                    <div key={index} className="generated-link-item">
                                        <div className="flex-1 min-w-0">
                                            <div className="link-title">{link.label} <span className="text-sm text-gray-500">({link.count} resources)</span></div>
                                            <div className="link-url text-sm truncate">{link.url}</div>
                                            <div className="text-xs text-gray-400">Code: {link.shortCode}</div>
                                        </div>
                                        <div className="flex gap-2 flex-wrap">
                                            <button onClick={() => copyToClipboard(link.url)} className="copy-btn">📋 Copy Link</button>
                                            <button onClick={() => copyFullMessage(index)} className="copy-btn" style={{background: '#7C3AED', color: '#fff'}}>💬 Copy Message</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="promo-message-box mt-3">
                                <strong>📱 Recommended message for {sourceLabels[campaignSource]}:</strong>
                                <br />
                                {generatedLinks.length > 0 && (
                                    <div className="mt-2 text-sm">
                                        {generatedLinks.map(l => (
                                            <div key={l.category} className="mb-2 p-2 bg-white/50 dark:bg-gray-800/50 rounded-lg">
                                                <span className="font-semibold">{l.label}:</span> {l.url}
                                            </div>
                                        ))}
                                        <div className="mt-2 p-2 bg-[#D4A72C]/10 rounded-lg border border-[#D4A72C]/20">
                                            <span className="font-semibold">💡 Tip:</span> Share these links in WhatsApp groups, Telegram channels, and Facebook communities. 
                                            Use the KenyaVault brand name and emphasize the KICD-aligned, instant download features.
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {showModal && (
                        <div className="modal-overlay open" onClick={closeModal}>
                            <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold">Generate Promo Links for Selected Categories</h2>
                                    <button onClick={closeModal} className="text-gray-500 hover:text-gray-700 text-2xl">✕</button>
                                </div>

                                <div className="mb-6">
                                    <p className="text-sm text-gray-600 dark:text-gray-400">
                                        Select the resource categories you want to promote. Links will be generated with tracking parameters 
                                        for each selected category, grouped by resource type.
                                    </p>
                                </div>

                                <div className="category-summary-grid">
                                    {Object.keys(selectedCategories).map(cat => {
                                        const count = getCategoryCount(cat);
                                        const label = categoryLabels[cat] || cat;
                                        const icon = categoryIcons[cat] || '📄';
                                        return (
                                            <div 
                                                key={cat} 
                                                className={`category-summary-card cursor-pointer ${selectedCategories[cat] ? 'border-[#D4A72C]' : 'opacity-50'}`}
                                                onClick={() => toggleCategory(cat)}
                                            >
                                                <div>
                                                    <span className="cat-icon">{icon}</span>
                                                    <span className="cat-name">{label}</span>
                                                    <span className="text-xs text-gray-400 ml-2">({count} resources)</span>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="cat-count">{count}</span>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={selectedCategories[cat]} 
                                                        onChange={() => toggleCategory(cat)}
                                                        className="w-4 h-4 accent-[#D4A72C]"
                                                        onClick={(e) => e.stopPropagation()}
                                                    />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-4 text-sm text-gray-500 dark:text-gray-400">
                                    Total selected: <span className="font-bold text-[#D4A72C]">{getTotalSelected()}</span> resources
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                            Campaign Source <span className="text-red-500">*</span>
                                        </label>
                                        <select 
                                            value={campaignSource} 
                                            onChange={(e) => setCampaignSource(e.target.value)}
                                            className="form-input"
                                        >
                                            <option value="whatsapp">📱 WhatsApp</option>
                                            <option value="telegram">✈️ Telegram</option>
                                            <option value="facebook">📘 Facebook</option>
                                            <option value="email">✉️ Email</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                            Tracking Slug (optional)
                                        </label>
                                        <input 
                                            type="text" 
                                            value={trackingSlug} 
                                            onChange={(e) => setTrackingSlug(e.target.value)}
                                            placeholder="e.g., cbc2026"
                                            className="form-input"
                                        />
                                        <span className="text-xs text-gray-400">Helps identify campaign in analytics</span>
                                    </div>
                                </div>

                                <div className="mt-4">
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                        Coupon Code (optional)
                                    </label>
                                    <input 
                                        type="text" 
                                        value={couponCode} 
                                        onChange={(e) => setCouponCode(e.target.value)}
                                        placeholder="e.g., VAULT20"
                                        className="form-input"
                                    />
                                    <span className="text-xs text-gray-400">Add a discount code to encourage purchases</span>
                                </div>

                                <div className="mt-6 flex gap-3">
                                    <button 
                                        onClick={generateLinks} 
                                        disabled={generating || getTotalSelected() === 0}
                                        className="btn-gold px-6 py-2 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {generating ? '⏳ Generating...' : '🔗 Generate Links'}
                                    </button>
                                    <button onClick={closeModal} className="px-6 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg font-semibold">Cancel</button>
                                </div>

                                {getTotalSelected() === 0 && (
                                    <p className="text-red-500 text-sm mt-2">⚠️ Please select at least one category</p>
                                )}

                                {generatedLinks.length > 0 && !generating && (
                                    <div className="mt-4 p-3 bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-200 dark:border-green-800">
                                        <p className="text-sm text-green-700 dark:text-green-400">
                                            ✅ {generatedLinks.length} links generated! Links are also available in the main panel below.
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ── SETTINGS MODULE ──
        function SettingsModule() {
            const { darkMode, toggleDarkMode, showToast } = useApp();
            const [settings, setSettings] = useState({ siteName: 'KenyaVault', siteTagline: 'Complete Education Resources', emailNotifications: true, orderNotifications: true, payoutPercentage: 80, currency: 'KES', timezone: 'Africa/Nairobi' });
            const [loading, setLoading] = useState(false);

            const handleSave = async (e) => {
                e.preventDefault();
                setLoading(true);
                localStorage.setItem('kv-settings', JSON.stringify(settings));
                showToast('✅ Settings saved');
                setLoading(false);
            };

            useEffect(() => {
                const saved = localStorage.getItem('kv-settings');
                if (saved) try { setSettings(prev => ({ ...prev, ...JSON.parse(saved) })); } catch (e) {}
            }, []);

            return (
                <div className="content-card max-w-2xl fade-in">
                    <h3 className="text-xl font-bold mb-6">⚙️ Settings</h3>
                    <form onSubmit={handleSave}>
                        <div className="settings-section"><h4 className="text-sm font-semibold mb-3">General</h4>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" name="siteName" value={settings.siteName} onChange={(e) => setSettings({...settings, siteName: e.target.value})} className="form-input" />
                                <input type="text" name="siteTagline" value={settings.siteTagline} onChange={(e) => setSettings({...settings, siteTagline: e.target.value})} className="form-input" />
                            </div>
                        </div>
                        <div className="settings-section"><h4 className="text-sm font-semibold mb-3">Payout Settings</h4>
                            <div className="flex items-center gap-2">
                                <input type="number" name="payoutPercentage" value={settings.payoutPercentage} onChange={(e) => setSettings({...settings, payoutPercentage: parseInt(e.target.value) || 0})} min="0" max="100" className="w-24 form-input" />
                                <span>%</span>
                                <select name="currency" value={settings.currency} onChange={(e) => setSettings({...settings, currency: e.target.value})} className="form-input ml-4"><option value="KES">KES</option><option value="USD">USD</option><option value="EUR">EUR</option></select>
                            </div>
                        </div>
                        <div className="settings-section"><h4 className="text-sm font-semibold mb-3">Notifications</h4>
                            <label className="flex items-center gap-2"><input type="checkbox" checked={settings.emailNotifications} onChange={(e) => setSettings({...settings, emailNotifications: e.target.checked})} className="w-4 h-4 accent-[#D4A72C]" /> Email notifications</label>
                            <label className="flex items-center gap-2"><input type="checkbox" checked={settings.orderNotifications} onChange={(e) => setSettings({...settings, orderNotifications: e.target.checked})} className="w-4 h-4 accent-[#D4A72C]" /> Order notifications</label>
                        </div>
                        <div className="settings-section"><h4 className="text-sm font-semibold mb-3">Display</h4>
                            <div className="flex items-center justify-between"><span>Dark Mode</span><button type="button" onClick={toggleDarkMode} className="px-4 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg">{darkMode ? '☀️ Light' : '🌙 Dark'}</button></div>
                        </div>
                        <div className="settings-section"><h4 className="text-sm font-semibold mb-3">Regional</h4>
                            <select name="timezone" value={settings.timezone} onChange={(e) => setSettings({...settings, timezone: e.target.value})} className="form-input w-full md:w-64"><option value="Africa/Nairobi">Africa/Nairobi (EAT)</option><option value="Africa/Lagos">Africa/Lagos (WAT)</option><option value="UTC">UTC</option></select>
                        </div>
                        <div className="mt-6 flex gap-3">
                            <button type="submit" disabled={loading} className="btn-gold px-6 py-2 rounded-lg">{loading ? '⏳...' : '💾 Save'}</button>
                            <button type="button" onClick={() => { if (confirm('Reset?')) { localStorage.removeItem('kv-settings'); setSettings({ siteName: 'KenyaVault', siteTagline: 'Complete Education Resources', emailNotifications: true, orderNotifications: true, payoutPercentage: 80, currency: 'KES', timezone: 'Africa/Nairobi' }); showToast('✅ Reset'); } }} className="px-6 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 rounded-lg">Reset</button>
                        </div>
                    </form>
                </div>
            );
        }

        // ── MODULE RENDERER ──
        function ModuleRenderer() {
            const { currentModule } = useApp();
            const map = {
                dashboard: <DashboardModule />,
                learners: <LearnersModule />,
                resources: <ResourcesModule />,
                tutors: <TutorsModule />,
                orders: <OrdersModule />,
                finance: <FinanceModule />,
                promote: <PromoteModule />,
                settings: <SettingsModule />,
            };
            return map[currentModule] || <DashboardModule />;
        }

        // ── MAIN APP ──
        function App() {
            const { isAuthenticated } = useApp();
            if (!isAuthenticated) return <LoginPage />;
            return (
                <div className="dashboard-wrapper">
                    <Sidebar />
                    <div className="main-content">
                        <Topbar />
                        <ModuleRenderer />
                    </div>
                    <ToastContainer />
                    <PendingAlert />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>
</html>
