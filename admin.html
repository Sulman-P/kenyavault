        // ── PDF PREVIEW GENERATION FUNCTIONS ──
        // ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──

        async function generatePreview(resourceId) {
            const { showToast, loadData } = useApp();
            
            // Find the resource
            const resource = resources.find(r => r.id === resourceId);
            if (!resource) {
                showToast('❌ Resource not found', 'error');
                return;
            }

            // Check if preview already exists
            if (resource.has_preview) {
                showToast('✅ Preview already exists', 'success');
                return;
            }

            // Mark as generating
            setResources(prev => prev.map(r => 
                r.id === resourceId ? { ...r, preview_generating: true } : r
            ));

            try {
                showToast('⏳ Generating preview...', 'info');

                // Get the file path from the resource
                let filePath = resource.file_path || resource.file_url || '';
                
                // Clean up the file path
                for (const bucket of AVAILABLE_BUCKETS) {
                    if (filePath.startsWith(`${bucket}/`)) {
                        filePath = filePath.replace(`${bucket}/`, '');
                        break;
                    }
                }
                filePath = filePath.replace(/^https?:\/\/[^\/]+\/storage\/v1\/object\/public\/[^\/]+\//, '');
                filePath = filePath.replace(/^\/+/, '');
                if (filePath && !filePath.startsWith('resources/')) {
                    filePath = `resources/${filePath}`;
                }

                // Call the Supabase Edge Function to generate preview
                const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-preview`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        filePath: filePath,
                        fileId: resourceId,
                        bucketName: 'kenyavault-pdfs'
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Preview generation failed');
                }

                const result = await response.json();
                
                if (result.success) {
                    showToast('✅ Preview generated successfully!', 'success');
                    // Reload resources to show the preview status
                    loadData();
                } else {
                    showToast('❌ Preview generation failed: ' + (result.error || 'Unknown error'), 'error');
                }

            } catch (error) {
                console.error('❌ Preview generation error:', error);
                showToast('❌ Preview generation failed: ' + error.message, 'error');
            } finally {
                // Remove generating flag
                setResources(prev => prev.map(r => 
                    r.id === resourceId ? { ...r, preview_generating: false } : r
                ));
            }
        }

        // ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──
        // ── BULK UPLOAD MODULE WITH PREVIEW GENERATION ──
        // ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──

        function BulkUploadModule() {
            const { showToast, loadData, resources, setResources } = useApp();
            const [files, setFiles] = useState([]);
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState({});
            const [batchSettings, setBatchSettings] = useState({
                level: '',
                price: 0,
                subject: '',
                curriculum: 'cbc',
                resource_type: 'lesson-plan',
                description: ''
            });
            const [uploadResults, setUploadResults] = useState([]);
            const fileInputRef = useRef(null);

            const handleDrop = useCallback((e) => {
                e.preventDefault();
                const droppedFiles = Array.from(e.dataTransfer.files);
                const validFiles = droppedFiles.filter(f => 
                    f.type === 'application/pdf' || 
                    f.name.endsWith('.pdf') ||
                    f.name.endsWith('.docx') ||
                    f.name.endsWith('.pptx')
                );
                setFiles(prev => [...prev, ...validFiles]);
            }, []);

            const handleFileSelect = (e) => {
                const selectedFiles = Array.from(e.target.files);
                const validFiles = selectedFiles.filter(f => 
                    f.type === 'application/pdf' || 
                    f.name.endsWith('.pdf') ||
                    f.name.endsWith('.docx') ||
                    f.name.endsWith('.pptx')
                );
                setFiles(prev => [...prev, ...validFiles]);
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            };

            const removeFile = (index) => {
                setFiles(prev => prev.filter((_, i) => i !== index));
                const fileName = files[index]?.name;
                if (fileName) {
                    setUploadProgress(prev => {
                        const newProgress = { ...prev };
                        delete newProgress[fileName];
                        return newProgress;
                    });
                }
            };

            const calculateTotalSize = () => {
                return files.reduce((sum, f) => sum + f.size, 0);
            };

            const getUploadStatus = (fileName) => {
                return uploadProgress[fileName] || { status: 'pending', progress: 0 };
            };

            // ── GENERATE PREVIEW AFTER UPLOAD ──
            const generatePreviewForResource = async (resourceId, filePath) => {
                try {
                    // Clean up the file path
                    let cleanPath = filePath;
                    for (const bucket of AVAILABLE_BUCKETS) {
                        if (cleanPath.startsWith(`${bucket}/`)) {
                            cleanPath = cleanPath.replace(`${bucket}/`, '');
                            break;
                        }
                    }
                    cleanPath = cleanPath.replace(/^https?:\/\/[^\/]+\/storage\/v1\/object\/public\/[^\/]+\//, '');
                    cleanPath = cleanPath.replace(/^\/+/, '');
                    if (cleanPath && !cleanPath.startsWith('resources/')) {
                        cleanPath = `resources/${cleanPath}`;
                    }

                    const response = await fetch(`${SUPABASE_URL}/functions/v1/generate-preview`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            filePath: cleanPath,
                            fileId: resourceId,
                            bucketName: 'kenyavault-pdfs'
                        })
                    });

                    if (!response.ok) {
                        console.warn(`⚠️ Preview generation failed for resource ${resourceId}`);
                        return null;
                    }

                    const result = await response.json();
                    return result.previewUrl;
                } catch (error) {
                    console.error('❌ Preview generation error:', error);
                    return null;
                }
            };

            // ── CORE BULK UPLOAD LOGIC WITH PREVIEW ──
            const uploadSingleFile = async (file, index) => {
                const fileName = file.name;
                
                try {
                    setUploadProgress(prev => ({
                        ...prev,
                        [fileName]: { status: 'uploading', progress: 10 }
                    }));

                    const fileExt = file.name.split('.').pop();
                    const sanitizedName = file.name.replace(/\s/g, '_').replace(/[^a-zA-Z0-9._-]/g, '');
                    const timestamp = Date.now();
                    const uniqueFileName = `${timestamp}-${index}-${sanitizedName}`;
                    const filePath = `resources/${batchSettings.level}/${uniqueFileName}`;

                    // ── SUPABASE STORAGE UPLOAD ──
                    const formData = new FormData();
                    formData.append('file', file);

                    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/kenyavault-pdfs/${filePath}`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        },
                        body: formData
                    });

                    if (!uploadRes.ok) {
                        const errorText = await uploadRes.text();
                        throw new Error(`Upload failed: ${errorText}`);
                    }

                    setUploadProgress(prev => ({
                        ...prev,
                        [fileName]: { status: 'uploading', progress: 60 }
                    }));

                    const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/kenyavault-pdfs/${filePath}`;

                    // ── DATABASE SYNCHRONIZATION ──
                    const resourceData = {
                        title: file.name.replace(/\.[^/.]+$/, ''),
                        subject: batchSettings.subject || '',
                        level: batchSettings.level,
                        curriculum: batchSettings.curriculum || 'cbc',
                        resource_type: batchSettings.resource_type || 'lesson-plan',
                        price: parseFloat(batchSettings.price) || 0,
                        description: batchSettings.description || `Uploaded in batch: ${new Date().toISOString().split('T')[0]}`,
                        file_url: fileUrl,
                        file_path: filePath,
                        file_name: file.name,
                        file_size: file.size,
                        status: 'draft',
                        created_at: new Date().toISOString(),
                        download_count: 0,
                        kicd_aligned: true,
                        cbc_compliant: batchSettings.curriculum === 'cbc',
                        has_preview: false,
                        preview_generating: false
                    };

                    const createRes = await fetch(`${SUPABASE_URL}/rest/v1/resources`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(resourceData)
                    });

                    if (!createRes.ok) {
                        const errorText = await createRes.text();
                        throw new Error(`Database insert failed: ${errorText}`);
                    }

                    const result = await createRes.json();
                    const created = result[0] || result;
                    const resourceId = created.id;

                    setUploadProgress(prev => ({
                        ...prev,
                        [fileName]: { status: 'uploading', progress: 80 }
                    }));

                    // ── GENERATE PREVIEW ──
                    // Only generate preview for PDF files
                    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        try {
                            const previewUrl = await generatePreviewForResource(resourceId, filePath);
                            if (previewUrl) {
                                // Update the resource with preview URL
                                await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${resourceId}`, {
                                    method: 'PATCH',
                                    headers: {
                                        'apikey': SUPABASE_ANON_KEY,
                                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        has_preview: true,
                                        preview_url: previewUrl,
                                        preview_generating: false,
                                        updated_at: new Date().toISOString()
                                    })
                                });
                                console.log(`✅ Preview generated for: ${file.name}`);
                            } else {
                                console.warn(`⚠️ No preview generated for: ${file.name}`);
                                // Update resource to indicate preview generation was attempted
                                await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${resourceId}`, {
                                    method: 'PATCH',
                                    headers: {
                                        'apikey': SUPABASE_ANON_KEY,
                                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        preview_generating: false,
                                        updated_at: new Date().toISOString()
                                    })
                                });
                            }
                        } catch (previewError) {
                            console.warn(`⚠️ Preview generation failed for ${file.name}:`, previewError);
                            // Update resource to indicate preview generation failed
                            await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${resourceId}`, {
                                method: 'PATCH',
                                headers: {
                                    'apikey': SUPABASE_ANON_KEY,
                                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    preview_generating: false,
                                    updated_at: new Date().toISOString()
                                })
                            });
                        }
                    } else {
                        // For non-PDF files, just mark as having no preview
                        await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${resourceId}`, {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                has_preview: false,
                                preview_generating: false,
                                updated_at: new Date().toISOString()
                            })
                        });
                    }

                    setUploadProgress(prev => ({
                        ...prev,
                        [fileName]: { status: 'completed', progress: 100 }
                    }));

                    return {
                        success: true,
                        file: file.name,
                        resource: created,
                        url: fileUrl,
                        previewGenerated: file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')
                    };

                } catch (error) {
                    console.error(`❌ Upload failed for ${file.name}:`, error);
                    setUploadProgress(prev => ({
                        ...prev,
                        [fileName]: { status: 'failed', progress: 0, error: error.message }
                    }));
                    return {
                        success: false,
                        file: file.name,
                        error: error.message
                    };
                }
            };

            const handleBulkUpload = async () => {
                if (files.length === 0) {
                    showToast('⚠️ Please select files to upload', 'error');
                    return;
                }
                if (!batchSettings.level) {
                    showToast('⚠️ Please select a grade/level', 'error');
                    return;
                }

                setUploading(true);
                setUploadResults([]);
                
                const initialProgress = {};
                files.forEach(f => {
                    initialProgress[f.name] = { status: 'pending', progress: 0 };
                });
                setUploadProgress(initialProgress);

                const CONCURRENCY_LIMIT = 3;
                const results = [];
                const uploadQueue = [...files];
                let activeUploads = 0;
                let completed = 0;

                return new Promise((resolve) => {
                    const processNext = async () => {
                        if (uploadQueue.length === 0 && activeUploads === 0) {
                            setUploadResults(results);
                            const successCount = results.filter(r => r.success).length;
                            const failCount = results.filter(r => !r.success).length;
                            const previewCount = results.filter(r => r.previewGenerated).length;
                            
                            let message = `${successCount} files processed successfully. ${failCount} failed.`;
                            if (previewCount > 0) {
                                message += ` ${previewCount} previews generated.`;
                            }
                            showToast(`✅ ${successCount} uploaded, ${failCount} failed`, message);

                            if (failCount === 0) {
                                setTimeout(() => {
                                    setFiles([]);
                                    setUploadProgress({});
                                    loadData();
                                }, 3000);
                            }
                            
                            setUploading(false);
                            resolve(results);
                            return;
                        }

                        while (uploadQueue.length > 0 && activeUploads < CONCURRENCY_LIMIT) {
                            const file = uploadQueue.shift();
                            const index = files.indexOf(file);
                            activeUploads++;

                            const result = await uploadSingleFile(file, index);
                            results.push(result);
                            
                            completed++;
                            activeUploads--;
                            processNext();
                        }
                    };

                    processNext();
                });
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
                        <h3 className="text-lg font-semibold mb-4">📤 Bulk Upload Resources with Preview Generation</h3>
                        
                        {/* Batch Settings - same as before */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                                    Grade/Level <span className="text-red-500">*</span>
                                </label>
                                <select 
                                    value={batchSettings.level} 
                                    onChange={(e) => setBatchSettings({...batchSettings, level: e.target.value})}
                                    className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white"
                                    required
                                >
                                    <option value="">Select Level</option>
                                    <option value="pp1">PP1</option><option value="pp2">PP2</option>
                                    <option value="grade-1">Grade 1</option><option value="grade-2">Grade 2</option>
                                    <option value="grade-3">Grade 3</option><option value="grade-4">Grade 4</option>
                                    <option value="grade-5">Grade 5</option><option value="grade-6">Grade 6</option>
                                    <option value="grade-7">Grade 7</option><option value="grade-8">Grade 8</option>
                                    <option value="grade-9">Grade 9</option><option value="grade-10">Grade 10</option>
                                    <option value="grade-11">Grade 11</option><option value="grade-12">Grade 12</option>
                                    <option value="form-1">Form 1</option><option value="form-2">Form 2</option>
                                    <option value="form-3">Form 3</option><option value="form-4">Form 4</option>
                                    <option value="college">College</option><option value="tvet">TVET</option><option value="university">University</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Subject</label>
                                <select value={batchSettings.subject} onChange={(e) => setBatchSettings({...batchSettings, subject: e.target.value})} className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
                                    <option value="">Select Subject</option>
                                    <option value="mathematics">Mathematics</option><option value="english">English</option><option value="kiswahili">Kiswahili</option>
                                    <option value="integrated-science">Integrated Science</option><option value="social-studies">Social Studies</option>
                                    <option value="creative-arts">Creative Arts</option><option value="business-studies">Business Studies</option>
                                    <option value="agriculture">Agriculture</option><option value="religious-education">Religious Education</option>
                                    <option value="computer-studies">Computer Studies</option><option value="chemistry">Chemistry</option>
                                    <option value="physics">Physics</option><option value="biology">Biology</option>
                                    <option value="pretechnical-studies">Pretechnical Studies</option>
                                    <option value="history-citizenship">History & Citizenship</option><option value="geography">Geography</option>
                                    <option value="tvet">TVET</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Price (KES)</label>
                                <input type="number" value={batchSettings.price} onChange={(e) => setBatchSettings({...batchSettings, price: parseFloat(e.target.value) || 0})} className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white" min="0" />
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Resource Type</label>
                                <select value={batchSettings.resource_type} onChange={(e) => setBatchSettings({...batchSettings, resource_type: e.target.value})} className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
                                    <option value="lesson-plan">Lesson Plan</option><option value="scheme-work">Scheme of Work</option>
                                    <option value="revision-paper">Revision Paper</option><option value="exam-paper">Exam Paper</option>
                                    <option value="lesson-notes">Lesson Notes</option><option value="predictions">Prediction Assessment</option>
                                    <option value="cbc-portfolio">CBC Portfolio</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Curriculum</label>
                                <select value={batchSettings.curriculum} onChange={(e) => setBatchSettings({...batchSettings, curriculum: e.target.value})} className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
                                    <option value="cbc">CBC</option><option value="8-4-4">8-4-4</option>
                                </select>
                            </div>
                        </div>
                        
                        <div className="mb-4">
                            <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Batch Description (Optional)</label>
                            <input type="text" value={batchSettings.description} onChange={(e) => setBatchSettings({...batchSettings, description: e.target.value})} className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white" placeholder="e.g., Grade 7 Mathematics Revision Papers" />
                        </div>

                        {/* Info Banner about preview generation */}
                        <div className="mb-4 p-3 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg">
                            <p className="text-sm text-blue-700 dark:text-blue-300">
                                <strong>💡 PDF Preview Generation:</strong> For each uploaded PDF file, a 1-page preview will be automatically generated and saved as <code>filename_preview.pdf</code>. 
                                This preview will be available to customers before purchase.
                            </p>
                        </div>

                        {/* File Drop Zone */}
                        <div 
                            className="drop-zone"
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={handleDrop}
                            onClick={() => fileInputRef.current?.click()}
                        >
                            <input type="file" ref={fileInputRef} style={{display:'none'}} onChange={handleFileSelect} multiple accept=".pdf,.docx,.pptx" />
                            <div className="text-4xl mb-2">📁</div>
                            <div className="text-sm text-gray-500 dark:text-gray-400">
                                {files.length > 0 ? `${files.length} file(s) selected` : 'Drag & drop files here, or click to select'}
                            </div>
                            <div className="text-xs text-gray-400 dark:text-gray-500 mt-1">
                                Supports PDF, DOCX, PPTX • PDF previews auto-generated
                            </div>
                            {files.length > 0 && (
                                <div className="text-xs text-gray-500 dark:text-gray-400 mt-2">
                                    Total size: {(calculateTotalSize() / 1024 / 1024).toFixed(2)} MB
                                </div>
                            )}
                        </div>

                        {/* File List with Progress */}
                        {files.length > 0 && (
                            <div className="mt-4 file-list-container">
                                {files.map((file, index) => {
                                    const status = getUploadStatus(file.name);
                                    const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                                    return (
                                        <div key={index} className="file-item">
                                            <div className="file-info">
                                                <div className="file-name truncate">{file.name}</div>
                                                <div className="file-size">{(file.size / 1024).toFixed(1)} KB {isPDF && <span className="text-xs text-blue-500 ml-2">📄 PDF (preview will be generated)</span>}</div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                {status.status === 'pending' && (
                                                    <button onClick={() => removeFile(index)} className="text-red-500 hover:text-red-700 text-sm px-2" disabled={uploading}>✕</button>
                                                )}
                                                {status.status === 'uploading' && (
                                                    <div className="file-progress-track"><div className="file-progress-bar" style={{width: status.progress + '%'}}></div></div>
                                                )}
                                                <span className={`file-status ${status.status}`}>
                                                    {status.status === 'pending' && 'Pending'}
                                                    {status.status === 'uploading' && `${status.progress}%`}
                                                    {status.status === 'completed' && '✅ Done'}
                                                    {status.status === 'failed' && '❌ Failed'}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* Upload Button */}
                        <div className="mt-4 flex gap-3">
                            <button onClick={handleBulkUpload} disabled={uploading || files.length === 0 || !batchSettings.level} className="btn-gold px-6 py-2 rounded-lg font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
                                {uploading ? '⏳ Uploading...' : `📤 Upload ${files.length} File(s)`}
                            </button>
                            {files.length > 0 && !uploading && (
                                <button onClick={() => { setFiles([]); setUploadProgress({}); setUploadResults([]); }} className="px-4 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg font-semibold">Clear All</button>
                            )}
                        </div>

                        {/* Upload Results Summary */}
                        {uploadResults.length > 0 && (
                            <div className="mt-4 p-4 bg-gray-50 dark:bg-gray-800/50 rounded-lg">
                                <h4 className="font-semibold mb-2">📊 Upload Results</h4>
                                <div className="grid grid-cols-4 gap-4 text-center">
                                    <div><div className="text-2xl font-bold text-green-600">{uploadResults.filter(r => r.success).length}</div><div className="text-xs text-gray-500">Successful</div></div>
                                    <div><div className="text-2xl font-bold text-red-600">{uploadResults.filter(r => !r.success).length}</div><div className="text-xs text-gray-500">Failed</div></div>
                                    <div><div className="text-2xl font-bold text-[#D4A017]">{uploadResults.length}</div><div className="text-xs text-gray-500">Total</div></div>
                                    <div><div className="text-2xl font-bold text-blue-600">{uploadResults.filter(r => r.previewGenerated).length}</div><div className="text-xs text-gray-500">Previews Generated</div></div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──
        // ── TUTORS MODULE ──
        // ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ── ──

        function TutorsModule() {
            const { tutors, setTutors, orders, resources, showToast } = useApp();
            const [formData, setFormData] = useState({ name: '', email: '', phone: '', specialization: '' });
            const [editingTutor, setEditingTutor] = useState(null);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editFormData, setEditFormData] = useState({ name: '', email: '', phone: '', specialization: '', status: 'active' });
            const [tutorStats, setTutorStats] = useState({});

            const loadTutors = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/tutors?select=*`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    if (res.ok) setTutors(await res.json());
                } catch (e) { console.error(e); }
            };

            const calculateTutorStats = useCallback(() => {
                const stats = {};
                tutors.forEach(t => {
                    const tutorResources = resources.filter(r => r.creator_id === t.id || r.tutor_id === t.id || r.creator_name === t.name);
                    const totalDownloads = tutorResources.reduce((sum, r) => sum + (r.download_count || 0), 0);
                    const paidResources = tutorResources.filter(r => r.price > 0);
                    const freeResources = tutorResources.filter(r => r.price === 0 || r.price === null);
                    const totalRevenue = paidResources.reduce((sum, r) => sum + (r.price || 0) * (r.download_count || 0), 0);
                    const tutorPayout = totalRevenue * (TUTOR_PAYOUT_PERCENTAGE / 100);
                    const tutorOrderIds = orders.filter(o => {
                        const cartItems = o.cart_items || [];
                        return cartItems.some(item => {
                            const resource = resources.find(r => r.id === item.id);
                            return resource && (resource.creator_id === t.id || resource.tutor_id === t.id || resource.creator_name === t.name);
                        });
                    });
                    stats[t.id] = {
                        resourceCount: tutorResources.length,
                        totalDownloads: totalDownloads,
                        paidResources: paidResources.length,
                        freeResources: freeResources.length,
                        totalRevenue: totalRevenue,
                        tutorPayout: tutorPayout,
                        orderCount: tutorOrderIds.length,
                        resources: tutorResources
                    };
                });
                setTutorStats(stats);
            }, [tutors, resources, orders]);

            useEffect(() => { loadTutors(); }, []);
            useEffect(() => {
                if (tutors.length > 0 && resources.length > 0) {
                    calculateTutorStats();
                }
            }, [tutors, resources, orders, calculateTutorStats]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.email || !formData.specialization) { showToast('⚠️ Fill all required fields', 'error'); return; }
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/tutors`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...formData, status: 'active', created_at: new Date().toISOString() })
                    });
                    showToast('✅ Tutor added');
                    setFormData({ name: '', email: '', phone: '', specialization: '' });
                    loadTutors();
                } catch (e) { showToast('❌ Failed', 'error'); }
            };

            const openEditModal = (t) => { setEditingTutor(t); setEditFormData({ name: t.name, email: t.email, phone: t.phone, specialization: t.specialization, status: t.status }); setShowEditModal(true); };
            const closeEditModal = () => { setShowEditModal(false); setEditingTutor(null); };

            const handleEditSave = async () => {
                if (!editingTutor) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${editingTutor.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(editFormData)
                    });
                    showToast('✅ Updated');
                    closeEditModal();
                    loadTutors();
                } catch (e) { showToast('❌ Update failed', 'error'); }
            };

            const toggleStatus = async (id, currentStatus) => {
                const newStatus = currentStatus === 'active' ? 'suspended' : 'active';
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });
                    showToast(`✅ ${newStatus === 'active' ? 'Activated' : 'Suspended'}`);
                    loadTutors();
                } catch (e) { showToast('❌ Status update failed', 'error'); }
            };

            const deleteTutor = async (id) => {
                if (!confirm('Delete?')) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/tutors?id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    showToast('✅ Deleted');
                    loadTutors();
                } catch (e) { showToast('❌ Delete failed', 'error'); }
            };

            const totalDownloads = Object.values(tutorStats).reduce((sum, s) => sum + s.totalDownloads, 0);
            const totalRevenue = Object.values(tutorStats).reduce((sum, s) => sum + s.totalRevenue, 0);
            const totalPayout = Object.values(tutorStats).reduce((sum, s) => sum + s.tutorPayout, 0);

            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
                        <h3 className="text-lg font-semibold mb-4">🧑‍🏫 Add New Tutor</h3>
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" placeholder="Full Name *" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700" required />
                            <input type="email" placeholder="Email *" value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700" required />
                            <input type="tel" placeholder="Phone" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700" />
                            <select value={formData.specialization} onChange={(e) => setFormData({...formData, specialization: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700" required>
                                <option value="">Specialization *</option>
                                <option value="mathematics">Mathematics</option><option value="english">English</option><option value="kiswahili">Kiswahili</option>
                                <option value="science">Integrated Science</option><option value="social-studies">Social Studies</option>
                                <option value="creative-arts">Creative Arts</option><option value="business-studies">Business Studies</option>
                                <option value="religious-education">Religious Education</option><option value="computer-studies">Computer Studies</option>
                                <option value="agriculture-nutrition">Agriculture</option><option value="kiswahili">Kiswahili</option><option value="aviation">Aviation</option>
                                <option value="chemistry">Chemistry</option><option value="physics">Physics</option><option value="Biology">Biology</option>
                                <option value="geography">Geography</option><option value="History-citizenship">History & Citizenship</option>
                                <option value="pretechnical-studies">Pretechnical Studies</option><option value="tvet">TVET</option>
                                <option value="college">College</option><option value="university">University</option>
                            </select>
                            <div className="md:col-span-2"><button type="submit" className="btn-gold px-6 py-2 rounded-lg">➕ Add Tutor</button></div>
                        </form>
                    </div>

                    <div className="tutor-download-stats">
                        <div className="tutor-stat-card"><div className="stat-number">{totalDownloads}</div><div className="stat-label">📥 Total Downloads</div></div>
                        <div className="tutor-stat-card"><div className="stat-number gold">KES {totalRevenue.toLocaleString()}</div><div className="stat-label">💰 Total Revenue</div></div>
                        <div className="tutor-stat-card"><div className="stat-number purple">KES {totalPayout.toLocaleString()}</div><div className="stat-label">💳 Total Payout ({TUTOR_PAYOUT_PERCENTAGE}%)</div></div>
                        <div className="tutor-stat-card"><div className="stat-number blue">{tutors.filter(t => t.status === 'active').length}</div><div className="stat-label">👨‍🏫 Active Tutors</div></div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
                        <div className="card-header">
                            <h3>📋 Tutor Roster &amp; Performance</h3>
                            <button onClick={loadTutors} className="btn-gold px-4 py-2 rounded-lg text-sm">🔄 Refresh</button>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50 dark:bg-gray-700/50">
                                    <tr><th className="px-4 py-2 text-left">Tutor</th><th className="px-4 py-2 text-left">Specialization</th><th className="px-4 py-2 text-left">Resources</th><th className="px-4 py-2 text-left">Downloads</th><th className="px-4 py-2 text-left">Revenue</th><th className="px-4 py-2 text-left">Payout (80%)</th><th className="px-4 py-2 text-left">Status</th><th className="px-4 py-2 text-left">Actions</th></tr>
                                </thead>
                                <tbody>
                                    {tutors.map(t => {
                                        const stats = tutorStats[t.id] || { resourceCount: 0, totalDownloads: 0, totalRevenue: 0, tutorPayout: 0 };
                                        return (
                                            <tr key={t.id} className="border-t border-gray-100 dark:border-gray-700">
                                                <td className="px-4 py-2 font-medium">{t.name}</td>
                                                <td className="px-4 py-2 text-gray-600 dark:text-gray-400">{t.specialization || '—'}</td>
                                                <td className="px-4 py-2 text-center">{stats.resourceCount}</td>
                                                <td className="px-4 py-2 text-center font-semibold text-blue-600">{stats.totalDownloads}</td>
                                                <td className="px-4 py-2 font-semibold text-[#D4A017]">KES {stats.totalRevenue.toLocaleString()}</td>
                                                <td className="px-4 py-2 font-semibold text-purple-600">KES {stats.tutorPayout.toLocaleString()}</td>
                                                <td className="px-4 py-2"><span className={`status-badge ${t.status === 'active' ? 'active' : 'suspended'}`}>{t.status || 'inactive'}</span></td>
                                                <td className="px-4 py-2 flex gap-2 flex-wrap">
                                                    <button onClick={() => openEditModal(t)} className="px-2 py-1 text-xs bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded">✏️</button>
                                                    <button onClick={() => toggleStatus(t.id, t.status)} className="px-2 py-1 text-xs bg-green-100 dark:bg-green-900/30 text-green-600 rounded">{t.status === 'active' ? '⏸️' : '▶️'}</button>
                                                    <button onClick={() => deleteTutor(t.id)} className="px-2 py-1 text-xs bg-red-100 dark:bg-red-900/30 text-red-600 rounded">🗑️</button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showEditModal && <div className="modal-overlay open" onClick={closeEditModal}><div className="modal-box" onClick={(e) => e.stopPropagation()}><h3 className="text-lg font-semibold mb-4">✏️ Edit Tutor</h3>
                        <div className="space-y-4">
                            <input type="text" placeholder="Name" value={editFormData.name} onChange={(e) => setEditFormData({...editFormData, name: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700" />
                            <input type="email" placeholder="Email" value={editFormData.email} onChange={(e) => setEditFormData({...editFormData, email: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700" />
                            <input type="tel" placeholder="Phone" value={editFormData.phone} onChange={(e) => setEditFormData({...editFormData, phone: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700" />
                            <select value={editFormData.specialization} onChange={(e) => setEditFormData({...editFormData, specialization: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700"><option value="mathematics">Mathematics</option><option value="english">English</option><option value="kiswahili">Kiswahili</option><option value="science">Science</option></select>
                            <select value={editFormData.status} onChange={(e) => setEditFormData({...editFormData, status: e.target.value})} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700"><option value="active">Active</option><option value="suspended">Suspended</option></select>
                            <div className="flex gap-3"><button onClick={handleEditSave} className="btn-gold px-4 py-2 rounded-lg">💾 Save</button><button onClick={closeEditModal} className="px-4 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg">Cancel</button></div>
                        </div>
                    </div></div>}
                </div>
            );
        }

        // ── ORDERS MODULE ──
        function OrdersModule() {
            const { orders, loadOrders, showToast, newOrderIds, pendingOrderCount, openOrderDetails } = useApp();
            const [filter, setFilter] = useState('all');
            const [loadingOrderId, setLoadingOrderId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const interval = setInterval(() => loadOrders(), 10000);
                return () => clearInterval(interval);
            }, []);

            const getStatusBadge = (status) => {
                const map = { 'pending': 'pending', 'pending_verification': 'pending', 'confirmed': 'confirmed', 'paid': 'paid', 'completed': 'paid', 'cancelled': 'rejected', 'rejected': 'rejected' };
                return map[status] || 'pending';
            };
            const getStatusLabel = (status) => {
                const map = { 'pending': '⏳ Pending', 'pending_verification': '⏳ Pending Approval', 'confirmed': '✅ Confirmed', 'paid': '✅ Paid', 'completed': '✅ Paid', 'cancelled': '❌ Cancelled', 'rejected': '❌ Rejected' };
                return map[status] || '⏳ Pending';
            };
            const isPending = (o) => o.payment_status === 'pending' || o.status === 'pending';

            const handleConfirmOrder = async (order) => {
                if (!confirm(`Confirm order #${order.order_ref || order.id.slice(0,8)}?`)) return;
                setLoadingOrderId(order.id);
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payment_status: 'confirmed', status: 'confirmed' })
                    });
                    showToast('✅ Order confirmed');
                    await loadOrders();
                } catch (e) { showToast('❌ Error: ' + e.message, 'error'); }
                setLoadingOrderId(null);
            };

            const handleRejectOrder = async (order) => {
                if (!confirm(`Reject order #${order.order_ref || order.id.slice(0,8)}?`)) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ payment_status: 'rejected', status: 'rejected' })
                    });
                    showToast('❌ Order rejected');
                    await loadOrders();
                } catch (e) { showToast('❌ Error: ' + e.message, 'error'); }
            };

            const filteredOrders = orders.filter(o => {
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    if (!(o.order_ref || '').toLowerCase().includes(s) && !(o.customer_name || '').toLowerCase().includes(s) && !(o.phone || '').includes(s)) return false;
                }
                if (filter === 'pending') return isPending(o);
                if (filter === 'confirmed') return o.payment_status === 'confirmed' || o.status === 'confirmed';
                if (filter === 'paid') return o.payment_status === 'paid' || o.status === 'paid';
                if (filter === 'cancelled') return o.payment_status === 'cancelled' || o.payment_status === 'rejected';
                return true;
            });

            const totalRevenue = orders.reduce((s, o) => s + (o.total_amount || 0), 0);
            const pendingRevenue = orders.filter(o => isPending(o)).reduce((s, o) => s + (o.total_amount || 0), 0);
            const confirmedRevenue = orders.filter(o => o.payment_status === 'confirmed' || o.status === 'confirmed').reduce((s, o) => s + (o.total_amount || 0), 0);

            const hasCartItems = (order) => {
                return order.cart_items && Array.isArray(order.cart_items) && order.cart_items.length > 0;
            };

            const getItemCount = (order) => {
                if (hasCartItems(order)) {
                    return order.cart_items.reduce((sum, item) => sum + (item.quantity || 1), 0);
                }
                return 1;
            };

            return (
                <div className="fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700"><p className="text-sm text-gray-500">Total Revenue</p><p className="text-2xl font-bold text-[#D4A017]">KES {totalRevenue.toLocaleString()}</p></div>
                        <div className="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700"><p className="text-sm text-gray-500">Pending Revenue</p><p className="text-2xl font-bold text-amber-600">KES {pendingRevenue.toLocaleString()}</p></div>
                        <div className="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700"><p className="text-sm text-gray-500">Confirmed Revenue</p><p className="text-2xl font-bold text-green-600">KES {confirmedRevenue.toLocaleString()}</p></div>
                        <div className="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700"><p className="text-sm text-gray-500">Platform Fee (20%)</p><p className="text-2xl font-bold text-purple-600">KES {Math.round(confirmedRevenue * 0.2).toLocaleString()}</p></div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
                        <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                            <h2 className="text-xl font-bold">📦 Orders ({orders.length}) {pendingOrderCount>0 && <span className="ml-2 text-xs bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 px-2 py-0.5 rounded-full animate-pulse">{pendingOrderCount} pending</span>}</h2>
                            <button onClick={() => loadOrders()} className="px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-lg text-xs">🔄 Refresh</button>
                        </div>
                        <div className="flex gap-2 flex-wrap mb-4">
                            <button onClick={() => setFilter('all')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'all' ? 'bg-[#D4A017] text-[#0a1a3a]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>All</button>
                            <button onClick={() => setFilter('pending')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'pending' ? 'bg-[#D4A017] text-[#0a1a3a]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>⏳ Pending</button>
                            <button onClick={() => setFilter('confirmed')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'confirmed' ? 'bg-[#D4A017] text-[#0a1a3a]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>✅ Confirmed</button>
                            <button onClick={() => setFilter('paid')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'paid' ? 'bg-[#D4A017] text-[#0a1a3a]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>💳 Paid</button>
                        </div>
                        <div className="mb-4"><input type="text" placeholder="🔍 Search by ref, customer, phone..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white" /></div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50 dark:bg-gray-700/50">
                                    <tr><th className="px-4 py-2 text-left">Reference</th><th className="px-4 py-2 text-left">Customer</th><th className="px-4 py-2 text-left">Phone</th><th className="px-4 py-2 text-left">Type</th><th className="px-4 py-2 text-left">Items</th><th className="px-4 py-2 text-left">Total</th><th className="px-4 py-2 text-left">Status</th><th className="px-4 py-2 text-left">Actions</th></tr>
                                </thead>
                                <tbody>
                                    {filteredOrders.map(o => {
                                        const pending = isPending(o);
                                        const ref = o.order_ref || o.id.slice(0,8).toUpperCase();
                                        const isNew = newOrderIds.includes(o.id);
                                        const isCart = hasCartItems(o);
                                        const itemCount = getItemCount(o);
                                        return (
                                            <tr key={o.id} className={`border-t border-gray-100 dark:border-gray-700 ${pending ? 'bg-amber-50 dark:bg-amber-900/10' : ''} ${isNew ? 'new-order-flash' : ''}`}>
                                                <td className="px-4 py-2 font-medium">#{ref}</td>
                                                <td className="px-4 py-2 text-gray-600 dark:text-gray-400">{o.customer_name || 'N/A'}</td>
                                                <td className="px-4 py-2 text-gray-600 dark:text-gray-400 font-mono text-sm">{o.phone || '—'}</td>
                                                <td className="px-4 py-2"><span className={`order-badge ${isCart ? 'cart' : 'single'}`}>{isCart ? '🛒 Cart' : '📄 Single'}</span></td>
                                                <td className="px-4 py-2 text-gray-600 dark:text-gray-400">{itemCount}</td>
                                                <td className="px-4 py-2 font-semibold text-[#D4A017]">KES {o.total_amount || 0}</td>
                                                <td className="px-4 py-2"><span className={`status-badge ${getStatusBadge(o.payment_status || o.status)}`}>{getStatusLabel(o.payment_status || o.status)}</span>{isNew && <span className="ml-1 text-xs text-green-500 font-bold">NEW</span>}</td>
                                                <td className="px-4 py-2">
                                                    <div className="flex gap-2 flex-wrap">
                                                        <button onClick={() => openOrderDetails(o)} className="px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg text-xs hover:bg-blue-200 transition">📋 Details</button>
                                                        {pending && (
                                                            <>
                                                                <button onClick={() => handleConfirmOrder(o)} disabled={loadingOrderId === o.id} className="px-3 py-1 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-lg text-xs hover:bg-green-200 transition disabled:opacity-50">{loadingOrderId === o.id ? '⏳' : '✅ Confirm'}</button>
                                                                <button onClick={() => handleRejectOrder(o)} className="px-3 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg text-xs hover:bg-red-200 transition">❌ Reject</button>
                                                            </>
                                                        )}
                                                        {(o.payment_status === 'confirmed' || o.status === 'confirmed') && <span className="text-xs text-green-600 dark:text-green-400">✅ Confirmed</span>}
                                                        {(o.payment_status === 'paid' || o.payment_status === 'completed') && <span className="text-xs text-blue-600 dark:text-blue-400">💳 Paid</span>}
                                                        {(o.payment_status === 'cancelled' || o.payment_status === 'rejected') && <span className="text-xs text-red-600 dark:text-red-400">✗ Cancelled</span>}
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <OrderDetailsModal />
                </div>
            );
        }

        // ── ORDER DETAILS MODAL ──
        function OrderDetailsModal() {
            const { selectedOrder, showOrderModal, closeOrderDetails } = useApp();
            if (!showOrderModal || !selectedOrder) return null;

            const order = selectedOrder;
            const isCart = order.cart_items && Array.isArray(order.cart_items) && order.cart_items.length > 0;
            const cartItems = isCart ? order.cart_items : [];
            const itemCount = isCart ? cartItems.reduce((sum, item) => sum + (item.quantity || 1), 0) : 1;
            const subtotal = isCart ? cartItems.reduce((sum, item) => sum + (item.price || 0) * (item.quantity || 1), 0) : (order.item_price || order.total_amount || 0);
            const total = order.total_amount || subtotal;

            const getStatusBadge = (status) => {
                const map = { 'pending': 'pending', 'pending_verification': 'pending', 'confirmed': 'confirmed', 'paid': 'paid', 'completed': 'paid', 'cancelled': 'rejected', 'rejected': 'rejected' };
                return map[status] || 'pending';
            };
            const getStatusLabel = (status) => {
                const map = { 'pending': '⏳ Pending', 'pending_verification': '⏳ Pending Approval', 'confirmed': '✅ Confirmed', 'paid': '✅ Paid', 'completed': '✅ Paid', 'cancelled': '❌ Cancelled', 'rejected': '❌ Rejected' };
                return map[status] || '⏳ Pending';
            };

            return (
                <div className="modal-overlay open" onClick={closeOrderDetails}>
                    <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-xl font-bold text-gray-800 dark:text-white">📋 Order Details</h3>
                            <button onClick={closeOrderDetails} className="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-xl">✕</button>
                        </div>
                        <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4 mb-4">
                            <div className="grid grid-cols-2 gap-3">
                                <div><div className="text-xs text-gray-500 dark:text-gray-400">Order Reference</div><div className="font-semibold text-gray-800 dark:text-white">#{order.order_ref || order.id.slice(0,8).toUpperCase()}</div></div>
                                <div><div className="text-xs text-gray-500 dark:text-gray-400">Status</div><span className={`status-badge ${getStatusBadge(order.payment_status || order.status)}`}>{getStatusLabel(order.payment_status || order.status)}</span></div>
                                <div><div className="text-xs text-gray-500 dark:text-gray-400">Customer</div><div className="font-semibold text-gray-800 dark:text-white">{order.customer_name || 'N/A'}</div></div>
                                <div><div className="text-xs text-gray-500 dark:text-gray-400">Phone</div><div className="font-semibold text-gray-800 dark:text-white">{order.phone || 'N/A'}</div></div>
                                <div><div className="text-xs text-gray-500 dark:text-gray-400">Order Type</div><span className={`order-badge ${isCart ? 'cart' : 'single'}`}>{isCart ? '🛒 Cart Order' : '📄 Single Item'}</span></div>
                                <div><div className="text-xs text-gray-500 dark:text-gray-400">Item Count</div><div className="font-semibold text-gray-800 dark:text-white">{itemCount} item{itemCount > 1 ? 's' : ''}</div></div>
                                <div><div className="text-xs text-gray-500 dark:text-gray-400">Date</div><div className="font-semibold text-gray-800 dark:text-white">{order.created_at ? new Date(order.created_at).toLocaleString() : 'N/A'}</div></div>

                                <h4 className="font-semibold text-green-700 dark:text-green-400 mb-2">💳 Payment Details</h4>
                                {order.mpesa_transaction_id && <div className="order-detail-item"><span className="order-detail-label">Transaction ID</span><span className="order-detail-value text-green-700 dark:text-green-400">{order.mpesa_transaction_id}</span></div>}
