<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Admin — Kenyavault Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            transition: background 0.3s, color 0.3s;
        }
        .dark body {
            background: #0f172a;
            color: #e5e7eb;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #374151;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 280px;
            background: #0a1a3a;
            color: #fff;
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .dark .sidebar {
            background: #0f172a;
        }
        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .sidebar-header .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header .logo .logo-icon {
            width: 36px;
            height: 36px;
            background: #d4a017;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #0a1a3a;
        }
        .sidebar-header .logo span {
            color: #FCD34D;
        }
        .sidebar-close-btn {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .sidebar-close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar-menu {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }
        .sidebar-menu .menu-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 16px 6px;
            font-weight: 700;
        }
        .sidebar-menu .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        .sidebar-menu .menu-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .sidebar-menu .menu-item.active {
            background: rgba(212, 160, 23, 0.15);
            color: #FCD34D;
            border-left: 3px solid #D4A017;
        }
        .sidebar-menu .menu-item i {
            width: 20px;
            text-align: center;
            font-size: 0.95rem;
        }
        .sidebar-menu .menu-item .badge {
            margin-left: auto;
            background: rgba(212, 160, 23, 0.2);
            color: #FCD34D;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 600;
        }
        .sidebar-menu .menu-item .badge.danger {
            background: rgba(220, 38, 38, 0.25);
            color: #f87171;
        }
        .pending-badge {
            position: relative;
        }
        .pending-badge .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #dc2626;
            color: white;
            font-size: 0.55rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                transform: scale(1)
            }
            50% {
                transform: scale(1.15)
            }
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .sidebar-footer .logout-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            color: #ef4444;
            background: rgba(220, 38, 38, 0.1);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .sidebar-footer .logout-btn:hover {
            background: rgba(220, 38, 38, 0.2);
        }

        /* TOPBAR */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e5e7eb;
            padding: 0 24px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dark .topbar {
            background: rgba(17, 24, 39, 0.92);
            border-color: #374151;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            color: #1f2937;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .dark .hamburger-btn {
            color: #f3f4f6;
        }
        .hamburger-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        .dark .hamburger-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .topbar-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1f2937;
        }
        .dark .topbar-title {
            color: #f3f4f6;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 1.1rem;
            color: #6b7280;
            transition: all 0.2s;
        }
        .topbar-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        .dark .topbar-actions button {
            color: #9ca3af;
        }
        .dark .topbar-actions button:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .topbar-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #D4A017;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a1a3a;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #16a34a;
            background: #dcfce7;
            padding: 4px 14px;
            border-radius: 99px;
        }
        .dark .live-indicator {
            background: rgba(22, 163, 74, 0.2);
            color: #34d399;
        }
        .live-indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #16a34a;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: 0.3
            }
        }

        .topbar-datetime {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #4a5f7a;
            background: #f0f4fa;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #e6edf5;
            white-space: nowrap;
        }
        .dark .topbar-datetime {
            color: #9ca3af;
            background: #1f2937;
            border-color: #374151;
        }
        .topbar-datetime i {
            font-size: 0.8rem;
            color: #6b7f99;
        }
        .dark .topbar-datetime i {
            color: #6b7f99;
        }

        .main-content {
            flex: 1;
            min-height: 100vh;
            padding: 24px 28px 40px;
            background: #f0f2f5;
            transition: margin-left 0.3s;
        }
        .dark .main-content {
            background: #0f172a;
        }

        /* STATUS BADGES */
        .status-badge {
            padding: 3px 12px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }
        .status-badge.confirmed {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-badge.live {
            background: #d1fae5;
            color: #065f46;
        }
        .status-badge.paid {
            background: #d1fae5;
            color: #065f46;
        }
        .status-badge.pending-approval {
            background: #fef3c7;
            color: #92400e;
        }
        .status-badge.approved {
            background: #d1fae5;
            color: #065f46;
        }
        .status-badge.rejected {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.suspended {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.draft {
            background: #f3f4f6;
            color: #6b7280;
        }
        .status-badge.active {
            background: #dbeafe;
            color: #1e40af;
        }
        .dark .status-badge.pending {
            background: #78350f;
            color: #fbbf24;
        }
        .dark .status-badge.confirmed {
            background: #1e3a5f;
            color: #60a5fa;
        }
        .dark .status-badge.live {
            background: #064e3b;
            color: #34d399;
        }
        .dark .status-badge.paid {
            background: #064e3b;
            color: #34d399;
        }
        .dark .status-badge.pending-approval {
            background: #78350f;
            color: #fbbf24;
        }
        .dark .status-badge.approved {
            background: #064e3b;
            color: #34d399;
        }
        .dark .status-badge.rejected {
            background: #7f1d1d;
            color: #f87171;
        }
        .dark .status-badge.suspended {
            background: #7f1d1d;
            color: #f87171;
        }
        .dark .status-badge.draft {
            background: #374151;
            color: #9ca3af;
        }
        .dark .status-badge.active {
            background: #1e3a5f;
            color: #60a5fa;
        }

        /* CARDS */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #fff;
            border-radius: 16px;
            padding: 18px 22px;
            border: 1px solid #e5e7eb;
            transition: all .2s;
            position: relative;
            overflow: hidden;
        }
        .dark .stat-card {
            background: #1f2937;
            border-color: #374151;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .stat-card .stat-icon {
            position: absolute;
            right: 18px;
            top: 18px;
            font-size: 1.8rem;
            opacity: 0.15;
        }
        .stat-card .stat-number {
            font-weight: 800;
            font-size: 1.8rem;
            color: #0a1a3a;
            margin-top: 4px;
        }
        .dark .stat-card .stat-number {
            color: #fff;
        }
        .stat-card .stat-label {
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: 500;
        }
        .dark .stat-card .stat-label {
            color: #9ca3af;
        }
        .stat-card .stat-trend {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .stat-card .stat-trend.up {
            color: #16a34a;
        }
        .stat-card .stat-trend.down {
            color: #dc2626;
        }

        .content-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e5e7eb;
            margin-bottom: 24px;
        }
        .dark .content-card {
            background: #1f2937;
            border-color: #374151;
        }
        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        .dark .content-card .card-header {
            border-color: #374151;
        }
        .content-card .card-header h3 {
            font-weight: 700;
            font-size: 1.05rem;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dark .content-card .card-header h3 {
            color: #fff;
        }

        .btn-gold {
            background: #D4A017;
            color: #0a1a3a;
            padding: 9px 22px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all .2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-gold:hover {
            background: #FCD34D;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(212, 160, 23, 0.3);
        }
        .btn-gold-outline {
            background: transparent;
            color: #D4A017;
            padding: 8px 20px;
            border: 2px solid #D4A017;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all .2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-gold-outline:hover {
            background: #D4A017;
            color: #0a1a3a;
        }
        .btn-sm {
            padding: 4px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.7rem;
            border: none;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-sm.green {
            background: #dcfce7;
            color: #16a34a;
        }
        .btn-sm.red {
            background: #fee2e2;
            color: #dc2626;
        }
        .btn-sm.blue {
            background: #dbeafe;
            color: #2563eb;
        }
        .btn-sm.amber {
            background: #fef3c7;
            color: #92400e;
        }
        .dark .btn-sm.green {
            background: rgba(22, 163, 74, 0.2);
            color: #34d399;
        }
        .dark .btn-sm.red {
            background: rgba(220, 38, 38, 0.2);
            color: #f87171;
        }
        .dark .btn-sm.blue {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }
        .dark .btn-sm.amber {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }
        .btn-sm:hover {
            transform: translateY(-1px);
        }

        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        thead {
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }
        .dark thead {
            background: #1f2937;
            border-color: #374151;
        }
        th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: #6b7280;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dark th {
            color: #9ca3af;
        }
        td {
            padding: 10px 14px;
            border-bottom: 1px solid #f3f4f6;
            color: #1f2937;
        }
        .dark td {
            border-color: #374151;
            color: #e5e7eb;
        }
        tr:hover td {
            background: #f9fafb;
        }
        .dark tr:hover td {
            background: #1f2937;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            max-width: 400px;
            width: 100%;
        }
        .toast-item {
            background: white;
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-left: 4px solid #0b7e4b;
            margin-bottom: 10px;
            animation: slideInRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dark .toast-item {
            background: #1f2937;
        }
        .toast-item .toast-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1f2937;
        }
        .dark .toast-item .toast-title {
            color: #f3f4f6;
        }
        .toast-item .toast-msg {
            font-size: 0.8rem;
            color: #6b7280;
        }
        .dark .toast-item .toast-msg {
            color: #9ca3af;
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .dark .modal-box {
            background: #1f2937;
        }
        .modal-box .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dark .modal-box .modal-title {
            color: #fff;
        }
        .modal-box input,
        .modal-box select,
        .modal-box textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dce5ef;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            font-family: 'Inter', sans-serif;
            background: #f8fafd;
            transition: 0.2s;
        }
        .dark .modal-box input,
        .dark .modal-box select,
        .dark .modal-box textarea {
            background: #1f2937;
            border-color: #374151;
            color: #e5e7eb;
        }
        .modal-box input:focus,
        .modal-box select:focus,
        .modal-box textarea:focus {
            outline: none;
            border-color: #D4A017;
            box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.15);
        }
        .modal-box textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .modal-box .modal-actions button {
            padding: 10px 28px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-box .modal-actions .primary {
            background: #D4A017;
            color: #0a1a3a;
        }
        .modal-box .modal-actions .primary:hover {
            background: #FCD34D;
        }
        .modal-box .modal-actions .secondary {
            background: #f0f4fa;
            color: #1d3147;
        }
        .dark .modal-box .modal-actions .secondary {
            background: #374151;
            color: #e5e7eb;
        }
        .modal-box .modal-actions .secondary:hover {
            background: #e6edf5;
        }
        .dark .modal-box .modal-actions .secondary:hover {
            background: #4b5563;
        }

        .drop-zone {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbfc;
            margin-bottom: 16px;
        }
        .dark .drop-zone {
            background: #1f2937;
            border-color: #374151;
        }
        .drop-zone:hover {
            border-color: #D4A017;
            background: rgba(212, 160, 23, 0.04);
        }
        .drop-zone .icon {
            font-size: 42px;
            color: #6b7f99;
            margin-bottom: 8px;

    <script type="text/babel">
        const { useState, useEffect, useCallback, useContext, useRef, useMemo } = React;

        // ── SUPABASE CONFIG ──
        const SUPABASE_URL = 'https://rewpminmqnrtwdvglxxr.supabase.co';
        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld3BtaW5tcW5ydHdkdmdseHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDkzOTksImV4cCI6MjA5NzMyNTM5OX0.2HnM4NMvxOlqrc2ChuFa_F6kqEniSah3NU5vTLNtfYs';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_CREDENTIALS = { username: 'adminnexalearn@gmail.com', password: 'KenyaVault2026' };

        const AppContext = React.createContext(null);

        function useApp() {
            const ctx = useContext(AppContext);
            if (!ctx) throw new Error('useApp must be used within AppProvider');
            return ctx;
        }

        function AppProvider({ children }) {
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('kv-dark-mode') === 'true');
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 768);
            const [currentModule, setCurrentModule] = useState('dashboard');
            const [isAuthenticated, setIsAuthenticated] = useState(() => sessionStorage.getItem('kv-auth') === 'true');
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');
            const [loading, setLoading] = useState(true);
            const [tutors, setTutors] = useState([]);
            const [orders, setOrders] = useState([]);
            const [resources, setResources] = useState([]);
            const [classes, setClasses] = useState([]);
            const [payments, setPayments] = useState([]);
            const [toast, setToast] = useState(null);
            const [pendingTutors, setPendingTutors] = useState([]);
            const [visitorCount, setVisitorCount] = useState(1247);
            const [pendingOrderCount, setPendingOrderCount] = useState(0);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
            const [currentDateTime, setCurrentDateTime] = useState(new Date());
            const [currentCurrency, setCurrentCurrency] = useState('KES');
            const exchangeRates = { KES: 1, USD: 0.0077, EUR: 0.0071 };

            // Real-time clock
            useEffect(() => {
                const timer = setInterval(() => setCurrentDateTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Dark mode
            useEffect(() => {
                localStorage.setItem('kv-dark-mode', darkMode);
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => {
                const handleResize = () => {
                    const mobile = window.innerWidth <= 768;
                    setIsMobile(mobile);
                    if (mobile) setSidebarOpen(false);
                    else setSidebarOpen(true);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                if (isAuthenticated) {
                    loadData();
                    startPolling();
                }
                return () => stopPolling();
            }, [isAuthenticated]);

            const startPolling = () => {
                const interval = setInterval(() => { loadOrders();
                    loadTutors(); }, 10000);
                window._pollingInterval = interval;
            };
            const stopPolling = () => {
                if (window._pollingInterval) {
                    clearInterval(window._pollingInterval);
                    window._pollingInterval = null;
                }
            };

            const showToast = (title, message, type = 'success') => {
                setToast({ title, message, type, id: Date.now() });
                setTimeout(() => setToast(null), 5000);
            };

            const formatCurrency = (amount) => {
                const symbol = currentCurrency === 'KES' ? 'KES ' :
                    currentCurrency === 'USD' ? '$' :
                    currentCurrency === 'EUR' ? '€' : 'KES ';
                const rate = exchangeRates[currentCurrency] || 1;
                const converted = amount * rate;
                if (currentCurrency === 'KES') return symbol + converted.toLocaleString();
                return symbol + converted.toFixed(2);
            };

            const loadOrders = async () => {
                try {
                    const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
                    if (error) throw error;
                    setOrders(data || []);
                    const pending = (data || []).filter(o => o.payment_status === 'pending' || o.status === 'pending');
                    setPendingOrderCount(pending.length);
                } catch (e) {
                    console.error('Load orders error:', e);
                    setOrders([]);
                    setPendingOrderCount(0);
                }
            };

            const loadTutors = async () => {
                try {
                    const { data, error } = await supabase.from('tutors').select('*');
                    if (error) throw error;
                    setTutors(data || []);
                    const pending = (data || []).filter(t => t.status === 'pending_approval' || t.status === 'pending');
                    setPendingTutors(pending);
                } catch (e) {
                    console.error('Load tutors error:', e);
                    setTutors([]);
                    setPendingTutors([]);
                }
            };

            const loadResources = async () => {
                try {
                    const { data, error } = await supabase.from('resources').select('*').order('created_at', { ascending: false });
                    if (error) throw error;
                    setResources(data || []);
                } catch (e) {
                    console.error('Load resources error:', e);
                    setResources([]);
                }
            };

            const loadClasses = async () => {
                try {
                    const { data, error } = await supabase.from('classes').select('*').order('scheduled_at', { ascending: true });
                    if (error) throw error;
                    setClasses(data || []);
                } catch (e) {
                    console.error('Load classes error:', e);
                    setClasses([]);
                }
            };

            const loadData = async () => {
                setLoading(true);
                try {
                    await Promise.all([loadOrders(), loadTutors(), loadResources(), loadClasses()]);
                    // Simulate visitor count
                    setVisitorCount(1247 + Math.floor(Math.random() * 50));
                } catch (e) {
                    console.error('Load data error:', e);
                }
                setLoading(false);
            };

            const login = (username, password) => {
                setAuthLoading(true);
                setAuthError('');
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                            sessionStorage.setItem('kv-auth', 'true');
                            sessionStorage.setItem('kv-user', username);
                            setIsAuthenticated(true);
                            setAuthLoading(false);
                            resolve(true);
                        } else {
                            setAuthError('Invalid username or password.');
                            setAuthLoading(false);
                            reject(new Error('Invalid credentials'));
                        }
                    }, 800);
                });
            };

            const logout = () => {
                stopPolling();
                sessionStorage.removeItem('kv-auth');
                sessionStorage.removeItem('kv-user');
                setIsAuthenticated(false);
                setCurrentModule('dashboard');
            };

            const toggleDarkMode = () => setDarkMode(!darkMode);
            const toggleSidebar = () => setSidebarOpen(!sidebarOpen);
            const closeSidebar = () => setSidebarOpen(false);

            const approveTutor = async (tutorId) => {
                try {
                    await supabase.from('tutors').update({ status: 'active' }).eq('id', tutorId);
                    showToast('Tutor Approved', 'The tutor can now access their dashboard');
                    await loadTutors();
                } catch (e) {
                    showToast('Error', 'Failed to approve tutor', 'error');
                }
            };

            const rejectTutor = async (tutorId) => {
                try {
                    await supabase.from('tutors').update({ status: 'rejected' }).eq('id', tutorId);
                    showToast('Tutor Rejected', 'The tutor application has been rejected');
                    await loadTutors();
                } catch (e) {
                    showToast('Error', 'Failed to reject tutor', 'error');
                }
            };

            const deleteResource = async (id) => {
                if (!confirm('Delete this resource?')) return;
                try {
                    await supabase.from('resources').delete().eq('id', id);
                    showToast('Deleted', 'Resource removed');
                    await loadResources();
                } catch (e) {
                    showToast('Error', 'Failed to delete', 'error');
                }
            };

            const updateResource = async (id, updates) => {
                try {
                    await supabase.from('resources').update(updates).eq('id', id);
                    showToast('Updated', 'Resource updated successfully');
                    await loadResources();
                } catch (e) {
                    showToast('Error', 'Failed to update', 'error');
                }
            };

            const toggleResourceStatus = async (id, currentStatus) => {
                const newStatus = currentStatus === 'live' ? 'draft' : 'live';
                try {
                    await supabase.from('resources').update({ status: newStatus }).eq('id', id);
                    showToast('Updated', `Resource ${newStatus === 'live' ? 'published' : 'drafted'}`);
                    await loadResources();
                } catch (e) {
                    showToast('Error', 'Failed to update', 'error');
                }
            };

            return ( <
                AppContext.Provider value = {{
                    darkMode,
                    toggleDarkMode,
                    sidebarOpen,
                    toggleSidebar,
                    closeSidebar,
                    currentModule,
                    setCurrentModule,
                    isAuthenticated,
                    authLoading,
                    authError,
                    login,
                    logout,
                    loading,
                    tutors,
                    setTutors,
                    orders,
                    setOrders,
                    resources,
                    setResources,
                    classes,
                    setClasses,
                    payments,
                    setPayments,
                    toast,
                    showToast,
                    loadData,
                    loadOrders,
                    loadTutors,
                    loadResources,
                    loadClasses,
                    pendingOrderCount,
                    pendingTutors,
                    isMobile,
                    currentDateTime,
                    currentCurrency,
                    setCurrentCurrency,
                    formatCurrency,
                    exchangeRates,
                    visitorCount,
                    approveTutor,
                    rejectTutor,
                    deleteResource,
                    updateResource,
                    toggleResourceStatus
                }} >
                { children } <
                /AppContext.Provider>
            );
        }

        function ToastContainer() {

                /div> <
                /div>

                    <

                    Kenya < span className = "text-[#FCD34D]" > Vault < /span> < /h1> <

                    /div> <
                    /div> <
                    /div> <
                    div className = "login-box rounded-2xl p-8 shadow-2xl border border-white/10" >
                    <
                    h2 className = "text-2xl font-bold text-white mb-2" > Welcome Back < /h2> <
                    p className = "text-gray-400 text-sm mb-6" > Sign in to manage your platform < /p> {
                        authError && <
                        div className = "mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm" >

                        const [selectedFile, setSelectedFile] = useState(null);
                        const [uploading, setUploading] = useState(false);

                        useEffect(() => { loadResources(); }, []);

                        const handleUpload = async (e) => {
                            e.preventDefault();
                            if (!selectedFile || !uploadForm.title) {
                                showToast('Error', 'Please fill all fields and select a file', 'error');
                                return;
                            }
                            setUploading(true);
                            try {
                                const fileExt = selectedFile.name.split('.').pop();
                                const fileName =
                                `${Date.now()}-${uploadForm.title.replace(/\s/g, '_')}.${fileExt}`;
                                const filePath = `resources/${fileName}`;
                                const formData = new FormData();
                                formData.append('file', selectedFile);
                                await supabase.storage.from('kenyavault-pdfs').upload(filePath, selectedFile);
                                const { data: urlData } = supabase.storage.from('kenyavault-pdfs').getPublicUrl(
                                filePath);

                                await supabase.from('resources').insert({
                                    ...uploadForm,
                                    file_url: urlData.publicUrl,
                                    status: 'draft',
                                    created_at: new Date().toISOString()
                                });
                                showToast('Success', 'Resource uploaded successfully');
                                setShowUploadModal(false);
                                setSelectedFile(null);
                                setUploadForm({ title: '', subject: '', level: '', price: 0, description: '',
                                    resource_type: 'lesson-plan', curriculum: 'cbc' });
                                await loadResources();
                            } catch (e) {
                                showToast('Error', 'Upload failed: ' + e.message, 'error');
                            }
                            setUploading(false);
                        };

                        const openEditModal = (resource) => {
                            setEditingResource(resource);
                            setEditForm({
                                title: resource.title,
                                subject: resource.subject || '',
                                level: resource.level || '',
                                price: resource.price || 0,
                                description: resource.description || ''
                            });
                            setShowEditModal(true);
                        };

                        const handleEditSave = async () => {
                            if (!editingResource) return;
                            await updateResource(editingResource.id, editForm);
                            setShowEditModal(false);
                            setEditingResource(null);
                        };

                                is_live: false });

                            useEffect(() => { loadClasses(); }, []);

                            const handleCreate = async (e) => {
                                e.preventDefault();
                                if (!formData.title || !formData.tutor_id || !formData.scheduled_at) {
                                    showToast('Error', 'Please fill all required fields', 'error');
                                    return;
                                }
                                try {
                                    await supabase.from('classes').insert({
                                        ...formData,
                                        status: formData.is_live ? 'live' : 'scheduled',
                                        created_at: new Date().toISOString()
                                    });
                                    showToast('Success', 'Class created successfully');
                                    setShowCreateModal(false);
                                    setFormData({ title: '', tutor_id: '', subject: '', scheduled_at: '',
                                        duration_minutes: 60, max_students: 50, meeting_link: '', is_live: false });
                                    await loadClasses();
                                } catch (e) {
                                    showToast('Error', 'Failed to create class', 'error');
                                }
                            };

                            const toggleClass = async (id, isLive) => {
                                const newLive = !isLive;
                                try {
                                    await supabase.from('classes').update({ is_live: newLive, status: newLive ?
                                            'live' : 'scheduled' }).eq('id', id);
                                    showToast('Updated', `Class ${newLive ? 'started' : 'ended'}`);
                                    await loadClasses();

                                                /div> <

                                    required / >
                                    <
                                    div className = "grid grid-cols-2 gap-3" >
                                    <
                                    input type = "number"
                                    placeholder = "Duration (min)"
                                    value = { formData.duration_minutes }
                                    onChange = {(e) => setFormData({ ...formData,
                                        duration_minutes: parseInt(e.target.value) || 60 }) }
                                    min = "15"
                                    / >
                                    <
                                    input type = "number"
                                    placeholder = "Max Students"
                                    value = { formData.max_students }
                                    onChange = {(e) => setFormData({ ...formData,
                                        max_students: parseInt(e.target.value) || 50 }) }
                                    min = "1"
                                    / >
                                    <
                                    /div> <
                                    input type = "url"
                                    placeholder = "Meeting Link (Zoom/Google Meet)"
                                    value = { formData.meeting_link }
                                    onChange = {(e) => setFormData({ ...formData,
                                        meeting_link: e.target.value }) }
                                    / >
                                    <
                                    div className = "flex items-center gap-3" >
                                    <
                                    label className = "flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300" >
                                    <
                                    input type = "checkbox"
                                    checked = { formData.is_live }
                                    onChange = {(e) => setFormData({ ...formData,
                                        is_live: e.target.checked }) }
                                    className = "w-4 h-4 accent-[#D4A017]" / >
                                    Start immediately (live) <
                                    /label> <
                                    /div> <
                                    div className = "modal-actions" >
                                    <
                                    button type = "submit"
                                    className = "primary" >
                                    <
                                    i className = "fas fa-plus" > < /i> Create Class <
                                    /button> <
                                    button type = "button"
                                    className = "secondary"
                                    onClick = {
                                        () => setShowCreateModal(false) } >
                                    Cancel <
                                    /button> <
                                    /div> <
                                    /form> <
                                    /div> <
                                    /div> <
                                    /div>
                                );
                            }

                            // ── SETTINGS MODULE ──
                            function SettingsModule() {
                                const { darkMode, toggleDarkMode, showToast, currentCurrency, setCurrentCurrency } =
                                useApp();
                                const [settings, setSettings] = useState({
                                    siteName: 'KenyaVault',
                                    siteTagline: 'Complete Education Resources',
                                    emailNotifications: true,
                                    orderNotifications: true,
                                    payoutPercentage: 80,
                                    currency: 'KES',
                                    timezone: 'Africa/Nairobi'
                                });

                                useEffect(() => {
                                    const saved = localStorage.getItem('kv-settings');
                                    if (saved) try { setSettings(prev => ({ ...prev,
                                            ...JSON.parse(saved) })); } catch (e) {}
                                }, []);

                                const handleSave = (e) => {
                                    e.preventDefault();
                                    localStorage.setItem('kv-settings', JSON.stringify(settings));
                                    if (settings.currency !== currentCurrency) {
                                        setCurrentCurrency(settings.currency);
                                    }
                                    showToast('Saved', 'Settings updated successfully');
                                };

                                return ( <
                                    div className = "fade-in" >
                                    <
                                    h2 className = "text-xl font-bold text-gray-800 dark:text-white mb-6" >
                                    <
                                    i className = "fas fa-cog text-[#D4A017] mr-2" > < /i> System Settings <
                                    /h2>

                                    <
                                    div className = "content-card max-w-3xl" >
                                    <
                                    form onSubmit = { handleSave } >
                                    <
                                    div className = "settings-section" >
                                    <
                                    div className = "section-title" > General Settings < /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Site Name < /label> <
                                    input type = "text"
                                    value = { settings.siteName }
                                    onChange = {(e) => setSettings({ ...settings,
                                        siteName: e.target.value }) }
                                    / >
                                    <
                                    /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Tagline < /label> <
                                    input type = "text"
                                    value = { settings.siteTagline }
                                    onChange = {(e) => setSettings({ ...settings,
                                        siteTagline: e.target.value }) }
                                    / >
                                    <
                                    /div> <
                                    /div>

                                    <
                                    div className = "settings-section" >
                                    <
                                    div className = "section-title" > Payment Settings < /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Default Currency < /label> <
                                    select value = { settings.currency }
                                    onChange = {(e) => setSettings({ ...settings,
                                        currency: e.target.value }) } >
                                    <
                                    option value = "KES" > KES < /option> <
                                    option value = "USD" > USD < /option> <
                                    option value = "EUR" > EUR < /option> <
                                    /select> <
                                    /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Tutor Payout( % ) < /label> <
                                    input type = "number"
                                    value = { settings.payoutPercentage }
                                    onChange = {(e) => setSettings({ ...settings,
                                        payoutPercentage: parseInt(e.target.value) || 80 }) }
                                    min = "0"
                                    max = "100"
                                    / >
                                    <
                                    /div> <
                                    /div>

                                    <
                                    div className = "settings-section" >
                                    <
                                    div className = "section-title" > Notifications < /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Email Notifications < /label> <
                                    input type = "checkbox"
                                    checked = { settings.emailNotifications }
                                    onChange = {(e) => setSettings({ ...settings,
                                        emailNotifications: e.target.checked }) }
                                    / >
                                    <
                                    /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Order Notifications < /label> <
                                    input type = "checkbox"
                                    checked = { settings.orderNotifications }
                                    onChange = {(e) => setSettings({ ...settings,
                                        orderNotifications: e.target.checked }) }
                                    / >
                                    <
                                    /div> <
                                    /div>

                                    <
                                    div className = "settings-section" >
                                    <
                                    div className = "section-title" > Display < /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Dark Mode < /label> <
                                    button type = "button"
                                    onClick = { toggleDarkMode }
                                    className = "px-4 py-2 bg-gray-200 dark:bg-gray-600 rounded-lg text-sm font-medium" >
                                    { darkMode ? '☀️ Light' : '🌙 Dark' } <
                                    /button> <
                                    /div> <
                                    /div>

                                    <
                                    div className = "settings-section" >
                                    <
                                    div className = "section-title" > Regional < /div> <
                                    div className = "setting-row" >
                                    <
                                    label > Timezone < /label> <
                                    select value = { settings.timezone }
                                    onChange = {(e) => setSettings({ ...settings,
                                        timezone: e.target.value }) } >
                                    <
                                    option value = "Africa/Nairobi" > Africa / Nairobi(EAT) < /option> <
                                    option value = "Africa/Lagos" > Africa / Lagos(WAT) < /option> <
                                    option value = "UTC" > UTC < /option> <
                                    /select> <
                                    /div> <
                                    /div>

                                    <
                                    div className = "flex gap-3 mt-6" >
                                    <
                                    button type = "submit"
                                    className = "btn-gold" >
                                    <
                                    i className = "fas fa-save" > < /i> Save Settings <
                                    /button> <
                                    button type = "button"
                                    className = "btn-sm red"
                                    onClick = {
                                        () => { if (confirm('Reset all settings to default?')) { localStorage
                                                    .removeItem('kv-settings');
                                                setSettings({ siteName: 'KenyaVault',
                                                    siteTagline: 'Complete Education Resources',
                                                    emailNotifications: true, orderNotifications: true,
                                                    payoutPercentage: 80, currency: 'KES',
                                                    timezone: 'Africa/Nairobi' });
                                                showToast('Reset', 'Settings reset to default'); } } } >
                                    <
                                    i className = "fas fa-undo" > < /i> Reset to Default <
                                    /button> <
                                    /div> <
                                    /form> <
                                    /div> <
                                    /div>
                                );
                            }

                            // ── MODULE RENDERER ──
                            function ModuleRenderer() {
                                const { currentModule } = useApp();
                                const map = {
                                    dashboard: < DashboardModule / > ,
                                        tutors: < TutorsModule / > ,
                                            resources: < ResourcesModule / > ,
                                                orders: < OrdersModule / > ,
                                                    classes: < ClassesModule / > ,
                                                        settings: < SettingsModule / >
                                };
                                return map[currentModule] || < DashboardModule / > ;
                            }

                            // ── MAIN APP ──
                            function App() {
                                const { isAuthenticated } = useApp();
                                if (!isAuthenticated) return < LoginPage / > ;
                                return ( <
                                    div className = "dashboard-wrapper" >
                                    <
                                    Sidebar / >
                                    <
                                    div className = "main-content" >
                                    <
                                    Topbar / >
                                    <
                                    ModuleRenderer / >
                                    <
                                    /div> <
                                    ToastContainer / >
                                    <
                                    /div>
                                );
                            }

                            const root = ReactDOM.createRoot(document.getElementById('root'));
                            root.render( <
                                AppProvider >
                                <
                                App / >
                                <
                                /AppProvider>
                            );
    </script>
</body>
</html>
