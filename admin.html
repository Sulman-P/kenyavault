<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KenyaVault Academy — Admin Command Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ────────────────────────────────────────────────
           KENYAVAULT ACADEMY — ADMIN DESIGN SYSTEM
           ──────────────────────────────────────────────── */
        :root {
            --kv-navy: #0B2340;
            --kv-navy-light: #1a3a5a;
            --kv-green: #1F7A3A;
            --kv-green-light: #2a9d4a;
            --kv-gold: #D4A72C;
            --kv-gold-light: #FCD34D;
            --kv-gold-pale: #fdf6e0;
            --kv-white: #FFFFFF;
            --kv-bg: #F6F8F7;
            --kv-text: #172033;
            --kv-muted: #667085;
            --kv-border: #E2E8F0;
            --kv-radius: 8px;
            --kv-radius-lg: 12px;
            --kv-shadow-sm: 0 1px 3px rgba(11, 35, 64, 0.06);
            --kv-shadow-md: 0 4px 16px rgba(11, 35, 64, 0.08);
            --kv-shadow-lg: 0 8px 32px rgba(11, 35, 64, 0.12);
            --kv-transition: all 0.25s ease;
            --kv-font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --kv-header-height: 72px;
            --kv-container-width: 1400px;
            --kv-safearea-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--kv-font);
            background: var(--kv-bg);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }
        .dark body {
            background: #111827;
            color: #e5e7eb;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; }

        /* ── SIDEBAR ── */
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px;
            background: var(--kv-navy); color: #fff; z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto; display: flex; flex-direction: column;
        }
        .dark .sidebar { background: #0f172a; }
        .sidebar.open { transform: translateX(0); }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .sidebar-header .logo {
            font-weight: 800; font-size: 1.2rem; color: #fff;
            display: flex; align-items: center; gap: 8px;
        }
        .sidebar-header .logo span { color: var(--kv-gold-light); }
        .sidebar-header .logo .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px; height: 32px;
            background: var(--kv-gold);
            border-radius: var(--kv-radius);
            color: var(--kv-navy);
            font-weight: 800;
            font-size: 0.9rem;
        }
        .sidebar-close-btn {
            display: none; background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer; padding: 4px 8px; border-radius: var(--kv-radius);
        }
        .sidebar-close-btn:hover { background: rgba(255,255,255,0.1); }

        .sidebar-menu { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .sidebar-menu .menu-label {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: rgba(255,255,255,0.3); padding: 0 12px 8px;
        }
        .sidebar-menu .menu-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; border-radius: var(--kv-radius);
            color: rgba(255,255,255,0.6); cursor: pointer;
            transition: all 0.2s; margin-bottom: 2px;
            border: none; background: transparent; width: 100%;
            font-size: 0.85rem; font-weight: 500; text-align: left;
            font-family: var(--kv-font);
        }
        .sidebar-menu .menu-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .sidebar-menu .menu-item.active {
            background: rgba(212, 167, 44, 0.15); color: var(--kv-gold-light);
            border-left: 3px solid var(--kv-gold);
        }
        .sidebar-menu .menu-item i { width: 20px; text-align: center; }
        .sidebar-menu .menu-item .badge {
            margin-left: auto; background: rgba(212,167,44,0.2);
            color: var(--kv-gold-light); font-size: 0.65rem; padding: 2px 8px; border-radius: 12px;
        }
        .pending-badge { position: relative; }
        .pending-badge .badge-count {
            position: absolute; top: -4px; right: -8px;
            background: #dc2626; color: white; font-size: 0.55rem; font-weight: 700;
            min-width: 18px; height: 18px; border-radius: 99px;
            display: flex; align-items: center; justify-content: center;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge { 0%,100%{transform:scale(1)}50%{transform:scale(1.15)} }

        .sidebar-footer {
            padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .sidebar-footer .admin-info {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 12px;
        }
        .sidebar-footer .admin-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--kv-gold);
            display: flex; align-items: center; justify-content: center;
            color: var(--kv-navy); font-weight: 700; font-size: 0.9rem;
        }
        .sidebar-footer .admin-name { font-weight: 600; font-size: 0.85rem; }
        .sidebar-footer .admin-role { font-size: 0.65rem; color: rgba(255,255,255,0.4); }
        .sidebar-footer .logout-btn {
            width: 100%; display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: var(--kv-radius); color: #ef4444;
            background: rgba(220,38,38,0.1); border: none; cursor: pointer;
            transition: all 0.2s; font-family: var(--kv-font);
            font-weight: 600; font-size: 0.85rem;
        }
        .sidebar-footer .logout-btn:hover { background: rgba(220,38,38,0.2); }

        /* ── TOPBAR ── */
        .topbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--kv-border);
            padding: 0 20px; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .dark .topbar {
            background: rgba(17,24,39,0.9);
            border-color: #374151;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .hamburger-btn {
            display: none; background: none; border: none; color: var(--kv-text);
            font-size: 1.4rem; cursor: pointer; padding: 6px 8px; border-radius: var(--kv-radius);
        }
        .dark .hamburger-btn { color: #f3f4f6; }
        .hamburger-btn:hover { background: rgba(0,0,0,0.05); }
        .dark .hamburger-btn:hover { background: rgba(255,255,255,0.05); }
        .topbar-title {
            font-weight: 700; font-size: 1rem; color: var(--kv-text);
        }
        .dark .topbar-title { color: #f3f4f6; }

        .topbar-clock {
            font-family: 'Inter', monospace;
            font-size: 0.85rem; font-weight: 600;
            color: var(--kv-text);
            background: var(--kv-bg);
            padding: 4px 14px; border-radius: var(--kv-radius);
            border: 1px solid var(--kv-border);
            display: flex; align-items: center; gap: 8px;
        }
        .dark .topbar-clock {
            color: #e5e7eb; background: #1f2937; border-color: #374151;
        }
        .topbar-clock .clock-icon { font-size: 0.8rem; color: var(--kv-gold); }
        .topbar-clock .clock-separator { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .topbar-actions { display: flex; align-items: center; gap: 12px; }
        .topbar-actions button {
            background: none; border: none; cursor: pointer;
            padding: 6px 8px; border-radius: var(--kv-radius); font-size: 1.1rem;
            color: var(--kv-muted); transition: all 0.2s;
        }
        .topbar-actions button:hover { background: rgba(0,0,0,0.05); }
        .dark .topbar-actions button { color: #9ca3af; }
        .dark .topbar-actions button:hover { background: rgba(255,255,255,0.05); }
        .topbar-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--kv-gold);
            display: flex; align-items: center; justify-content: center;
            color: var(--kv-navy); font-weight: 700; font-size: 0.8rem;
        }
        .live-indicator {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.7rem; font-weight: 600; color: var(--kv-green);
            background: #dcfce7; padding: 4px 12px; border-radius: 99px;
        }
        .dark .live-indicator {
            background: rgba(31, 122, 58, 0.2);
            color: #34d399;
        }
        .live-indicator .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--kv-green);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1}50%{opacity:0.3} }

        /* ── MAIN CONTENT ── */
        .main-content {
            flex: 1; min-height: 100vh; padding: 20px;
            background: var(--kv-bg);
            transition: margin-left 0.3s;
        }
        .dark .main-content { background: #111827; }

        /* ── STATUS BADGES ── */
        .status-badge {
            padding: 2px 10px; border-radius: 9999px;
            font-size: 0.7rem; font-weight: 600;
        }
        .status-badge.pending { background: #fef3c7; color: #92400e; }
        .status-badge.confirmed { background: #dbeafe; color: #1e40af; }
        .status-badge.live { background: #d1fae5; color: var(--kv-green); }
        .status-badge.paid { background: #d1fae5; color: var(--kv-green); }
        .status-badge.paid-out { background: #d1fae5; color: var(--kv-green); }
        .status-badge.pending-payment { background: #fef3c7; color: #92400e; }
        .status-badge.rejected { background: #fee2e2; color: #dc2626; }
        .status-badge.suspended { background: #fee2e2; color: #dc2626; }
        .status-badge.draft { background: var(--kv-bg); color: var(--kv-muted); }
        .status-badge.active { background: #dbeafe; color: #1e40af; }
        .status-badge.inactive { background: var(--kv-bg); color: var(--kv-muted); }
        .status-badge.expired { background: #fee2e2; color: #dc2626; }
        .dark .status-badge.pending { background: #78350f; color: #fbbf24; }
        .dark .status-badge.confirmed { background: #1e3a5f; color: #60a5fa; }
        .dark .status-badge.live { background: #064e3b; color: #34d399; }
        .dark .status-badge.paid { background: #064e3b; color: #34d399; }
        .dark .status-badge.paid-out { background: #064e3b; color: #34d399; }
        .dark .status-badge.pending-payment { background: #78350f; color: #fbbf24; }
        .dark .status-badge.rejected { background: #7f1d1d; color: #f87171; }
        .dark .status-badge.suspended { background: #7f1d1d; color: #f87171; }
        .dark .status-badge.draft { background: #374151; color: #9ca3af; }
        .dark .status-badge.active { background: #1e3a5f; color: #60a5fa; }
        .dark .status-badge.inactive { background: #374151; color: #9ca3af; }
        .dark .status-badge.expired { background: #7f1d1d; color: #f87171; }

        /* ── STAT CARDS ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--kv-white);
            border-radius: var(--kv-radius-lg);
            padding: 16px 20px;
            border: 1px solid var(--kv-border);
            transition: all .2s;
        }
        .dark .stat-card {
            background: #1f2937;
            border-color: #374151;
        }
        .stat-card .stat-number {
            font-weight: 800; font-size: 1.5rem;
            color: var(--kv-navy);
        }
        .dark .stat-card .stat-number { color: #fff; }
        .stat-card .stat-number.gold { color: var(--kv-gold); }
        .stat-card .stat-number.green { color: var(--kv-green); }
        .stat-card .stat-number.blue { color: #3b82f6; }
        .stat-card .stat-number.red { color: #dc2626; }
        .stat-card .stat-label {
            font-size: 0.8rem; color: var(--kv-muted);
            margin-top: 2px;
        }
        .dark .stat-card .stat-label { color: #9ca3af; }

        /* ── CONTENT CARDS ── */
        .content-card {
            background: var(--kv-white);
            border-radius: var(--kv-radius-lg);
            padding: 20px;
            border: 1px solid var(--kv-border);
            margin-bottom: 20px;
        }
        .dark .content-card {
            background: #1f2937;
            border-color: #374151;
        }
        .content-card .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 1px solid var(--kv-border);
            flex-wrap: wrap; gap: 8px;
        }
        .dark .content-card .card-header { border-color: #374151; }
        .content-card .card-header h3 {
            font-weight: 700; font-size: 1rem;
            color: var(--kv-text);
        }
        .dark .content-card .card-header h3 { color: #fff; }

        /* ── BUTTONS ── */
        .btn-gold {
            background: var(--kv-gold);
            color: var(--kv-navy);
            padding: 8px 20px;
            border: none;
            border-radius: var(--kv-radius);
            font-weight: 700;
            font-size: 0.8rem;
            transition: all .2s;
            cursor: pointer;
            font-family: var(--kv-font);
        }
        .btn-gold:hover {
            background: var(--kv-gold-light);
            transform: translateY(-1px);
        }
        .btn-sm {
            padding: 4px 12px; border-radius: 6px;
            font-weight: 600; font-size: 0.7rem;
            border: none; cursor: pointer; transition: all .2s;
        }
        .btn-sm.green { background: #dcfce7; color: var(--kv-green); }
        .btn-sm.red { background: #fee2e2; color: #dc2626; }
        .btn-sm.blue { background: #dbeafe; color: #2563eb; }
        .dark .btn-sm.green { background: rgba(31,122,58,0.2); color: #34d399; }
        .dark .btn-sm.red { background: rgba(220,38,38,0.2); color: #f87171; }
        .dark .btn-sm.blue { background: rgba(37,99,235,0.2); color: #60a5fa; }
        .btn-sm:hover { transform: translateY(-1px); }

        /* ── TABLES ── */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead { background: var(--kv-bg); border-bottom: 2px solid var(--kv-border); }
        .dark thead { background: #1f2937; border-color: #374151; }
        th {
            padding: 10px 12px; text-align: left; font-weight: 600;
            color: var(--kv-muted); font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .dark th { color: #9ca3af; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--kv-border); color: var(--kv-text); }
        .dark td { border-color: #374151; color: #e5e7eb; }
        tr:hover td { background: var(--kv-bg); }
        .dark tr:hover td { background: #1f2937; }

        /* ── MODALS ── */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--kv-white); border-radius: 16px;
            padding: 24px; max-width: 900px; width: 100%;
            max-height: 90vh; overflow-y: auto;
        }
        .dark .modal-box { background: #1f2937; }

        /* ── CHART ── */
        .chart-container { height: 280px; position: relative; }

        /* ── TOAST ── */
        .toast-container {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 99999; max-width: 380px; width: 100%;
        }
        .toast-item {
            background: var(--kv-white); border-radius: 12px;
            padding: 14px 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border-left: 4px solid var(--kv-gold);
            margin-bottom: 8px;
            animation: slideInRight 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        .dark .toast-item { background: #1f2937; }
        .toast-item .toast-title { font-weight: 600; font-size: 0.85rem; color: var(--kv-text); }
        .dark .toast-item .toast-title { color: #f3f4f6; }
        .toast-item .toast-msg { font-size: 0.8rem; color: var(--kv-muted); }
        .dark .toast-item .toast-msg { color: #9ca3af; }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ── PENDING ALERT ── */
        .pending-alert {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 99998; background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white; padding: 10px 20px; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(245,158,11,0.4);
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            border: none; font-family: var(--kv-font);
            animation: slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }
        .pending-alert .alert-text { font-weight: 600; font-size: 0.85rem; }
        .pending-alert .alert-count {
            background: rgba(255,255,255,0.2); padding: 2px 10px;
            border-radius: 99px; font-weight: 700; font-size: 0.75rem;
        }
        @keyframes slideUp {
            from { opacity:0; transform:translateX(-50%) translateY(20px); }
            to { opacity:1; transform:translateX(-50%) translateY(0); }
        }

        /* ── LOGIN ── */
        .login-bg {
            background: linear-gradient(135deg, var(--kv-navy) 0%, var(--kv-navy-light) 50%, #2a4a6a 100%);
            position: relative; overflow: hidden;
        }
        .login-bg::before {
            content: ''; position: absolute; inset: 0;
            background-image:
                url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FFFFFF' fill-opacity='0.04'%3E%3Cpath d='M40 20c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V24c0-2.2-1.8-4-4-4H40zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H40c-1.1 0-2-.9-2-2V24c0-1.1.9-2 2-2zM16 32c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V36c0-2.2-1.8-4-4-4H16zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H16c-1.1 0-2-.9-2-2V36c0-1.1.9-2 2-2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FCD34D' fill-opacity='0.03'%3E%3Cpath d='M50 30L20 46l30 16 30-16-30-16zm0 0l-20 10 20 10 20-10-20-10zM20 46v18l30 16 30-16V46l-30 16-30-16z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 80px 80px, 100px 100px;
            background-position: 0 0, 40px 20px;
            pointer-events: none;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(212, 167, 44, 0.3), 0 0 20px rgba(212, 167, 44, 0.1);
        }

        /* ── RESPONSIVE ── */
        @media (min-width:769px) {
            .sidebar { transform: translateX(0)!important; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
            .sidebar-overlay { display:none!important; }
            .sidebar-close-btn { display:none!important; }
            .hamburger-btn { display:none!important; }
            .dashboard-wrapper { display:flex; }
            .main-content { margin-left:0; }
        }
        @media (max-width:768px) {
            .sidebar { width:80%; max-width:320px; transform:translateX(-100%); }
            .sidebar.open { transform:translateX(0); }
            .sidebar-close-btn { display:block!important; }
            .hamburger-btn { display:block!important; }
            .dashboard-wrapper { display:block; }
            .main-content { padding:16px; width:100%; }
            .topbar { padding:0 16px; height:60px; }
            .topbar-title { font-size:0.9rem; }
            .topbar-clock { font-size:0.7rem; padding:2px 10px; }
            .live-indicator .label { display:none; }
            .live-indicator { padding:4px 8px; }
            .stat-grid { grid-template-columns:1fr 1fr; gap:10px; }
            .stat-card { padding:12px 14px; }
            .stat-card .stat-number { font-size:1.2rem; }
        }
        @media (max-width:480px) {
            .sidebar { width:85%; }
            .main-content { padding:12px; }

        .tutor-stat-card .stat-number.red { color: #dc2626; }

<body>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useCallback, useContext, useRef } = React;

        // ── SUPABASE CONFIG ──
        const SUPABASE_URL = 'https://rewpminmqnrtwdvglxxr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld3BtaW5tcW5ydHdkdmdseHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDkzOTksImV4cCI6MjA5NzMyNTM5OX0.2HnM4NMvxOlqrc2ChuFa_F6kqEniSah3NU5vTLNtfYs';
        const ADMIN_CREDENTIALS = { username: 'adminnexalearn@gmail.com', password: 'KenyaVault2026' };
        const TUTOR_PAYOUT_PERCENTAGE = 80;

        const adminModules = [
            { id: 'dashboard', icon: 'fa-chart-pie', label: 'Overview' },
            { id: 'learners', icon: 'fa-user-graduate', label: 'Learners' },
            { id: 'resources', icon: 'fa-book', label: 'Resources' },
            { id: 'tutors', icon: 'fa-users', label: 'Tutors' },
            { id: 'orders', icon: 'fa-shopping-bag', label: 'Orders' },
            { id: 'finance', icon: 'fa-coins', label: 'Finance' },
            { id: 'promote', icon: 'fa-bullhorn', label: 'Promote' },
            { id: 'settings', icon: 'fa-gear', label: 'Settings' },
        ];

        const AppContext = React.createContext(null);
        function useApp() { const ctx = useContext(AppContext); if (!ctx) throw new Error('useApp must be used within AppProvider'); return ctx; }

        function AppProvider({ children }) {
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('kv-dark-mode') === 'true');
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 768);
            const [currentModule, setCurrentModule] = useState('dashboard');
            const [isAuthenticated, setIsAuthenticated] = useState(() => sessionStorage.getItem('kv-auth') === 'true');
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');
            const [loading, setLoading] = useState(true);
            const [tutors, setTutors] = useState([]);
            const [orders, setOrders] = useState([]);
            const [resources, setResources] = useState([]);
            const [classes, setClasses] = useState([]);
            const [payments, setPayments] = useState([]);
            const [learners, setLearners] = useState([]);
            const [toast, setToast] = useState(null);
            const [newOrderIds, setNewOrderIds] = useState([]);
            const [pendingOrderCount, setPendingOrderCount] = useState(0);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [showOrderModal, setShowOrderModal] = useState(false);

            useEffect(() => {
                localStorage.setItem('kv-dark-mode', darkMode);
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            useEffect(() => {
                const handleResize = () => {
                    const mobile = window.innerWidth <= 768;
                    setIsMobile(mobile);
                    if (mobile) setSidebarOpen(false);
                    else setSidebarOpen(true);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                if (isAuthenticated) { loadData(); startPolling(); }
                return () => stopPolling();
            }, [isAuthenticated]);

            const startPolling = () => {
                const interval = setInterval(checkNewOrders, 8000);
                window._pollingInterval = interval;
                setTimeout(checkNewOrders, 2000);
            };
            const stopPolling = () => { if (window._pollingInterval) { clearInterval(window._pollingInterval); window._pollingInterval = null; } };

            const checkNewOrders = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc&limit=20`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const pending = data.filter(o => o.payment_status === 'pending' || o.status === 'pending');
                        for (const order of pending) {
                            if (order.mpesa_code || order.payment_ref) {
                                await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${order.id}`, {
                                    method: 'PATCH',
                                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ payment_status: 'confirmed', status: 'confirmed' })
                                });
                            }
                        }
                        await loadOrders();
                    }
                } catch (e) { console.error('Polling error:', e); }
            };

            const showToast = (title, message, type = 'success') => {
                setToast({ title, message, type, id: Date.now() });
                setTimeout(() => setToast(null), 5000);
            };

            const loadOrders = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const parsedData = data.map(order => {
                            if (order.cart_items && typeof order.cart_items === 'string') {
                                try { order.cart_items = JSON.parse(order.cart_items); } catch (e) { order.cart_items = []; }
                            }
                            return order;
                        });
                        setOrders(parsedData || []);
                        const pending = parsedData.filter(o => o.payment_status === 'pending' || o.status === 'pending');
                        setPendingOrderCount(pending.length);
                        return parsedData;
                    }
                } catch (e) { console.error('Load orders error:', e); setOrders([]); setPendingOrderCount(0); }
            };

            const loadLearners = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?select=*&order=created_at.desc`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setLearners(data || []);
                        return data;
                    }
                } catch (e) { console.error('Load learners error:', e); setLearners([]); }
            };

            const loadData = async () => {
                setLoading(true);
                try {
                    await loadOrders();
                    await loadLearners();
                    const [rRes, tRes, cRes, pRes] = await Promise.all([
                        fetch(`${SUPABASE_URL}/rest/v1/resources?select=*&order=created_at.desc`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                        fetch(`${SUPABASE_URL}/rest/v1/tutors?select=*`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                        fetch(`${SUPABASE_URL}/rest/v1/classes?select=*&order=created_at.desc`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                        fetch(`${SUPABASE_URL}/rest/v1/tutor_payments?select=*&order=created_at.desc`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } })
                    ]);
                    if (rRes.ok) setResources(await rRes.json());
                    if (tRes.ok) setTutors(await tRes.json());
                    if (cRes.ok) setClasses(await cRes.json());
                    if (pRes.ok) setPayments(await pRes.json());
                } catch (e) { console.error('Load data error:', e); }
                setLoading(false);
            };

            const login = (username, password) => {
                setAuthLoading(true); setAuthError('');
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                            sessionStorage.setItem('kv-auth', 'true');
                            sessionStorage.setItem('kv-user', username);
                            setIsAuthenticated(true);
                            setAuthLoading(false);
                            resolve(true);
                        } else {
                            setAuthError('Invalid username or password.');
                            setAuthLoading(false);
                            reject(new Error('Invalid credentials'));
                        }
                    }, 800);
                });
            };

            const logout = () => {
                stopPolling();
                sessionStorage.removeItem('kv-auth');
                sessionStorage.removeItem('kv-user');
                setIsAuthenticated(false);
                setCurrentModule('dashboard');
                window.location.href = '/';
            };

            const toggleDarkMode = () => setDarkMode(!darkMode);
            const toggleSidebar = () => setSidebarOpen(!sidebarOpen);
            const closeSidebar = () => setSidebarOpen(false);

            const openOrderDetails = (order) => {
                setSelectedOrder(order);
                setShowOrderModal(true);
            };
            const closeOrderDetails = () => {
                setShowOrderModal(false);
                setSelectedOrder(null);
            };

            return (
                <AppContext.Provider value={{
                    darkMode, toggleDarkMode, sidebarOpen, toggleSidebar, closeSidebar,
                    currentModule, setCurrentModule, isAuthenticated, authLoading, authError,
                    login, logout, loading, tutors, setTutors, orders, setOrders,
                    resources, setResources, classes, setClasses, payments, setPayments,
                    learners, setLearners, loadLearners,
                    toast, showToast, loadData, loadOrders, newOrderIds, setNewOrderIds,
                    pendingOrderCount, setPendingOrderCount, isMobile,
                    TUTOR_PAYOUT_PERCENTAGE,
                    selectedOrder, showOrderModal, openOrderDetails, closeOrderDetails
                }}>
                    {children}
                </AppContext.Provider>
            );
        }

        function ToastContainer() {
            const { toast } = useApp();
            if (!toast) return null;
            return (
                <div className="toast-container">
                    <div className="toast-item">
                        <div className="toast-title">{toast.title}</div>
                        <div className="toast-msg">{toast.message}</div>
                    </div>
                </div>
            );
        }

        function PendingAlert() {
            const { pendingOrderCount, setCurrentModule } = useApp();
            if (pendingOrderCount === 0) return null;
            return (
                <button className="pending-alert" onClick={() => setCurrentModule('orders')}>
                    <span>🔔</span>
                    <span className="alert-text">{pendingOrderCount} order{pendingOrderCount>1?'s':''} pending approval</span>
                    <span className="alert-count">View</span>
                </button>
            );
        }

        function LoginPage() {
            const { login, authLoading, authError, toggleDarkMode, darkMode } = useApp();
            const [username, setUsername] = useState('adminnexalearn@gmail.com');
            const [password, setPassword] = useState('');
            const handleSubmit = async (e) => { e.preventDefault(); try { await login(username, password); } catch (err) {} };
            return (
                <div className="min-h-screen login-bg flex items-center justify-center p-4 relative">
                    <button onClick={toggleDarkMode} className="absolute top-4 right-4 p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition">{darkMode?'☀️':'🌙'}</button>
                    <div className="w-full max-w-md relative z-10">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center gap-3 bg-white/10 backdrop-blur-sm px-6 py-3 rounded-2xl border border-white/10">
                                <div className="w-10 h-10 rounded-xl bg-[#D4A017] flex items-center justify-center text-[#0a1a3a] font-bold text-lg">KV</div>
                                <div className="text-left"><h1 className="text-xl font-bold text-white">Kenya<span className="text-[#FCD34D]">Vault</span></h1><p className="text-xs text-gray-400">Admin Portal</p></div>
                            </div>
                        </div>
                        <div className="login-box rounded-2xl p-8 shadow-2xl border border-white/10">
                            <h2 className="text-2xl font-bold text-white mb-2">Welcome Back</h2>
                            <p className="text-gray-400 text-sm mb-6">Sign in to manage your KenyaVault platform</p>
                            {authError && <div className="mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm">{authError}</div>}
                            <form onSubmit={handleSubmit}>
                                <div className="mb-4">
                                    <label className="block text-gray-300 text-sm font-medium mb-2">Email / Username</label>
                                    <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#D4A017] input-glow transition" required />
                                </div>
                                <div className="mb-4">
                                    <label className="block text-gray-300 text-sm font-medium mb-2">Password</label>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#D4A017] input-glow transition" required />
                                </div>
                                <button type="submit" disabled={authLoading} className="w-full py-3 bg-[#D4A017] hover:bg-[#FCD34D] text-[#0a1a3a] font-semibold rounded-xl transition flex items-center justify-center gap-2 disabled:opacity-50">
                                    {authLoading ? '⏳ Signing in...' : '🔑 Sign In'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function Sidebar() {
            const { sidebarOpen, currentModule, setCurrentModule, closeSidebar, pendingOrderCount } = useApp();
            return (
                <>
                    <div className={`sidebar-overlay ${sidebarOpen ? 'active' : ''}`} onClick={closeSidebar}></div>
                    <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                        <div className="sidebar-header">
                            <div className="logo">
                                <span className="logo-icon">KV</span>
                                Kenya<span>Vault</span>
                            </div>
                            <button className="sidebar-close-btn" onClick={closeSidebar}>✕</button>
                        </div>
                        <div className="sidebar-menu sidebar-scroll">
                            <div className="menu-label">Navigation</div>
                            {adminModules.map((mod) => (
                                <button key={mod.id} className={`menu-item ${currentModule === mod.id ? 'active' : ''}`} onClick={() => { setCurrentModule(mod.id); if (window.innerWidth <= 768) closeSidebar(); }}>
                                    <i className={`fas ${mod.icon}`}></i>
                                    <span>{mod.label}</span>
                                    {mod.id === 'orders' && pendingOrderCount > 0 && <span className="badge pending-badge">{pendingOrderCount}<span className="badge-count">{pendingOrderCount}</span></span>}
                                </button>
                            ))}
                        </div>
                        <div className="sidebar-footer">
                            <div className="admin-info">
                                <div className="admin-avatar">A</div>
                                <div>
                                    <div className="admin-name">Administrator</div>
                                    <div className="admin-role">Super Admin</div>
                                </div>
                            </div>
                            <button className="logout-btn" onClick={() => { if (window.confirm('Logout?')) { sessionStorage.removeItem('kv-auth'); window.location.href = '/'; } }}>
                                <i className="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>
                </>
            );
        }

        function Topbar() {
            const { darkMode, toggleDarkMode, toggleSidebar, currentModule } = useApp();
            const currentMod = adminModules.find(m => m.id === currentModule) || adminModules[0];
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => { setCurrentTime(new Date()); }, 1000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (date) => {
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            };

            const formatDate = (date) => {
                const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
                return date.toLocaleDateString('en-US', options);
            };

            return (
                <header className="topbar">
                    <div className="topbar-left">
                        <button className="hamburger-btn" onClick={toggleSidebar}><i className="fas fa-bars"></i></button>
                        <span className="topbar-title">{currentMod.label}</span>
                    </div>
                    <div className="topbar-actions">
                        <div className="topbar-clock">
                            <span className="clock-icon"><i className="fas fa-clock"></i></span>
                            <span>{formatTime(currentTime)}</span>
                            <span className="clock-separator">|</span>
                            <span style={{fontWeight: '400', fontSize: '0.7rem', opacity: 0.7}}>{formatDate(currentTime)}</span>
                        </div>
                        <span className="live-indicator"><span className="dot"></span><span className="label">Live</span></span>
                        <button onClick={toggleDarkMode}><i className={`fas ${darkMode ? 'fa-sun' : 'fa-moon'}`}></i></button>
                        <div className="topbar-avatar">A</div>
                    </div>
                </header>
            );
        }

        // ── DASHBOARD MODULE ──
        function DashboardModule() {
            const { orders, resources, tutors, classes, learners, pendingOrderCount, darkMode } = useApp();
            const chartRef = useRef(null);

            const prepareDailyData = useCallback(() => {
                const dailyMap = {};
                orders.forEach(o => {
                    if (o.created_at) {
                        const date = new Date(o.created_at).toISOString().split('T')[0];
                        dailyMap[date] = (dailyMap[date] || 0) + (o.total_amount || 0);
                    }
                });
                const sortedDates = Object.keys(dailyMap).sort();
                const labels = sortedDates.map(d => new Date(d).toLocaleDateString('en', { month: 'short', day: 'numeric' }));
                const data = sortedDates.map(d => dailyMap[d]);
                return { labels, data };
            }, [orders]);

            useEffect(() => {
                if (typeof Chart === 'undefined') return;
                const ctx = document.getElementById('earningsChart')?.getContext('2d');
                if (!ctx) return;
                if (chartRef.current) { chartRef.current.destroy(); }
                const dailyData = prepareDailyData();
                const isDark = document.documentElement.classList.contains('dark');
                const gradient = ctx.createLinearGradient(0, 0, 0, 280);
                gradient.addColorStop(0, 'rgba(212, 167, 44, 0.3)');
                gradient.addColorStop(1, 'rgba(212, 167, 44, 0)');
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: dailyData.labels.length ? dailyData.labels : ['No Data'],

        // ── LEARNERS MODULE ──
        function LearnersModule() {
            const { learners, setLearners, loadLearners, showToast } = useApp();
            const [filter, setFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedLearner, setSelectedLearner] = useState(null);
            const [showLearnerModal, setShowLearnerModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editFormData, setEditFormData] = useState({ full_name: '', email: '', grade_level: '', school_name: '', parent_phone: '', subscription_tier: '', is_active: true });

            useEffect(() => { loadLearners(); }, []);

            const getSubscriptionStatus = (learner) => {
                if (!learner) return 'inactive';
                if (learner.subscription_tier === 'free' || !learner.subscription_tier) return 'inactive';
                if (learner.subscription_tier === 'pending') return 'pending';
                if (!learner.subscription_expiry) return 'inactive';
                const expiry = new Date(learner.subscription_expiry);
                if (expiry <= new Date()) return 'expired';
                return 'active';
            };

            const getSubscriptionLabel = (status) => {
                const map = { 'active': '✅ Active', 'pending': '⏳ Pending', 'expired': '❌ Expired', 'inactive': '⚪ Inactive' };
                return map[status] || '⚪ Inactive';
            };

            const getDaysRemaining = (learner) => {
                if (!learner || !learner.subscription_expiry) return 0;
                const expiry = new Date(learner.subscription_expiry);
                const now = new Date();
                const diff = expiry - now;
                return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
            };

            const toggleLearnerStatus = async (learner) => {
                const newStatus = !learner.is_active;
                if (!confirm(`${newStatus ? 'Activate' : 'Deactivate'} learner ${learner.full_name}?`)) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${learner.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ is_active: newStatus })
                    });
                    showToast(`✅ Learner ${newStatus ? 'activated' : 'deactivated'}`);
                    loadLearners();
                } catch (e) { showToast('❌ Failed to update status', 'error'); }
            };

            const openLearnerDetails = (learner) => {
                setSelectedLearner(learner);
                setShowLearnerModal(true);
            };
            const closeLearnerDetails = () => {
                setShowLearnerModal(false);
                setSelectedLearner(null);
            };

            const openEditModal = (learner) => {
                setSelectedLearner(learner);
                setEditFormData({
                    full_name: learner.full_name || '',
                    email: learner.email || '',
                    grade_level: learner.grade_level || '',
                    school_name: learner.school_name || '',
                    parent_phone: learner.parent_phone || '',
                    subscription_tier: learner.subscription_tier || 'free',
                    is_active: learner.is_active !== false

                setShowEditModal(false);
                setSelectedLearner(null);
            };

            const handleEditSave = async () => {
                if (!selectedLearner) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${selectedLearner.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },

                            grade_level: editFormData.grade_level,
                            school_name: editFormData.school_name,
                            parent_phone: editFormData.parent_phone,

            };

            const filteredLearners = learners.filter(l => {
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();

                }
                if (filter === 'active') return l.is_active !== false;
                if (filter === 'inactive') return l.is_active === false;
                if (filter === 'subscribed') { const status = getSubscriptionStatus(l); return status === 'active'; }
                if (filter === 'pending') { const status = getSubscriptionStatus(l); return status === 'pending'; }
                if (filter === 'expired') { const status = getSubscriptionStatus(l); return status === 'expired'; }
                return true;

                            <button onClick={() => setFilter('active')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'active' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>✅ Active</button>
                            <button onClick={() => setFilter('inactive')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'inactive' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>⛔ Inactive</button>
                            <button onClick={() => setFilter('subscribed')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'subscribed' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>💳 Subscribed</button>
                            <button onClick={() => setFilter('pending')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'pending' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>⏳ Pending</button>
                            <button onClick={() => setFilter('expired')} className={`px-3 py-1 rounded-lg text-sm ${filter === 'expired' ? 'bg-[#D4A72C] text-[#0B2340]' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}>❌ Expired</button>
                        </div>
                        <div className="mb-4">
                            <input type="text" placeholder="🔍 Search by name, email, or school..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white" />

                                        return (

                                                <td className="text-gray-600 dark:text-gray-400">{l.school_name || '—'}</td>
                                                <td><span className={`status-badge ${status}`}>{getSubscriptionLabel(status)}{status === 'active' && ` (${daysLeft}d)`}</span></td>
                                                <td><span className={`status-badge ${l.is_active !== false ? 'active' : 'inactive'}`}>{l.is_active !== false ? '✅ Active' : '⛔ Inactive'}</span></td>
                                                <td>
                                                    <div className="flex gap-2 flex-wrap">
                                                        <button onClick={() => openLearnerDetails(l)} className="px-2 py-1 text-xs bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded">📋</button>
                                                        <button onClick={() => openEditModal(l)} className="px-2 py-1 text-xs bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded">✏️</button>
                                                        <button onClick={() => toggleLearnerStatus(l)} className={`px-2 py-1 text-xs rounded ${l.is_active !== false ? 'bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400' : 'bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400'}`}>
                                                            {l.is_active !== false ? '⏸️' : '▶️'}
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                            {filteredLearners.length === 0 && <p className="text-center text-gray-500 py-8">No learners found matching your filters.</p>}
                        </div>
                    </div>

                    {showLearnerModal && selectedLearner && (
                        <div className="modal-overlay open" onClick={closeLearnerDetails}>
                            <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold text-gray-800 dark:text-white">👨‍🎓 Learner Details</h3>
                                    <button onClick={closeLearnerDetails} className="text-gray-500 hover:text-gray-700 text-xl">✕</button>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">Full Name</div><div className="font-semibold">{selectedLearner.full_name || 'N/A'}</div></div>
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">Email</div><div className="font-semibold">{selectedLearner.email || 'N/A'}</div></div>
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">Grade Level</div><div className="font-semibold">{selectedLearner.grade_level || 'N/A'}</div></div>
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">School</div><div className="font-semibold">{selectedLearner.school_name || 'N/A'}</div></div>
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">Parent/Guardian Phone</div><div className="font-semibold">{selectedLearner.parent_phone || 'N/A'}</div></div>
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">Subscription</div><div className="font-semibold"><span className={`status-badge ${getSubscriptionStatus(selectedLearner)}`}>{getSubscriptionLabel(getSubscriptionStatus(selectedLearner))}{getSubscriptionStatus(selectedLearner) === 'active' && ` (${getDaysRemaining(selectedLearner)} days left)`}</span></div></div>
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">Status</div><div className="font-semibold"><span className={`status-badge ${selectedLearner.is_active !== false ? 'active' : 'inactive'}`}>{selectedLearner.is_active !== false ? '✅ Active' : '⛔ Inactive'}</span></div></div>
                                    <div className="bg-gray-50 dark:bg-gray-800/50 rounded-lg p-4"><div className="text-xs text-gray-500">Joined</div><div className="font-semibold">{selectedLearner.created_at ? new Date(selectedLearner.created_at).toLocaleDateString() : 'N/A'}</div></div>
                                </div>
                                <div className="flex gap-3 mt-6">
                                    <button onClick={closeLearnerDetails} className="btn-gold px-6 py-2 rounded-lg font-semibold">Close</button>
                                    <button onClick={() => { closeLearnerDetails(); openEditModal(selectedLearner); }} className="px-6 py-2 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-lg font-semibold">✏️ Edit</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showEditModal && selectedLearner && (
                        <div className="modal-overlay open" onClick={closeEditModal}>
                            <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-xl font-bold mb-4">✏️ Edit Learner</h3>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium mb-1">Full Name</label><input type="text" value={editFormData.full_name} onChange={(e) => setEditFormData({...editFormData, full_name: e.target.value})} className="form-input" /></div>
                                        <div><label className="block text-sm font-medium mb-1">Email</label><input type="email" value={editFormData.email} onChange={(e) => setEditFormData({...editFormData, email: e.target.value})} className="form-input" /></div>
                                        <div><label className="block text-sm font-medium mb-1">Grade Level</label><select value={editFormData.grade_level} onChange={(e) => setEditFormData({...editFormData, grade_level: e.target.value})} className="form-input"><option value="">Select grade...</option><option value="grade-1">Grade 1</option><option value="grade-2">Grade 2</option><option value="grade-3">Grade 3</option><option value="grade-4">Grade 4</option><option value="grade-5">Grade 5</option><option value="grade-6">Grade 6</option><option value="grade-7">Grade 7</option><option value="grade-8">Grade 8</option><option value="grade-9">Grade 9</option><option value="grade-10">Grade 10</option><option value="grade-11">Grade 11</option><option value="grade-12">Grade 12</option><option value="form-1">Form 1</option><option value="form-2">Form 2</option><option value="form-3">Form 3</option><option value="form-4">Form 4</option><option value="college">College</option><option value="tvet">TVET</option><option value="university">University</option></select></div>

        // ── RESOURCES MODULE ──
        function ResourcesModule() {
            const { resources, setResources, showToast } = useApp();
            const [formData, setFormData] = useState({ title: '', subject: '', level: '', curriculum: 'cbc', resource_type: 'lesson-plan', price: 0, description: '' });
            const [selectedFile, setSelectedFile] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [editingResource, setEditingResource] = useState(null);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editFormData, setEditFormData] = useState({ title: '', price: 0, status: 'draft', subject: '', level: '', description: '' });

            const loadResources = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/resources?select=*&order=created_at.desc`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    if (res.ok) setResources(await res.json());
                } catch (e) { console.error(e); }
            };
            useEffect(() => { loadResources(); }, []);

            const openEditModal = (r) => { setEditingResource(r); setEditFormData({ title: r.title, price: r.price, status: r.status, subject: r.subject, level: r.level, description: r.description }); setShowEditModal(true); };
            const closeEditModal = () => { setShowEditModal(false); setEditingResource(null); };

            const handleEditSave = async () => {
                if (!editingResource) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${editingResource.id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: editFormData.title, price: editFormData.price, status: editFormData.status, subject: editFormData.subject, level: editFormData.level, description: editFormData.description })
                    });
                    showToast('✅ Resource updated');
                    closeEditModal();
                    loadResources();
                } catch (e) { showToast('❌ Update failed', 'error'); }
            };

            const toggleStatus = async (id, currentStatus) => {
                const newStatus = currentStatus === 'live' ? 'draft' : 'live';
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${id}`, {
                        method: 'PATCH',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });
                    showToast(`✅ ${newStatus === 'live' ? 'Published' : 'Drafted'}`);
                    loadResources();
                } catch (e) { showToast('❌ Status update failed', 'error'); }
            };

            const deleteResource = async (id) => {
                if (!confirm('Delete?')) return;
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/resources?id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });

            const loadTutors = async () => {
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/tutors?select=*`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    if (res.ok) setTutors(await res.json());
                } catch (e) { console.error(e); }
            };

            const calculateTutorStats = useCallback(() => {
                const stats = {};
                tutors.forEach(t => {
                    const tutorResources = resources.filter(r => r.creator_id === t.id || r.tutor_id === t.id || r.creator_name === t.name);
                    const totalDownloads = tutorResources.reduce((sum, r) => sum + (r.download_count || 0), 0);
                    const paidResources = tutorResources.filter(r => r.price > 0);
                    const freeResources = tutorResources.filter(r => r.price === 0 || r.price === null);
                    const totalRevenue = paidResources.reduce((sum, r) => sum + (r.price || 0) * (r.download_count || 0), 0);
                    const tutorPayout = totalRevenue * (TUTOR_PAYOUT_PERCENTAGE / 100);
                    const tutorOrderIds = orders.filter(o => {
                        const cartItems = o.cart_items || [];
                        return cartItems.some(item => {
                            const resource = resources.find(r => r.id === item.id);
                            return resource && (resource.creator_id === t.id || resource.tutor_id === t.id || resource.creator_name === t.name);
                        });
                    });
                    stats[t.id] = {
                        resourceCount: tutorResources.length,
                        totalDownloads: totalDownloads,
                        paidResources: paidResources.length,
                        freeResources: freeResources.length,
                        totalRevenue: totalRevenue,
                        tutorPayout: tutorPayout,
                        orderCount: tutorOrderIds.length,
                        resources: tutorResources
                    };
                });
                setTutorStats(stats);
            }, [tutors, resources, orders]);

            useEffect(() => { loadTutors(); }, []);

            const handleEditSave = async () => {

                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },

                                <option value="geography">Geography</option><option value="History-citizenship">History & Citizenship</option>
                                <option value="pretechnical-studies">Pretechnical Studies</option><option value="tvet">TVET</option>

                        <div className="tutor-stat-card"><div className="stat-number blue">{tutors.filter(t => t.status === 'active').length}</div><div className="stat-label">👨‍🏫 Active Tutors</div></div>

                    <div className="content-card">
