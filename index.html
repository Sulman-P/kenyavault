        // ─── GENERATE PUBLIC URL ──────────────────────────────────
        // (Your existing generatePublicUrl and openFileInNewTab stay the same)
        async function generatePublicUrl(filePath, fileName) {
            if (!filePath) return null;

            var cleanPath = filePath;
            try { cleanPath = decodeURIComponent(filePath); } catch (e) {}

            var AVAILABLE_BUCKETS = ['kenyavault-pdfs', 'kenyavault-resources', 'academic-resources'];

            for (var b = 0; b < AVAILABLE_BUCKETS.length; b++) {
                var bucket = AVAILABLE_BUCKETS[b];
                if (cleanPath.startsWith(bucket + '/')) {
                    cleanPath = cleanPath.replace(bucket + '/', '');
                    break;
                }
            }
            cleanPath = cleanPath.replace(/^https?:\/\/[^\/]+\/storage\/v1\/object\/public\/[^\/]+\//, '');
            cleanPath = cleanPath.replace(/^\/+/, '');

            var ext = cleanPath.split('.').pop().toLowerCase();
            if (!['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'jpg', 'jpeg', 'png', 'gif', 'webp', 'mp4', 'mov',
                    'mp3', 'wav', 'zip', 'epub'
                ].includes(ext)) {
                if (cleanPath.indexOf('.') === -1) {
                    cleanPath = cleanPath + '.pdf';
                }
            }

            var variations = [
                cleanPath,
                'resources/' + cleanPath,
                cleanPath.replace(/^resources\//, ''),
                encodeURIComponent(cleanPath).replace(/%2F/g, '/')
            ];

            for (var b = 0; b < AVAILABLE_BUCKETS.length; b++) {
                var bucket = AVAILABLE_BUCKETS[b];
                for (var v = 0; v < variations.length; v++) {
                    var path = variations[v];
                    path = path.replace(/\/+/g, '/').replace(/^\/+/, '');

                    var encodedPath = path.split('/').map(function(s) { return encodeURIComponent(s); }).join('/');
                    var downloadUrl = SUPABASE_URL + '/storage/v1/object/public/' + bucket + '/' + encodedPath +
                        '?download=' + encodeURIComponent(fileName || 'document.pdf');

                    try {
                        var response = await fetch(downloadUrl, {
                            method: 'HEAD',
                            headers: { 'Accept': 'application/pdf,application/octet-stream,*/*' }
                        });

                        if (response.ok) {
                            return downloadUrl;
                        }
                    } catch (e) {}
                }
            }
            return null;
        }

        function openFileInNewTab(url, fileName) {
            try {
                var newTab = window.open(url, '_blank');
                if (newTab) return true;
            } catch (e) {}
            try {
                var link = document.createElement('a');
                link.href = url;
                link.download = fileName || 'document.pdf';
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                setTimeout(function() { document.body.removeChild(link); }, 1000);
                return true;
            } catch (e) {}
            try {
                var iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = url;
                document.body.appendChild(iframe);
                setTimeout(function() { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 10000);
                return true;
            } catch (e) {
                return false;
            }
        }

            cleanFilePath = cleanFilePath.replace(/^https?:\/\/[^\/]+\/storage\/v1\/object\/public\/[^\/]+\//, '');
            cleanFilePath = cleanFilePath.replace(/^\/+/, '');
            if (cleanFilePath && !cleanFilePath.startsWith('resources/')) {
                cleanFilePath = 'resources/' + cleanFilePath;
            }

            var orderData = {
                order_ref: orderRef,
                customer_name: customerName,
                phone: phone,
                session_id: sessionId,
                item_title: product.title || 'Resource',
                item_price: product.price || 0,
                total_amount: product.price || 0,
                cart_items: [{
                    id: productId,
                    title: product.title || 'Resource',
                    price: product.price || 0,
                    quantity: 1,
                    resource_type: product.resource_type || 'digital',
                    level: product.level || '',
                    file_path: cleanFilePath,
                    file_url: product.file_url || ''
                }],
                item_count: 1,
                resource_id: productId,
                resource_file_path: cleanFilePath,
                resource_file_name: fileName,
                created_at: new Date().toISOString()
            };

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/orders', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.status === 409 && retryCount < maxRetries) {
                    return createSingleOrder(product, customerName, phone, retryCount + 1);
                }

                if (!response.ok) {
                    var errorText = await response.text();
                    throw new Error('HTTP ' + response.status + ': ' + errorText);
                }

                var result = await response.json();
                var createdOrder = result[0] || result;
                return { orderRef: orderRef, orderId: createdOrder.id };
            } catch (error) {
                throw error;
            }
        }

        async function createCartOrder(items, customerName, phone, retryCount) {
            retryCount = retryCount || 0;
            var maxRetries = 3;
            var orderRef = generateOrderRef();
            var sessionId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            var totalAmount = items.reduce(function(sum, item) { return sum + (item.price || 0) * item.qty; }, 0);
            var itemCount = items.reduce(function(sum, item) { return sum + item.qty; }, 0);
            var cartItems = items.map(function(item) {
                return {
                    id: item.id,
                    title: item.title,
                    price: item.price,
                    quantity: item.qty,
                    resource_type: item.resource_type || 'digital',
                    level: item.level || '',
                    file_path: item.file_path || '',
                    file_url: item.file_url || ''
                };
            });

            var itemsList = items.map(function(item) { return item.title + ' (x' + item.qty + ')'; }).join(', ');
            var summary = itemCount + ' item' + (itemCount > 1 ? 's' : '') + ': ' + itemsList.substring(0, 200);

            var orderData = {
                order_ref: orderRef,
                customer_name: customerName,
                phone: phone,
                session_id: sessionId,
                item_title: summary,
                item_price: totalAmount,
                total_amount: totalAmount,
                cart_total: totalAmount,
                item_count: itemCount,
                cart_items: cartItems,
                description: 'Cart purchase: ' + itemCount + ' items. Total: KES ' + totalAmount,
                created_at: new Date().toISOString()
            };

            try {
                var response = await fetch(SUPABASE_URL + '/rest/v1/orders', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.status === 409 && retryCount < maxRetries) {
                    return createCartOrder(items, customerName, phone, retryCount + 1);
                }

                if (!response.ok) {
                    var errorText = await response.text();
                    throw new Error('HTTP ' + response.status + ': ' + errorText);
                }

                var result = await response.json();
                var createdOrder = result[0] || result;
                return { orderRef: orderRef, orderId: createdOrder.id };
            } catch (error) {
                throw error;
            }
        }

        // ─── STK PUSH STATUS UI ──────────────────────────────────
        // (Your existing showStkStatus and hideStkStatus stay the same)
        function showStkStatus(message, type) {
            if (!stkStatus) return;
            stkStatus.className = 'stk-status visible ' + type;
            stkStatus.innerHTML = message;
        }

        function hideStkStatus() {
            if (!stkStatus) return;
            stkStatus.className = 'stk-status';
            stkStatus.innerHTML = '';
        }

        // ─── PAYMENT FUNCTIONS ────────────────────────────────────
        // (Your existing startPaymentPolling, stopPaymentPolling, checkOrderPaymentStatus stay the same)
        function startPaymentPolling() {
            stopPaymentPolling();
            paymentCheckAttempts = 0;
            showStkStatus(
                '<span class="spinner"></span> Waiting for payment confirmation... (Attempt 1/' + MAX_POLL_ATTEMPTS +
                ')',
                'pending'
            );

            setTimeout(function() { checkOrderPaymentStatus(); }, 2000);
            paymentPollingInterval = setInterval(function() {
                paymentCheckAttempts++;
                showStkStatus(
                    '<span class="spinner"></span> Waiting for payment confirmation... (Attempt ' + paymentCheckAttempts +
                    '/' + MAX_POLL_ATTEMPTS + ')',
                    'pending'
                );
                checkOrderPaymentStatus();
                if (paymentCheckAttempts >= MAX_POLL_ATTEMPTS) {
                    stopPaymentPolling();
                    showStkStatus('⏰ Payment verification timed out. Please check your order status.', 'error');
                    payPrimaryBtn.style.display = 'flex';
                    verifyOrderBtn.style.display = 'block';
                    payPrimaryBtn.disabled = false;
                    payPrimaryBtn.innerHTML = '<span class="btn-text">🔄 Retry Payment</span>';
                }
            }, POLL_INTERVAL);
        }

        function stopPaymentPolling() {
            if (paymentPollingInterval) {
                clearInterval(paymentPollingInterval);
                paymentPollingInterval = null;
            }
        }

        async function checkOrderPaymentStatus() {
            if (!currentOrderRef && !currentOrderId) return;

            try {
                var query = SUPABASE_URL + '/rest/v1/orders?select=*';
                if (currentOrderId) query += '&id=eq.' + currentOrderId;
                else if (currentOrderRef) query += '&order_ref=eq.' + currentOrderRef;

                var response = await fetch(query, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                });

                if (!response.ok) return;
                var orders = await response.json();
                if (orders.length === 0) return;
                var order = orders[0];

                var isPaid = false;
                if (order.payment_status === 'paid' || order.payment_status === 'completed' ||
                    order.status === 'paid' || order.status === 'completed' ||
                    order.status === 'success') {
                    isPaid = true;
                }

                if (isPaid) {
                    stopPaymentPolling();
                    isPaymentVerified = true;
                    currentOrderId = order.id;
                    currentOrderRef = order.order_ref;

                    showStkStatus('✅ Payment confirmed! Downloading your resource...', 'success');

                    await downloadOrderFiles(order);
                    showSuccessWithShare(order.order_ref);

                    if (checkoutMode === 'cart') clearCart();

                    setTimeout(function() {
                        hideStkStatus();
                        closeCheckoutModal();
                    }, 3000);
                }

                if (paymentCheckAttempts >= MAX_POLL_ATTEMPTS && !isPaid) {
                    stopPaymentPolling();
                    showStkStatus('⏰ Payment verification timed out. Please check your order status or try again.',
                        'error');
                    payPrimaryBtn.style.display = 'flex';
                    verifyOrderBtn.style.display = 'block';
                    payPrimaryBtn.disabled = false;
                    payPrimaryBtn.innerHTML = '<span class="btn-text">🔄 Retry Payment</span>';
                }

            } catch (error) {
                console.error('Payment status check error:', error);
            }
        }

        // ─── UPDATED: INITIATE PAYMENT WITH CORRECT MEGAPAY API ──
        async function initiatePayment() {
            if (isProcessing) return;

            var phone = phoneInput.value.trim().replace(/\s/g, '');
            var customerName = customerNameInput.value.trim();
            var customerEmail = customerName.toLowerCase().replace(/\s/g, '') + '@kenyavault.co.ke';

            if (!customerName) {
                customerNameInput.classList.add('error');
                showToast('Error', 'Please enter your full name', 'error');
                return;
            }
            customerNameInput.classList.remove('error');

            if (!phone || phone.length < 9) {
                phoneInput.classList.add('error');
                showToast('Error', 'Please enter a valid phone number', 'error');
                return;
            }
            phoneInput.classList.remove('error');

            // ─── CONVERT PHONE TO MEGAPAY FORMAT (07XXXXXXXX) ───
            var formattedPhone = phone;
            if (phone.startsWith('254')) {
                formattedPhone = '0' + phone.substring(3);
            } else if (phone.startsWith('+254')) {
                formattedPhone = '0' + phone.substring(4);
            } else if (phone.startsWith('0') && phone.length === 10) {
                formattedPhone = phone;
            } else if (phone.length === 9 && phone.startsWith('7')) {
                formattedPhone = '0' + phone;
            }

            // Validate format (should be 07XXXXXXXX)
            if (!/^07[0-9]{8}$/.test(formattedPhone)) {
                phoneInput.classList.add('error');
                showToast('Error', 'Please enter a valid Safaricom phone number (e.g., 0712345678)', 'error');
                return;
            }

            var isFreeCheckout = false;
            if (checkoutMode === 'single' && currentProduct) {
                var pricing = getResourcePricing(currentProduct);
                isFreeCheckout = pricing.isFree;
            } else if (checkoutMode === 'cart') {
                isFreeCheckout = checkoutExpectedTotal === 0;
            }

            // ─── FREE RESOURCE ──────────────────────────────────
            if (isFreeCheckout) {
                try {
                    var freeResult;
                    if (checkoutMode === 'single') {
                        freeResult = await createSingleOrder(currentProduct, customerName, formattedPhone);
                    } else {
                        freeResult = await createCartOrder(checkoutCartItems, customerName, formattedPhone);
                    }

                    currentOrderRef = freeResult.orderRef;
                    currentOrderId = freeResult.orderId;
                    isPaymentVerified = true;

                    try {
                        var orderFetch = await fetch(SUPABASE_URL + '/rest/v1/orders?id=eq.' + freeResult.orderId +
                            '&select=*', {
                                headers: {
                                    'apikey': SUPABASE_ANON_KEY,
                                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                                }
                            });
                        if (orderFetch.ok) {
                            var orderData = await orderFetch.json();
                            if (orderData && orderData.length > 0) {
                                showStkStatus('✅ Downloading your free resource...', 'success');
                                await downloadOrderFiles(orderData[0]);
                            }
                        }
                    } catch (downloadError) {
                        console.warn('Download error:', downloadError);
                    }

                    showSuccessWithShare(freeResult.orderRef);
                    if (checkoutMode === 'cart') clearCart();
                    setTimeout(function() { closeCheckoutModal(); }, 3000);
                    return;
                } catch (error) {
                    console.error('Free download error:', error);
                    showToast('Error', 'Failed to process: ' + (error.message || 'Unknown error'), 'error');
                    return;
                }
            }

            // ─── PAID RESOURCE ──────────────────────────────────
            if (checkoutMode === 'single' && !currentProduct) return;
            if (checkoutMode === 'cart' && checkoutCartItems.length === 0) return;

            isProcessing = true;
            payPrimaryBtn.disabled = true;
            payPrimaryBtn.classList.add('loading');
            payPrimaryBtn.innerHTML = '<span class="spinner"></span><span class="btn-text">Processing...</span>';
            hideStkStatus();

            try {
                var orderRef, orderId, totalAmount, description;

                if (checkoutMode === 'cart') {
                    var cartResult = await createCartOrder(checkoutCartItems, customerName, formattedPhone);
                    orderRef = cartResult.orderRef;
                    orderId = cartResult.orderId;
                    totalAmount = checkoutExpectedTotal;
                    description = 'KenyaVault cart — ' + checkoutCartItems.length + ' items';
                } else {
                    var singleResult = await createSingleOrder(currentProduct, customerName, formattedPhone);
                    orderRef = singleResult.orderRef;
                    orderId = singleResult.orderId;
                    totalAmount = currentProduct.price || 0;
                    description = currentProduct.title || 'Educational Resource';
                }

                currentOrderRef = orderRef;
                currentOrderId = orderId;
                checkoutExpectedTotal = totalAmount;

                // ─── UPDATED: CALL BACKEND WITH CORRECT PARAMETERS ──
                showStkStatus(
                    '<span class="spinner"></span> Sending STK Push to your phone...',
                    'pending'
                );

                var response = await fetch(BACKEND_URL + '/api/mpesa/stk-push', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: formattedPhone,  // 07XXXXXXXX format
                        amount: totalAmount,
                        order_id: orderId,
                        customer_name: customerName,
                        customer_email: customerEmail,
                        resource_ids: checkoutMode === 'cart' ? checkoutCartItems.map(function(i) { return i.id; }) : [currentProduct.id]
                    })
                });

                var result = await response.json();

                if (!result.success) {
                    throw new Error(result.error || 'Failed to send STK Push');
                }

                // STK Push sent successfully!
                showStkStatus(
                    '📱 STK Push sent! Check your phone for the M-Pesa PIN prompt.\n' +
                    'Reference: ' + result.data.reference,
                    'pending'
                );

                payPrimaryBtn.style.display = 'none';
                verifyOrderBtn.style.display = 'block';
                verifyOrderBtn.textContent = '🔓 Verify Payment';
                verifyOrderBtn.disabled = false;
                verifyOrderBtn.onclick = function() { checkOrderPaymentStatus(); };

                // Start polling for payment confirmation
                startPaymentPolling();

                // Also check for callback via URL params
                setTimeout(function() {
                    checkPaymentCallback();
                }, 5000);

            } catch (error) {
                console.error('Payment initiation failed:', error);
                showStkStatus('❌ ' + (error.message || 'Payment initiation failed'), 'error');
                showToast('Error', 'Payment initiation failed: ' + (error.message || 'Unknown error'), 'error');
            } finally {
                isProcessing = false;
                payPrimaryBtn.disabled = false;
                payPrimaryBtn.classList.remove('loading');
                payPrimaryBtn.innerHTML = '<span class="btn-text">💳 Pay with M-PESA</span>';
            }
        }

        // ─── CHECK PAYMENT CALLBACK ──────────────────────────────
        // (Your existing checkPaymentCallback stays the same)
        function checkPaymentCallback() {
            var params = new URLSearchParams(window.location.search);
            var status = params.get('status');
            var orderRef = params.get('order_ref') || localStorage.getItem('pendingOrderRef');

            if ((status === 'success' || status === 'completed') && orderRef) {
                (function() {
                    var ref = orderRef;
                    fetch(SUPABASE_URL + '/rest/v1/orders?order_ref=eq.' + ref + '&select=*', {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                        }
                    })
                    .then(function(res) { return res.ok ? res.json() : null; })
                    .then(function(orders) {
                        if (orders && orders.length > 0) {
                            var order = orders[0];
                            var isPaid = order.payment_status === 'paid' || order.payment_status ===
                                'completed' ||
                                order.status === 'paid' || order.status === 'completed' ||
                                order.status === 'success';
                            if (isPaid) {
                                isPaymentVerified = true;
                                currentOrderId = order.id;
                                currentOrderRef = ref;
                                stopPaymentPolling();
                                showStkStatus('✅ Payment confirmed! Downloading your resource...', 'success');
                                downloadOrderFiles(order);
                                showSuccessWithShare(ref);
                                if (checkoutMode === 'cart') clearCart();
                                setTimeout(function() { closeCheckoutModal(); }, 3000);
                            }
                        }
                        return null;
                    })
                    .catch(function(error) {
                        console.error('Callback processing failed:', error);
                    });
                })();
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function showSuccessWithShare(orderRef) {
            successOrderRef.textContent = orderRef;
            successModal.classList.add('open');
        }

        function closeSuccessModal() {
            successModal.classList.remove('open');
            currentOrderRef = null;
            currentProduct = null;
            isPaymentVerified = false;
        }

        function closeCheckoutModal() {
            checkoutModal.classList.remove('open');
            document.body.style.overflow = '';
            hideStkStatus();
            payPrimaryBtn.style.display = 'flex';
            payPrimaryBtn.disabled = false;
            payPrimaryBtn.classList.remove('loading');
            payPrimaryBtn.innerHTML = '<span class="btn-text">💳 Pay with M-PESA</span>';
            verifyOrderBtn.style.display = 'none';
            verifyOrderBtn.disabled = false;
            stopPaymentPolling();
            setTimeout(function() {
                currentOrderId = null;
                checkoutMode = 'single';
                checkoutCartItems = [];
                checkoutExpectedTotal = 0;
                isPaymentVerified = false;
            }, 500);
        }

        // ─── CHECKOUT FUNCTIONS ──────────────────────────────────
        // (Your existing openCheckout, openCartCheckout stay the same)
        function openCheckout(productId) {
            var product = allResources.find(function(r) { return r.id === productId; });
            if (!product) return;

            var pricing = getResourcePricing(product);
            var isFree = pricing.isFree;
            var priceDisplay = pricing.priceDisplay;
            var status = pricing.status;

            checkoutMode = 'single';
            checkoutCartItems = [];
            checkoutExpectedTotal = product.price || 0;
            currentProduct = product;
            currentOrderRef = null;
            currentOrderId = null;
            isPaymentVerified = false;

            customerNameInput.value = '';
            customerNameInput.classList.remove('error');
            phoneInput.value = '';
            phoneInput.classList.remove('error');
            hideStkStatus();
            payPrimaryBtn.style.display = 'flex';
            payPrimaryBtn.disabled = false;
            payPrimaryBtn.classList.remove('loading');
            payPrimaryBtn.innerHTML = '<span class="btn-text">💳 Pay with M-PESA</span>';
            verifyOrderBtn.style.display = 'none';

            checkoutItemTitle.textContent = product.title || 'Resource';
            if (isFree) {
                checkoutTotal.textContent = 'FREE';
                checkoutTotal.className = 'summary-value free';
            } else if (status === 'unavailable') {
                checkoutTotal.textContent = 'Price unavailable';
                checkoutTotal.className = 'summary-value';
            } else {
                checkoutTotal.textContent = 'KES ' + (product.price || 0);
                checkoutTotal.className = 'summary-value price';
            }
            document.getElementById('checkoutLineItems').innerHTML = '';

            if (!isFree && status !== 'unavailable') {
                verifyOrderBtn.style.display = 'block';
                verifyOrderBtn.textContent = '🔓 Verify Payment';
                verifyOrderBtn.onclick = function() { checkOrderPaymentStatus(); };
            }

            checkoutModal.classList.add('open');
            document.body.style.overflow = 'hidden';
            setTimeout(function() { customerNameInput.focus(); }, 300);
        }

        function openCartCheckout() {
            if (cart.length === 0) {
                showToast('Cart Empty', 'Your cart is empty. Add some resources first!', 'error');
                return;
            }

            closeCartDrawer();

            setTimeout(function() {
                checkoutMode = 'cart';
                checkoutCartItems = JSON.parse(JSON.stringify(cart));
                currentProduct = null;
                currentOrderRef = null;
                currentOrderId = null;
                isPaymentVerified = false;

                var total = checkoutCartItems.reduce(function(sum, ci) { return sum + (ci.price || 0) * ci.qty; },
                    0);
                checkoutExpectedTotal = total;
                var allFree = total === 0;

                customerNameInput.value = '';
                customerNameInput.classList.remove('error');
                phoneInput.value = '';
                phoneInput.classList.remove('error');
                hideStkStatus();
                payPrimaryBtn.style.display = 'flex';
                payPrimaryBtn.disabled = false;
                payPrimaryBtn.classList.remove('loading');
                payPrimaryBtn.innerHTML = '<span class="btn-text">💳 Pay with M-PESA</span>';
                verifyOrderBtn.style.display = 'none';

                var lineItemsHtml = '';
                for (var i = 0; i < checkoutCartItems.length; i++) {
                    var ci = checkoutCartItems[i];
                    var lineTotal = (ci.price || 0) * ci.qty;
                    var isFree = ci.price === 0;
                    lineItemsHtml += '<div class="cart-line-item">';
                    lineItemsHtml += '  <span>' + ci.title + ' (x' + ci.qty + ')</span>';
                    lineItemsHtml += '  <span style="font-weight:700;color:' + (isFree ? 'var(--kv-green)' :
                        'var(--kv-gold)') + ';">' + (lineTotal === 0 ? 'FREE' : 'KES ' + lineTotal) +
                        '</span>';
                    lineItemsHtml += '</div>';
                }
                document.getElementById('checkoutLineItems').innerHTML = lineItemsHtml;

                if (allFree) {
                    checkoutTotal.textContent = 'FREE';
                    checkoutTotal.className = 'summary-value free';
                } else {
                    checkoutTotal.textContent = 'KES ' + total;
                    checkoutTotal.className = 'summary-value price';
                    verifyOrderBtn.style.display = 'block';
                    verifyOrderBtn.textContent = '🔓 Verify Payment';
                    verifyOrderBtn.onclick = function() { checkOrderPaymentStatus(); };
                }

                checkoutModal.classList.add('open');
                document.body.style.overflow = 'hidden';
                setTimeout(function() { customerNameInput.focus(); }, 300);
            }, 400);
        }

        // (All your existing event listeners stay the same)
        document.getElementById('hamburger').addEventListener('click', function() {
            document.getElementById('navLinks').classList.toggle('open');
        });

        phoneInput.addEventListener('input', function() {
            var val = this.value.replace(/\D/g, '');
            if (val.length > 12) val = val.substring(0, 12);
            this.value = val;
            this.classList.remove('error');
        });

        customerNameInput.addEventListener('input', function() {
            this.classList.remove('error');
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (checkoutModal.classList.contains('open')) closeCheckoutModal();
                if (successModal.classList.contains('open')) closeSuccessModal();
                if (previewModal.classList.contains('open')) closePreview();
                if (document.getElementById('filterBottomSheet').classList.contains('open')) toggleMobileFilter();
                if (document.getElementById('cartDrawer').classList.contains('open')) closeCartDrawer();
            }
        });

        checkoutModal.addEventListener('click', function(e) {
            if (e.target === checkoutModal) closeCheckoutModal();
        });

        successModal.addEventListener('click', function(e) {
            if (e.target === successModal) closeSuccessModal();
        });

        previewModal.addEventListener('click', function(e) {
            if (e.target === previewModal) closePreview();
        });

        // ─── CONSENT BANNER ───────────────────────────────────────
        (function() {
            var CONSENT_KEY = 'kenyavault_consent';
            var banner = document.getElementById('consentBanner');
            var checkbox = document.getElementById('consentCheckbox');
            var acceptBtn = document.getElementById('consentAcceptBtn');

            if (localStorage.getItem(CONSENT_KEY) === 'true') {
                if (banner) banner.classList.add('hidden');
                return;
            }

            if (banner) banner.classList.remove('hidden');

            function updateAcceptButton() {
                if (checkbox && acceptBtn) {
                    var isChecked = checkbox.checked;
                    acceptBtn.disabled = !isChecked;
                    acceptBtn.style.opacity = isChecked ? '1' : '0.5';
                    acceptBtn.style.pointerEvents = isChecked ? 'auto' : 'none';
                }
            }

            if (checkbox) checkbox.addEventListener('change', updateAcceptButton);
            if (acceptBtn) {
                acceptBtn.addEventListener('click', function() {
                    if (checkbox && checkbox.checked) {
                        localStorage.setItem(CONSENT_KEY, 'true');
                        if (banner) banner.classList.add('hidden');
                    }
                });
            }
            updateAcceptButton();
            if (banner && !localStorage.getItem(CONSENT_KEY)) banner.classList.remove('hidden');
        })();

        // ─── EXPOSE GLOBALLY ──────────────────────────────────────
        window.openCheckout = openCheckout;
        window.closeCheckoutModal = closeCheckoutModal;
        window.closeSuccessModal = closeSuccessModal;
        window.initiatePayment = initiatePayment;
        window.openPreview = openPreview;
        window.closePreview = closePreview;
        window.buyFromPreview = buyFromPreview;
        window.resetFilters = resetFilters;
        window.applyFilters = applyFilters;
        window.filterByCategory = filterByCategory;
        window.filterByLevel = filterByLevel;
        window.filterByGrade = filterByGrade;
        window.filterBySubject = filterBySubject;
        window.filterByType = filterByType;
        window.setPriceRange = setPriceRange;
        window.changePage = changePage;
        window.toggleMobileFilter = toggleMobileFilter;
        window.renderShop = renderShop;
        window.handleSearch = handleSearch;
        window.clearSearchInput = clearSearchInput;
        window.init = init;
        window.checkOrderPaymentStatus = checkOrderPaymentStatus;
        window.stopPaymentPolling = stopPaymentPolling;
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
        window.updateCartQty = updateCartQty;
        window.clearCart = clearCart;
        window.openCartDrawer = openCartDrawer;
        window.closeCartDrawer = closeCartDrawer;
        window.toggleCartDrawer = toggleCartDrawer;
        window.openCartCheckout = openCartCheckout;
        window.heroSearch = heroSearch;

        document.addEventListener('DOMContentLoaded', init);
        console.log('✅ KenyaVault Marketplace — Category-Driven Design');
        console.log('✅ STK Push In-Page mode enabled');
        console.log('✅ Users stay on site during payment');
        console.log('✅ Backend URL: ' + BACKEND_URL);

    })();
</script>
