<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learner Account — KenyaVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ── ROOT VARIABLES ── */
        :root {
            --navy: #0a1a3a;
            --navy-light: #1a2a5a;
            --gold: #D4A017;
            --gold-light: #FCD34D;
            --gold-pale: #fdf2d6;
            --white: #FFFFFF;
            --off-white: #f8f9fc;
            --surface: #f1f3f7;
            --text: #0a1a3a;
            --muted: #4a5a7a;
            --border: #e2e6ee;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #2563eb;
            --radius: 12px;
            --shadow-sm: 0 2px 8px rgba(10,26,58,0.06);
            --shadow-md: 0 4px 16px rgba(10,26,58,0.08);
            --shadow-lg: 0 8px 32px rgba(10,26,58,0.12);
            --transition: all 0.3s ease;
            --max-width: 1280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--off-white);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ── CONTAINER ── */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 5%;
        }

        /* ── AUTH PAGES ── */
        .auth-banner {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .auth-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FCD34D' fill-opacity='0.04'%3E%3Cpath d='M40 20c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V24c0-2.2-1.8-4-4-4H40zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H40c-1.1 0-2-.9-2-2V24c0-1.1.9-2 2-2zM16 32c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V36c0-2.2-1.8-4-4-4H16zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H16c-1.1 0-2-.9-2-2V36c0-1.1.9-2 2-2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 80px 80px;
            pointer-events: none;
        }
        .auth-banner .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }
        .auth-box {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
        }
        .auth-box .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-box .logo .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--navy);
        }
        .auth-box .logo .logo-text span { color: var(--gold); }
        .auth-box .logo .logo-sub {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .auth-tabs {
            display: flex;
            gap: 0;
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px 20px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .auth-tab:hover { background: rgba(212, 160, 23, 0.08); }
        .auth-tab.active {
            background: var(--gold);
            color: var(--white);
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text);
            margin-bottom: 4px;
        }
        .form-group label .req { color: var(--red); }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--white);
            color: var(--text);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212,160,23,0.1);
        }
        .form-input.error {
            border-color: var(--red);
            background: #fef2f2;
        }

        .btn-gold {
            background: var(--gold);
            color: var(--white);
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gold:hover {
            background: #b8890f;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-gold:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-link {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-link:hover { text-decoration: underline; }

        /* ── LEARNER DASHBOARD ── */
        .dashboard-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--navy);
            color: var(--white);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-logo {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        .sidebar-logo .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--white);
        }
        .sidebar-logo .logo-text span { color: var(--gold-light); }
        .sidebar-logo .logo-sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        .sidebar-menu {
            flex: 1;
            padding: 0 12px;
        }
        .sidebar-menu .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
        }
        .sidebar-menu .menu-item:hover {
            background: rgba(255,255,255,0.06);
            color: var(--white);
        }
        .sidebar-menu .menu-item.active {
            background: rgba(212, 160, 23, 0.15);
            color: var(--gold-light);
            border-left: 3px solid var(--gold);
        }
        .sidebar-menu .menu-item i {
            width: 20px;
            font-size: 1rem;
        }
        .sidebar-menu .menu-item .badge {
            margin-left: auto;
            background: rgba(212, 160, 23, 0.2);
            color: var(--gold-light);
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-footer .learner-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-footer .learner-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: var(--white);
        }
        .sidebar-footer .learner-name {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .sidebar-footer .learner-grade {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
        }

        .top-navbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.9);
        }
        .top-navbar .page-title {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .top-navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-content {
            padding: 24px 32px;
        }

        /* ── STAT CARDS ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .stat-card .stat-number {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--gold);
        }
        .stat-card .stat-number.green { color: var(--green); }
        .stat-card .stat-number.blue { color: var(--blue); }
        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* ── CONTENT CARDS ── */
        .content-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .content-card .card-header h3 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }

        /* ── RESOURCE ITEMS ── */
        .resource-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 8px;
        }
        .resource-item:hover {
            background: var(--off-white);
        }
        .resource-item .info .title {
            font-weight: 600;
            color: var(--text);
        }
        .resource-item .info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .resource-item .progress-bar {
            width: 100px;
            height: 6px;
            background: var(--surface);
            border-radius: 99px;
            overflow: hidden;
        }
        .resource-item .progress-bar .progress-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.completed { background: #dcfce7; color: var(--green); }
        .status-badge.in-progress { background: #fef3c7; color: #d97706; }
        .status-badge.not-started { background: var(--surface); color: var(--muted); }

        /* ── RESPONSIVE ── */
        .mobile-menu-toggle {
            display: none;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 80%;
                max-width: 300px;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .mobile-menu-toggle { display: block; }
            .main-content { margin-left: 0; }
            .page-content { padding: 16px; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .stat-grid { grid-template-columns: 1fr; }
            .auth-box { padding: 20px; }
            .top-navbar { padding: 10px 16px; }
            .content-card { padding: 16px; }
        }
    </style>
</head>
<body>

    <div id="root"></div>

 <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // ── SUPABASE CONFIG ──
    const SUPABASE_URL = 'https://rewpminmqnrtwdvglxxr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld3BtaW5tcW5ydHdkdmdseHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDkzOTksImV4cCI6MjA5NzMyNTM5OX0.2HnM4NMvxOlqrc2ChuFa_F6kqEniSah3NU5vTLNtfYs';

    // ── GRADE LEVELS ──
    const GRADE_LEVELS = [
        { value: 'grade-1', label: 'Grade 1' },
        { value: 'grade-2', label: 'Grade 2' },
        { value: 'grade-3', label: 'Grade 3' },
        { value: 'grade-4', label: 'Grade 4' },
        { value: 'grade-5', label: 'Grade 5' },
        { value: 'grade-6', label: 'Grade 6' },
        { value: 'grade-7', label: 'Grade 7' },
        { value: 'grade-8', label: 'Grade 8' },
        { value: 'grade-9', label: 'Grade 9' },
        { value: 'grade-10', label: 'Grade 10' },
        { value: 'grade-11', label: 'Grade 11' },
        { value: 'grade-12', label: 'Grade 12' },
        { value: 'form-1', label: 'Form 1' },
        { value: 'form-2', label: 'Form 2' },
        { value: 'form-3', label: 'Form 3' },
        { value: 'form-4', label: 'Form 4' },
    ];

    // ── CONTEXT ──
    const LearnerContext = createContext(null);

    function LearnerProvider({ children }) {
        const [isLoggedIn, setIsLoggedIn] = useState(() => sessionStorage.getItem('learner_id') !== null);
        const [learner, setLearner] = useState(null);
        const [resources, setResources] = useState([]);
        const [progress, setProgress] = useState([]);
        const [favorites, setFavorites] = useState([]);
        const [studyPlans, setStudyPlans] = useState([]);
        const [notifications, setNotifications] = useState([]);
        const [loading, setLoading] = useState(true);
        const [activeTab, setActiveTab] = useState('dashboard');
        const [sidebarOpen, setSidebarOpen] = useState(false);
        const [notification, setNotification] = useState(null);
        const [debugInfo, setDebugInfo] = useState([]);

        const addDebug = (message, type = 'info') => {
            setDebugInfo(prev => [...prev, { message, type, timestamp: new Date().toLocaleTimeString() }]);
            console.log(message);
        };

        useEffect(() => {
            const learnerId = sessionStorage.getItem('learner_id');
            if (learnerId) loadLearnerData(learnerId);
            else setLoading(false);
        }, []);

        const showNotification = (msg, type = 'success') => {
            setNotification({ msg, type });
            setTimeout(() => setNotification(null), 4000);
        };

        const loadLearnerData = async (learnerId) => {
            setLoading(true);
            addDebug('📂 Loading learner data...', 'info');
            try {
                // Load learner profile
                const lRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${learnerId}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (lRes.ok) {
                    const data = await lRes.json();
                    if (data.length > 0) {
                        setLearner(data[0]);
                        sessionStorage.setItem('learner_name', data[0].full_name);
                        addDebug('✅ Learner loaded', 'success');
                    }
                } else {
                    addDebug(`⚠️ Failed to load learner: ${lRes.status}`, 'error');
                }

                // Load progress
                try {
                    const pRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_progress?learner_id=eq.${learnerId}&select=*`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (pRes.ok) {
                        const data = await pRes.json();
                        setProgress(data || []);
                        addDebug(`✅ Loaded ${data.length} progress records`, 'success');
                    }
                } catch (e) {
                    addDebug(`⚠️ Progress load error: ${e.message}`, 'warning');
                }

                // Load favorites
                try {
                    const fRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_favorites?learner_id=eq.${learnerId}&select=*`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (fRes.ok) {
                        const data = await fRes.json();
                        setFavorites(data || []);
                        addDebug(`✅ Loaded ${data.length} favorites`, 'success');
                    }
                } catch (e) {
                    addDebug(`⚠️ Favorites load error: ${e.message}`, 'warning');
                }

                // Load study plans
                try {
                    const sRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_study_plans?learner_id=eq.${learnerId}&select=*`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (sRes.ok) {
                        const data = await sRes.json();
                        setStudyPlans(data || []);
                        addDebug(`✅ Loaded ${data.length} study plans`, 'success');
                    }
                } catch (e) {
                    addDebug(`⚠️ Study plans load error: ${e.message}`, 'warning');
                }

                // Load notifications
                try {
                    const nRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_notifications?learner_id=eq.${learnerId}&order=created_at.desc&limit=10`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (nRes.ok) {
                        const data = await nRes.json();
                        setNotifications(data || []);
                        addDebug(`✅ Loaded ${data.length} notifications`, 'success');
                    }
                } catch (e) {
                    addDebug(`⚠️ Notifications load error: ${e.message}`, 'warning');
                }

                // Load resources
                try {
                    const rRes = await fetch(`${SUPABASE_URL}/rest/v1/resources?select=*&limit=20`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (rRes.ok) {
                        const data = await rRes.json();
                        setResources(data || []);
                        addDebug(`✅ Loaded ${data.length} resources`, 'success');
                    }
                } catch (e) {
                    addDebug(`⚠️ Resources load error: ${e.message}`, 'warning');
                }

            } catch (e) {
                console.error('Load error:', e);
                addDebug(`❌ Error loading data: ${e.message}`, 'error');
            }
            setLoading(false);
        };

        const logout = () => {
            sessionStorage.removeItem('learner_id');
            sessionStorage.removeItem('learner_name');
            setIsLoggedIn(false);
            setLearner(null);
            setDebugInfo([]);
            showNotification('Logged out successfully', 'success');
            setTimeout(() => { window.location.href = '/'; }, 500);
        };

        const refreshData = () => {
            const learnerId = sessionStorage.getItem('learner_id');
            if (learnerId) loadLearnerData(learnerId);
        };

        return (
            <LearnerContext.Provider value={{
                isLoggedIn, setIsLoggedIn,
                learner, setLearner,
                resources, setResources,
                progress, setProgress,
                favorites, setFavorites,
                studyPlans, setStudyPlans,
                notifications, setNotifications,
                loading, setLoading,
                activeTab, setActiveTab,
                sidebarOpen, setSidebarOpen,
                notification, showNotification,
                logout,
                refreshData,
                debugInfo,
                addDebug,
            }}>
                {children}
            </LearnerContext.Provider>
        );
    }

    function useLearner() {
        const context = useContext(LearnerContext);
        if (!context) throw new Error('useLearner must be used within LearnerProvider');
        return context;
    }

    // ── AUTH PAGE ──
    function AuthPage() {
        const { setIsLoggedIn, setLearner, showNotification, loadLearnerData, addDebug, debugInfo } = useLearner();
        const [isLogin, setIsLogin] = useState(true);
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [fullName, setFullName] = useState('');
        const [gradeLevel, setGradeLevel] = useState('');
        const [schoolName, setSchoolName] = useState('');
        const [parentPhone, setParentPhone] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [localDebug, setLocalDebug] = useState([]);

        const addLocalDebug = (message, type = 'info') => {
            setLocalDebug(prev => [...prev, { message, type, timestamp: new Date().toLocaleTimeString() }]);
            console.log(message);
            addDebug(message, type);
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            setError('');
            setLocalDebug([]);
            if (!email || !password) {
                setError('Please fill in all fields.');
                return;
            }
            setLoading(true);
            addLocalDebug(`🔑 Attempting login for: ${email}`, 'info');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?email=eq.${email}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                addLocalDebug(`📡 Login response: ${res.status}`, 'info');
                
                if (!res.ok) {
                    const errorText = await res.text();
                    addLocalDebug(`❌ Login failed: ${res.status} - ${errorText}`, 'error');
                    throw new Error(`Login failed (${res.status})`);
                }
                
                const data = await res.json();
                if (data.length === 0) {
                    addLocalDebug('❌ No account found with this email', 'error');
                    setError('No account found with this email.');
                    setLoading(false);
                    return;
                }
                const learner = data[0];
                if (learner.password !== password) {
                    addLocalDebug('❌ Password mismatch', 'error');
                    setError('Invalid password.');
                    setLoading(false);
                    return;
                }
                addLocalDebug('✅ Login successful!', 'success');
                sessionStorage.setItem('learner_id', learner.id);
                sessionStorage.setItem('learner_name', learner.full_name);
                setIsLoggedIn(true);
                setLearner(learner);
                await loadLearnerData(learner.id);
                showNotification(`Welcome back, ${learner.full_name}! 🎉`, 'success');
            } catch (e) {
                addLocalDebug(`❌ Login error: ${e.message}`, 'error');
                setError('Error logging in. Please try again.');
            }
            setLoading(false);
        };

        const handleSignup = async (e) => {
            e.preventDefault();
            setError('');
            setLocalDebug([]);
            
            if (!email || !password || !fullName || !gradeLevel) {
                setError('Please fill in all required fields.');
                return;
            }
            if (password.length < 6) {
                setError('Password must be at least 6 characters.');
                return;
            }
            
            setLoading(true);
            addLocalDebug(`📝 Creating account for: ${email}`, 'info');
            
            try {
                // Check if email exists
                addLocalDebug('🔍 Checking if email exists...', 'info');
                const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?email=eq.${email}&select=id`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (checkRes.ok) {
                    const existing = await checkRes.json();
                    if (existing.length > 0) {
                        addLocalDebug('❌ Email already registered', 'error');
                        setError('An account with this email already exists.');
                        setLoading(false);
                        return;
                    }
                } else {
                    addLocalDebug(`⚠️ Check email response: ${checkRes.status}`, 'warning');
                }

                const learnerData = {
                    email,
                    password,
                    full_name: fullName,
                    grade_level: gradeLevel,
                    school_name: schoolName || '',
                    parent_phone: parentPhone || '',
                    is_active: true,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };

                addLocalDebug(`📤 Sending signup data: ${JSON.stringify({ ...learnerData, password: '***' })}`, 'info');

                const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(learnerData)
                });

                addLocalDebug(`📡 Signup response: ${res.status}`, 'info');

                if (!res.ok) {
                    const errorText = await res.text();
                    addLocalDebug(`❌ Signup error: ${res.status} - ${errorText}`, 'error');
                    
                    // If it's a 401, it's likely RLS issue
                    if (res.status === 401) {
                        setError('Authentication error. Please contact support or try again later.');
                    } else {
                        throw new Error(`Signup failed (${res.status})`);
                    }
                    setLoading(false);
                    return;
                }

                const data = await res.json();
                const learner = data[0];
                
                if (!learner || !learner.id) {
                    addLocalDebug('❌ No learner returned from signup', 'error');
                    setError('Account created but no data returned. Please try logging in.');
                    setLoading(false);
                    return;
                }

                addLocalDebug('✅ Account created successfully!', 'success');
                sessionStorage.setItem('learner_id', learner.id);
                sessionStorage.setItem('learner_name', learner.full_name);
                setIsLoggedIn(true);
                setLearner(learner);
                await loadLearnerData(learner.id);
                showNotification(`Account created successfully! Welcome ${learner.full_name}! 🎉`, 'success');

            } catch (e) {
                addLocalDebug(`❌ Signup error: ${e.message}`, 'error');
                setError('Error creating account: ' + e.message);
            }
            setLoading(false);
        };

        return (
            <div className="auth-banner">
                <div className="container">
                    <div className="auth-box">
                        <div className="logo">
                            <div className="logo-text">Kenya<span>Vault</span></div>
                            <div className="logo-sub">Learner Account</div>
                        </div>
                        <div className="auth-tabs">
                            <button onClick={() => { setIsLogin(true); setError(''); setLocalDebug([]); }} className={`auth-tab ${isLogin ? 'active' : ''}`}>🔑 Login</button>
                            <button onClick={() => { setIsLogin(false); setError(''); setLocalDebug([]); }} className={`auth-tab ${!isLogin ? 'active' : ''}`}>📝 Sign Up</button>
                        </div>

                        {error && <div style={{ padding: '12px', background: '#fef2f2', borderRadius: '8px', color: '#dc2626', marginBottom: '16px', fontSize: '0.9rem' }}>{error}</div>}

                        {localDebug.length > 0 && (
                            <div className="debug-info" style={{ marginBottom: '16px' }}>
                                <strong>🔍 Debug:</strong>
                                {localDebug.map((d, i) => (
                                    <div key={i} className={d.type === 'error' ? 'error' : d.type === 'success' ? 'success' : ''}>
                                        [{d.timestamp}] {d.message}
                                    </div>
                                ))}
                            </div>
                        )}

                        {isLogin ? (
                            <form onSubmit={handleLogin}>
                                <div className="form-group">
                                    <label>Email Address <span className="req">*</span></label>
                                    <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="form-input" placeholder="your@email.com" required />
                                </div>
                                <div className="form-group">
                                    <label>Password <span className="req">*</span></label>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="form-input" placeholder="Enter your password" required />
                                </div>
                                <button type="submit" disabled={loading} className="btn-gold">
                                    {loading ? '⏳ Logging in...' : '🔑 Login'}
                                </button>
                                <div style={{ textAlign: 'center', marginTop: '12px' }}>
                                    <button type="button" className="btn-link" onClick={() => setIsLogin(false)}>Don't have an account? Sign up →</button>
                                </div>
                            </form>
                        ) : (
                            <form onSubmit={handleSignup}>
                                <div className="form-group">
                                    <label>Full Name <span className="req">*</span></label>
                                    <input type="text" value={fullName} onChange={(e) => setFullName(e.target.value)} className="form-input" placeholder="e.g., John Mwangi" required />
                                </div>
                                <div className="form-group">
                                    <label>Email Address <span className="req">*</span></label>
                                    <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="form-input" placeholder="your@email.com" required />
                                </div>
                                <div className="form-group">
                                    <label>Grade Level <span className="req">*</span></label>
                                    <select value={gradeLevel} onChange={(e) => setGradeLevel(e.target.value)} className="form-input" required>
                                        <option value="">Select your grade...</option>
                                        {GRADE_LEVELS.map(g => <option key={g.value} value={g.value}>{g.label}</option>)}
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label>School Name</label>
                                    <input type="text" value={schoolName} onChange={(e) => setSchoolName(e.target.value)} className="form-input" placeholder="e.g., Kenya High School" />
                                </div>
                                <div className="form-group">
                                    <label>Parent/Guardian Phone</label>
                                    <input type="tel" value={parentPhone} onChange={(e) => setParentPhone(e.target.value)} className="form-input" placeholder="0712 345 678" />
                                </div>
                                <div className="form-group">
                                    <label>Password <span className="req">*</span></label>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="form-input" placeholder="Min 6 characters" required />
                                </div>
                                <button type="submit" disabled={loading} className="btn-gold">
                                    {loading ? '⏳ Creating account...' : '📝 Create Account'}
                                </button>
                                <div style={{ textAlign: 'center', marginTop: '12px' }}>
                                    <button type="button" className="btn-link" onClick={() => setIsLogin(true)}>Already have an account? Login →</button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    // ── DASHBOARD (placeholder - reuse from previous implementation) ──
    function Dashboard() {
        const { learner, activeTab, setActiveTab, sidebarOpen, setSidebarOpen, logout, notifications } = useLearner();

        const menuItems = [
            { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
            { id: 'resources', icon: 'fa-book', label: 'My Resources' },
            { id: 'progress', icon: 'fa-chart-line', label: 'Progress' },
            { id: 'favorites', icon: 'fa-heart', label: 'Favorites' },
            { id: 'study-plan', icon: 'fa-calendar-check', label: 'Study Plan' },
            { id: 'notifications', icon: 'fa-bell', label: 'Notifications', badge: notifications.filter(n => !n.is_read).length },
            { id: 'profile', icon: 'fa-user', label: 'Profile' },
        ];

        return (
            <div className="dashboard-wrapper">
                {/* Sidebar */}
                <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                    <div className="sidebar-logo">
                        <div className="logo-text">Kenya<span>Vault</span></div>
                        <div className="logo-sub">Learner Dashboard</div>
                    </div>
                    <div className="sidebar-menu">
                        {menuItems.map(item => (
                            <button
                                key={item.id}
                                className={`menu-item ${activeTab === item.id ? 'active' : ''}`}
                                onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }}
                            >
                                <i className={`fas ${item.icon}`}></i>
                                <span>{item.label}</span>
                                {item.badge > 0 && <span className="badge">{item.badge}</span>}
                            </button>
                        ))}
                    </div>
                    <div className="sidebar-footer">
                        <div className="learner-info">
                            <div className="learner-avatar">
                                {learner?.full_name ? learner.full_name.charAt(0).toUpperCase() : 'L'}
                            </div>
                            <div>
                                <div className="learner-name">{learner?.full_name || 'Learner'}</div>
                                <div className="learner-grade">Grade {learner?.grade_level}</div>
                            </div>
                        </div>
                        <button onClick={logout} className="logout-btn" style={{ marginTop: '12px', width: '100%', padding: '8px 14px', borderRadius: '8px', color: '#ef4444', background: 'rgba(220,38,38,0.1)', border: 'none', cursor: 'pointer', fontWeight: '600', fontSize: '0.85rem' }}>
                            <i className="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>

                {/* Main Content */}
                <div className="main-content">
                    <div className="top-navbar">
                        <div className="topbar-left">
                            <button className="mobile-menu-toggle" onClick={() => setSidebarOpen(!sidebarOpen)}>
                                <i className="fas fa-bars"></i>
                            </button>
                            <span className="page-title">{menuItems.find(m => m.id === activeTab)?.label || 'Dashboard'}</span>
                        </div>
                        <div className="nav-actions">
                            <button onClick={() => setActiveTab('notifications')} style={{ position: 'relative', padding: '8px', borderRadius: '8px', border: '1px solid var(--border)', background: 'transparent', cursor: 'pointer' }}>
                                <i className="fas fa-bell" style={{ fontSize: '1.1rem' }}></i>
                                {notifications.filter(n => !n.is_read).length > 0 && (
                                    <span style={{ position: 'absolute', top: '-4px', right: '-4px', width: '18px', height: '18px', background: '#dc2626', color: '#fff', fontSize: '0.6rem', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                        {notifications.filter(n => !n.is_read).length}
                                    </span>
                                )}
                            </button>
                            <button onClick={() => setActiveTab('profile')} style={{ padding: '6px 12px', borderRadius: '8px', border: '1px solid var(--gold)', background: 'transparent', cursor: 'pointer', color: 'var(--gold)', fontWeight: '600', fontSize: '0.8rem' }}>
                                <i className="fas fa-user"></i>
                            </button>
                        </div>
                    </div>
                    <div className="page-content">
                        <div className="content-card">
                            <div style={{ display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap' }}>
                                <div style={{ width: '60px', height: '60px', borderRadius: '50%', background: 'var(--gold)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.8rem', color: '#fff' }}>
                                    {learner?.full_name ? learner.full_name.charAt(0).toUpperCase() : 'L'}
                                </div>
                                <div>
                                    <h2 style={{ fontFamily: 'Sora, sans-serif', fontWeight: 700, fontSize: '1.3rem' }}>
                                        👋 Welcome back, {learner?.full_name || 'Learner'}!
                                    </h2>
                                    <p style={{ color: 'var(--muted)', fontSize: '0.9rem' }}>
                                        Grade {learner?.grade_level} {learner?.school_name ? `• ${learner.school_name}` : ''}
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div className="stat-grid">
                            <div className="stat-card">
                                <div className="stat-number green">0</div>
                                <div className="stat-label">✅ Completed</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-number blue">0</div>
                                <div className="stat-label">📖 In Progress</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-number">0</div>
                                <div className="stat-label">❤️ Favorites</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-number">0</div>
                                <div className="stat-label">📋 Study Plans</div>
                            </div>
                        </div>
                        <p style={{ color: 'var(--muted)', textAlign: 'center', padding: '20px 0' }}>
                            🚀 Start exploring resources from the <a href="/shop.html" style={{ color: 'var(--gold)', fontWeight: '600' }}>KenyaVault Shop</a> to track your progress!
                        </p>
                    </div>
                </div>
            </div>
        );
    }

    // ── MAIN APP ──
    function App() {
        const { isLoggedIn, notification, debugInfo } = useLearner();

        const hasErrors = debugInfo.some(d => d.type === 'error');

        return (
            <div>
                {isLoggedIn ? <Dashboard /> : <AuthPage />}
                {hasErrors && (
                    <div className="debug-info" style={{ position: 'fixed', bottom: '80px', right: '24px', zIndex: 99998, maxWidth: '360px', background: 'rgba(0,0,0,0.85)', color: '#fff', padding: '12px 16px', borderRadius: '8px', fontSize: '0.75rem' }}>
                        <strong>⚠️ System Status:</strong>
                        {debugInfo.filter(d => d.type === 'error').map((d, i) => (
                            <div key={i} style={{ color: '#f87171' }}>[{d.timestamp}] {d.message}</div>
                        ))}
                        <div style={{ marginTop: '4px', color: '#9ca3af', fontSize: '0.65rem' }}>Check console for details</div>
                    </div>
                )}
                {notification && (
                    <div style={{ position: 'fixed', bottom: '24px', right: '24px', zIndex: 99999, background: notification.type === 'error' ? '#dc2626' : '#16a34a', color: '#fff', padding: '14px 20px', borderRadius: '12px', boxShadow: '0 8px 32px rgba(0,0,0,0.2)', display: 'flex', alignItems: 'center', gap: '10px', maxWidth: '360px' }}>
                        <span>{notification.type === 'error' ? '❌' : '✅'}</span>
                        <span>{notification.msg}</span>
                    </div>
                )}
            </div>
        );
    }

    // ── RENDER ──
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
        <LearnerProvider>
            <App />
        </LearnerProvider>
    );
</script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
