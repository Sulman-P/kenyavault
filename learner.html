<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learner Dashboard — KenyaVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ── ROOT VARIABLES ── */
        :root {
            --navy: #0a1a3a;
            --navy-light: #1a2a5a;
            --gold: #D4A017;
            --gold-light: #FCD34D;
            --gold-pale: #fdf2d6;
            --white: #FFFFFF;
            --off-white: #f8f9fc;
            --surface: #f1f3f7;
            --text: #0a1a3a;
            --muted: #4a5a7a;
            --border: #e2e6ee;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #2563eb;
            --purple: #7c3aed;
            --pink: #ec4899;
            --orange: #f59e0b;
            --teal: #14b8a6;
            --radius: 12px;
            --shadow-sm: 0 2px 8px rgba(10,26,58,0.06);
            --shadow-md: 0 4px 16px rgba(10,26,58,0.08);
            --shadow-lg: 0 8px 32px rgba(10,26,58,0.12);
            --transition: all 0.3s ease;
            --max-width: 1280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--off-white);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ── CONTAINER ── */
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 5%; }

        /* ── AUTH PAGES ── */
        .auth-banner {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .auth-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FCD34D' fill-opacity='0.04'%3E%3Cpath d='M40 20c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V24c0-2.2-1.8-4-4-4H40zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H40c-1.1 0-2-.9-2-2V24c0-1.1.9-2 2-2zM16 32c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V36c0-2.2-1.8-4-4-4H16zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H16c-1.1 0-2-.9-2-2V36c0-1.1.9-2 2-2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 80px 80px;
            pointer-events: none;
        }
        .auth-banner .container { position: relative; z-index: 1; width: 100%; max-width: 480px; }
        .auth-box {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
        }
        .auth-box .logo { text-align: center; margin-bottom: 24px; }
        .auth-box .logo .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--navy);
        }
        .auth-box .logo .logo-text span { color: var(--gold); }
        .auth-box .logo .logo-sub { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; }

        .auth-tabs {
            display: flex;
            gap: 0;
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px 20px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .auth-tab:hover { background: rgba(212, 160, 23, 0.08); }
        .auth-tab.active { background: var(--gold); color: var(--white); }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text);
            margin-bottom: 4px;
        }
        .form-group label .req { color: var(--red); }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--white);
            color: var(--text);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212,160,23,0.1);
        }
        .form-input.error { border-color: var(--red); background: #fef2f2; }

        .btn-gold {
            background: var(--gold);
            color: var(--white);
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gold:hover { background: #b8890f; transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-link { color: var(--gold); font-weight: 600; font-size: 0.85rem; background: none; border: none; cursor: pointer; transition: var(--transition); }
        .btn-link:hover { text-decoration: underline; }

        /* ── SUBSCRIPTION PLANS ── */
        .plans-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 12px 0;
        }
        .plan-card {
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--white);
        }
        .plan-card:hover { border-color: var(--gold); }
        .plan-card.selected {
            border-color: var(--gold);
            background: var(--gold-pale);
            box-shadow: 0 0 0 3px rgba(212,160,23,0.2);
        }
        .plan-card .plan-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 0.75rem; color: var(--text); }
        .plan-card .plan-price { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--gold); margin: 2px 0; }
        .plan-card .plan-price .currency { font-size: 0.7rem; }
        .plan-card .plan-duration { font-size: 0.6rem; color: var(--muted); }
        .plan-card .plan-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 99px;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--gold);
            color: var(--white);
            margin-top: 4px;
        }
        .plan-card .plan-badge.popular { background: var(--purple); }
        .plan-card .plan-badge.best { background: var(--green); }

        /* ── LEARNER DASHBOARD ── */
        .dashboard-wrapper { display: flex; min-height: 100vh; background: var(--off-white); }

        .sidebar {
            width: 260px;
            background: var(--navy);
            color: var(--white);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-logo {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        .sidebar-logo .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--white);
        }
        .sidebar-logo .logo-text span { color: var(--gold-light); }
        .sidebar-logo .logo-sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        .sidebar-menu { flex: 1; padding: 0 12px; }
        .sidebar-menu .menu-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.3);
            padding: 0 12px 8px;
        }
        .sidebar-menu .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
        }
        .sidebar-menu .menu-item:hover { background: rgba(255,255,255,0.06); color: var(--white); }
        .sidebar-menu .menu-item.active {
            background: rgba(212, 160, 23, 0.15);
            color: var(--gold-light);
            border-left: 3px solid var(--gold);
        }
        .sidebar-menu .menu-item i { width: 20px; font-size: 1rem; }
        .sidebar-menu .menu-item .badge {
            margin-left: auto;
            background: rgba(212, 160, 23, 0.2);
            color: var(--gold-light);
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-footer .learner-info { display: flex; align-items: center; gap: 12px; }
        .sidebar-footer .learner-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: var(--white);
        }
        .sidebar-footer .learner-name { font-weight: 600; font-size: 0.85rem; }
        .sidebar-footer .learner-grade { font-size: 0.7rem; color: rgba(255,255,255,0.4); }
        .sidebar-footer .subscription-status {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 99px;
            margin-top: 4px;
            display: inline-block;
        }
        .sidebar-footer .subscription-status.active { background: rgba(22, 163, 74, 0.2); color: #4ade80; }
        .sidebar-footer .subscription-status.expired { background: rgba(220, 38, 38, 0.2); color: #f87171; }
        .sidebar-footer .subscription-status.inactive { background: rgba(212, 160, 23, 0.2); color: var(--gold-light); }
        .sidebar-footer .subscription-status.pending { background: rgba(212, 160, 23, 0.2); color: var(--gold-light); }
        .sidebar-footer .logout-btn {
            width: 100%;
            padding: 8px 14px;
            border-radius: 8px;
            color: #ef4444;
            background: rgba(220,38,38,0.1);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 12px;
            transition: var(--transition);
        }
        .sidebar-footer .logout-btn:hover { background: rgba(220,38,38,0.2); }
        .sidebar-footer .subscribe-btn {
            width: 100%;
            padding: 8px 14px;
            border-radius: 8px;
            color: var(--white);
            background: var(--gold);
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 12px;
            transition: var(--transition);
        }
        .sidebar-footer .subscribe-btn:hover { background: #b8890f; }

        .main-content { flex: 1; margin-left: 260px; min-height: 100vh; }

        .top-navbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.9);
        }
        .top-navbar .page-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.1rem; }
        .top-navbar .nav-actions { display: flex; align-items: center; gap: 12px; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .mobile-menu-toggle {
            display: none;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--muted);
        }

        .page-content { padding: 24px 32px; }

        /* ── STAT CARDS ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-card .stat-number {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--gold);
        }
        .stat-card .stat-number.green { color: var(--green); }
        .stat-card .stat-number.blue { color: var(--blue); }
        .stat-card .stat-number.purple { color: var(--purple); }
        .stat-card .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

        /* ── WELCOME SECTION ── */
        .welcome-section {
            background: linear-gradient(135deg, var(--navy), var(--navy-light));
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            color: var(--white);
            border: 1px solid rgba(212,160,23,0.15);
        }
        .welcome-section .welcome-title {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .welcome-section .welcome-title span { color: var(--gold-light); }
        .welcome-section .welcome-sub { font-size: 0.9rem; color: rgba(255,255,255,0.7); }
        .welcome-section .welcome-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .welcome-section .welcome-stats .ws-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
        }
        .welcome-section .welcome-stats .ws-item .ws-number {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            color: var(--gold-light);
            font-size: 1.1rem;
        }

        /* ── CONTENT CARDS ── */
        .content-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .content-card .card-header h3 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }
        .content-card .card-header .btn-link-light {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.8rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .content-card .card-header .btn-link-light:hover { color: #b8890f; text-decoration: underline; }

        /* ── RESOURCE ITEMS ── */
        .resource-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
        }
        .resource-item:hover {
            background: var(--off-white);
            border-color: var(--gold);
            transform: translateX(4px);
        }
        .resource-item .info { flex: 1; min-width: 150px; }
        .resource-item .info .title {
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .resource-item .info .title .open-link {
            font-size: 0.65rem;
            color: var(--gold);
            background: var(--gold-pale);
            padding: 2px 10px;
            border-radius: 99px;
            font-weight: 600;
        }
        .resource-item .info .title .locked-link {
            font-size: 0.65rem;
            color: var(--red);
            background: #fee2e2;
            padding: 2px 10px;
            border-radius: 99px;
            font-weight: 600;
        }
        .resource-item .info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .resource-item .actions { display: flex; align-items: center; gap: 8px; }
        .resource-item .actions .btn-view {
            padding: 4px 14px;
            border-radius: 6px;
            background: var(--gold);
            color: var(--white);
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }
        .resource-item .actions .btn-view:hover { background: #b8890f; }
        .resource-item .actions .btn-view.locked { background: var(--surface); color: var(--muted); cursor: not-allowed; }
        .resource-item .actions .btn-fav {
            padding: 4px 8px;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            transition: var(--transition);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .resource-item .actions .btn-fav.active { color: var(--red); border-color: var(--red); }
        .resource-item .actions .btn-fav:hover { background: #fef2f2; }

        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.completed { background: #dcfce7; color: var(--green); }
        .status-badge.in-progress { background: #fef3c7; color: #d97706; }
        .status-badge.not-started { background: var(--surface); color: var(--muted); }
        .status-badge.locked { background: #fee2e2; color: var(--red); }

        .progress-bar {
            width: 80px;
            height: 6px;
            background: var(--surface);
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        /* ── RESOURCE VIEWER MODAL ── */
        .resource-viewer {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .resource-viewer.open { display: flex; }
        .resource-viewer .viewer-content {
            background: var(--white);
            border-radius: var(--radius);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .resource-viewer .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .resource-viewer .viewer-header h4 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }
        .resource-viewer .viewer-header .close-viewer {
            padding: 8px 12px;
            border-radius: 8px;
            background: #fef2f2;
            color: var(--red);
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .resource-viewer .viewer-header .close-viewer:hover { background: #fee2e2; }
        .resource-viewer .viewer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .resource-viewer .viewer-body .resource-preview {
            background: var(--surface);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            min-height: 200px;
        }
        .resource-viewer .viewer-body .resource-preview .preview-icon { font-size: 4rem; margin-bottom: 16px; }
        .resource-viewer .viewer-body .resource-preview h5 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .resource-viewer .viewer-body .resource-preview p { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
        .resource-viewer .viewer-body .resource-preview .btn-open-file {
            padding: 10px 24px;
            background: var(--gold);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .resource-viewer .viewer-body .resource-preview .btn-open-file:hover { background: #b8890f; }
        .resource-viewer .viewer-body .resource-preview .btn-open-file.locked {
            background: var(--surface);
            color: var(--muted);

        // ── STATE ──

        function showNotification(msg, type = 'success') {

        function isSubscriptionActive(learner) {
            if (!learner) return false;
            if (learner.subscription_tier === 'free' || !learner.subscription_tier) return false;
            if (learner.subscription_tier === 'pending') return false;
            if (!learner.subscription_expiry) return false;
            return new Date(learner.subscription_expiry) > new Date();
        }

        function getSubscriptionStatus(learner) {
            if (!learner) return 'inactive';
            if (learner.subscription_tier === 'free' || !learner.subscription_tier) return 'inactive';
            if (learner.subscription_tier === 'pending') return 'pending';
            if (!learner.subscription_expiry) return 'inactive';
            return new Date(learner.subscription_expiry) > new Date() ? 'active' : 'expired';
        }

        function getSubscriptionDaysRemaining(learner) {
            if (!learner || !learner.subscription_expiry) return 0;
            const diff = new Date(learner.subscription_expiry) - new Date();
            return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));

                chemistry: '⚗️',

        // ── DATA FUNCTIONS ──
        async function loadLearnerData(learnerId) {
            state.loading = true;
            render();

            try {
                // Load learner
                const lRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${learnerId}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (lRes.ok) {
                    const data = await lRes.json();
                    if (data.length > 0) {
                        state.learner = data[0];
                        sessionStorage.setItem('learner_name', data[0].full_name);
                    }
                }

                // Load resources, progress, favorites, study plans, notifications
                const [rRes, pRes, fRes, sRes, nRes] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/resources?select=*&order=created_at.desc`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    }),
                    fetch(`${SUPABASE_URL}/rest/v1/learner_progress?learner_id=eq.${learnerId}&select=*`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    }),
                    fetch(`${SUPABASE_URL}/rest/v1/learner_favorites?learner_id=eq.${learnerId}&select=*`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    }),
                    fetch(`${SUPABASE_URL}/rest/v1/learner_study_plans?learner_id=eq.${learnerId}&select=*`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    }),
                    fetch(`${SUPABASE_URL}/rest/v1/learner_notifications?learner_id=eq.${learnerId}&order=created_at.desc&limit=20`, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    })
                ]);

                if (rRes.ok) { const data = await rRes.json(); state.resources = data || []; }
                if (pRes.ok) { const data = await pRes.json(); state.progress = data || []; }
                if (fRes.ok) { const data = await fRes.json(); state.favorites = data || []; }
                if (sRes.ok) { const data = await sRes.json(); state.studyPlans = data || []; }
                if (nRes.ok) { const data = await nRes.json(); state.notifications = data || []; }

            } catch (e) {
                console.error('Load error:', e);
                showNotification('Error loading data: ' + e.message, 'error');
            }

            state.loading = false;
            render();
        }

        async function login(email, password) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?email=eq.${email}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (!res.ok) throw new Error(`Login failed (${res.status})`);
                const data = await res.json();
                if (data.length === 0) { showNotification('No account found with this email.', 'error'); return false; }
                const learner = data[0];
                if (learner.password !== password) { showNotification('Invalid password.', 'error'); return false; }
                
                sessionStorage.setItem('learner_id', learner.id);
                sessionStorage.setItem('learner_name', learner.full_name);
                state.isLoggedIn = true;
                state.learner = learner;
                await loadLearnerData(learner.id);
                showNotification(`Welcome back, ${learner.full_name}!`, 'success');
                return true;
            } catch (e) {
                showNotification('Login error: ' + e.message, 'error');
                return false;
            }
        }

        async function signup(data) {
            try {
                // Check existing
                const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?email=eq.${data.email}&select=id`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (checkRes.ok) {
                    const existing = await checkRes.json();
                    if (existing.length > 0) { showNotification('An account with this email already exists.', 'error'); return false; }
                }

                const learnerData = {
                    email: data.email,
                    password: data.password,
                    full_name: data.fullName,
                    grade_level: data.gradeLevel,
                    school_name: data.schoolName || '',
                    parent_phone: data.parentPhone || '',
                    subscription_tier: 'pending',
                    subscription_expiry: null,
                    is_active: true,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };

                const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(learnerData)
                });
                if (!res.ok) throw new Error(`Signup failed (${res.status})`);
                const result = await res.json();
                const learner = result[0];
                if (!learner || !learner.id) { throw new Error('No learner data returned'); }

                sessionStorage.setItem('learner_id', learner.id);
                sessionStorage.setItem('learner_name', learner.full_name);
                state.isLoggedIn = true;
                state.learner = learner;
                await loadLearnerData(learner.id);
                showNotification(`Account created! Welcome ${learner.full_name}!`, 'success');
                return true;
            } catch (e) {
                showNotification('Signup error: ' + e.message, 'error');
                return false;
            }
        }

        function refreshData() {

            if (learnerId) loadLearnerData(learnerId);
        }

        async function updateProgress(resourceId, status, progressPercent = null) {
            const learnerId = sessionStorage.getItem('learner_id');
            if (!learnerId) return;
            if (!isSubscriptionActive(state.learner)) {
                showNotification('Please subscribe to access resources', 'error');
                return;
            }
            const existing = state.progress.find(p => p.resource_id === resourceId);
            const data = {
                status: status,
                progress_percentage: progressPercent !== null ? progressPercent : (status === 'completed' ? 100 : 50),
                last_accessed: new Date().toISOString()
            };
            if (status === 'completed') data.completed_at = new Date().toISOString();
            if (status === 'in_progress' && !existing?.started_at) data.started_at = new Date().toISOString();
            try {
                let response;
                if (existing) {
                    response = await fetch(`${SUPABASE_URL}/rest/v1/learner_progress?id=eq.${existing.id}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                } else {
                    response = await fetch(`${SUPABASE_URL}/rest/v1/learner_progress`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify({ learner_id: learnerId, resource_id: resourceId, ...data })
                    });
                }
                if (response.ok) {
                    refreshData();
                    showNotification(`Progress updated: ${status.replace('-', ' ')}`, 'success');
                }
            } catch (e) {
                showNotification('Failed to update progress', 'error');
            }
        }

        async function toggleFavorite(resourceId) {
            const learnerId = sessionStorage.getItem('learner_id');
            if (!learnerId) return;
            const existing = state.favorites.find(f => f.resource_id === resourceId);
            try {
                if (existing) {
                    await fetch(`${SUPABASE_URL}/rest/v1/learner_favorites?id=eq.${existing.id}`, {
                        method: 'DELETE',
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    showNotification('Removed from favorites', 'info');
                } else {
                    await fetch(`${SUPABASE_URL}/rest/v1/learner_favorites`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ learner_id: learnerId, resource_id: resourceId })
                    });
                    showNotification('Added to favorites', 'success');
                }
                refreshData();
            } catch (e) {
                showNotification('Failed to update favorites', 'error');
            }
        }

        async function processPayment(planId, phoneNumber, customerName) {
            const learnerId = sessionStorage.getItem('learner_id');
            if (!learnerId) { showNotification('Please login first', 'error'); return false; }
            const plan = SUBSCRIPTION_PLANS.find(p => p.id === planId);
            if (!plan) { showNotification('Invalid plan selected', 'error'); return false; }
            state.isProcessing = true;
            render();

            try {
                let formattedPhone = phoneNumber.replace(/\s/g, '');
                if (formattedPhone.startsWith('0')) formattedPhone = '254' + formattedPhone.substring(1);
                if (formattedPhone.startsWith('+')) formattedPhone = formattedPhone.substring(1);
                if (formattedPhone.length === 9 && formattedPhone.startsWith('7')) formattedPhone = '254' + formattedPhone;

                const metadata = JSON.stringify({
                    learner_id: learnerId,
                    learner_name: customerName || state.learner?.full_name || 'Learner',
                    plan_id: planId,
                    plan_name: plan.label,
                    plan_price: plan.price,
                    plan_days: plan.days,
                    type: 'subscription',
                    action: 'activate_subscription'
                });

                const payUrl = `${MEGAPAY_PAYMENT_URL}?phone=${encodeURIComponent(formattedPhone)}&amount=${encodeURIComponent(plan.price)}&description=${encodeURIComponent(`KenyaVault Subscription: ${plan.label} Plan`)}&callback=${encodeURIComponent(`${SUPABASE_URL}/functions/v1/mpesa-webhook`)}&return_url=${encodeURIComponent(window.location.origin + '/learner.html?payment=success&plan=' + planId)}&metadata=${encodeURIComponent(metadata)}`;

                const paymentWindow = window.open(payUrl, '_blank', 'width=500,height=700,scrollbars=yes');
                if (!paymentWindow) {
                    showNotification('Please allow popups to complete payment', 'error');
                    state.isProcessing = false;
                    render();
                    return false;
                }

                showNotification('MegaPay opened. Check your phone for M-Pesa PIN.', 'success');

                let attempts = 0;
                const maxAttempts = 40;
                const checkPaymentStatus = setInterval(async () => {
                    attempts++;
                    try {
                        const statusRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${learnerId}&select=subscription_tier,subscription_expiry`, {
                            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                        });
                        if (statusRes.ok) {
                            const data = await statusRes.json();
                            if (data.length > 0) {
                                const currentLearner = data[0];
                                if (currentLearner.subscription_tier === planId && currentLearner.subscription_expiry && new Date(currentLearner.subscription_expiry) > new Date()) {
                                    clearInterval(checkPaymentStatus);
                                    state.isProcessing = false;
                                    showNotification(`Payment confirmed! ${plan.label} subscription activated.`, 'success');
                                    refreshData();
                                    state.showPaymentModal = false;
                                    state.showSubscribeModal = false;
                                    render();
                                    if (paymentWindow && !paymentWindow.closed) paymentWindow.close();
                                    return;
                                }
                            }
                        }
                    } catch (e) {}
                    if (attempts >= maxAttempts) {
                        clearInterval(checkPaymentStatus);
                        state.isProcessing = false;
                        render();
                        showNotification('Payment taking longer than expected. Check your M-Pesa.', 'info');
                    }
                }, 3000);
                return true;
            } catch (e) {
                showNotification('Payment failed: ' + e.message, 'error');
                state.isProcessing = false;
                render();
                return false;
            }
        }

                        <div class="empty-state">
                            <div class="empty-icon">❤️</div>
                            <h4>No favorites yet</h4>
                            <p>${isSubscribed ? "You haven't added any favorites yet. ❤️ resources to save them here!" : 'Subscribe to save your favorite resources.'}</p>
                            ${!isSubscribed ? `<button class="btn-gold" style="width:auto;padding:10px 24px;margin-top:12px;" onclick="openSubscribeModal()">Subscribe Now</button>` : ''}
                        </div>
                    ` : favoriteResources.map(f => {
                        const isLocked = !isSubscribed;
                        return `
                            <div class="resource-item" onclick="openResource('${f.resource_id}')">
                                <div class="info">
                                    <div class="title">
                                        ${f.resource.title}
                                        ${!isLocked ? `<span class="open-link">Unlocked</span>` : `<span class="locked-link">Locked</span>`}
                                    </div>
                                    <div class="meta">
                                        <span>${f.resource.level}</span>
                                        <span>${f.resource.subject}</span>
                                    </div>
                                </div>
                                <div class="actions">
                                    <button class="btn-fav active" onclick="event.stopPropagation();toggleFavorite('${f.resource_id}')">
                                        <i class="fas fa-heart"></i>
                                    </button>
                                    <button class="btn-view ${isLocked ? 'locked' : ''}" onclick="event.stopPropagation();openResource('${f.resource_id}')">
                                        ${isLocked ? 'Locked' : 'View'}
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderNotificationsTab() {
            return `
                <div class="content-card">
                    <div class="card-header">
                        <h3>Notifications</h3>
                        <button class="btn-link-light" onclick="markAllNotificationsRead()">Mark All Read</button>
                    </div>
                    ${state.notifications.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-icon">🔕</div>
                            <h4>No notifications</h4>
                            <p>Stay tuned for updates!</p>
                        </div>
                    ` : state.notifications.map(n => `
                        <div class="resource-item" style="opacity:${n.is_read ? 0.6 : 1};">
                            <div class="info">
                                <div class="title">
                                    ${n.title || 'Notification'}
                                    ${!n.is_read ? `<span class="open-link" style="background:#dbeafe;color:#2563eb;">New</span>` : ''}
                                </div>
                                <div class="meta">
                                    <span>${n.message}</span>
                                    <span>${new Date(n.created_at).toLocaleDateString()}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderProfileTab() {
            const learner = state.learner;
            if (!learner) return '<div class="content-card"><p>Please login to view your profile.</p></div>';

            return `
                <div class="content-card">
                    <div class="card-header">
                        <h3>Your Profile</h3>
                    </div>
                    <div style="max-width:500px;">
                        <div class="form-group">
                            <label>Full Name <span class="req">*</span></label>
                            <input type="text" id="profileName" class="form-input" value="${learner.full_name || ''}" />
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-input" value="${learner.email || ''}" disabled style="background:var(--surface);" />
                        </div>
                        <div class="form-group">
                            <label>Grade Level <span class="req">*</span></label>
                            <select id="profileGrade" class="form-input">
                                <option value="">Select your grade...</option>
                                ${GRADE_LEVELS.map(g => `<option value="${g.value}" ${learner.grade_level === g.value ? 'selected' : ''}>${g.label}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>School Name</label>
                            <input type="text" id="profileSchool" class="form-input" value="${learner.school_name || ''}" placeholder="e.g., Kenya High School" />
                        </div>
                        <div class="form-group">
                            <label>Parent/Guardian Phone</label>
                            <input type="tel" id="profilePhone" class="form-input" value="${learner.parent_phone || ''}" placeholder="0712 345 678" />
                        </div>
                        <button class="btn-gold" onclick="updateProfile()">Save Changes</button>
                    </div>
                </div>
            `;
        }

        function renderResourceViewer() {
            if (!state.selectedResource) return '';

            const resource = state.selectedResource;
            const isSubscribed = isSubscriptionActive(state.learner);
            const currentProgress = state.progress.find(p => p.resource_id === resource.id);
            const isCompleted = currentProgress?.status === 'completed';
            const progressPercent = currentProgress?.progress_percentage || 0;

            return `
                <div class="resource-viewer open" onclick="closeResourceViewer(event)">
                    <div class="viewer-content" onclick="event.stopPropagation()">
                        <div class="viewer-header">
                            <h4>${getSubjectIcon(resource.subject)} ${resource.title}</h4>
                            <button class="close-viewer" onclick="closeResourceViewer()">Close</button>
                        </div>
                        <div class="viewer-body">
                            <div class="resource-preview">
                                <div class="preview-icon">${getSubjectIcon(resource.subject)}</div>
                                <h5>${resource.title}</h5>
                                <p>${resource.level} • ${resource.subject} • ${resource.price === 0 ? 'FREE' : 'KES ' + resource.price}</p>
                                ${resource.description ? `<p style="color:var(--muted);font-size:0.9rem;max-width:600px;margin:0 auto 16px;">${resource.description}</p>` : ''}
                                ${!isSubscribed ? `
                                    <div class="subscription-required">
                                        <h6>Subscription Required</h6>
                                        <p>Please subscribe to access this resource.</p>
                                        <button class="btn-open-file" style="margin-top:12px;background:var(--purple);" onclick="closeResourceViewer();openSubscribeModal();">Subscribe Now</button>
                                    </div>
                                ` : `
                                    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                                        <button class="btn-open-file" onclick="openResourceFile('${resource.id}')">Open Resource</button>
                                        ${resource.file_url ? `<button class="btn-open-file" style="background:var(--blue);" onclick="downloadResourceFile('${resource.id}')">Download</button>` : ''}
                                    </div>
                                `}
                            </div>
                        </div>
                        <div class="viewer-footer">
                            <div class="progress-section">
                                <span class="progress-label">Progress:</span>
                                <div class="progress-bar" style="width:120px;">
                                    <div class="progress-fill" style="width:${progressPercent}%;"></div>
                                </div>
                                <span style="font-size:0.8rem;color:var(--muted);">${progressPercent}%</span>
                                <span class="status-badge ${isCompleted ? 'completed' : 'in-progress'}">
                                    ${isCompleted ? 'Completed' : 'In Progress'}
                                </span>
                            </div>
                            <button class="btn-mark-complete ${isCompleted ? 'completed' : ''} ${!isSubscribed ? 'locked' : ''}" onclick="toggleResourceComplete('${resource.id}')" ${!isSubscribed ? 'disabled' : ''}>
                                ${isCompleted ? 'Mark as Incomplete' : 'Mark as Complete'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSubscribeModal() {
            if (!state.showSubscribeModal) return '';

            const plansHTML = SUBSCRIPTION_PLANS.map(plan => `
                <div class="plan-card ${state.selectedPlan === plan.id ? 'selected' : ''}" onclick="selectPlan('${plan.id}')">
                    <div class="plan-name">${plan.label}</div>
                    <div class="plan-price"><span class="currency">KES</span> ${plan.price.toLocaleString()}</div>
                    <div class="plan-duration">${plan.duration}</div>
                    ${plan.badge ? `<div class="plan-badge ${plan.badgeClass}">${plan.badge}</div>` : ''}
                </div>
            `).join('');

            return `
                <div class="resource-viewer open" onclick="closeSubscribeModal(event)">
                    <div class="viewer-content" style="max-width:600px;" onclick="event.stopPropagation()">
                        <div class="viewer-header">
                            <h4>Choose Your Plan</h4>
                            <button class="close-viewer" onclick="closeSubscribeModal()">Close</button>
                        </div>
                        <div class="viewer-body">
                            <div style="text-align:center;margin-bottom:20px;">
                                <p style="color:var(--muted);">Select a subscription plan and complete payment via M-PESA to unlock all resources.</p>
                            </div>
                            <div class="plans-grid">${plansHTML}</div>
                            <div style="margin-top:16px;padding:12px;background:var(--surface);border-radius:8px;">
                                <p style="font-size:0.8rem;color:var(--muted);text-align:center;">
                                    Pay via M-PESA STK Push. You'll receive a prompt on your phone.<br />
                                    <span style="font-size:0.7rem;">Secure payment powered by MegaPay.</span>
                                </p>
                            </div>
                        </div>
                        <div class="viewer-footer" style="justify-content:center;">
                            <button class="btn-gold" style="width:auto;padding:12px 40px;" onclick="proceedToPayment()" ${state.isProcessing ? 'disabled' : ''}>
                                ${state.isProcessing ? 'Processing...' : 'Continue to Payment'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPaymentModal() {
            if (!state.showPaymentModal) return '';
            
            const plan = SUBSCRIPTION_PLANS.find(p => p.id === state.selectedPlan);
            if (!plan) return '';

            return `
                <div class="payment-modal open" onclick="closePaymentModal(event)">
                    <div class="payment-content" onclick="event.stopPropagation()">
                        <h3>Complete Payment</h3>
                        <p style="text-align:center;color:var(--muted);font-size:0.85rem;">You'll receive an M-PESA STK Push prompt on your phone.</p>
                        <div class="payment-details">
                            <div class="plan-name">${plan.label} Plan</div>
                            <div class="plan-price">KES ${plan.price.toLocaleString()}</div>
                            <div class="plan-duration">${plan.duration} access</div>
                        </div>
                        <div class="payment-form">
                            <div class="form-group">
                                <label>Full Name <span class="req">*</span></label>
                                <input type="text" id="paymentName" class="form-input" value="${state.learner?.full_name || ''}" placeholder="Enter your full name" />
                            </div>
                            <div class="form-group">
                                <label>Safaricom Phone Number <span class="req">*</span></label>
                                <input type="tel" id="paymentPhone" class="form-input" value="${state.learner?.parent_phone || ''}" placeholder="0712 345 678" />
                                <span style="font-size:0.65rem;color:var(--muted);">You'll receive an M-PESA STK Push prompt on this number.</span>
                            </div>
                        </div>
                        <div class="payment-actions">
                            <button class="btn-cancel" onclick="closePaymentModal()">Cancel</button>
                            <button class="btn-pay" onclick="handlePayment()" ${state.isProcessing ? 'disabled' : ''}>
                                ${state.isProcessing ? 'Processing...' : `Pay KES ${plan.price}`}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ── GLOBAL FUNCTIONS ──
        window.showLoginForm = function() {
            document.getElementById('authContent').innerHTML = renderLoginForm();
        };

        window.showSignupForm = function() {
            document.getElementById('authContent').innerHTML = renderSignupForm();
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            await login(email, password);
        };

        window.handleSignup = async function(e) {
            e.preventDefault();
            const data = {
                email: document.getElementById('signupEmail').value,
                password: document.getElementById('signupPassword').value,
                fullName: document.getElementById('signupName').value,
                gradeLevel: document.getElementById('signupGrade').value,
                schoolName: document.getElementById('signupSchool').value,
                parentPhone: document.getElementById('signupPhone').value,
            };
            await signup(data);
        };

        window.selectPlan = function(planId) {
            state.selectedPlan = planId;
            render();
        };

        window.openSubscribeModal = function() {
            state.showSubscribeModal = true;
            state.showPaymentModal = false;
            render();
        };

        window.closeSubscribeModal = function(e) {
            if (e && e.target !== e.currentTarget) return;
            state.showSubscribeModal = false;
            render();
        };

        window.proceedToPayment = function() {
            state.showSubscribeModal = false;
            state.showPaymentModal = true;
            render();
        };

        window.closePaymentModal = function(e) {
            if (e && e.target !== e.currentTarget) return;
            state.showPaymentModal = false;
            render();
        };

        window.handlePayment = async function() {
            const name = document.getElementById('paymentName').value;
            const phone = document.getElementById('paymentPhone').value;
            if (!phone || phone.length < 9) {
                showNotification('Please enter a valid phone number', 'error');
                return;
            }
            await processPayment(state.selectedPlan, phone, name);
        };

        window.setActiveTab = function(tab) {
            state.activeTab = tab;
            state.sidebarOpen = false;
            render();
        };

        window.toggleSidebar = function() {
            state.sidebarOpen = !state.sidebarOpen;
            render();
        };

        window.handleLogout = function() {
            if (confirm('Are you sure you want to logout?')) {
                logout();
            }
        };

        window.openResource = function(resourceId) {
            const resource = state.resources.find(r => r.id === resourceId);
            if (resource) {
                state.selectedResource = resource;
                render();
            }
        };

        window.closeResourceViewer = function(e) {
            if (e && e.target !== e.currentTarget) return;
            state.selectedResource = null;
            render();
        };

        window.toggleResourceComplete = function(resourceId) {
            const isSubscribed = isSubscriptionActive(state.learner);
            if (!isSubscribed) {
                showNotification('Please subscribe to access resources', 'error');
                return;
            }
            const current = state.progress.find(p => p.resource_id === resourceId);
            const status = current?.status === 'completed' ? 'in_progress' : 'completed';
            updateProgress(resourceId, status);
        };

        window.openResourceFile = function(resourceId) {
            const resource = state.resources.find(r => r.id === resourceId);
            if (!resource) return;
            const isSubscribed = isSubscriptionActive(state.learner);
            if (!isSubscribed) {
                showNotification('Please subscribe to access this resource', 'error');
                return;
            }
            if (resource.file_url) {
                window.open(resource.file_url, '_blank');
                updateProgress(resourceId, 'in_progress', 50);
            } else {
                showNotification('No file available for this resource', 'info');
            }
        };

        window.downloadResourceFile = function(resourceId) {
            const resource = state.resources.find(r => r.id === resourceId);
            if (!resource) return;
            const isSubscribed = isSubscriptionActive(state.learner);
            if (!isSubscribed) {
                showNotification('Please subscribe to access this resource', 'error');
                return;
            }
            if (resource.file_url) {
                const link = document.createElement('a');
                link.href = resource.file_url;
                link.download = resource.file_name || `${resource.title}.pdf`;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                updateProgress(resourceId, 'in_progress', 50);
            } else {
                showNotification('No file available for download', 'info');
            }
        };

        window.toggleFavorite = function(resourceId) {
            toggleFavorite(resourceId);
        };

        window.markAllNotificationsRead = async function() {
            const unreadIds = state.notifications.filter(n => !n.is_read).map(n => n.id);
            if (unreadIds.length === 0) return;
            for (const id of unreadIds) {
                await fetch(`${SUPABASE_URL}/rest/v1/learner_notifications?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ is_read: true })
                });
            }
            refreshData();
        };

        window.updateProfile = async function() {
            const learner = state.learner;
            if (!learner) return;
            
            const name = document.getElementById('profileName').value;
            const grade = document.getElementById('profileGrade').value;
            const school = document.getElementById('profileSchool').value;
            const phone = document.getElementById('profilePhone').value;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${learner.id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: name,
                        grade_level: grade,
                        school_name: school,
                        parent_phone: phone,
                        updated_at: new Date().toISOString()
                    })
                });
                if (res.ok) {
                    showNotification('Profile updated successfully', 'success');
                    refreshData();
                } else {
                    showNotification('Failed to update profile', 'error');
                }
            } catch (e) {
                showNotification('Error updating profile', 'error');
            }
        };

        // ── MAIN RENDER ──
        function render() {
            const isLoggedIn = state.isLoggedIn || sessionStorage.getItem('learner_id') !== null;

            if (state.loading) {
                root.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner-content">
                            <div class="spinner-icon">📚</div>
                            <div style="font-size:1.2rem;font-weight:600;color:var(--text);">Loading KenyaVault...</div>
                            <div style="margin-top:12px;width:200px;height:4px;background:var(--surface);border-radius:99px;overflow:hidden;margin:12px auto;">
                                <div style="width:50%;height:100%;background:var(--gold);border-radius:99px;animation:pulse 1.5s ease-in-out infinite;"></div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            let html = '';
            if (isLoggedIn && state.learner) {
                html = renderDashboard();
            } else {
                html = renderAuthPage();
            }

            // Toast notification
            if (state.notification) {
                const toastHTML = `
                    <div class="toast-container">
                        <div class="toast ${state.notification.type}">${state.notification.msg}</div>
                    </div>
                `;
                // Only add toast if not already present
                if (!html.includes('toast-container')) {
                    html += toastHTML;
                }
            }

            root.innerHTML = html;
        }

        // ── INIT ──
        (function init() {
            const learnerId = sessionStorage.getItem('learner_id');
            if (learnerId) {
                state.isLoggedIn = true;
                loadLearnerData(learnerId);
            } else {
                state.loading = false;
                render();
            }
        })();

        // Handle payment callback
        (function checkPaymentCallback() {
            const params = new URLSearchParams(window.location.search);
            const paymentStatus = params.get('payment');
            const plan = params.get('plan');
            if (paymentStatus === 'success' && plan) {
                showNotification(`Payment successful! ${plan} plan activated.`, 'success');
                refreshData();
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        })();
    </script>
</body>
</html>
