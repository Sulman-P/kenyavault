                                        {p.resource?.title || 'Unknown Resource'}
                                    </div>
                                    <div className="meta">
                                        <span>📚 {p.resource?.level}</span>
                                        <span>📖 {p.resource?.subject}</span>
                                        <span className={`status-badge ${p.status}`}>
                                            {p.status === 'completed' ? '✅ Completed' : 
                                             p.status === 'in_progress' ? '📖 In Progress' : '⏳ Not Started'}
                                        </span>
                                    </div>
                                </div>
                                <div className="actions">
                                    <div className="progress-bar" style={{ width: '100px' }}>
                                        <div className="progress-fill" style={{ width: `${p.progress_percentage || 0}%` }}></div>
                                    </div>
                                    <span style={{ fontSize: '0.75rem', color: 'var(--muted)' }}>{p.progress_percentage || 0}%</span>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        // ── FAVORITES TAB ──
        function FavoritesTab({ setSelectedResource, isSubscribed }) {
            const { favorites, resources, toggleFavorite } = useLearner();

            const favoriteResources = favorites.map(f => {
                const resource = resources.find(r => r.id === f.resource_id);
                return { ...f, resource };
            }).filter(f => f.resource);

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>❤️ Your Favorites</h3>
                    </div>
                    {favoriteResources.length === 0 ? (
                        <p style={{ color: 'var(--muted)', textAlign: 'center', padding: '20px 0' }}>
                            {isSubscribed ? "You haven't added any favorites yet. ❤️ resources to save them here!" : 'Subscribe to save your favorite resources.'}
                        </p>
                    ) : (
                        favoriteResources.map(f => (
                            <div key={f.id} className="resource-item" onClick={() => setSelectedResource(f.resource)}>
                                <div className="info">
                                    <div className="title">
                                        {f.resource.title}
                                        {isSubscribed && <span className="open-link">🔓 Unlocked</span>}
                                        {!isSubscribed && <span className="open-link" style={{ background: '#fee2e2', color: '#dc2626' }}>🔒 Locked</span>}
                                    </div>
                                    <div className="meta">
                                        <span>📚 {f.resource.level}</span>
                                        <span>📖 {f.resource.subject}</span>
                                        <span>📄 {f.resource.type || 'Resource'}</span>
                                    </div>
                                </div>
                                <div className="actions">
                                    <button 
                                        className="btn-fav active"
                                        onClick={(e) => { e.stopPropagation(); toggleFavorite(f.resource_id); }}
                                    >
                                        <i className="fas fa-heart"></i>
                                    </button>
                                    <button 
                                        className={`btn-view ${!isSubscribed ? 'locked' : ''}`}
                                        onClick={(e) => { e.stopPropagation(); setSelectedResource(f.resource); }}
                                    >
                                        {isSubscribed ? '📖 View' : '🔒 Locked'}
                                    </button>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        // ── STUDY PLAN TAB ──
        function StudyPlanTab({ setSelectedResource }) {
            const { studyPlans, resources, isSubscriptionActive, learner } = useLearner();
            const isSubscribed = isSubscriptionActive(learner);

            const plansWithResources = studyPlans.map(sp => {
                const resource = resources.find(r => r.id === sp.resource_id);
                return { ...sp, resource };
            }).filter(sp => sp.resource);

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>📅 Your Study Plan</h3>
                        <button className="btn-link" onClick={() => alert('Study plan feature coming soon!')}>
                            <i className="fas fa-plus"></i> Add Plan
                        </button>
                    </div>
                    {!isSubscribed ? (
                        <div style={{ textAlign: 'center', padding: '20px 0' }}>
                            <p style={{ color: 'var(--muted)', marginBottom: '12px' }}>
                                Subscribe to create and manage your study plan.
                            </p>
                            <button 
                                className="btn-gold" 
                                style={{ width: 'auto', padding: '10px 24px' }}
                                onClick={() => {
                                    const subscribeBtn = document.querySelector('.subscribe-btn');
                                    if (subscribeBtn) subscribeBtn.click();
                                }}
                            >
                                💳 Subscribe Now
                            </button>
                        </div>
                    ) : plansWithResources.length === 0 ? (
                        <p style={{ color: 'var(--muted)', textAlign: 'center', padding: '20px 0' }}>
                            No study plans yet. Create your first study plan to stay organized!
                        </p>
                    ) : (
                        plansWithResources.map(plan => (
                            <div key={plan.id} className="resource-item" onClick={() => setSelectedResource(plan.resource)}>
                                <div className="info">
                                    <div className="title">
                                        {plan.resource?.title || 'Unknown Resource'}
                                        <span className="open-link">
                                            {plan.priority === 'high' && '🔴 High Priority'}
                                            {plan.priority === 'medium' && '🟡 Medium Priority'}
                                            {plan.priority === 'low' && '🟢 Low Priority'}
                                        </span>
                                    </div>
                                    <div className="meta">
                                        <span>📚 {plan.resource?.level}</span>
                                        <span>📖 {plan.resource?.subject}</span>
                                        {plan.target_date && <span>📅 Target: {new Date(plan.target_date).toLocaleDateString()}</span>}
                                    </div>
                                </div>
                                <div className="actions">
                                    <button 
                                        className="btn-view"
                                        onClick={(e) => { e.stopPropagation(); setSelectedResource(plan.resource); }}
                                    >
                                        📖 View
                                    </button>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        // ── NOTIFICATIONS TAB ──
        function NotificationsTab() {
            const { notifications, refreshData } = useLearner();

            const markAllRead = async () => {
                const unreadIds = notifications.filter(n => !n.is_read).map(n => n.id);
                if (unreadIds.length === 0) return;

                for (const id of unreadIds) {
                    await fetch(`${SUPABASE_URL}/rest/v1/learner_notifications?id=eq.${id}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ is_read: true })
                    });
                }
                refreshData();
            };

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>🔔 Notifications</h3>
                        <button className="btn-link" onClick={markAllRead}>
                            Mark All Read
                        </button>
                    </div>
                    {notifications.length === 0 ? (
                        <p style={{ color: 'var(--muted)', textAlign: 'center', padding: '20px 0' }}>
                            No notifications yet. Stay tuned for updates!
                        </p>
                    ) : (
                        notifications.map(n => (
                            <div key={n.id} className="resource-item" style={{ opacity: n.is_read ? 0.6 : 1 }}>
                                <div className="info">
                                    <div className="title">
                                        {n.title || 'Notification'}
                                        {!n.is_read && <span className="open-link" style={{ background: '#dbeafe', color: '#2563eb' }}>New</span>}
                                    </div>
                                    <div className="meta">
                                        <span>{n.message}</span>
                                        <span>📅 {new Date(n.created_at).toLocaleDateString()}</span>
                                    </div>
                                </div>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        // ── PROFILE TAB ──
        function ProfileTab() {
            const { learner, refreshData, showNotification } = useLearner();

            const [name, setName] = useState(learner?.full_name || '');
            const [grade, setGrade] = useState(learner?.grade_level || '');
            const [school, setSchool] = useState(learner?.school_name || '');
            const [phone, setPhone] = useState(learner?.parent_phone || '');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (learner) {
                    setName(learner.full_name || '');
                    setGrade(learner.grade_level || '');
                    setSchool(learner.school_name || '');
                    setPhone(learner.parent_phone || '');
                }
            }, [learner]);

            const handleUpdate = async () => {
                if (!learner) return;
                setLoading(true);
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${learner.id}`, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            full_name: name,
                            grade_level: grade,
                            school_name: school,
                            parent_phone: phone,
                            updated_at: new Date().toISOString()
                        })
                    });
                    if (res.ok) {
                        showNotification('Profile updated successfully ✅', 'success');
                        refreshData();
                    } else {
                        showNotification('Failed to update profile', 'error');
                    }
                } catch (e) {
                    showNotification('Error updating profile', 'error');
                }
                setLoading(false);
            };

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>👤 Your Profile</h3>
                    </div>
                    <div style={{ maxWidth: '500px' }}>
                        <div className="form-group">
                            <label>Full Name <span className="req">*</span></label>
                            <input type="text" className="form-input" value={name} onChange={(e) => setName(e.target.value)} />
                        </div>
                        <div className="form-group">
                            <label>Email</label>
                            <input type="email" className="form-input" value={learner?.email || ''} disabled style={{ background: 'var(--surface)' }} />
                        </div>
                        <div className="form-group">
                            <label>Grade Level <span className="req">*</span></label>
                            <select className="form-input" value={grade} onChange={(e) => setGrade(e.target.value)}>
                                <option value="">Select your grade...</option>
                                {GRADE_LEVELS.map(g => <option key={g.value} value={g.value}>{g.label}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label>School Name</label>
                            <input type="text" className="form-input" value={school} onChange={(e) => setSchool(e.target.value)} placeholder="e.g., Kenya High School" />
                        </div>
                        <div className="form-group">
                            <label>Parent/Guardian Phone</label>
                            <input type="tel" className="form-input" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="0712 345 678" />
                        </div>
                        <button className="btn-gold" onClick={handleUpdate} disabled={loading}>
                            {loading ? '⏳ Saving...' : '💾 Save Changes'}
                        </button>
                    </div>
                </div>
            );
        }

        // ── TOAST NOTIFICATION ──
        function ToastContainer() {
            const { notification } = useLearner();
            if (!notification) return null;
            return (
                <div className="toast-container">
                    <div className={`toast ${notification.type}`}>
                        <span>{notification.msg}</span>
                    </div>
                </div>
            );
        }

        // ── APP ──
        function App() {
            const { isLoggedIn, loading } = useLearner();

            if (loading) {
                return (
                    <div className="loading-spinner">
                        <div className="spinner-content">
                            <div className="spinner-icon">📚</div>
                            <div style={{ fontSize: '1.2rem', fontWeight: '600', color: 'var(--text)' }}>Loading KenyaVault...</div>
                            <div style={{ marginTop: '12px', width: '200px', height: '4px', background: 'var(--surface)', borderRadius: '99px', overflow: 'hidden', margin: '12px auto' }}>
                                <div style={{ width: '50%', height: '100%', background: 'var(--gold)', borderRadius: '99px', animation: 'pulse 1.5s ease-in-out infinite' }}></div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <>
                    {isLoggedIn ? <Dashboard /> : <AuthPage />}
                    <ToastContainer />
                </>
            );
        }

        // ── RENDER ──
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(
                <LearnerProvider>
                    <App />
                </LearnerProvider>
            );
        } catch (error) {
            console.error('Render error:', error);
            document.getElementById('root').innerHTML = `
                <div style="padding: 40px; text-align: center; background: #fef2f2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div style="font-size: 3rem; margin-bottom: 16px;">⚠️</div>
                    <h2 style="color: #dc2626; margin-bottom: 8px;">Something went wrong</h2>
                    <p style="color: #4a5a7a; max-width: 500px;">${error.message}</p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 24px; background: var(--gold); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Refresh Page</button>
                </div>
            `;
        }
    </script>
</body>
</html>
