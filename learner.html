<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learner Account — KenyaVault</title>
    
    <!-- Load React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ── ROOT VARIABLES ── */
        :root {
            --navy: #0a1a3a;
            --navy-light: #1a2a5a;
            --gold: #D4A017;
            --gold-light: #FCD34D;
            --gold-pale: #fdf2d6;
            --white: #FFFFFF;
            --off-white: #f8f9fc;
            --surface: #f1f3f7;
            --text: #0a1a3a;
            --muted: #4a5a7a;
            --border: #e2e6ee;
            --green: #16a34a;
            --red: #dc2626;
            --blue: #2563eb;
            --purple: #7c3aed;
            --radius: 12px;
            --shadow-sm: 0 2px 8px rgba(10,26,58,0.06);
            --shadow-md: 0 4px 16px rgba(10,26,58,0.08);
            --shadow-lg: 0 8px 32px rgba(10,26,58,0.12);
            --transition: all 0.3s ease;
            --max-width: 1280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--off-white);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }

        /* ── CONTAINER ── */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 5%;
        }

        /* ── AUTH PAGES ── */
        .auth-banner {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .auth-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FCD34D' fill-opacity='0.04'%3E%3Cpath d='M40 20c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V24c0-2.2-1.8-4-4-4H40zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H40c-1.1 0-2-.9-2-2V24c0-1.1.9-2 2-2zM16 32c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h24c2.2 0 4-1.8 4-4V36c0-2.2-1.8-4-4-4H16zm0 2h24c1.1 0 2 .9 2 2v24c0 1.1-.9 2-2 2H16c-1.1 0-2-.9-2-2V36c0-1.1.9-2 2-2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-size: 80px 80px;
            pointer-events: none;
        }
        .auth-banner .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }
        .auth-box {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
        }
        .auth-box .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-box .logo .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--navy);
        }
        .auth-box .logo .logo-text span { color: var(--gold); }
        .auth-box .logo .logo-sub {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .auth-tabs {
            display: flex;
            gap: 0;
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px 20px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .auth-tab:hover { background: rgba(212, 160, 23, 0.08); }
        .auth-tab.active {
            background: var(--gold);
            color: var(--white);
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text);
            margin-bottom: 4px;
        }
        .form-group label .req { color: var(--red); }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--white);
            color: var(--text);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212,160,23,0.1);
        }
        .form-input.error {
            border-color: var(--red);
            background: #fef2f2;
        }

        .btn-gold {
            background: var(--gold);
            color: var(--white);
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: var(--transition);
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gold:hover {
            background: #b8890f;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-gold:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-link {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-link:hover { text-decoration: underline; }

        /* ── SUBSCRIPTION PLANS ── */
        .plans-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 12px 0;
        }
        .plan-card {
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--white);
        }
        .plan-card:hover {
            border-color: var(--gold);
        }
        .plan-card.selected {
            border-color: var(--gold);
            background: var(--gold-pale);
            box-shadow: 0 0 0 3px rgba(212,160,23,0.2);
        }
        .plan-card .plan-name {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text);
        }
        .plan-card .plan-price {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--gold);
            margin: 2px 0;
        }
        .plan-card .plan-price .currency {
            font-size: 0.7rem;
        }
        .plan-card .plan-duration {
            font-size: 0.6rem;
            color: var(--muted);
        }
        .plan-card .plan-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 99px;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--gold);
            color: var(--white);
            margin-top: 4px;
        }
        .plan-card .plan-badge.popular {
            background: var(--purple);
        }
        .plan-card .plan-badge.best {
            background: var(--green);
        }

        /* ── LEARNER DASHBOARD ── */
        .dashboard-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--navy);
            color: var(--white);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-logo {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        .sidebar-logo .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--white);
        }
        .sidebar-logo .logo-text span { color: var(--gold-light); }
        .sidebar-logo .logo-sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        .sidebar-menu {
            flex: 1;
            padding: 0 12px;
        }
        .sidebar-menu .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
            border: none;
            background: transparent;
            width: 100%;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
        }
        .sidebar-menu .menu-item:hover {
            background: rgba(255,255,255,0.06);
            color: var(--white);
        }
        .sidebar-menu .menu-item.active {
            background: rgba(212, 160, 23, 0.15);
            color: var(--gold-light);
            border-left: 3px solid var(--gold);
        }
        .sidebar-menu .menu-item i {
            width: 20px;
            font-size: 1rem;
        }
        .sidebar-menu .menu-item .badge {
            margin-left: auto;
            background: rgba(212, 160, 23, 0.2);
            color: var(--gold-light);
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-footer .learner-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-footer .learner-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: var(--white);
        }
        .sidebar-footer .learner-name {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .sidebar-footer .learner-grade {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
        }
        .sidebar-footer .subscription-status {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 99px;
            margin-top: 4px;
            display: inline-block;
        }
        .sidebar-footer .subscription-status.active {
            background: rgba(22, 163, 74, 0.2);
            color: #4ade80;
        }
        .sidebar-footer .subscription-status.expired {
            background: rgba(220, 38, 38, 0.2);
            color: #f87171;
        }
        .sidebar-footer .subscription-status.inactive {
            background: rgba(212, 160, 23, 0.2);
            color: var(--gold-light);
        }
        .sidebar-footer .subscription-status.pending {
            background: rgba(212, 160, 23, 0.2);
            color: var(--gold-light);
        }
        .sidebar-footer .logout-btn {
            width: 100%;
            padding: 8px 14px;
            border-radius: 8px;
            color: #ef4444;
            background: rgba(220,38,38,0.1);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 12px;
            transition: var(--transition);
        }
        .sidebar-footer .logout-btn:hover {
            background: rgba(220,38,38,0.2);
        }
        .sidebar-footer .subscribe-btn {
            width: 100%;
            padding: 8px 14px;
            border-radius: 8px;
            color: var(--white);
            background: var(--gold);
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 12px;
            transition: var(--transition);
        }
        .sidebar-footer .subscribe-btn:hover {
            background: #b8890f;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
        }

        .top-navbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.9);
        }
        .top-navbar .page-title {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .top-navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mobile-menu-toggle {
            display: none;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--muted);
        }

        .page-content {
            padding: 24px 32px;
        }

        /* ── STAT CARDS ── */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .stat-card .stat-number {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--gold);
        }
        .stat-card .stat-number.green { color: var(--green); }
        .stat-card .stat-number.blue { color: var(--blue); }
        .stat-card .stat-number.purple { color: var(--purple); }
        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* ── CONTENT CARDS ── */
        .content-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .content-card .card-header h3 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }

        /* ── RESOURCE ITEMS ── */
        .resource-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: var(--transition);
            flex-wrap: wrap;
            gap: 8px;
            cursor: pointer;
        }
        .resource-item:hover {
            background: var(--off-white);
            border-color: var(--gold);
            transform: translateX(4px);
        }
        .resource-item .info {
            flex: 1;
            min-width: 150px;
        }
        .resource-item .info .title {
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .resource-item .info .title .open-link {
            font-size: 0.7rem;
            color: var(--gold);
            background: var(--gold-pale);
            padding: 2px 8px;
            border-radius: 99px;
        }
        .resource-item .info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .resource-item .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .resource-item .actions .btn-view {
            padding: 4px 12px;
            border-radius: 6px;
            background: var(--gold);
            color: var(--white);
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }
        .resource-item .actions .btn-view:hover {
            background: #b8890f;
        }
        .resource-item .actions .btn-view.locked {
            background: var(--surface);
            color: var(--muted);
            cursor: not-allowed;
        }
        .resource-item .actions .btn-fav {
            padding: 4px 8px;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 0.85rem;
            transition: var(--transition);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .resource-item .actions .btn-fav.active {
            color: var(--red);
            border-color: var(--red);
        }
        .resource-item .actions .btn-fav:hover {
            background: #fef2f2;
        }

        .status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.completed { background: #dcfce7; color: var(--green); }
        .status-badge.in-progress { background: #fef3c7; color: #d97706; }
        .status-badge.not-started { background: var(--surface); color: var(--muted); }
        .status-badge.locked { background: #fee2e2; color: var(--red); }

        .progress-bar {
            width: 80px;
            height: 6px;
            background: var(--surface);
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        /* ── RESOURCE VIEWER MODAL ── */
        .resource-viewer {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .resource-viewer.open {
            display: flex;
        }
        .resource-viewer .viewer-content {
            background: var(--white);
            border-radius: var(--radius);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .resource-viewer .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .resource-viewer .viewer-header h4 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }
        .resource-viewer .viewer-header .close-viewer {
            padding: 8px 12px;
            border-radius: 8px;
            background: #fef2f2;
            color: var(--red);
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .resource-viewer .viewer-header .close-viewer:hover {
            background: #fee2e2;
        }
        .resource-viewer .viewer-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }
        .resource-viewer .viewer-body .resource-preview {
            background: var(--surface);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            min-height: 200px;
        }
        .resource-viewer .viewer-body .resource-preview .preview-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        .resource-viewer .viewer-body .resource-preview h5 {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .resource-viewer .viewer-body .resource-preview p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .resource-viewer .viewer-body .resource-preview .btn-open-file {
            padding: 10px 24px;
            background: var(--gold);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .resource-viewer .viewer-body .resource-preview .btn-open-file:hover {
            background: #b8890f;
        }
        .resource-viewer .viewer-body .resource-preview .btn-open-file.locked {
            background: var(--surface);
            color: var(--muted);
            cursor: not-allowed;
        }
        .resource-viewer .viewer-body .resource-preview .subscription-required {
            margin-top: 16px;
            padding: 16px;
            background: #fef3c7;
            border-radius: 8px;
            border: 1px solid #fcd34d;
        }
        .resource-viewer .viewer-body .resource-preview .subscription-required h6 {
            font-weight: 700;
            color: #92400e;
            margin-bottom: 4px;
        }
        .resource-viewer .viewer-body .resource-preview .subscription-required p {
            color: #92400e;
            font-size: 0.85rem;
            margin: 0;
        }

                    } else if (formattedPhone.length === 9 && formattedPhone.startsWith('7')) {

                    const callbackUrl = encodeURIComponent(webhookUrl);
                    const returnUrl = encodeURIComponent(`${siteUrl}/learner.html?payment=success&plan=${planId}&learner=${learnerId}`);

                    const payUrl = `${MEGAPAY_PAYMENT_URL}?phone=${encodeURIComponent(formattedPhone)}&amount=${encodeURIComponent(plan.price)}&description=${encodeURIComponent(description)}&callback=${callbackUrl}&return_url=${returnUrl}&metadata=${encodeURIComponent(metadata)}`;

                    addDebug(`🔗 Opening MegaPay STK Push: ${payUrl}`, 'info');

                    // Open MegaPay in new window
                    const paymentWindow = window.open(payUrl, '_blank', 'width=500,height=700,scrollbars=yes');

                    if (!paymentWindow) {
                        showNotification('⚠️ Please allow popups to complete payment', 'error');
                        setIsProcessing(false);
                        return false;
                    }

                    showNotification('📱 MegaPay opened. Check your phone for M-Pesa PIN prompt.', 'success');

                    // Start polling for payment confirmation
                    let attempts = 0;
                    const maxAttempts = 40;

                    const checkPaymentStatus = setInterval(async () => {
                        attempts++;
                        addDebug(`⏳ Checking payment status... (${attempts}/${maxAttempts})`, 'info');

                        try {
                            const statusRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?id=eq.${learnerId}&select=subscription_tier,subscription_expiry`, {
                                headers: {
                                    'apikey': SUPABASE_ANON_KEY,
                                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                    'Content-Type': 'application/json'
                                }
                            });

                            if (statusRes.ok) {
                                const data = await statusRes.json();
                                if (data.length > 0) {
                                    const currentLearner = data[0];
                                    if (currentLearner.subscription_tier === planId && 
                                        currentLearner.subscription_expiry && 
                                        new Date(currentLearner.subscription_expiry) > new Date()) {
                                        
                                        clearInterval(checkPaymentStatus);
                                        setIsProcessing(false);
                                        showNotification(`✅ Payment confirmed! ${plan.label} subscription activated.`, 'success');
                                        refreshData();
                                        
                                        // Close payment window if still open
                                        if (paymentWindow && !paymentWindow.closed) {
                                            paymentWindow.close();
                                        }
                                        return;
                                    }
                                }
                            }
                        } catch (e) {
                            addDebug(`⚠️ Status check error: ${e.message}`, 'warning');
                        }

                        if (attempts >= maxAttempts) {
                            clearInterval(checkPaymentStatus);
                            setIsProcessing(false);
                            showNotification('⏳ Payment is taking longer than expected. Please check your M-Pesa and refresh the page.', 'info');
                        }
                    }, 3000);

                    return true;

                } catch (e) {
                    addDebug(`❌ Payment error: ${e.message}`, 'error');
                    showNotification(`❌ Payment failed: ${e.message}`, 'error');
                    setIsProcessing(false);
                    return false;
                }
            };

            // ── UPDATE SUBSCRIPTION (FREE TRIAL - FOR TESTING) ──
            const updateSubscription = async (planId) => {
                // This is kept for free trial/testing purposes
                // Real subscriptions go through processPayment
                return await activateSubscription(planId);
            };

            const updateProgress = async (resourceId, status, progressPercent = null) => {
                const learnerId = sessionStorage.getItem('learner_id');
                if (!learnerId) return;

                // Check if subscription is active for accessing resources
                if (!isSubscriptionActive(learner)) {
                    showNotification('⚠️ Please subscribe to access resources', 'error');
                    return;
                }

                const existing = progress.find(p => p.resource_id === resourceId);
                const data = {
                    status: status,
                    progress_percentage: progressPercent !== null ? progressPercent : (status === 'completed' ? 100 : 50),
                    last_accessed: new Date().toISOString()
                };
                if (status === 'completed') {
                    data.completed_at = new Date().toISOString();
                }
                if (status === 'in_progress' && !existing?.started_at) {
                    data.started_at = new Date().toISOString();
                }

                try {
                    let response;
                    if (existing) {
                        response = await fetch(`${SUPABASE_URL}/rest/v1/learner_progress?id=eq.${existing.id}`, {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });
                    } else {
                        response = await fetch(`${SUPABASE_URL}/rest/v1/learner_progress`, {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=representation'
                            },
                            body: JSON.stringify({
                                learner_id: learnerId,
                                resource_id: resourceId,
                                ...data
                            })
                        });
                    }
                    if (response.ok) {
                        refreshData();
                        showNotification(`Progress updated: ${status.replace('-', ' ')} ✅`, 'success');
                    }
                } catch (e) {
                    showNotification('Failed to update progress', 'error');
                }
            };

            const toggleFavorite = async (resourceId) => {
                const learnerId = sessionStorage.getItem('learner_id');
                if (!learnerId) return;

                const existing = favorites.find(f => f.resource_id === resourceId);
                try {
                    if (existing) {
                        await fetch(`${SUPABASE_URL}/rest/v1/learner_favorites?id=eq.${existing.id}`, {
                            method: 'DELETE',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                            }
                        });
                        showNotification('Removed from favorites', 'info');
                    } else {
                        await fetch(`${SUPABASE_URL}/rest/v1/learner_favorites`, {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                learner_id: learnerId,
                                resource_id: resourceId
                            })
                        });
                        showNotification('Added to favorites ❤️', 'success');
                    }
                    refreshData();
                } catch (e) {
                    showNotification('Failed to update favorites', 'error');
                }
            };

            const value = {
                isLoggedIn,
                setIsLoggedIn,
                learner,
                setLearner,
                resources,
                setResources,
                progress,
                setProgress,
                favorites,
                setFavorites,
                studyPlans,
                setStudyPlans,
                notifications,
                setNotifications,
                loading,
                setLoading,
                activeTab,
                setActiveTab,
                sidebarOpen,
                setSidebarOpen,
                notification,
                showNotification,
                logout,
                refreshData,
                debugInfo,
                addDebug,
                loadLearnerData,
                updateProgress,
                toggleFavorite,
                isSubscriptionActive,
                getSubscriptionStatus,
                getSubscriptionDaysRemaining,
                updateSubscription,
                processPayment,
                activateSubscription,
                SUBSCRIPTION_PLANS,
                isProcessing,
                setIsProcessing,
            };

            return (
                <LearnerContext.Provider value={value}>
                    {children}
                </LearnerContext.Provider>
            );
        }

        function useLearner() {
            const context = useContext(LearnerContext);
            if (!context) throw new Error('useLearner must be used within LearnerProvider');
            return context;
        }

        // ── AUTH PAGE ──
        function AuthPage() {
            const { setIsLoggedIn, setLearner, showNotification, loadLearnerData, addDebug, debugInfo, SUBSCRIPTION_PLANS } = useLearner();
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [fullName, setFullName] = useState('');
            const [gradeLevel, setGradeLevel] = useState('');
            const [schoolName, setSchoolName] = useState('');
            const [parentPhone, setParentPhone] = useState('');
            const [selectedPlan, setSelectedPlan] = useState('quarterly');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [localDebug, setLocalDebug] = useState([]);

            const addLocalDebug = (message, type = 'info') => {
                setLocalDebug(prev => [...prev, { message, type, timestamp: new Date().toLocaleTimeString() }]);
                console.log(message);
                addDebug(message, type);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLocalDebug([]);
                if (!email || !password) {
                    setError('Please fill in all fields.');
                    return;
                }
                setLoading(true);
                addLocalDebug(`🔑 Attempting login for: ${email}`, 'info');
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?email=eq.${email}&select=*`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    addLocalDebug(`📡 Login response: ${res.status}`, 'info');
                    
                    if (!res.ok) {
                        const errorText = await res.text();
                        addLocalDebug(`❌ Login failed: ${res.status} - ${errorText}`, 'error');
                        throw new Error(`Login failed (${res.status})`);
                    }
                    
                    const data = await res.json();
                    if (data.length === 0) {
                        addLocalDebug('❌ No account found with this email', 'error');
                        setError('No account found with this email.');
                        setLoading(false);
                        return;
                    }
                    const learner = data[0];
                    if (learner.password !== password) {
                        addLocalDebug('❌ Password mismatch', 'error');
                        setError('Invalid password.');
                        setLoading(false);
                        return;
                    }
                    addLocalDebug('✅ Login successful!', 'success');
                    sessionStorage.setItem('learner_id', learner.id);
                    sessionStorage.setItem('learner_name', learner.full_name);
                    setIsLoggedIn(true);
                    setLearner(learner);
                    if (typeof loadLearnerData === 'function') {
                        await loadLearnerData(learner.id);
                    }
                    showNotification(`Welcome back, ${learner.full_name}! 🎉`, 'success');
                } catch (e) {
                    addLocalDebug(`❌ Login error: ${e.message}`, 'error');
                    setError('Error logging in. Please try again.');
                }
                setLoading(false);
            };

            const handleSignup = async (e) => {
                e.preventDefault();
                setError('');
                setLocalDebug([]);
                
                if (!email || !password || !fullName || !gradeLevel) {
                    setError('Please fill in all required fields.');
                    return;
                }
                if (password.length < 6) {
                    setError('Password must be at least 6 characters.');
                    return;
                }
                
                setLoading(true);
                addLocalDebug(`📝 Creating account for: ${email}`, 'info');
                
                try {
                    // Check if email exists
                    addLocalDebug('🔍 Checking if email exists...', 'info');
                    const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts?email=eq.${email}&select=id`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (checkRes.ok) {
                        const existing = await checkRes.json();
                        if (existing.length > 0) {
                            addLocalDebug('❌ Email already registered', 'error');
                            setError('An account with this email already exists.');
                            setLoading(false);
                            return;
                        }
                    }

                    // Get plan details - set as pending until payment
                    const plan = SUBSCRIPTION_PLANS.find(p => p.id === selectedPlan);

                    const learnerData = {
                        email,
                        password,
                        full_name: fullName,
                        grade_level: gradeLevel,
                        school_name: schoolName || '',
                        parent_phone: parentPhone || '',
                        subscription_tier: 'pending',
                        subscription_expiry: null,
                        is_active: true,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };

                    addLocalDebug(`📤 Sending signup data with pending ${plan?.label} subscription`, 'info');

                    const res = await fetch(`${SUPABASE_URL}/rest/v1/learner_accounts`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=representation'
                        },
                        body: JSON.stringify(learnerData)
                    });

                    addLocalDebug(`📡 Signup response: ${res.status}`, 'info');

                    if (!res.ok) {
                        const errorText = await res.text();
                        addLocalDebug(`❌ Signup error: ${res.status} - ${errorText}`, 'error');
                        if (res.status === 401) {
                            setError('Authentication error. Please contact support.');
                        } else {
                            throw new Error(`Signup failed (${res.status})`);
                        }
                        setLoading(false);
                        return;
                    }

                    const data = await res.json();
                    const learner = data[0];
                    
                    if (!learner || !learner.id) {
                        addLocalDebug('❌ No learner returned from signup', 'error');
                        setError('Account created but no data returned. Please try logging in.');
                        setLoading(false);
                        return;
                    }

                    addLocalDebug('✅ Account created successfully!', 'success');
                    sessionStorage.setItem('learner_id', learner.id);
                    sessionStorage.setItem('learner_name', learner.full_name);
                    setIsLoggedIn(true);
                    setLearner(learner);
                    if (typeof loadLearnerData === 'function') {
                        await loadLearnerData(learner.id);
                    }
                    showNotification(`Account created! Please subscribe to access resources. Welcome ${learner.full_name}! 🎉`, 'success');

                } catch (e) {
                    addLocalDebug(`❌ Signup error: ${e.message}`, 'error');
                    setError('Error creating account: ' + e.message);
                }
                setLoading(false);
            };

            return (
                <div className="auth-banner">
                    <div className="container">
                        <div className="auth-box">
                            <div className="logo">
                                <div className="logo-text">Kenya<span>Vault</span></div>
                                <div className="logo-sub">Learner Account</div>
                            </div>
                            <div className="auth-tabs">
                                <button onClick={() => { setIsLogin(true); setError(''); setLocalDebug([]); }} className={`auth-tab ${isLogin ? 'active' : ''}`}>🔑 Login</button>
                                <button onClick={() => { setIsLogin(false); setError(''); setLocalDebug([]); }} className={`auth-tab ${!isLogin ? 'active' : ''}`}>📝 Sign Up</button>
                            </div>

                            {error && <div style={{ padding: '12px', background: '#fef2f2', borderRadius: '8px', color: '#dc2626', marginBottom: '16px', fontSize: '0.9rem' }}>{error}</div>}

                            {localDebug.length > 0 && (
                                <div className="debug-info">
                                    <strong>🔍 Debug:</strong>
                                    {localDebug.map((d, i) => (
                                        <div key={i} className={d.type === 'error' ? 'error' : d.type === 'success' ? 'success' : ''}>
                                            [{d.timestamp}] {d.message}
                                        </div>
                                    ))}
                                </div>
                            )}

                            {isLogin ? (
                                <form onSubmit={handleLogin}>
                                    <div className="form-group">
                                        <label>Email Address <span className="req">*</span></label>
                                        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="form-input" placeholder="your@email.com" required />
                                    </div>
                                    <div className="form-group">
                                        <label>Password <span className="req">*</span></label>
                                        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="form-input" placeholder="Enter your password" required />
                                    </div>
                                    <button type="submit" disabled={loading} className="btn-gold">
                                        {loading ? '⏳ Logging in...' : '🔑 Login'}
                                    </button>
                                    <div style={{ textAlign: 'center', marginTop: '12px' }}>
                                        <button type="button" className="btn-link" onClick={() => setIsLogin(false)}>Don't have an account? Sign up →</button>
                                    </div>
                                </form>
                            ) : (
                                <form onSubmit={handleSignup}>
                                    <div className="form-group">
                                        <label>Full Name <span className="req">*</span></label>
                                        <input type="text" value={fullName} onChange={(e) => setFullName(e.target.value)} className="form-input" placeholder="e.g., John Mwangi" required />
                                    </div>
                                    <div className="form-group">
                                        <label>Email Address <span className="req">*</span></label>
                                        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="form-input" placeholder="your@email.com" required />
                                    </div>
                                    <div className="form-group">
                                        <label>Grade Level <span className="req">*</span></label>
                                        <select value={gradeLevel} onChange={(e) => setGradeLevel(e.target.value)} className="form-input" required>
                                            <option value="">Select your grade...</option>
                                            {GRADE_LEVELS.map(g => <option key={g.value} value={g.value}>{g.label}</option>)}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>School Name</label>
                                        <input type="text" value={schoolName} onChange={(e) => setSchoolName(e.target.value)} className="form-input" placeholder="e.g., Kenya High School" />
                                    </div>
                                    <div className="form-group">
                                        <label>Parent/Guardian Phone</label>
                                        <input type="tel" value={parentPhone} onChange={(e) => setParentPhone(e.target.value)} className="form-input" placeholder="0712 345 678" />
                                    </div>
                                    <div className="form-group">
                                        <label>Password <span className="req">*</span></label>
                                        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="form-input" placeholder="Min 6 characters" required />
                                    </div>
                                    
                                    {/* Subscription Plans */}
                                    <div className="form-group">
                                        <label>Choose Your Plan <span className="req">*</span></label>
                                        <div className="plans-grid">
                                            {SUBSCRIPTION_PLANS.map(plan => (
                                                <div 
                                                    key={plan.id}
                                                    className={`plan-card ${selectedPlan === plan.id ? 'selected' : ''}`}
                                                    onClick={() => setSelectedPlan(plan.id)}
                                                >
                                                    <div className="plan-name">{plan.label}</div>
                                                    <div className="plan-price">
                                                        <span className="currency">KES</span> {plan.price.toLocaleString()}
                                                    </div>
                                                    <div className="plan-duration">{plan.duration}</div>
                                                    {plan.badge && (
                                                        <div className={`plan-badge ${plan.badgeClass}`}>{plan.badge}</div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                        <span style={{ fontSize: '0.65rem', color: 'var(--muted)', display: 'block', marginTop: '4px' }}>
                                            💡 You'll be redirected to M-PESA to complete payment after creating your account.
                                        </span>
                                    </div>

                                    <button type="submit" disabled={loading} className="btn-gold">
                                        {loading ? '⏳ Creating account...' : `📝 Create Account & Subscribe`}
                                    </button>
                                    <div style={{ textAlign: 'center', marginTop: '12px' }}>
                                        <button type="button" className="btn-link" onClick={() => setIsLogin(true)}>Already have an account? Login →</button>
                                    </div>
                                    <p style={{ fontSize: '0.7rem', color: 'var(--muted)', textAlign: 'center', marginTop: '8px' }}>
                                        By creating an account, you agree to our Terms of Service and Privacy Policy.
                                    </p>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ── RESOURCE VIEWER COMPONENT ──
        function ResourceViewer({ resource, onClose, onProgressUpdate, currentProgress, isSubscribed }) {
            const [isOpen, setIsOpen] = useState(false);
            const { showNotification } = useLearner();

            useEffect(() => {
                if (resource) {
                    setIsOpen(true);
                    document.body.style.overflow = 'hidden';
                }
                return () => {
                    document.body.style.overflow = '';
                };
            }, [resource]);

            const handleClose = () => {
                setIsOpen(false);
                setTimeout(onClose, 300);
            };

            const handleMarkComplete = () => {
                if (!isSubscribed) {
                    showNotification('⚠️ Please subscribe to access this resource', 'error');
                    return;
                }
                if (currentProgress?.status === 'completed') {
                    onProgressUpdate(resource.id, 'in_progress', 50);
                } else {
                    onProgressUpdate(resource.id, 'completed', 100);
                }
            };

            const handleOpenResource = () => {
                if (!isSubscribed) {
                    showNotification('⚠️ Please subscribe to access this resource', 'error');
                    return;
                }
                if (resource.file_url) {
                    window.open(resource.file_url, '_blank');
                    if (currentProgress?.progress_percentage < 50) {
                        onProgressUpdate(resource.id, 'in_progress', 50);
                    }
                } else {
                    onProgressUpdate(resource.id, 'in_progress', 50);
                }
            };

            if (!resource) return null;

            const isCompleted = currentProgress?.status === 'completed';
            const progressPercent = currentProgress?.progress_percentage || 0;

            return (
                <div className={`resource-viewer ${isOpen ? 'open' : ''}`} onClick={handleClose}>
                    <div className="viewer-content" onClick={(e) => e.stopPropagation()}>
                        <div className="viewer-header">
                            <h4>📄 {resource.title}</h4>
                            <button className="close-viewer" onClick={handleClose}>✕ Close</button>
                        </div>
                        <div className="viewer-body">
                            <div className="resource-preview">
                                <div className="preview-icon">📘</div>
                                <h5>{resource.title}</h5>
                                <p>
                                    📚 {resource.level} • 📖 {resource.subject} • 
                                    {resource.price === 0 ? ' FREE' : ` KES ${resource.price}`}
                                </p>
                                {resource.description && (
                                    <p style={{ color: 'var(--muted)', fontSize: '0.9rem', maxWidth: '600px', margin: '0 auto 16px' }}>
                                        {resource.description}
                                    </p>
                                )}
                                
                                {!isSubscribed ? (
                                    <div className="subscription-required">
                                        <h6>🔒 Subscription Required</h6>
                                        <p>Please subscribe to access this resource.</p>
                                        <button 
                                            className="btn-open-file" 
                                            style={{ marginTop: '12px', background: 'var(--purple)' }}
                                            onClick={() => { onClose(); }}
                                        >
                                            💳 Subscribe Now
                                        </button>
                                    </div>
                                ) : (
                                    <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
                                        {resource.file_url ? (
                                            <button 
                                                className="btn-open-file"
                                                onClick={handleOpenResource}
                                            >
                                                📖 Open Resource
                                            </button>
                                        ) : (
                                            <button 
                                                className="btn-open-file"
                                                onClick={handleOpenResource}
                                            >
                                                📖 Start Learning
                                            </button>
                                        )}
                                        {resource.file_url && (
                                            <button 
                                                className="btn-open-file" 
                                                style={{ background: 'var(--blue)' }}
                                                onClick={() => {
                                                    if (resource.file_url) {
                                                        window.open(resource.file_url, '_blank');
                                                    }
                                                }}
                                            >
                                                📥 Download
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="viewer-footer">
                            <div className="progress-section">
                                <span className="progress-label">📊 Progress:</span>
                                <div className="progress-bar" style={{ width: '120px' }}>
                                    <div className="progress-fill" style={{ width: `${progressPercent}%` }}></div>
                                </div>
                                <span style={{ fontSize: '0.8rem', color: 'var(--muted)' }}>{progressPercent}%</span>
                                <span className={`status-badge ${isCompleted ? 'completed' : 'in-progress'}`}>
                                    {isCompleted ? '✅ Completed' : '📖 In Progress'}
                                </span>
                            </div>
                            <button 
                                className={`btn-mark-complete ${isCompleted ? 'completed' : ''} ${!isSubscribed ? 'locked' : ''}`}
                                onClick={handleMarkComplete}
                                disabled={!isSubscribed}
                            >
                                {isCompleted ? '↩️ Mark as Incomplete' : '✅ Mark as Complete'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ── PAYMENT MODAL COMPONENT ──
        function PaymentModal({ isOpen, onClose, plan, onPaymentComplete }) {
            const [phone, setPhone] = useState('');
            const [name, setName] = useState('');
            const [loading, setLoading] = useState(false);
            const { processPayment, showNotification, learner } = useLearner();

            useEffect(() => {
                if (learner) {
                    setName(learner.full_name || '');
                    setPhone(learner.parent_phone || '');
                }
            }, [learner]);

            if (!isOpen || !plan) return null;

            const handlePayment = async () => {
                if (!phone || phone.length < 9) {
                    showNotification('⚠️ Please enter a valid phone number', 'error');
                    return;
                }

                setLoading(true);
                const success = await processPayment(plan.id, phone, name);
                setLoading(false);
                if (success) {
                    onPaymentComplete();
                }
            };

            return (
                <div className="payment-modal open" onClick={onClose}>
                    <div className="payment-content" onClick={(e) => e.stopPropagation()}>
                        <h3>💳 Complete Payment</h3>
                        <p style={{ textAlign: 'center', color: 'var(--muted)', fontSize: '0.85rem' }}>
                            You'll receive an M-PESA STK Push prompt on your phone.
                        </p>
                        
                        <div className="payment-details">
                            <div className="plan-name">{plan.label} Plan</div>
                            <div className="plan-price">KES {plan.price.toLocaleString()}</div>
                            <div className="plan-duration">{plan.duration} access</div>
                        </div>

                        <div className="payment-form">
                            <div className="form-group">
                                <label>Full Name <span className="req">*</span></label>
                                <input 
                                    type="text" 
                                    value={name} 
                                    onChange={(e) => setName(e.target.value)} 
                                    placeholder="Enter your full name" 
                                    required 
                                />
                            </div>
                            <div className="form-group">
                                <label>Safaricom Phone Number <span className="req">*</span></label>
                                <input 
                                    type="tel" 
                                    value={phone} 
                                    onChange={(e) => setPhone(e.target.value)} 
                                    placeholder="0712 345 678" 
                                    required 
                                />
                                <span style={{ fontSize: '0.65rem', color: 'var(--muted)' }}>
                                    You'll receive an M-PESA STK Push prompt on this number.
                                </span>
                            </div>
                        </div>

                        <div className="payment-actions">
                            <button className="btn-cancel" onClick={onClose}>Cancel</button>
                            <button 
                                className="btn-pay" 
                                onClick={handlePayment} 
                                disabled={loading}
                            >
                                {loading ? '⏳ Processing...' : `💳 Pay KES ${plan.price}`}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ── RESOURCES TAB ──
        function ResourcesTab({ setSelectedResource, isSubscribed }) {
            const { resources, progress, toggleFavorite, favorites } = useLearner();
            const [searchTerm, setSearchTerm] = useState('');
            const [filterLevel, setFilterLevel] = useState('');
            const [filterSubject, setFilterSubject] = useState('');

            // Get unique subjects and levels from resources
            const subjects = [...new Set(resources.map(r => r.subject).filter(Boolean))];
            const levels = [...new Set(resources.map(r => r.level).filter(Boolean))];

            const filteredResources = resources.filter(r => {
                const matchesSearch = r.title.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesLevel = filterLevel ? r.level === filterLevel : true;
                const matchesSubject = filterSubject ? r.subject === filterSubject : true;
                return matchesSearch && matchesLevel && matchesSubject;
            });

            const isFavorited = (resourceId) => {
                return favorites.some(f => f.resource_id === resourceId);
            };

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>📚 All Resources</h3>
                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>

                                type="text" 
                                className="form-input" 
                                style={{ width: '200px', padding: '8px 12px', fontSize: '0.85rem' }}

                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}

                                className="form-input" 
                                style={{ width: '150px', padding: '8px 12px', fontSize: '0.85rem' }}

                                onChange={(e) => setFilterLevel(e.target.value)}

                                <option value="">All Levels</option>
                                {levels.map(l => <option key={l} value={l}>{l}</option>)}
                            </select>
                            <select 
                                className="form-input" 
                                style={{ width: '150px', padding: '8px 12px', fontSize: '0.85rem' }}
                                value={filterSubject}
                                onChange={(e) => setFilterSubject(e.target.value)}
                            >
                                <option value="">All Subjects</option>
                                {subjects.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                    </div>
                    {filteredResources.length === 0 ? (
                        <p style={{ color: 'var(--muted)', textAlign: 'center', padding: '20px 0' }}>
                            No resources found matching your filters.
                        </p>
                    ) : (
                        filteredResources.map(resource => (
                            <div key={resource.id} className="resource-item" onClick={() => setSelectedResource(resource)}>
                                <div className="info">
                                    <div className="title">
                                        {resource.title}
                                        {isSubscribed && <span className="open-link">🔓 Unlocked</span>}
                                        {!isSubscribed && <span className="open-link" style={{ background: '#fee2e2', color: '#dc2626' }}>🔒 Locked</span>}
                                    </div>
                                    <div className="meta">
                                        <span>📚 {resource.level}</span>
                                        <span>📖 {resource.subject}</span>
                                        <span>📄 {resource.type || 'Resource'}</span>

                                </div>
                                <div className="actions">
                                    <button 
                                        className={`btn-fav ${isFavorited(resource.id) ? 'active' : ''}`}
                                        onClick={(e) => { e.stopPropagation(); toggleFavorite(resource.id); }}
                                    >
                                        <i className={`fas ${isFavorited(resource.id) ? 'fa-heart' : 'fa-heart'}`}></i>
                                    </button>
                                    <button 
                                        className={`btn-view ${!isSubscribed ? 'locked' : ''}`}
                                        onClick={(e) => { e.stopPropagation(); setSelectedResource(resource); }}

                                        {isSubscribed ? '📖 View' : '🔒 Locked'}

                            </div>

        // ── PROGRESS TAB ──
        function ProgressTab({ setSelectedResource }) {
            const { progress, resources, isSubscriptionActive, learner } = useLearner();
            const isSubscribed = isSubscriptionActive(learner);

            const progressWithResources = progress.map(p => {
                const resource = resources.find(r => r.id === p.resource_id);
                return { ...p, resource };
            }).filter(p => p.resource);

            const completedCount = progress.filter(p => p.status === 'completed').length;
            const total = progress.length || 1;
            const overallProgress = Math.round((completedCount / total) * 100);

            return (
                <div className="content-card">
                    <div className="card-header">
                        <h3>📊 Your Progress</h3>
                    </div>
                    <div style={{ marginBottom: '20px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap' }}>
                            <div style={{ flex: 1 }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                                    <span style={{ fontWeight: '600' }}>Overall Progress</span>
                                    <span style={{ fontWeight: '700', color: 'var(--gold)' }}>{overallProgress}%</span>
                                </div>
                                <div className="progress-bar" style={{ width: '100%', height: '10px' }}>
                                    <div className="progress-fill" style={{ width: `${overallProgress}%` }}></div>

                            <div style={{ display: 'flex', gap: '20px' }}>
                                <div><span style={{ fontWeight: '700', color: 'var(--green)' }}>{completedCount}</span> <span style={{ color: 'var(--muted)' }}>Completed</span></div>
                                <div><span style={{ fontWeight: '700', color: 'var(--blue)' }}>{progress.filter(p => p.status === 'in_progress').length}</span> <span style={{ color: 'var(--muted)' }}>In Progress</span></div>
                                <div><span style={{ fontWeight: '700', color: 'var(--muted)' }}>{resources.length - progress.length}</span> <span style={{ color: 'var(--muted)' }}>Not Started</span></div>
                            </div>
                        </div>
                    </div>
                    {progressWithResources.length === 0 ? (
                        <p style={{ color: 'var(--muted)', textAlign: 'center', padding: '20px 0' }}>
                            {isSubscribed ? 'Start learning to track your progress!' : 'Subscribe to track your progress.'}
                        </p>
                    ) : (
                        progressWithResources.map(p => (
                            <div key={p.id} className="resource-item" onClick={() => setSelectedResource(p.resource)}>
