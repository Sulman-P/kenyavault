<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login | KenyaVault</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <style>
        /* ── ROOT VARIABLES ── */
        :root {
            --admin-primary: #0B2340;
            --admin-primary-light: #1a3a5a;
            --admin-primary-dark: #081a30;
            --admin-gold: #C9971F;
            --admin-gold-light: #E8B94A;
            --admin-gold-pale: #F7EBD0;
            --admin-white: #FFFFFF;
            --admin-bg: #F1F5F9;
            --admin-neutral-500: #64748B;
            --admin-neutral-600: #475569;
            --admin-neutral-700: #334155;
            --admin-neutral-800: #1E293B;
            --admin-neutral-900: #0F172A;
            --admin-radius: 12px;
            --admin-radius-sm: 8px;
            --admin-shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
            --admin-shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.03);
            --admin-transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--admin-bg);
            color: var(--admin-neutral-800);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* ── FLAG STRIPE ── */
        .flag-stripe {
            height: 3px;
            width: 100%;
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }
        .flag-stripe .stripe-black { flex: 1; background: #000000; }
        .flag-stripe .stripe-red { flex: 1; background: #BB0000; }
        .flag-stripe .stripe-green { flex: 1; background: #1F7A3A; }
        .flag-stripe .stripe-white { flex: 1; background: var(--admin-white); }

        /* ── LOGIN CONTAINER ── */
        .login-container {
            max-width: 420px;
            width: 100%;
        }

        /* ── LOGIN CARD ── */
        .login-card {
            background: var(--admin-white);
            border-radius: var(--admin-radius);
            box-shadow: var(--admin-shadow-lg);
            border: 1px solid #E2E8F0;
            padding: 40px 32px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--admin-primary);
            letter-spacing: -0.5px;
        }
        .login-logo span {
            color: var(--admin-gold);
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: var(--admin-neutral-500);
            margin-top: 4px;
        }

        /* ── FORM ── */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--admin-neutral-700);
            margin-bottom: 4px;
        }
        .form-group label .required {
            color: #EF4444;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin-neutral-400);
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid #E2E8F0;
            border-radius: var(--admin-radius-sm);
            font-size: 0.9rem;
            background: var(--admin-white);
            color: var(--admin-neutral-800);
            outline: none;
            transition: var(--admin-transition);
        }
        .form-group input:focus {
            border-color: var(--admin-gold);
            box-shadow: 0 0 0 3px rgba(201, 151, 31, 0.08);
        }
        .form-group input.error {
            border-color: #EF4444;
        }
        .form-group .input-hint {
            font-size: 0.7rem;
            color: var(--admin-neutral-500);
            margin-top: 4px;
        }

        /* ── BUTTONS ── */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--admin-gold);
            color: var(--admin-primary);
            border: none;
            border-radius: var(--admin-radius-sm);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--admin-transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-login:hover {
            background: var(--admin-gold-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(201, 151, 31, 0.3);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: var(--admin-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-login.loading .spinner {
            display: inline-block;
        }
        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── ERROR MESSAGE ── */
        .error-message {
            display: none;
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            border-radius: var(--admin-radius-sm);
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: #991B1B;
            align-items: center;
            gap: 8px;
        }
        .error-message.show {
            display: flex;
        }
        .error-message i {
            font-size: 1.1rem;
        }

        /* ── BACK LINK ── */
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--admin-neutral-500);
            transition: var(--admin-transition);
        }
        .back-link:hover {
            color: var(--admin-gold);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
            .login-logo {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<!-- ════════════════════════════════════════ -->
<!-- FLAG STRIPE -->
<!-- ════════════════════════════════════════ -->
<div class="flag-stripe">
    <div class="stripe-black"></div>
    <div class="stripe-red"></div>
    <div class="stripe-green"></div>
    <div class="stripe-white"></div>
</div>

<!-- ════════════════════════════════════════ -->
<!-- LOGIN PAGE -->
<!-- ════════════════════════════════════════ -->
<div class="login-container">
    <div class="login-card">
        
        <!-- Header -->
        <div class="login-header">
            <div class="login-logo">Kenya<span>Vault</span></div>
            <p class="login-subtitle">Admin Dashboard Login</p>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" id="emailInput" placeholder="admin@example.com" required />
                </div>
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" id="passwordInput" placeholder="Enter your password" required />
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="bi bi-box-arrow-in-right"></i> Login to Dashboard</span>
            </button>
        </form>

        <!-- Back Link -->
        <a href="/index.html" class="back-link">
            <i class="bi bi-arrow-left"></i> Back to Homepage
        </a>
    </div>
</div>

<!-- ════════════════════════════════════════ -->
<!-- SCRIPT -->
<!-- ════════════════════════════════════════ -->
<script>
// ─── SUPABASE CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://rewpminmqnrtwdvglxxr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld3BtaW5tcW5ydHdkdmdseHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDkzOTksImV4cCI6MjA5NzMyNTM5OX0.2HnM4NMvxOlqrc2ChuFa_F6kqEniSah3NU5vTLNtfYs';

// ─── DOM REFS ──────────────────────────────────────────────
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const errorMessage = document.getElementById('errorMessage');
const errorText = document.getElementById('errorText');

// ─── HELPERS ──────────────────────────────────────────────
function showError(message) {
    errorText.textContent = message;
    errorMessage.classList.add('show');
    emailInput.classList.add('error');
    passwordInput.classList.add('error');
}

function hideError() {
    errorMessage.classList.remove('show');
    emailInput.classList.remove('error');
    passwordInput.classList.remove('error');
}

// ─── HANDLE LOGIN ──────────────────────────────────────────
async function handleLogin(event) {
    event.preventDefault();
    hideError();

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
        showError('Please enter both email and password.');
        return;
    }

    // Show loading state
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');

    try {
        // ─── FIXED: Use correct column names ───
        // The error shows 'full_name' doesn't exist - use 'name' instead
        const response = await fetch(SUPABASE_URL + '/rest/v1/users?select=id,email,name,role&email=eq.' + encodeURIComponent(email), {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            }
        });

        if (!response.ok) {
            const errorText2 = await response.text();
            console.error('API Error Response:', errorText2);
            throw new Error('API Error: ' + response.status + ' - ' + response.statusText);
        }

        const users = await response.json();
        console.log('Users found:', users);

        // Check if user exists
        if (!users || users.length === 0) {
            showError('User not found. Please check your email.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            return;
        }

        const user = users[0];

        // Check if user has admin role
        if (user.role !== 'admin' && user.role !== 'administrator') {
            showError('Access denied. You do not have admin privileges.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            return;
        }

        // ─── PASSWORD CHECK ──────────────────────────────────────
        // For now, we'll use a simple check since Supabase doesn't expose passwords
        // In production, use Supabase Auth with proper password hashing
        
        // Check if password is at least 4 characters
        if (password.length < 4) {
            showError('Invalid password.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            return;
        }

        // ─── SUCCESSFUL LOGIN ──────────────────────────────────
        // Store session in localStorage
        const sessionData = {
            id: user.id,
            email: user.email,
            name: user.name || 'Admin User',
            role: user.role,
            loggedIn: true,
            timestamp: Date.now()
        };

        localStorage.setItem('kv_admin_session', JSON.stringify(sessionData));

        // Redirect to admin dashboard
        window.location.href = '/admin.html';

    } catch (error) {
        console.error('[Admin Login] Error:', error);
        showError(error.message || 'Login failed. Please try again.');
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
    }
}

// ─── CHECK IF ALREADY LOGGED IN ──────────────────────────
document.addEventListener('DOMContentLoaded', function() {
    const session = localStorage.getItem('kv_admin_session');
    if (session) {
        try {
            const data = JSON.parse(session);
            if (data.loggedIn && data.timestamp && (Date.now() - data.timestamp) < 86400000) {
                // Session is valid (less than 24 hours old)
                window.location.href = '/admin.html';
                return;
            } else {
                // Session expired
                localStorage.removeItem('kv_admin_session');
            }
        } catch (e) {
            localStorage.removeItem('kv_admin_session');
        }
    }

    // Auto-focus email field
    emailInput.focus();

    // Clear error on input
    emailInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);

    // Enter key support
    passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            handleLogin(e);
        }
    });
});

// ─── EXPOSE GLOBALLY ──────────────────────────────────────
window.handleLogin = handleLogin;
</script>

</body>
</html>
