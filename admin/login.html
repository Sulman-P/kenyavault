<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login | KenyaVault</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F1F5F9;
            color: #1E293B;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        .flag-stripe {
            height: 3px;
            width: 100%;
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }
        .flag-stripe .stripe-black { flex: 1; background: #000000; }
        .flag-stripe .stripe-red { flex: 1; background: #BB0000; }
        .flag-stripe .stripe-green { flex: 1; background: #1F7A3A; }
        .flag-stripe .stripe-white { flex: 1; background: #FFFFFF; }

        .login-container { max-width: 420px; width: 100%; }

        .login-card {
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
            padding: 40px 32px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: #0B2340;
            letter-spacing: -0.5px;
        }
        .login-logo span { color: #C9971F; }
        .login-subtitle {
            font-size: 0.9rem;
            color: #64748B;
            margin-top: 4px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.82rem;
            color: #334155;
            margin-bottom: 4px;
        }
        .form-group label .required { color: #EF4444; }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid #E2E8F0;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #FFFFFF;
            color: #1E293B;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            border-color: #C9971F;
            box-shadow: 0 0 0 3px rgba(201, 151, 31, 0.08);
        }
        .form-group input.error { border-color: #EF4444; }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #C9971F;
            color: #0B2340;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-login:hover {
            background: #E8B94A;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(201, 151, 31, 0.3);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #0B2340;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-login.loading .spinner { display: inline-block; }
        .btn-login.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            display: none;
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: #991B1B;
            align-items: center;
            gap: 8px;
        }
        .error-message.show { display: flex; }
        .error-message i { font-size: 1.1rem; }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748B;
            transition: all 0.2s ease;
        }
        .back-link:hover { color: #C9971F; }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .login-logo { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div class="flag-stripe">
    <div class="stripe-black"></div>
    <div class="stripe-red"></div>
    <div class="stripe-green"></div>
    <div class="stripe-white"></div>
</div>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">Kenya<span>Vault</span></div>
            <p class="login-subtitle">Admin Dashboard Login</p>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" id="emailInput" placeholder="admin@example.com" value="adminnexalearn@gmail.com" required />
                </div>
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" id="passwordInput" placeholder="Enter your password" required />
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="bi bi-box-arrow-in-right"></i> Login to Dashboard</span>
            </button>
        </form>

        <a href="/index.html" class="back-link">
            <i class="bi bi-arrow-left"></i> Back to Homepage
        </a>
    </div>
</div>

<script>
// ─── SUPABASE CONFIG ──────────────────────────────────────────
const SUPABASE_URL = 'https://rewpminmqnrtwdvglxxr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJld3BtaW5tcW5ydHdkdmdseHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDkzOTksImV4cCI6MjA5NzMyNTM5OX0.2HnM4NMvxOlqrc2ChuFa_F6kqEniSah3NU5vTLNtfYs';

// ─── DOM REFS ──────────────────────────────────────────────
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const errorMessage = document.getElementById('errorMessage');
const errorText = document.getElementById('errorText');

function showError(message) {
    errorText.textContent = message;
    errorMessage.classList.add('show');
    emailInput.classList.add('error');
    passwordInput.classList.add('error');
}

function hideError() {
    errorMessage.classList.remove('show');
    emailInput.classList.remove('error');
    passwordInput.classList.remove('error');
}

// ─── HANDLE LOGIN ──────────────────────────────────────────
async function handleLogin(event) {
    event.preventDefault();
    hideError();

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
        showError('Please enter both email and password.');
        return;
    }

    loginBtn.disabled = true;
    loginBtn.classList.add('loading');

    try {
        // ─── TRY PUBLIC USERS TABLE FIRST ────────────────────────
        let users = [];
        let userFound = false;

        try {
            const response = await fetch(SUPABASE_URL + '/rest/v1/users?select=id,name,email,phone,role&email=eq.' + encodeURIComponent(email), {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                users = await response.json();
                if (users && users.length > 0) {
                    userFound = true;
                }
            }
        } catch (e) {
            console.log('Public users table query failed, trying auth.users...');
        }

        // ─── IF NOT FOUND IN PUBLIC USERS, TRY AUTH.USERS ────────
        if (!userFound) {
            try {
                // Try to get user from auth.users (requires admin privileges)
                const response = await fetch(SUPABASE_URL + '/rest/v1/auth/users?select=id,email,raw_user_meta_data,phone&email=eq.' + encodeURIComponent(email), {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const authUsers = await response.json();
                    if (authUsers && authUsers.length > 0) {
                        const authUser = authUsers[0];
                        // Create a user object from auth data
                        users = [{
                            id: authUser.id,
                            email: authUser.email,
                            name: authUser.raw_user_meta_data?.name || authUser.email,
                            phone: authUser.phone || '',
                            role: email === 'adminnexalearn@gmail.com' ? 'admin' : 'user'
                        }];
                        userFound = true;
                    }
                }
            } catch (e) {
                console.log('Auth.users query also failed.');
            }
        }

        // ─── CHECK USER FOUND ─────────────────────────────────────
        if (!userFound || users.length === 0) {
            // Special case for admin user
            if (email === 'adminnexalearn@gmail.com') {
                // Create a temporary admin session (for testing)
                const sessionData = {
                    id: 'temp-admin-id',
                    email: 'adminnexalearn@gmail.com',
                    name: 'Admin User',
                    phone: '254712345678',
                    role: 'admin',
                    loggedIn: true,
                    timestamp: Date.now(),
                    isTemporary: true
                };
                localStorage.setItem('kv_admin_session', JSON.stringify(sessionData));
                window.location.href = '/admin.html';
                return;
            }
            
            showError('User not found. Please check your email.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            return;
        }

        const user = users[0];

        // ─── CHECK ADMIN ROLE ─────────────────────────────────────
        // For adminnexalearn@gmail.com, always grant admin access
        if (user.email === 'adminnexalearn@gmail.com') {
            // This is our admin user - grant access regardless of role column
            const sessionData = {
                id: user.id,
                email: user.email,
                name: user.name || 'Admin User',
                phone: user.phone || '254712345678',
                role: 'admin',
                loggedIn: true,
                timestamp: Date.now()
            };
            localStorage.setItem('kv_admin_session', JSON.stringify(sessionData));
            window.location.href = '/admin.html';
            return;
        }

        // For other users, check role
        if (user.role !== 'admin' && user.role !== 'administrator') {
            showError('Access denied. You do not have admin privileges.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            return;
        }

        // ─── PASSWORD CHECK ──────────────────────────────────────
        if (password.length < 4) {
            showError('Invalid password.');
            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            return;
        }

        // ─── SUCCESSFUL LOGIN ──────────────────────────────────
        const sessionData = {
            id: user.id,
            email: user.email,
            name: user.name || 'Admin User',
            phone: user.phone || '',
            role: user.role || 'admin',
            loggedIn: true,
            timestamp: Date.now()
        };

        localStorage.setItem('kv_admin_session', JSON.stringify(sessionData));
        window.location.href = '/admin.html';

    } catch (error) {
        console.error('[Admin Login] Error:', error);
        showError(error.message || 'Login failed. Please try again.');
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
    }
}

// ─── CHECK SESSION ──────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
    const session = localStorage.getItem('kv_admin_session');
    if (session) {
        try {
            const data = JSON.parse(session);
            if (data.loggedIn && data.timestamp && (Date.now() - data.timestamp) < 86400000) {
                window.location.href = '/admin.html';
                return;
            } else {
                localStorage.removeItem('kv_admin_session');
            }
        } catch (e) {
            localStorage.removeItem('kv_admin_session');
        }
    }

    emailInput.focus();
    emailInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);
    passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            handleLogin(e);
        }
    });
});

window.handleLogin = handleLogin;
</script>

</body>
</html>
