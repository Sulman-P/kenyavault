<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Logging Out | KenyaVault</title>
    <meta http-equiv="refresh" content="2;url=/admin/login.html" />
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .logout-card {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
        }
        .logout-icon {
            font-size: 3rem;
            color: #10B981;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.3rem;
            color: #0F172A;
            margin-bottom: 8px;
        }
        p {
            color: #64748B;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #C9971F;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="logout-icon"><i class="bi bi-box-arrow-right"></i></div>
        <h1>Logging Out...</h1>
        <p>You are being redirected to the login page.</p>
        <div class="spinner"></div>
    </div>

    <script>
        // Clear session
        localStorage.removeItem('kv_admin_session');
        localStorage.removeItem('admin_auth_token');
        // Redirect after 2 seconds (handled by meta refresh)
    </script>
</body>
</html>
