<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard — Admin | KenyaVault</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <style>
        :root {
            --admin-primary: #0B2340;
            --admin-primary-light: #1a3a5a;
            --admin-primary-dark: #081a30;
            --admin-gold: #C9971F;
            --admin-gold-light: #E8B94A;
            --admin-gold-pale: #F7EBD0;
            --admin-white: #FFFFFF;
            --admin-bg: #F1F5F9;
            --admin-surface: #F8FAFC;
            --admin-neutral-50: #F8FAFC;
            --admin-neutral-100: #F1F5F9;
            --admin-neutral-200: #E2E8F0;
            --admin-neutral-300: #CBD5E1;
            --admin-neutral-400: #94A3B8;
            --admin-neutral-500: #64748B;
            --admin-neutral-600: #475569;
            --admin-neutral-700: #334155;
            --admin-neutral-800: #1E293B;
            --admin-neutral-900: #0F172A;
            --admin-radius: 12px;
            --admin-radius-sm: 8px;
            --admin-shadow: 0 1px 3px rgba(0,0,0,0.06);
            --admin-shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
            --admin-shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
            --admin-transition: all 0.2s ease;
            --admin-sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--admin-bg);
            color: var(--admin-neutral-800);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        .flag-stripe {
            height: 3px;
            width: 100%;
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }
        .flag-stripe .stripe-black { flex: 1; background: #000000; }
        .flag-stripe .stripe-red { flex: 1; background: #BB0000; }
        .flag-stripe .stripe-green { flex: 1; background: #1F7A3A; }
        .flag-stripe .stripe-white { flex: 1; background: var(--admin-white); }

        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            padding-top: 3px;
        }

        .admin-sidebar {
            width: var(--admin-sidebar-width);
            background: var(--admin-primary);
            border-right: 2px solid var(--admin-gold);
            position: fixed;
            top: 3px;
            left: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .admin-sidebar-brand {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-sidebar-brand .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--admin-white);
            letter-spacing: -0.5px;
        }
        .admin-sidebar-brand .logo span {
            color: var(--admin-gold-light);
        }
        .admin-sidebar-brand .badge {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 99px;
            background: var(--admin-gold);
            color: var(--admin-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-sidebar-nav {
            flex: 1;
            padding: 16px 12px;
        }
        .admin-sidebar-nav .nav-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.3);
            padding: 8px 12px 4px;
        }
        .admin-sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--admin-radius-sm);
            color: rgba(255,255,255,0.7);
            font-size: 0.82rem;
            font-weight: 500;
            transition: var(--admin-transition);
            margin-bottom: 2px;
        }
        .admin-sidebar-nav a i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .admin-sidebar-nav a:hover {
            background: rgba(255,255,255,0.06);
            color: var(--admin-white);
        }
        .admin-sidebar-nav a.active {
            background: rgba(201, 151, 31, 0.12);
            color: var(--admin-gold-light);
            border-right: 3px solid var(--admin-gold);
        }
        .admin-sidebar-nav a .nav-badge {
            margin-left: auto;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 99px;
            background: #EF4444;
            color: white;
        }
        .admin-sidebar-nav a .nav-badge.green { background: #10B981; }
        .admin-sidebar-nav a .nav-badge.amber { background: #F59E0B; }

        .admin-sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .admin-sidebar-footer .admin-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-sidebar-footer .admin-user .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--admin-gold-pale);
            color: var(--admin-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .admin-sidebar-footer .admin-user .info {
            flex: 1;
        }
        .admin-sidebar-footer .admin-user .info .name {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--admin-white);
        }
        .admin-sidebar-footer .admin-user .info .role {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.4);
        }
        .admin-sidebar-footer .admin-user .logout-btn {
            color: rgba(255,255,255,0.3);
            font-size: 1rem;
            transition: var(--admin-transition);
        }
        .admin-sidebar-footer .admin-user .logout-btn:hover {
            color: #EF4444;
        }

        .admin-sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }
        .admin-sidebar-overlay.open { display: block; }

        .admin-main-content {
            flex: 1;
            margin-left: var(--admin-sidebar-width);
            padding: 0 24px 40px;
            min-height: 100vh;
        }

        .admin-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--admin-neutral-200);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 3px;
            background: var(--admin-bg);
            z-index: 100;
        }
        .admin-topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-topbar-left .menu-toggle {
            display: none;
            font-size: 1.3rem;
            color: var(--admin-neutral-600);
            padding: 4px;
            border-radius: var(--admin-radius-sm);
            transition: var(--admin-transition);
        }
        .admin-topbar-left .menu-toggle:hover {
            background: var(--admin-neutral-200);
        }
        .admin-topbar-left h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--admin-neutral-800);
            letter-spacing: -0.3px;
        }
        .admin-topbar-left .page-badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--admin-gold-pale);
            color: var(--admin-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-topbar-right .date-display {
            font-size: 0.82rem;
            color: var(--admin-neutral-500);
        }
        .admin-topbar-right .admin-actions {
            display: flex;
            gap: 8px;
        }

        .admin-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--admin-radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            transition: var(--admin-transition);
            border: none;
            cursor: pointer;
        }
        .admin-btn-primary {
            background: var(--admin-gold);
            color: var(--admin-primary);
        }
        .admin-btn-primary:hover {
            background: var(--admin-gold-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(201, 151, 31, 0.3);
        }
        .admin-btn-secondary {
            background: var(--admin-neutral-200);
            color: var(--admin-neutral-700);
        }
        .admin-btn-secondary:hover {
            background: var(--admin-neutral-300);
        }
        .admin-btn-success {
            background: #10B981;
            color: white;
        }
        .admin-btn-success:hover {
            background: #059669;
        }
        .admin-btn-danger {
            background: #EF4444;
            color: white;
        }
        .admin-btn-danger:hover {
            background: #DC2626;
        }
        .admin-btn-sm {
            padding: 4px 12px;
            font-size: 0.72rem;
        }

        .admin-dashboard-content {
            max-width: 1400px;
        }

        .admin-header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .admin-header-flex .text-neutral-500 {
            color: var(--admin-neutral-500);
            font-size: 0.9rem;
        }

        .dash-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .dash-card {
            background: var(--admin-white);
            border-radius: var(--admin-radius);
            border: 1px solid var(--admin-neutral-200);
            padding: 20px 20px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--admin-transition);
        }
        .dash-card:hover {
            box-shadow: var(--admin-shadow-md);
            transform: translateY(-2px);
        }
        .dash-card-body {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }
        .dash-card-info { flex: 1; }
        .dash-card-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--admin-neutral-500);
        }
        .dash-card-number {
            display: block;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--admin-neutral-800);
            margin: 2px 0 4px;
            letter-spacing: -0.5px;
        }
        .dash-card-link {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--admin-gold);
            transition: var(--admin-transition);
        }
        .dash-card-link:hover {
            color: var(--admin-gold);
            text-decoration: underline;
        }
        .dash-card-trend {
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .dash-card-trend.up { color: #10B981; }
        .dash-card-trend.warning { color: #F59E0B; }
        .dash-card-trend.down { color: #EF4444; }

        .dash-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .dash-card-icon.blue { background: rgba(59,130,246,0.1); color: #3B82F6; }
        .dash-card-icon.green { background: rgba(16,185,129,0.1); color: #10B981; }
        .dash-card-icon.purple { background: rgba(139,92,246,0.1); color: #7C3AED; }
        .dash-card-icon.yellow { background: rgba(245,158,11,0.1); color: #F59E0B; }
        .dash-card-icon.pink { background: rgba(236,72,153,0.1); color: #EC4899; }
        .dash-card-icon.red { background: rgba(239,68,68,0.1); color: #EF4444; }
        .dash-card-icon.teal { background: rgba(20,184,166,0.1); color: #0D9488; }
        .dash-card-icon.orange { background: rgba(249,115,22,0.1); color: #F97316; }

        .dash-card-watermark {
            position: absolute;
            bottom: -12px;
            right: -8px;
            font-size: 4.5rem;
            opacity: 0.5;
            pointer-events: none;
            color: rgba(0,0,0,0.03);
        }

        .admin-section-card {
            background: var(--admin-white);
            border-radius: var(--admin-radius);
            border: 1px solid var(--admin-neutral-200);
            overflow: hidden;
            margin-bottom: 28px;
        }
        .table-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--admin-neutral-200);
            flex-wrap: wrap;
            gap: 8px;
        }
        .table-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--admin-neutral-800);
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }
        .table-card-title i {
            color: var(--admin-gold);
        }
        .admin-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--admin-neutral-100);
            color: var(--admin-neutral-500);
        }

        .table-container {
            overflow-x: auto;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .admin-table th {
            text-align: left;
            padding: 10px 16px;
            font-weight: 600;
            color: var(--admin-neutral-500);
            border-bottom: 1px solid var(--admin-neutral-200);
            background: var(--admin-neutral-50);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .admin-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--admin-neutral-100);
            vertical-align: middle;
        }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: var(--admin-neutral-50); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 99px;
            text-transform: capitalize;
        }
        .status-badge.completed { background: #DCFCE7; color: #15803D; }
        .status-badge.paid { background: #DCFCE7; color: #15803D; }
        .status-badge.success { background: #DCFCE7; color: #15803D; }
        .status-badge.pending { background: #FEF3C7; color: #92400E; }
        .status-badge.processing { background: #FEF3C7; color: #92400E; }
        .status-badge.failed { background: #FEE2E2; color: #991B1B; }
        .status-badge.unread { background: #DBEAFE; color: #1D4ED8; }
        .status-badge.read { background: var(--admin-neutral-100); color: var(--admin-neutral-500); }
        .status-badge.free { background: #DCFCE7; color: #15803D; }

        .admin-empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--admin-neutral-500);
        }
        .admin-empty-state i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            color: var(--admin-neutral-300);
        }
        .admin-empty-state p {
            font-size: 0.9rem;
            margin: 0;
        }

        .dash-insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }
        .dash-insight-card {
            background: var(--admin-white);
            border-radius: var(--admin-radius);
            border: 1px solid var(--admin-neutral-200);
            padding: 16px 18px;
            transition: var(--admin-transition);
        }
        .dash-insight-card:hover {
            box-shadow: var(--admin-shadow-md);
        }
        .dash-insight-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .dash-insight-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .dash-insight-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--admin-neutral-700);
            margin: 0;
        }
        .dash-insight-body { flex: 1; }
        .dash-insight-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        .dash-insight-label {
            font-size: 0.78rem;
            color: var(--admin-neutral-500);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .dash-insight-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--admin-neutral-800);
        }
        .dash-insight-revenue { color: var(--admin-gold); }
        .dash-insight-divider {
            height: 1px;
            background: var(--admin-neutral-100);
            margin: 2px 0;
        }
        .dash-insight-doc-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--admin-neutral-800);
            margin: 0 0 4px;
        }
        .dash-insight-sender {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--admin-neutral-800);
            margin: 0;
        }
        .dash-insight-message {
            font-size: 0.78rem;
            color: var(--admin-neutral-500);
            margin: 2px 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dash-insight-empty {
            font-size: 0.82rem;
            color: var(--admin-neutral-400);
            margin: 4px 0;
        }
        .dash-insight-link {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--admin-gold);
            transition: var(--admin-transition);
        }
        .dash-insight-link:hover {
            color: var(--admin-gold);
            text-decoration: underline;
        }

        .progress-bar-container {
            width: 100%;
            background: var(--admin-neutral-100);
            border-radius: 99px;
            height: 8px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--admin-gold);
            border-radius: 99px;
            transition: width 0.3s ease;
            width: 0%;
        }

        @media (max-width: 1024px) {
            .dash-stats-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-sidebar-overlay.open { display: block; }
            .admin-main-content { margin-left: 0; padding: 0 16px 40px; }
            .admin-topbar-left .menu-toggle { display: block; }
            .dash-stats-grid { grid-template-columns: repeat(2, 1fr); }
            .dash-insights-grid { grid-template-columns: 1fr; }
            .admin-header-flex { flex-direction: column; align-items: stretch; }
            .admin-topbar { flex-direction: column; align-items: stretch; gap: 8px; }
            .admin-topbar-right { justify-content: space-between; flex-wrap: wrap; }
        }
        @media (max-width: 480px) {
            .dash-stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .dash-card { padding: 14px; }
            .dash-card-number { font-size: 1.2rem; }
            .admin-table { font-size: 0.72rem; }
            .admin-table th, .admin-table td { padding: 6px 10px; }
            .table-card-header { flex-direction: column; align-items: stretch; }
            .table-card-header .admin-actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="flag-stripe">
    <div class="stripe-black"></div>
    <div class="stripe-red"></div>
    <div class="stripe-green"></div>
    <div class="stripe-white"></div>
</div>

<div class="admin-wrapper">

    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-brand">
            <div class="logo">Kenya<span>Vault</span></div>
            <span class="badge">Admin</span>
        </div>
        
        <nav class="admin-sidebar-nav">
            <div class="nav-label">Main</div>
            <a href="#" onclick="showSection('dashboard')" class="active">
                <i class="bi bi-grid-1x2-fill"></i> Dashboard
            </a>
            <a href="#" onclick="showSection('documents')">
                <i class="bi bi-file-earmark-text"></i> Resources
                <span class="nav-badge" id="docCount">0</span>
            </a>
            <a href="#" onclick="showSection('upload')">
                <i class="bi bi-upload"></i> Upload
            </a>
            <a href="#" onclick="showSection('bulk-upload')">
                <i class="bi bi-file-zip"></i> Bulk Upload ZIP
            </a>
            
            <div class="nav-label" style="margin-top:12px;">Commerce</div>
            <a href="#" onclick="showSection('transactions')">
                <i class="bi bi-receipt"></i> Transactions
                <span class="nav-badge amber" id="pendingCount">0</span>
            </a>
            <a href="#" onclick="showSection('analytics')">
                <i class="bi bi-bar-chart-fill"></i> Analytics
            </a>
            
            <div class="nav-label" style="margin-top:12px;">Users</div>
            <a href="#" onclick="showSection('users')">
                <i class="bi bi-people"></i> Users
                <span class="nav-badge" id="userCount">0</span>
            </a>

                <i class="bi bi-envelope-heart"></i> Subscribers

function formatCurrency(amount) {
    return 'KES ' + Number(amount).toLocaleString();
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleDateString('en-US', { 
        month: 'short', day: 'numeric', year: 'numeric' 
    });
}

function formatTime(dateStr) {
    if (!dateStr) return '—';
    return new Date(dateStr).toLocaleTimeString('en-US', { 
        hour: '2-digit', minute: '2-digit' 
    });
}

function timeAgo(dateStr) {
    if (!dateStr) return '—';
    const diff = Math.floor((new Date() - new Date(dateStr)) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return formatDate(dateStr);
}

function getInitials(name) {
    if (!name) return 'A';
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

function getStatusBadge(status) {

        'completed': 'completed',
        'paid': 'paid',
        'success': 'success',
        'pending': 'pending',
        'processing': 'processing',
        'failed': 'failed',
        'unread': 'unread',
        'read': 'read'
    };
    return 'status-badge ' + (statusMap[status] || 'pending');
}

function getFileIcon(filename) {

        'pdf': 'bi-file-earmark-pdf',

        'pptx': 'bi-file-earmark-slides',
        'zip': 'bi-file-earmark-zip',
        'rar': 'bi-file-earmark-zip'
    };
    return '<i class="bi ' + (icons[ext] || 'bi-file-earmark') + '"></i>';
}

// ─── SUPABASE FETCH ──────────────────────────────────────
async function fetchSupabase(table, options = {}) {
    const { select = '*', order = null, limit = null, filter = null } = options;
    let url = SUPABASE_URL + '/rest/v1/' + table + '?select=' + select;
    
    if (filter) url += '&' + filter;
    if (order) url += '&order=' + order;
    if (limit) url += '&limit=' + limit;
    
    try {
        const response = await fetch(url, {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.status === 404) {
            console.warn(`Table '${table}' not found. Returning empty array.`);
            return [];
        }
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error('API Error:', errorText);
            throw new Error('HTTP ' + response.status + ' - ' + errorText);
        }
        return response.json();
    } catch (error) {
        console.warn(`Error fetching from ${table}:`, error);
        return [];
    }
}

async function handleUpload(e) {

    statusDiv.textContent = 'Uploading...';
    statusDiv.style.background = 'var(--admin-neutral-100)';
    statusDiv.style.color = 'var(--admin-neutral-700)';
    
    try {
        const title = document.getElementById('docTitle').value;
        const description = document.getElementById('docDescription').value;
        const category = document.getElementById('docCategory').value;
        const level = document.getElementById('docLevel').value;
        const price = parseInt(document.getElementById('docPrice').value) || 0;
        const isFree = document.getElementById('docIsFree').checked;
        const fileInput = document.getElementById('docFile');
        
        if (!fileInput.files || fileInput.files.length === 0) {
            throw new Error('Please select a file to upload.');
        }
        
        const file = fileInput.files[0];
        
        // Upload file to Supabase Storage
        const filePath = 'resources/' + Date.now() + '_' + file.name;
        const storageUrl = SUPABASE_URL + '/storage/v1/object/' + filePath;
        
        const uploadResponse = await fetch(storageUrl, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': file.type
            },
            body: file
        });
        
        if (!uploadResponse.ok) {
            throw new Error('Failed to upload file to storage.');
        }
        
        const fileUrl = SUPABASE_URL + '/storage/v1/object/public/' + filePath;
        
        // Create resource record
        const resourceData = {
            title,
            description,
            category,
            education_level: level || null,
            level: level || null,
            price: isFree ? 0 : price,
            is_free: isFree,
            file_name: file.name,
            file_path: filePath,
            file_url: fileUrl,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
            download_count: 0
        };
        
        const createResponse = await fetch(SUPABASE_URL + '/rest/v1/resources', {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            },
            body: JSON.stringify(resourceData)
        });
        
        if (!createResponse.ok) {
            throw new Error('Failed to create resource record.');
        }
        
        statusDiv.style.background = '#DCFCE7';
        statusDiv.style.color = '#15803D';
        statusDiv.textContent = '✅ Resource uploaded successfully!';
        
        document.getElementById('uploadForm').reset();
        document.getElementById('docPrice').disabled = false;

    } catch (error) {

        statusDiv.textContent = '❌ ' + error.message;
    }

// ─── HANDLE BULK UPLOAD WITH UNZIP ─────────────────────────

async function handleBulkUpload(e) {
    e.preventDefault();
    
    const statusDiv = document.getElementById('bulkUploadStatus');
    const progressDiv = document.getElementById('bulkProgress');
    const progressBar = document.getElementById('bulkProgressBar');
    const progressText = document.getElementById('bulkProgressText');
    const progressPercent = document.getElementById('bulkProgressPercent');
    const submitBtn = document.getElementById('bulkSubmitBtn');
    
    statusDiv.style.display = 'block';
    statusDiv.textContent = 'Loading ZIP library...';
    statusDiv.style.background = 'var(--admin-neutral-100)';
    statusDiv.style.color = 'var(--admin-neutral-700)';
    progressDiv.style.display = 'block';
    submitBtn.disabled = true;
    progressBar.style.width = '0%';
    progressPercent.textContent = '0%';
    
    try {
        // Load JSZip using a more reliable method
        let JSZipLib;
        
        // Try to load from CDN with a script tag
        if (typeof JSZip === 'undefined') {
            statusDiv.textContent = 'Loading JSZip library from CDN...';
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Failed to load JSZip library from CDN'));
                document.head.appendChild(script);
            });
            // Wait a moment for the script to initialize
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        if (typeof JSZip === 'undefined') {
            throw new Error('JSZip library failed to load. Please try refreshing the page.');
        }
        
        const category = document.getElementById('bulkCategory').value;
        const level = document.getElementById('bulkLevel').value;
        const price = parseInt(document.getElementById('bulkPrice').value) || 0;
        const isFree = document.getElementById('bulkIsFree').checked;
        const fileInput = document.getElementById('bulkFile');
        
        if (!fileInput.files || fileInput.files.length === 0) {
            throw new Error('Please select a ZIP file.');
        }
        
        const zipFile = fileInput.files[0];
        
        // Read ZIP file
        statusDiv.textContent = 'Reading ZIP file...';
        const zipData = await zipFile.arrayBuffer();
        const zip = await JSZip.loadAsync(zipData);
        const files = zip.files;
        
        const fileNames = Object.keys(files).filter(name => !files[name].dir);
        const totalFiles = fileNames.length;
        
        if (totalFiles === 0) {
            throw new Error('ZIP file is empty or contains no files.');
        }
        
        statusDiv.textContent = `Found ${totalFiles} files in ZIP. Starting upload...`;
        
        let uploadedCount = 0;
        let failedFiles = [];
        let skippedFiles = [];
        
        // Process files in batches of 3 to avoid rate limiting
        const batchSize = 3;
        for (let i = 0; i < fileNames.length; i += batchSize) {
            const batch = fileNames.slice(i, i + batchSize);
            
            // Process batch in parallel
            const batchPromises = batch.map(async (filename, index) => {
                const fileData = files[filename];
                const fileIndex = i + index;
                
                // Update progress
                const percent = Math.round(((fileIndex + 1) / totalFiles) * 100);
                progressBar.style.width = percent + '%';
                progressPercent.textContent = percent + '%';
                progressText.textContent = `Processing ${fileIndex + 1}/${totalFiles}: ${filename}`;
                
                const ext = filename.split('.').pop().toLowerCase();
                const supportedExts = ['pdf', 'doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'];
                
                if (!supportedExts.includes(ext)) {
                    return { filename, status: 'skipped', reason: 'unsupported format' };
                }
                
                try {
                    const content = await fileData.async('blob');
                    const safeFilename = filename.replace(/[^a-zA-Z0-9.\-]/g, '_');
                    const filePath = 'resources/' + Date.now() + '_' + fileIndex + '_' + safeFilename;
                    const storageUrl = SUPABASE_URL + '/storage/v1/object/' + filePath;
                    
                    const uploadResponse = await fetch(storageUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                            'Content-Type': content.type || 'application/octet-stream'
                        },
                        body: content
                    });
                    
                    if (!uploadResponse.ok) {
                        return { filename, status: 'failed', reason: 'storage upload failed: ' + uploadResponse.status };
                    }
                    
                    const fileUrl = SUPABASE_URL + '/storage/v1/object/public/' + filePath;
                    
                    const resourceData = {
                        title: filename.replace(/\.[^.]+$/, '').replace(/[_\-]/g, ' ').trim() || 'Untitled',
                        description: 'Uploaded via bulk ZIP',
                        category: category,
                        education_level: level || null,
                        level: level || null,
                        price: isFree ? 0 : price,
                        is_free: isFree,
                        file_name: filename,
                        file_path: filePath,
                        file_url: fileUrl,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString(),
                        download_count: 0
                    };
                    
                    const createResponse = await fetch(SUPABASE_URL + '/rest/v1/resources', {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(resourceData)
                    });
                    
                    if (!createResponse.ok) {
                        return { filename, status: 'failed', reason: 'record creation failed: ' + createResponse.status };
                    }
                    
                    return { filename, status: 'success' };
                } catch (err) {
                    return { filename, status: 'failed', reason: err.message };
                }
            });
            
            // Wait for batch to complete
            const batchResults = await Promise.all(batchPromises);
            
            // Process batch results
            for (const result of batchResults) {
                if (result.status === 'success') {
                    uploadedCount++;
                } else if (result.status === 'skipped') {
                    skippedFiles.push(result.filename + ' (' + result.reason + ')');
                } else {
                    failedFiles.push(result.filename + ' (' + result.reason + ')');
                }
            }
        }
        
        // Final status
        let message = `✅ Uploaded ${uploadedCount} files successfully.`;
        if (skippedFiles.length > 0) {
            message += `\n📝 Skipped: ${skippedFiles.length} files (unsupported formats).`;
        }
        if (failedFiles.length > 0) {
            message += `\n⚠️ Failed: ${failedFiles.length} files - ${failedFiles.join(', ')}`;
        }
        
        statusDiv.style.background = failedFiles.length === 0 && skippedFiles.length === 0 ? '#DCFCE7' : '#FEF3C7';
        statusDiv.style.color = failedFiles.length === 0 && skippedFiles.length === 0 ? '#15803D' : '#92400E';
        statusDiv.textContent = message;
        statusDiv.style.whiteSpace = 'pre-wrap';
        
        progressText.textContent = 'Complete!';
        progressBar.style.width = '100%';
        progressPercent.textContent = '100%';
        
        document.getElementById('bulkUploadForm').reset();
        document.getElementById('bulkPrice').disabled = false;
        document.getElementById('zipFileInfo').textContent = '';
        
        setTimeout(loadAllData, 2000);
        
    } catch (error) {
        statusDiv.style.background = '#FEE2E2';
        statusDiv.style.color = '#991B1B';
        statusDiv.textContent = '❌ ' + error.message;
        statusDiv.style.whiteSpace = 'normal';
        progressDiv.style.display = 'none';
    } finally {
        submitBtn.disabled = false;
    }
}

// ─── ANALYTICS ──────────────────────────────────────────────

function renderAnalytics() {
    const { users, resources, transactions } = allData;
    
    const completedTxs = transactions.filter(t => t.status === 'completed' || t.status === 'paid' || t.status === 'success');
    const totalRevenue = completedTxs.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
    const avgOrderValue = completedTxs.length > 0 ? totalRevenue / completedTxs.length : 0;
    
    // Monthly revenue data
    const monthlyData = {};
    completedTxs.forEach(t => {
        const d = new Date(t.created_at);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        if (!monthlyData[key]) monthlyData[key] = 0;
        monthlyData[key] += Number(t.amount) || 0;
    });
    
    const monthlyLabels = Object.keys(monthlyData).sort();
    const monthlyValues = monthlyLabels.map(k => monthlyData[k]);
    
    // Category breakdown
    const categoryData = {};
    resources.forEach(r => {
        const cat = r.category || 'Uncategorized';
        if (!categoryData[cat]) categoryData[cat] = 0;
        categoryData[cat]++;
    });
    
    const html = `
        <div class="dash-stats-grid" style="grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));">
            <div class="dash-card">
                <div class="dash-card-body">
                    <div class="dash-card-info">

                        <span class="dash-card-number" style="font-size:1.2rem;">${formatCurrency(totalRevenue)}</span>
                    </div>
                </div>
            </div>
            <div class="dash-card">
                <div class="dash-card-body">
                    <div class="dash-card-info">
                        <span class="dash-card-label">Total Transactions</span>
                        <span class="dash-card-number" style="font-size:1.2rem;">${completedTxs.length}</span>
                    </div>
                </div>
            </div>
            <div class="dash-card">
                <div class="dash-card-body">
                    <div class="dash-card-info">
                        <span class="dash-card-label">Average Order Value</span>
                        <span class="dash-card-number" style="font-size:1.2rem;">${formatCurrency(avgOrderValue)}</span>
                    </div>
                </div>
            </div>
            <div class="dash-card">
                <div class="dash-card-body">
                    <div class="dash-card-info">
                        <span class="dash-card-label">Total Resources</span>
                        <span class="dash-card-number" style="font-size:1.2rem;">${resources.length}</span>
                    </div>
                </div>
            </div>
            <div class="dash-card">
                <div class="dash-card-body">
                    <div class="dash-card-info">
                        <span class="dash-card-label">Total Users</span>
                        <span class="dash-card-number" style="font-size:1.2rem;">${users.length}</span>
                    </div>
                </div>
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;">
            <div class="admin-section-card" style="margin-bottom:0;">
                <div class="table-card-header">
                    <h2 class="table-card-title" style="font-size:0.9rem;">
                        <i class="bi bi-bar-chart"></i> Monthly Revenue
                    </h2>
                </div>
                <div style="padding:20px;">
                    ${monthlyLabels.length === 0 ? `
                        <p style="text-align:center;color:var(--admin-neutral-400);">No revenue data yet.</p>
                    ` : `
                        <div style="display:flex;align-items:flex-end;height:200px;gap:12px;padding-top:8px;">
                            ${monthlyValues.map((val, i) => {
                                const maxVal = Math.max(...monthlyValues, 1);
                                const height = (val / maxVal) * 180;
                                return `
                                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
                                        <div style="font-size:0.7rem;font-weight:600;color:var(--admin-neutral-500);margin-bottom:4px;">${formatCurrency(val)}</div>
                                        <div style="width:100%;background:var(--admin-gold);border-radius:4px 4px 0 0;min-height:4px;height:${Math.max(height, 4)}px;transition:height 0.3s;"></div>
                                        <div style="font-size:0.6rem;color:var(--admin-neutral-400);margin-top:4px;transform:rotate(-45deg);transform-origin:center;white-space:nowrap;">${monthlyLabels[i]}</div>

// ─── ACTION FUNCTIONS ──────────────────────────────────────

function viewTransaction(id) {
    alert('Transaction details for ID: ' + id + '\nThis would open a detailed view.');
}

function viewMessage(id) {
    alert('Message details for ID: ' + id + '\nThis would open the full message.');
}

async function markMessageRead(id) {
    try {
        await fetch(SUPABASE_URL + '/rest/v1/contact_messages?id=eq.' + id, {
            method: 'PATCH',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ status: 'read' })
        });
        await loadAllData();
    } catch (error) {
        console.error('Error marking message as read:', error);
        alert('Failed to mark message as read.');
    }
}

async function markAllRead() {
    if (!confirm('Mark all messages as read?')) return;
    try {
        const unreadMessages = allData.messages.filter(m => m.status === 'unread' || m.status === 'new');
        for (const msg of unreadMessages) {
            await fetch(SUPABASE_URL + '/rest/v1/contact_messages?id=eq.' + msg.id, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'read' })
            });
        }
        await loadAllData();
    } catch (error) {
        console.error('Error marking all as read:', error);
        alert('Failed to mark all messages as read.');
    }
}

async function deleteDocument(id) {
    if (!confirm('Are you sure you want to delete this resource?')) return;
    try {
        await fetch(SUPABASE_URL + '/rest/v1/resources?id=eq.' + id, {
            method: 'DELETE',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
        });
        await loadAllData();
    } catch (error) {
        console.error('Error deleting document:', error);
        alert('Failed to delete document.');
    }
}

async function refreshData() {
    document.getElementById('mainContent').innerHTML = `
        <div style="display:flex;justify-content:center;align-items:center;padding:60px;">
            <div style="text-align:center;">
                <i class="bi bi-arrow-clockwise" style="font-size:2rem;color:var(--admin-gold);display:block;margin-bottom:12px;animation:spin 1s linear infinite;"></i>
                <p style="color:var(--admin-neutral-500);">Refreshing data...</p>
            </div>
        </div>
        <style>
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        </style>
    `;
    await loadAllData();
}

// ─── INIT ──────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', function() {
    // Check for admin session
    const session = localStorage.getItem('kv_admin_session');
    if (!session) {
        window.location.href = '/admin/login.html';
        return;
    }

    try {
        const sessionData = JSON.parse(session);
        if (!sessionData.loggedIn || !sessionData.timestamp || (Date.now() - sessionData.timestamp) > 86400000) {
            localStorage.removeItem('kv_admin_session');
            window.location.href = '/admin/login.html';
            return;
        }
        
        if (sessionData.name) {
            document.getElementById('adminName').textContent = sessionData.name;
            document.getElementById('adminAvatar').textContent = getInitials(sessionData.name);
        }
    } catch (e) {
        console.warn('Invalid session data:', e);
        localStorage.removeItem('kv_admin_session');
        window.location.href = '/admin/login.html';
        return;
    }

    // Set date
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', { 
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' 
    });

    // Load data
    loadAllData();

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('adminSidebarOverlay');
            if (sidebar && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            }
        }
    });
});
