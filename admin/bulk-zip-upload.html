// ── HELPERS ──────────────────────────────────────────────
function formatCurrency(amount) {
    return 'KES ' + Number(amount).toLocaleString();
}

function getInitials(name) {
    if (!name) return 'A';
    return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

function getFileIcon(filename) {
    if (!filename) return '<i class="bi bi-file-earmark"></i>';
    const ext = filename.split('.').pop().toLowerCase();
    const icons = {
        'pdf': 'bi-file-earmark-pdf',
        'doc': 'bi-file-earmark-word',
        'docx': 'bi-file-earmark-word',
        'xls': 'bi-file-earmark-excel',
        'xlsx': 'bi-file-earmark-excel',
        'ppt': 'bi-file-earmark-slides',
        'pptx': 'bi-file-earmark-slides',
        'zip': 'bi-file-earmark-zip'
    };
    return '<i class="bi ' + (icons[ext] || 'bi-file-earmark') + '"></i>';
}

// ─── PARSE FILENAME WITH REGEX ────────────────────────────
function parseCurriculumFilename(filename) {
    const rawName = filename.replace(/\.[^.]+$/, '');
    const ext = filename.split('.').pop().toLowerCase();
    const normalized = rawName.replace(/[_\-]/g, ' ').replace(/\s+/g, ' ');
    
    // 1. Detect Category
    let categoryName = 'Schemes of Work';
    if (/lesson\s*plan|lp\b/i.test(normalized)) {
        categoryName = 'Lesson Plans';
    } else if (/notes|revision|summary|guide/i.test(normalized)) {
        categoryName = 'Notes';
    } else if (/exam|assessment|test|eval|paper|mock|opener|mid\s*term/i.test(normalized)) {
        categoryName = 'Exams';
    } else if (/setbook|novel|play|fasihi/i.test(normalized)) {
        categoryName = 'Setbook Guides';
    }
    
    // 2. Detect Grade & Level
    let gradeTitle = 'Grade 8';
    let levelTitle = 'Junior Secondary';
    let levelCode = 'junior-secondary';
    
    const gradeMatch = normalized.match(/\b(?:grade|grd|g)[-_\s]*(1[0-2]|[1-9])\b/i);
    if (gradeMatch) {
        const gNum = parseInt(gradeMatch[1]);
        gradeTitle = `Grade ${gNum}`;
        if (gNum <= 3) { levelTitle = 'Lower Primary'; levelCode = 'lower-primary'; }
        else if (gNum <= 6) { levelTitle = 'Upper Primary'; levelCode = 'upper-primary'; }
        else if (gNum <= 9) { levelTitle = 'Junior Secondary'; levelCode = 'junior-secondary'; }
        else { levelTitle = 'Senior Secondary'; levelCode = 'senior-secondary'; }
    } else if (/form\s*([1-4])/i.test(normalized)) {
        const fm = normalized.match(/form\s*([1-4])/i);
        gradeTitle = `Form ${fm[1]}`;
        levelTitle = 'Secondary';
        levelCode = 'secondary';
    } else if (/pp\s*([1-2])/i.test(normalized)) {
        const pm = normalized.match(/pp\s*([1-2])/i);
        gradeTitle = `PP${pm[1]}`;
        levelTitle = 'Lower Primary';
        levelCode = 'lower-primary';
    } else if (/senior\s*(school|secondary)/i.test(normalized)) {
        levelTitle = 'Senior Secondary';
        levelCode = 'senior-secondary';
        gradeTitle = 'Grade 10';
    } else if (/jss|junior\s*secondary/i.test(normalized)) {
        levelTitle = 'Junior Secondary';
        levelCode = 'junior-secondary';
        gradeTitle = 'Grade 8';
    } else if (/secondary|kcse|8-4-4/i.test(normalized)) {
        levelTitle = 'Secondary';
        levelCode = 'secondary';
        gradeTitle = 'Form 1';
    }
    
    // 3. Detect Term
    let termTitle = 'Term 1';
    const termMatch = normalized.match(/\b(?:term|t)[-_\s]*([1-3]|i{1,3})\b/i);
    if (termMatch) {
        const tNum = termMatch[1].toLowerCase();
        if (tNum === 'i' || tNum === '1') termTitle = 'Term 1';
        else if (tNum === 'ii' || tNum === '2') termTitle = 'Term 2';
        else if (tNum === 'iii' || tNum === '3') termTitle = 'Term 3';
    }
    
    // 4. Clean Title
    let cleanTitle = normalized.replace(/\b(?:grade|grd|g|form|f|term|t|pp|jss|kcse|8-4-4)\s*\d+\b/gi, '')
                               .replace(/\b(?:lesson\s*plan|lp|notes|revision|summary|guide|exam|assessment|test|eval|paper|mock|opener|mid\s*term|setbook|novel|play|fasihi|senior|junior|secondary|primary|school)\b/gi, '')
                               .replace(/\s+/g, ' ')
                               .trim();
    if (!cleanTitle) cleanTitle = rawName;
    cleanTitle = cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1);
    if (!/\b202[5-9]\b/.test(cleanTitle)) {
        cleanTitle += ' ' + new Date().getFullYear();
    }
    
    // Find category ID
    let categoryId = 1;
    const catMatch = categories.find(c => c.title && c.title.toLowerCase().includes(categoryName.toLowerCase()));
    if (catMatch) categoryId = catMatch.id;
    
    return {
        originalFilename: filename,
        cleanTitle: cleanTitle,
        categoryId: categoryId,
        categoryName: categoryName,
        levelTitle: levelTitle,
        levelCode: levelCode,
        gradeTitle: gradeTitle,
        termTitle: termTitle,
        price: 50,
        extension: ext
    };
}

// ─── SUPABASE API ──────────────────────────────────────────

async function supabaseFetch(endpoint, options = {}) {
    const url = SUPABASE_URL + endpoint;
    const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json'
    };
    
    const config = {
        headers: headers,
        ...options
    };
    
    try {
        const response = await fetch(url, config);
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errorText}`);
        }
        return await response.json();
    } catch (error) {
        console.error('Supabase API Error:', error);
        throw error;
    }
}

async function fetchCategories() {
    try {
        const data = await supabaseFetch('/rest/v1/categories?select=*');
        if (data && data.length > 0) {
            categories = data;
        } else {
            // Fallback categories
            categories = [
                { id: 1, title: 'Schemes of Work' },
                { id: 2, title: 'Lesson Plans' },
                { id: 3, title: 'Notes' },
                { id: 4, title: 'Exams' },
                { id: 5, title: 'Setbook Guides' }
            ];
        }
        return categories;
    } catch (error) {
        console.warn('Error fetching categories, using fallback:', error);
        categories = [
            { id: 1, title: 'Schemes of Work' },
            { id: 2, title: 'Lesson Plans' },
            { id: 3, title: 'Notes' },
            { id: 4, title: 'Exams' },
            { id: 5, title: 'Setbook Guides' }

        return categories;
    }
}

async function uploadToStorage(file, fileName) {
    const filePath = 'resources/' + new Date().getFullYear() + '/' + 
                     String(new Date().getMonth() + 1).padStart(2, '0') + '/' + 
                     Date.now() + '_' + fileName;
    const url = SUPABASE_URL + '/storage/v1/object/' + filePath;
    
    const response = await fetch(url, {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': file.type || 'application/octet-stream'
        },
        body: file
    });
    
    if (!response.ok) {
        const errorText = await response.text();
        throw new Error('Failed to upload to storage: ' + response.status + ' - ' + errorText);
    }
    
    return SUPABASE_URL + '/storage/v1/object/public/' + filePath;
}

async function createDocument(docData) {
    console.log('Creating document with data:', docData);
    
    const response = await fetch(SUPABASE_URL + '/rest/v1/resources', {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        },
        body: JSON.stringify(docData)
    });
    
    if (!response.ok) {
        const errorText = await response.text();
        console.error('Create document error response:', errorText);
        throw new Error('Failed to create document: ' + response.status + ' - ' + errorText);
    }
    
    return await response.json();
}

            e.preventDefault();
            this.classList.remove('dragover');
        });
        dropzone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                zipInput.files = files;
                zipInput.dispatchEvent(new Event('change'));

// ─── ZIP PROCESSING ──────────────────────────────────────

async function processZipFile(file) {
    const progressContainer = document.getElementById('uploadProgressContainer');
    const progressBar = document.getElementById('uploadProgressBar');
    const statusText = document.getElementById('uploadStatusText');
    const dropzoneTitle = document.getElementById('dropzoneTitle');
    const dropzoneSub = document.getElementById('dropzoneSub');
    
    try {
        if (typeof JSZip === 'undefined') {
            throw new Error('JSZip library not loaded. Please refresh the page.');
        }
        
        statusText.textContent = 'Reading ZIP file...';
        progressBar.style.width = '20%';
        
        const zipData = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(zipData);
        const files = zip.files;
        
        const fileNames = Object.keys(files).filter(name => !files[name].dir);
        const totalFiles = fileNames.length;
        
        if (totalFiles === 0) {
            throw new Error('ZIP file is empty or contains no files.');
        }
        
        statusText.textContent = `Found ${totalFiles} files. Extracting and parsing...`;
        progressBar.style.width = '40%';
        
        const supportedExts = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'];
        let extracted = [];
        let skipped = [];
        
        for (let i = 0; i < fileNames.length; i++) {
            const filename = fileNames[i];
            const fileData = files[filename];
            
            // Update progress
            const percent = 40 + Math.round(((i + 1) / totalFiles) * 40);
            progressBar.style.width = percent + '%';
            statusText.textContent = `Processing ${i + 1}/${totalFiles}: ${filename}`;
            
            // Skip macOS metadata
            if (filename.includes('__MACOSX') || filename.startsWith('._')) {
                continue;
            }
            
            const ext = filename.split('.').pop().toLowerCase();
            if (!supportedExts.includes(ext)) {
                skipped.push(filename);
                continue;
            }
            
            try {
                const content = await fileData.async('blob');
                const meta = parseCurriculumFilename(filename);
                meta.content = content;
                meta.fileSize = content.size;
                extracted.push(meta);
            } catch (err) {
                console.warn('Error extracting file:', filename, err);
                skipped.push(filename + ' (error)');
            }
        }
        
        progressBar.style.width = '90%';
        statusText.textContent = 'Extraction complete!';
        
        if (extracted.length === 0) {
            throw new Error('No supported files found in ZIP. Supported: PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX');
        }
        
        stagedFiles = extracted;
        localStorage.setItem('staged_bulk_files', JSON.stringify(stagedFiles));
        
        progressBar.style.width = '100%';
        statusText.textContent = `✅ Extracted ${extracted.length} files successfully!`;
        
        if (dropzoneTitle) dropzoneTitle.textContent = '✅ ' + extracted.length + ' files extracted!';
        if (dropzoneSub) dropzoneSub.textContent = 'Click "Review & Publish" to continue.';
        
        setTimeout(() => {
            currentStep = 'review';
            renderReview();
        }, 1000);
        
    } catch (error) {
        console.error('Error processing ZIP:', error);
        statusText.textContent = '❌ Error: ' + error.message;
        statusText.style.color = '#DC2626';
        alert('Error processing ZIP: ' + error.message);
    }
}

// ─── PUBLISH ──────────────────────────────────────────────

async function publishAll() {
    if (isProcessing) return;
    if (stagedFiles.length === 0) {
        alert('No files to publish.');
        return;
    }
    
    // Get selected files from checkboxes
    const selectedCheckboxes = document.querySelectorAll('.file-cb:checked');
    if (selectedCheckboxes.length === 0) {
        alert('Please select at least one file to publish.');
        return;
    }
    
    const selectedIndices = Array.from(selectedCheckboxes).map(cb => parseInt(cb.value));
    const titles = {};
    const prices = {};
    const categoryIds = {};
    
    document.querySelectorAll('input[name^="titles["]').forEach(input => {
        const match = input.name.match(/titles\[(\d+)\]/);
        if (match) titles[match[1]] = input.value;
    });
    
    document.querySelectorAll('input[name^="prices["]').forEach(input => {
        const match = input.name.match(/prices\[(\d+)\]/);
        if (match) prices[match[1]] = parseInt(input.value) || 0;
    });
    
    document.querySelectorAll('select[name^="category_ids["]').forEach(select => {
        const match = select.name.match(/category_ids\[(\d+)\]/);
        if (match) categoryIds[match[1]] = parseInt(select.value);
    });
    
    const publishBtn = document.getElementById('publishBtn');
    if (publishBtn) {
        publishBtn.disabled = true;
        publishBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Publishing...';
    }
    
    isProcessing = true;
    let published = 0;
    let failed = 0;
    let errors = [];
    
    try {
        for (const idx of selectedIndices) {
            const file = stagedFiles[idx];
            if (!file) continue;
            
            const title = titles[idx] || file.cleanTitle;
            const price = prices[idx] || file.price || 50;
            const categoryId = categoryIds[idx] || file.categoryId;
            
            // Update progress on button
            if (publishBtn) {
                publishBtn.innerHTML = `<i class="bi bi-hourglass-split"></i> Publishing ${published + 1}/${selectedIndices.length}...`;
            }
            
            try {
                // Upload to storage
                const blob = file.content;
                const safeFilename = file.originalFilename.replace(/[^a-zA-Z0-9.]/g, '_');
                const fileUrl = await uploadToStorage(blob, safeFilename);
                
                // Create document record - MATCH YOUR TABLE SCHEMA
                // Only send fields that exist in your resources table
                const docData = {
                    title: title,
                    description: 'Uploaded via bulk ZIP import',
                    category: file.categoryName,
                    price: price,
                    is_free: price === 0,
                    file_name: safeFilename,
                    file_url: fileUrl,
                    created_at: new Date().toISOString(),
                    download_count: 0
                };
                
                // Add optional fields if they exist in your table
                if (file.levelTitle) docData.education_level = file.levelTitle;
                if (file.gradeTitle) docData.grade = file.gradeTitle;
                
                console.log('Creating document:', docData);
                await createDocument(docData);
                published++;
            } catch (err) {
                console.error('Error publishing file:', file.originalFilename, err);
                failed++;
                errors.push(file.originalFilename + ': ' + err.message);
            }
        }
        
        // Clear staged files after successful publish
        stagedFiles = [];
        localStorage.removeItem('staged_bulk_files');
        
        // Show completion
        renderComplete(published, failed);
        
        let message = `✅ Published ${published} files successfully.`;
        if (failed > 0) {
            message += `\n⚠️ ${failed} files failed: ${errors.join('; ')}`;
        }
        if (failed === 0) {
            alert(message);
        } else {
            alert(message);
        }
        
    } catch (error) {
        console.error('Publish error:', error);
        alert('Error publishing: ' + error.message);
    } finally {
        isProcessing = false;
    }
}

async function init() {

    const session = localStorage.getItem('kv_admin_session');
    if (!session) {
        window.location.href = 'admin-login.html';
        return;
    }
    
    try {
        const sessionData = JSON.parse(session);
        if (!sessionData.loggedIn || !sessionData.timestamp || (Date.now() - sessionData.timestamp) > 86400000) {
            localStorage.removeItem('kv_admin_session');
            window.location.href = 'admin-login.html';
            return;
        }
        if (sessionData.name) {
            document.getElementById('adminName').textContent = sessionData.name;
            document.getElementById('adminAvatar').textContent = getInitials(sessionData.name);
        }
    } catch (e) {
        localStorage.removeItem('kv_admin_session');
        window.location.href = 'admin-login.html';
        return;
    }
    
    // Set date
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', { 
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' 
    });
    
    // Load categories
    await fetchCategories();
    window.categories = categories;
    
    // Check for staged files in localStorage
    const stored = localStorage.getItem('staged_bulk_files');
    if (stored) {
        try {
            const parsed = JSON.parse(stored);
            if (parsed && parsed.length > 0) {
                stagedFiles = parsed;
                currentStep = 'review';
                renderReview();
                return;
            }
        } catch (e) {
            localStorage.removeItem('staged_bulk_files');
        }
    }
    
    // Default: show upload
    currentStep = 'upload';
    renderUpload();
}
