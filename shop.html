        // ── HELPER FUNCTIONS ──
        function formatPhoneNumber(phone) {
            let cleaned = phone.replace(/\s/g, '');
            if (cleaned.startsWith('0')) {
                return '254' + cleaned.substring(1);
            } else if (cleaned.startsWith('+')) {
                return cleaned.substring(1);
            } else if (cleaned.length === 9 && cleaned.startsWith('7')) {
                return '254' + cleaned;
            } else if (/^254[0-9]{9}$/.test(cleaned)) {
                return cleaned;
            }
            return null;
        }

        function generateIdempotencyKey() {
            return `ik_${Date.now()}_${Math.random().toString(36).substring(2, 10)}`;
        }

        // ── TOAST SYSTEM ──
        function showToast(message, type = 'success', title = null) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const titleEl = document.getElementById('toastTitle');
            const messageEl = document.getElementById('toastMessage');

            toast.classList.remove('error');
            if (type === 'error') {
                toast.classList.add('error');
                icon.textContent = '❌';
                titleEl.textContent = title || 'Error';
            } else if (type === 'warning') {
                toast.classList.add('error');
                icon.textContent = '⚠️';
                titleEl.textContent = title || 'Warning';
            } else {
                icon.textContent = '✅';
                titleEl.textContent = title || 'Success';
            }

            messageEl.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                hideToast();
            }, 5000);
        }

        function hideToast() {
            document.getElementById('toast').classList.remove('show');
        }

        // ── FETCH RESOURCES ──
        async function fetchResources() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/resources?select=*&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                return await response.json() || [];
            } catch (error) {
                console.error('❌ Fetch error:', error);
                throw error;
            }
        }

        // ── SECURE ORDER CREATION ──
        async function createSecureOrder(productId, customerName, phone) {
            try {
                console.log('📦 Creating order for product:', productId);
                
                const response = await fetch(`${SUPABASE_URL}/functions/v1/create-order`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        resource_id: productId,
                        customer_name: customerName,
                        phone: phone,
                        idempotency_key: generateIdempotencyKey()
                    })
                });

                console.log('📦 Order response status:', response.status);

                if (!response.ok) {
                    let errorMessage = `Order creation failed (${response.status})`;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        // If response is not JSON, try to get text
                        const text = await response.text();
                        if (text) errorMessage = text;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();
                console.log('✅ Order created:', result);
                return result;
            } catch (error) {
                console.error('❌ Create order error:', error);
                throw error;
            }
        }

        // ── SECURE PAYMENT INITIATION ──
        async function initiateSecurePayment(orderId, orderRef, phone, customerName) {
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/initiate-payment`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        order_id: orderId,
                        order_ref: orderRef,
                        phone: phone,
                        customer_name: customerName
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Payment initiation failed (${response.status})`);
                }

                const result = await response.json();
                return result;
            } catch (error) {
                console.error('❌ Payment initiation error:', error);
                throw error;
            }
        }

        // ── SECURE PAYMENT VERIFICATION ──
        async function verifyPayment(orderRef) {
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/verify-payment`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        order_ref: orderRef
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Payment verification failed (${response.status})`);
                }

                const result = await response.json();
                return result;
            } catch (error) {
                console.error('❌ Payment verification error:', error);
                throw error;
            }
        }

        // ── CHECK PAYMENT STATUS ──
        async function checkOrderPaymentStatus() {
            if (!currentOrderRef && !currentOrderId) {
                showToast('No active payment to verify', 'warning');
                return;
            }
            
            try {
                const statusEl = document.getElementById('verificationStatus');
                statusEl.style.display = 'block';
                statusEl.innerHTML = '⏳ Checking payment status...';
                statusEl.style.color = '#667085';

                const result = await verifyPayment(currentOrderRef);
                
                if (result.status === 'paid') {
                    stopPaymentPolling();
                    statusEl.innerHTML = '✅ Payment verified successfully!';
                    statusEl.style.color = '#16A34A';
                    showSuccess(result.order_ref);
                    mpesaVerificationBox.classList.remove('visible');
                    setTimeout(() => closeCheckoutModal(), 1500);
                    return true;
                } else if (result.status === 'payment_mismatch') {
                    stopPaymentPolling();
                    statusEl.innerHTML = `⚠️ Payment mismatch! Expected: KES ${result.expected_amount}, Paid: KES ${result.paid_amount}`;
                    statusEl.style.color = '#DC2626';
                    mpesaVerificationBox.classList.remove('visible');
                    showMismatchModal(result.expected_amount, result.paid_amount);
                    return false;
                } else if (result.status === 'failed') {
                    stopPaymentPolling();
                    statusEl.innerHTML = '❌ Payment verification failed: ' + (result.message || 'Unknown error');
                    statusEl.style.color = '#DC2626';
                    showToast('Payment verification failed', 'error');
                    return false;
                } else {
                    statusEl.innerHTML = '⏳ Payment still pending. Please wait...';
                    statusEl.style.color = '#667085';
                    return null;
                }
            } catch (error) {
                console.error('❌ Status check error:', error);
                const statusEl = document.getElementById('verificationStatus');
                statusEl.innerHTML = '❌ Error checking payment: ' + error.message;
                statusEl.style.color = '#DC2626';
                return null;
            }
        }

        // ── PAYMENT POLLING ──
        function startPaymentPolling() {
            stopPaymentPolling();
            paymentCheckAttempts = 0;
            const statusEl = document.getElementById('verificationStatus');
            statusEl.style.display = 'block';
            statusEl.innerHTML = '⏳ Waiting for payment confirmation...';
            statusEl.style.color = '#667085';

            paymentPollingInterval = setInterval(async () => {
                paymentCheckAttempts++;
                const result = await checkOrderPaymentStatus();
                if (result !== null) {
                    stopPaymentPolling();
                }
                if (paymentCheckAttempts >= MAX_POLLING_ATTEMPTS) {
                    stopPaymentPolling();
                    statusEl.innerHTML = '⏳ Payment verification timed out. Please check your M-PESA and try again.';
                    statusEl.style.color = '#667085';
                    showToast('Payment verification timed out. Please check your M-PESA.', 'warning');
                }
            }, 3000);
            
            setTimeout(() => checkOrderPaymentStatus(), 1000);
        }

        function stopPaymentPolling() {
            if (paymentPollingInterval) {
                clearInterval(paymentPollingInterval);
                paymentPollingInterval = null;
            }
        }

        // ── CHECKOUT FLOW ──
        async function initiatePayment() {
            if (isProcessing) return;

            // Validate name
            const customerName = customerNameInput.value.trim();
            if (!customerName || customerName.length < 2) {
                customerNameInput.classList.add('error');
                nameError.classList.add('visible');
                customerNameInput.focus();
                return;
            }
            customerNameInput.classList.remove('error');
            nameError.classList.remove('visible');

            // Validate phone
            const phone = phoneInput.value.trim().replace(/\s/g, '');
            if (!phone || phone.length < 9) {
                phoneInput.classList.add('error');
                phoneError.classList.add('visible');
                phoneInput.focus();
                return;
            }

            const formattedPhone = formatPhoneNumber(phone);
            if (!formattedPhone) {
                phoneInput.classList.add('error');
                phoneError.classList.add('visible');
                phoneInput.focus();
                return;
            }
            phoneInput.classList.remove('error');
            phoneError.classList.remove('visible');

            if (!currentProduct) {
                showToast('No product selected', 'error');
                return;
            }

            isProcessing = true;
            payPrimaryBtn.disabled = true;
            payPrimaryBtn.classList.add('loading');

            try {
                // 1. Create order securely (backend fetches price from DB)
                showToast('Creating order...', 'info', '⏳ Processing');
                
                const orderResult = await createSecureOrder(currentProduct.id, customerName, formattedPhone);
                
                currentOrderRef = orderResult.order_ref;
                currentOrderId = orderResult.order_id;
                
                // Update UI with server-controlled price
                const displayPrice = `KES ${orderResult.amount}`;
                checkoutTotal.textContent = displayPrice;
                checkoutGrandTotal.textContent = displayPrice;
                
                // 2. Initiate payment with server-controlled amount
                showToast('Initiating payment...', 'info', '⏳ Processing');
                
                const paymentResult = await initiateSecurePayment(
                    orderResult.order_id,
                    orderResult.order_ref,
                    formattedPhone,
                    customerName
                );

                // 3. Open MegaPay in new window
                if (paymentResult.payment_url) {
                    megapayWindow = window.open(paymentResult.payment_url, '_blank', 'width=500,height=700,scrollbars=yes');
                    if (!megapayWindow) {
                        showToast('⚠️ Please allow popups to complete payment.', 'warning');
                        payPrimaryBtn.style.display = 'none';
                        mpesaVerificationBox.classList.add('visible');
                        return;
                    }
                }

                // 4. Show verification box and start polling
                payPrimaryBtn.style.display = 'none';
                mpesaVerificationBox.classList.add('visible');
                startPaymentPolling();

                showToast('Payment initiated. Please complete the payment in MegaPay.', 'success', 'Payment Started');

            } catch (error) {
                console.error('❌ Payment flow error:', error);
                showToast('❌ Payment failed: ' + error.message, 'error');
                payPrimaryBtn.classList.remove('loading');
                payPrimaryBtn.disabled = false;
                payPrimaryBtn.style.display = 'flex';
            } finally {
                isProcessing = false;
                payPrimaryBtn.classList.remove('loading');
                payPrimaryBtn.disabled = false;
            }
        }

        // ── MISMATCH MODAL ──

            currentProduct = null;

        // ── CLOSE CHECKOUT MODAL ──
        function closeCheckoutModal() {
            checkoutModal.classList.remove('open');
            document.body.style.overflow = '';
            mpesaVerificationBox.classList.remove('visible');
            payPrimaryBtn.style.display = 'flex';
            payPrimaryBtn.classList.remove('loading');
            payPrimaryBtn.disabled = false;
            const statusEl = document.getElementById('verificationStatus');
            statusEl.style.display = 'none';
            if (megapayWindow) { megapayWindow.close(); megapayWindow = null; }
            stopPaymentPolling();
        }

        // ── OPEN CHECKOUT ──
        function openCheckout(productId) {
            const product = allResources.find(r => r.id === productId);
            if (!product) {
                showToast('Product not found', 'error');
                return;
            }

            currentProduct = product;
            customerNameInput.value = '';
            customerNameInput.classList.remove('error');
            nameError.classList.remove('visible');
            phoneInput.value = '';
            phoneInput.classList.remove('error');
            phoneError.classList.remove('visible');
            payPrimaryBtn.style.display = 'flex';
            payPrimaryBtn.classList.remove('loading');
            payPrimaryBtn.disabled = false;
            mpesaVerificationBox.classList.remove('visible');
            const statusEl = document.getElementById('verificationStatus');
            statusEl.style.display = 'none';

            const isFree = (product.price === 0 || product.price === null || product.price === undefined);
            const displayPrice = isFree ? 'FREE' : `KES ${product.price || 0}`;
            checkoutItemTitle.textContent = product.title || 'Resource';
            checkoutTotal.textContent = displayPrice;
            checkoutGrandTotal.textContent = displayPrice;

            checkoutModal.classList.add('open');
            document.body.style.overflow = 'hidden';
            setTimeout(() => customerNameInput.focus(), 300);
        }

        // ── CART FUNCTIONS ──
        function loadCart() {
            try {
                const raw = localStorage.getItem('kenyavault_cart');
                cart = raw ? JSON.parse(raw) : [];
            } catch (e) { cart = []; }
            updateCartBadge();
        }

        function saveCart() {
            try {
                localStorage.setItem('kenyavault_cart', JSON.stringify(cart));
            } catch (e) {}
            updateCartBadge();
        }

        function getCartItemCount() {
            return cart.reduce((sum, ci) => sum + ci.qty, 0);
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartFabBadge');
            if (!badge) return;
            const count = getCartItemCount();
            badge.textContent = count;
            badge.classList.toggle('visible', count > 0);
        }

        function addToCart(productId) {
            const product = allResources.find(r => r.id === productId);
            if (!product) return;
            const existing = cart.find(ci => ci.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title || 'Resource',
                    price: product.price || 0,
                    qty: 1
                });
            }
            saveCart();
            const btn = document.getElementById(`cartBtn-${productId}`);
            if (btn) { btn.classList.add('added'); btn.textContent = '✓ In Cart'; }
            showToast(`${product.title} added to cart`, 'success');
        }

        function openCartDrawer() {
            if (cart.length === 0) {
                showToast('Your cart is empty', 'warning');
                return;
            }
            let message = '🛒 Your Cart:\n\n';
            let total = 0;
            cart.forEach(item => {
                message += `${item.title} x${item.qty} = KES ${item.price * item.qty}\n`;
                total += item.price * item.qty;
            });
            message += `\nTotal: KES ${total}`;
            message += `\n\nClick OK to checkout all items`;
            if (confirm(message)) {
                const firstItem = cart[0];
                openCheckout(firstItem.id);
            }
        }

        // ── SHOP RENDER FUNCTIONS ──
        function renderShop() {
            const filtered = getFilteredAndSortedResources();
            
            if (filtered.length === 0) {
                productsGrid.innerHTML = `
                    <div class="kv-empty" style="grid-column:1/-1;">
                        <span class="empty-icon">🔍</span>
                        <h3>${allResources.length === 0 ? 'No resources found' : 'No resources match your filters'}</h3>
                        <p>${allResources.length === 0 ? 'Please upload resources via the admin panel.' : 'Try adjusting your search or filters above.'}</p>
                        ${allResources.length === 0 ? `
                            <button onclick="init()" style="margin-top:12px;padding:8px 20px;background:var(--kv-gold);color:var(--kv-navy);border:none;border-radius:var(--kv-radius);cursor:pointer;font-weight:700;font-family:var(--kv-font);">🔄 Reload</button>
                        ` : `
                            <button onclick="resetFilters()" style="margin-top:12px;padding:8px 20px;background:var(--kv-gold);color:var(--kv-navy);border:none;border-radius:var(--kv-radius);cursor:pointer;font-weight:700;font-family:var(--kv-font);">Reset Filters</button>
                        `}
                    </div>
                `;
                productCount.textContent = '0';
                pagination.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * itemsPerPage;
            const end = Math.min(start + itemsPerPage, filtered.length);
            const pageItems = filtered.slice(start, end);

            let html = '';
            pageItems.forEach(r => { html += buildCardHTML(r); });
            productsGrid.innerHTML = html;
            productCount.textContent = filtered.length;

            updateSidebarCounts();

            if (totalPages > 1) {
                pagination.style.display = 'flex';
                pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
                prevPage.disabled = currentPage === 1;
                nextPage.disabled = currentPage === totalPages;
            } else {
                pagination.style.display = 'none';
            }
        }

        function getFilteredAndSortedResources() {
            let filtered = allResources.slice();

            if (activeLevel !== 'all') {
                filtered = filtered.filter(r => r.level === activeLevel);
            }
            if (activeCurriculum !== 'all') {
                filtered = filtered.filter(r => {
                    const curr = CURRICULUM_MAP[r.level] || 'other';
                    return curr === activeCurriculum;
                });
            }
            if (activeCategories.length > 0 && activeCategories.length < 4) {
                filtered = filtered.filter(r => {
                    const type = r.resource_type || r.category || r.type || '';
                    const typeClean = type.toLowerCase().replace(/\s+/g, '-');
                    return activeCategories.includes(typeClean);
                });
            }
            const searchTerm = searchInput.value.toLowerCase().trim();
            if (searchTerm) {
                filtered = filtered.filter(r => {
                    return (r.title || '').toLowerCase().includes(searchTerm) ||
                        (r.subject || '').toLowerCase().includes(searchTerm) ||
                        (r.description || '').toLowerCase().includes(searchTerm) ||
                        (r.creator_name || '').toLowerCase().includes(searchTerm);
                });
            }

            const sort = sortSelect.value || 'popular';
            if (sort === 'price-asc') filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
            else if (sort === 'price-desc') filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
            else if (sort === 'newest') filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            else if (sort === 'grade-asc') filtered.sort((a, b) => (GRADE_ORDER[a.level] || 999) - (GRADE_ORDER[b.level] || 999));
            else if (sort === 'grade-desc') filtered.sort((a, b) => (GRADE_ORDER[b.level] || 999) - (GRADE_ORDER[a.level] || 999));
            else filtered.sort((a, b) => (b.download_count || 0) - (a.download_count || 0));

            return filtered;
        }

        function buildCardHTML(r) {
            const isFree = (r.price === 0 || r.price === null || r.price === undefined) || r.resource_type === 'free';
            const priceDisplay = isFree ? 'FREE' : `KES ${r.price || 0}`;
            const productId = r.id || 'unknown';
            const safeTitle = (r.title || '').replace(/"/g, '&quot;').replace(/'/g, "\\'");
            const rating = r.rating || Math.floor(Math.random() * 2) + 3;
            const inCart = cart.some(ci => ci.id === productId);

            const freeBadge = isFree ? `<span class="cover-badge free-badge">FREE</span>` : `<span class="cover-badge">${r.badge === 'hot' ? '🔥 Hot' : r.badge === 'popular' ? 'Popular' : 'New'}</span>`;
            
            const coverHTML = r.cover_image_url ? `
                <div class="pc-cover">
                    <img src="${r.cover_image_url}" alt="${safeTitle}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
                    <div class="cover-fallback" style="display:none;">${getSubjectEmoji(r.subject) || '📄'}</div>
                    ${freeBadge}
                    <span class="cover-level">${LEVEL_DISPLAY[r.level] || r.level}</span>
                </div>
            ` : `
                <div class="pc-cover">
                    <div class="cover-fallback">${getSubjectEmoji(r.subject) || '📄'}</div>
                    ${freeBadge}
                    <span class="cover-level">${LEVEL_DISPLAY[r.level] || r.level}</span>
                </div>
            `;

            const badges = [];
            if (r.kicd_aligned !== false) badges.push('<span class="badge badge-green">KICD</span>');
            if (r.cbc_compliant !== false) badges.push('<span class="badge badge-green">CBC</span>');
            if (r.teacher_reviewed !== false) badges.push('<span class="badge badge-navy">Reviewed</span>');

            const creator = r.creator_name || r.tutor_name || 'KenyaVault';
            const buttonText = isFree ? 'Get Free' : 'Buy';

            return `
                <div class="kv-product-card" data-id="${productId}">
                    ${coverHTML}
                    <div class="pc-body">
                        <div class="pc-subject" style="color:${getSubjectColor(r.subject)}">${getSubjectEmoji(r.subject)} ${r.subject || 'General'}</div>
                        <h4>${safeTitle}</h4>
                        <div class="pc-creator"><i class="fas fa-user-graduate"></i> ${creator}</div>
                        <div class="pc-rating">${'★'.repeat(Math.round(rating))}${'☆'.repeat(5 - Math.round(rating))} <span>(${r.download_count || 0})</span></div>
                        <div class="pc-meta">
                            <span>📽️ Interactive</span>
                            <span>🎧 Audio</span>
                            <span>📥 ${r.download_count || 0}</span>
                        </div>
                        <div class="pc-badges">${badges.join('')}</div>
                    </div>
                    <div class="pc-footer">
                        <span class="pc-price">${priceDisplay}</span>
                        <div class="pc-actions">
                            <button class="btn btn-preview" onclick="openCheckout('${productId}')"><i class="fas fa-eye"></i> Preview</button>
                            <button class="btn btn-add-cart ${inCart ? 'added' : ''}" id="cartBtn-${productId}" onclick="addToCart('${productId}')">${inCart ? '✓ In Cart' : '🛒 Add'}</button>
                            <button class="btn btn-buy ${isFree ? 'free' : ''}" onclick="openCheckout('${productId}')">${buttonText}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function getSubjectEmoji(subject) {
            const map = {
                mathematics: '📐', english: '📖', kiswahili: '🗣️',
                'integrated-science': '🔬', 'social-studies': '🌍',
                'pre-technical': '🔧', agriculture: '🌾',
                'religious-education': '✝️', 'creative-arts': '🎨',
                'health-pe': '🏃', biology: '🧬', chemistry: '⚗️',
                physics: '⚡', business: '💼', 'computer-studies': '💻',
                engineering: '🔧', law: '⚖️', medicine: '🏥',
                'personal-growth': '🌱', 'financial-literacy': '💰', leadership: '🏆'
            };
            return map[subject?.toLowerCase()] || '📚';
        }

        function getSubjectColor(subject) {
            const map = {
                mathematics: '#2563EB', english: '#7C3AED', kiswahili: '#D97706',
                'integrated-science': '#16A34A', 'social-studies': '#0891B2',
                biology: '#16A34A', chemistry: '#7C3AED', physics: '#DC2626',
                business: '#0D9488', 'computer-studies': '#2563EB'
            };
            return map[subject?.toLowerCase()] || '#4B5563';
        }

        // ── UPDATE SIDEBAR COUNTS ──
        function updateSidebarCounts() {
            const levels = ['pp1', 'pp2', 'grade-1', 'grade-2', 'grade-3', 'grade-4', 'grade-5', 'grade-6', 
                           'grade-7', 'grade-8', 'grade-9', 'grade-10', 'grade-11', 'grade-12',
                           'form-1', 'form-2', 'form-3', 'form-4', 'college', 'tvet', 'university'];
            
            levels.forEach(level => {
                const count = allResources.filter(r => r.level === level).length;
                const id = level.replace('-', '').replace('grade-', 'g').replace('form-', 'f');
                const el = document.getElementById(id + 'Count');
                if (el) el.textContent = count;
            });
            
            document.getElementById('totalCount').textContent = allResources.length;
            
            const categories = ['lesson-plan', 'scheme-work', 'revision-paper', 'exam-paper'];
            categories.forEach(cat => {
                const count = allResources.filter(r => {
                    const type = (r.resource_type || r.category || r.type || '').toLowerCase().replace(/\s+/g, '-');
                    return type === cat;
                }).length;
                const el = document.getElementById('cat' + cat.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(''));
                if (el) el.textContent = count;
            });
        }

        // ── FILTER FUNCTIONS ──
        function resetFilters() {
            activeLevel = 'all';
            activeCurriculum = 'all';
            activeCategories = ['lesson-plan', 'scheme-work', 'revision-paper', 'exam-paper'];
            document.querySelectorAll('.kv-category-group input[type="checkbox"]').forEach(cb => cb.checked = true);
            searchInput.value = '';
            clearSearchBtn.classList.remove('visible');
            sortSelect.value = 'popular';
            currentPage = 1;
            document.querySelectorAll('.kv-level-tab').forEach(t => t.classList.toggle('active', t.dataset.level === 'all'));
            document.querySelectorAll('.kv-sidebar-subject').forEach(s => s.classList.toggle('active', s.dataset.levelFilter === 'all'));
            document.querySelectorAll('.kv-curriculum-toggle button').forEach(b => b.classList.toggle('active', b.dataset.curriculum === 'all'));
            renderShop();
        }

        function setLevel(level) {
            activeLevel = level;
            currentPage = 1;
            document.querySelectorAll('.kv-level-tab').forEach(t => t.classList.toggle('active', t.dataset.level === level));
            document.querySelectorAll('.kv-sidebar-subject').forEach(s => s.classList.toggle('active', s.dataset.levelFilter === level));
            renderShop();
            if (window.innerWidth <= 1024) {
                document.getElementById('kvSidebar').style.display = 'none';
            }
        }

        function setCurriculum(curriculum) {
            activeCurriculum = curriculum;
            currentPage = 1;
            document.querySelectorAll('.kv-curriculum-toggle button').forEach(b => b.classList.toggle('active', b.dataset.curriculum === curriculum));
            renderShop();
        }

        function toggleCategory(cb) {
            const category = cb.dataset.category;
            if (cb.checked) {
                if (!activeCategories.includes(category)) activeCategories.push(category);
            } else {
                activeCategories = activeCategories.filter(c => c !== category);
            }
            currentPage = 1;
            renderShop();
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                clearSearchBtn.classList.toggle('visible', searchInput.value.length > 0);
                currentPage = 1;
                renderShop();
            }, 300);
        }

        function clearSearchInput() {
            searchInput.value = '';
            clearSearchBtn.classList.remove('visible');
            currentPage = 1;
            renderShop();
        }

        function toggleMobileFilter() {
            const sidebar = document.getElementById('kvSidebar');
            sidebar.style.display = sidebar.style.display === 'block' ? 'none' : 'block';
        }

        function changePage(delta) {
            const filtered = getFilteredAndSortedResources();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            currentPage = newPage;
            renderShop();
            document.querySelector('.kv-products-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ── MOBILE NAV ──
        document.getElementById('kvHamburger')?.addEventListener('click', function() {
            const links = document.getElementById('kvNavLinks');
            links.classList.toggle('open');
            this.classList.toggle('active');
        });

        // ── KJSEA BANNER ──
        document.getElementById('kjseaBannerBtn')?.addEventListener('click', function() {
            setLevel('grade-9');
            document.querySelector('.kv-products-area').scrollIntoView({ behavior: 'smooth' });
        });

        // ── INIT ──
        async function init() {
            try {
                productsGrid.innerHTML = `
                    <div class="kv-loading">
                        <span class="spin-icon">⏳</span>
                        Loading resources...
                        <div style="margin-top:4px;font-size:0.8rem;color:var(--kv-muted);">Please wait as we search the best resources..</div>
                    </div>
                `;
                
                allResources = await fetchResources();
                loadCart();
                renderShop();
                
                const urlParams = new URLSearchParams(window.location.search);
                const levelParam = urlParams.get('level');
                if (levelParam && LEVEL_DISPLAY[levelParam]) {
                    setLevel(levelParam);
                }
                
                console.log(`✅ Loaded ${allResources.length} resources`);
                console.log('🔒 Secure payment system active - Amount validation enforced server-side');
                console.log('ℹ️  Edge Function URL:', `${SUPABASE_URL}/functions/v1/create-order`);
            } catch (error) {
                console.error('❌ Init error:', error);
                productsGrid.innerHTML = `
                    <div class="kv-empty" style="grid-column:1/-1;">
                        <span class="empty-icon">⚠️</span>
                        <h3>Failed to load resources</h3>
                        <p>${error.message || 'Please refresh the page or try again later.'}</p>
                        <button onclick="init()" style="margin-top:12px;padding:8px 20px;background:var(--kv-gold);color:var(--kv-navy);border:none;border-radius:var(--kv-radius);cursor:pointer;font-weight:700;font-family:var(--kv-font);">🔄 Retry</button>
                    </div>
                `;
                showToast('Failed to load resources. Please refresh.', 'error');
            }
        }

        // ── START ──
        document.addEventListener('DOMContentLoaded', init);

        // ── CLOSE MODALS ON OVERLAY CLICK ──
        document.querySelectorAll('.kv-checkout-modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    if (this.id === 'checkoutModal') closeCheckoutModal();
                    if (this.id === 'successModal') closeSuccessModal();
                    if (this.id === 'mismatchModal') closeMismatchModal();
                }
            });
        });

        // ── KEYBOARD SHORTCUTS ──
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (checkoutModal.classList.contains('open')) closeCheckoutModal();
                if (successModal.classList.contains('open')) closeSuccessModal();
                if (mismatchModal.classList.contains('open')) closeMismatchModal();
            }
        });

        console.log('🔒 KenyaVault Shop — Secure Payment System Active');
        console.log('✅ Payment amount validation is enforced server-side');
        console.log('❌ No price manipulation possible');
    </script>
</body>
</html>
