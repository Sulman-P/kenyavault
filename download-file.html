<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Document | KenyaVault</title>
    <meta name="description" content="Secure document download from KenyaVault. Your educational resources are ready for download." />
    <meta name="robots" content="noindex, nofollow" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <style>
        /* ── ROOT VARIABLES ── */
        :root {
            --kv-primary: #0B2340;
            --kv-primary-light: #1a3a5a;
            --kv-primary-dark: #081a30;
            
            --kv-gold: #C9971F;
            --kv-gold-light: #E8B94A;
            --kv-gold-pale: #F7EBD0;
            --kv-gold-dark: #a87d15;
            
            --kv-white: #FFFFFF;
            --kv-off-white: #FAFBFC;
            --kv-bg: #F5F3EE;
            --kv-surface: #F0EEEA;
            
            --kv-text: #172033;
            --kv-muted: #667085;
            --kv-border: #E2DDD0;
            
            --kv-red: #BB0000;
            --kv-red-light: #C41E3A;
            --kv-green: #1F7A3A;
            --kv-green-soft: #E6F5EC;
            
            --kv-radius: 16px;
            --kv-radius-sm: 8px;
            --kv-shadow-sm: 0 1px 2px rgba(11, 35, 64, 0.05);
            --kv-shadow-md: 0 4px 6px -1px rgba(11, 35, 64, 0.1);
            --kv-shadow-lg: 0 10px 15px -3px rgba(11, 35, 64, 0.1);
            --kv-transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--kv-bg);
            color: var(--kv-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* ── FLAG STRIPE ── */
        .flag-stripe {
            height: 4px;
            width: 100%;
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
        }
        .flag-stripe .stripe-black { flex: 1; background: #000000; }
        .flag-stripe .stripe-red { flex: 1; background: #BB0000; }
        .flag-stripe .stripe-green { flex: 1; background: #1F7A3A; }
        .flag-stripe .stripe-white { flex: 1; background: var(--kv-white); }

        /* ── DOWNLOAD CARD ── */
        .download-card {
            background: var(--kv-white);
            border-radius: var(--kv-radius);
            box-shadow: var(--kv-shadow-lg);
            border: 1px solid var(--kv-border);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            animation: cardFadeIn 0.5s ease forwards;
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── ICON WRAPPER ── */
        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.8rem;
        }
        .icon-wrap--success {
            background: var(--kv-green-soft);
            border: 1px solid #bbf7d0;
            color: var(--kv-green);
        }
        .icon-wrap--error {
            background: #FEF2F2;
            border: 1px solid #FEE2E2;
            color: var(--kv-red);
        }
        .icon-wrap--pending {
            background: #FEF3C7;
            border: 1px solid #FCD34D;
            color: #92400E;
        }
        .icon-wrap--info {
            background: #EFF6FF;
            border: 1px solid #93C5FD;
            color: #2563EB;
        }

        /* ── SPINNER ── */
        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(201, 151, 31, 0.2);
            border-top-color: var(--kv-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── TYPOGRAPHY ── */
        .download-title {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--kv-text);
            margin: 0 0 0.5rem;
        }
        .download-title--success { color: var(--kv-green); }
        .download-title--error { color: var(--kv-red); }
        .download-title--pending { color: #92400E; }

        .download-subtitle {
            font-size: 0.9rem;
            color: var(--kv-muted);
            margin: 0 0 1.25rem;
            line-height: 1.6;
        }

        /* ── DOCUMENT INFO BOX ── */
        .doc-box {
            background: var(--kv-surface);
            border-radius: var(--kv-radius-sm);
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--kv-text);
            text-align: left;
            border: 1px solid var(--kv-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .doc-box i {
            color: var(--kv-gold);
            font-size: 1.1rem;
        }
        .doc-box .doc-id {
            font-size: 0.7rem;
            color: var(--kv-muted);
            font-weight: 400;
            margin-left: auto;
        }

        /* ── BUTTONS ── */
        .btn-primary {
            background: var(--kv-gold);
            color: var(--kv-primary);
            padding: 0.75rem 1.5rem;
            border-radius: var(--kv-radius-sm);
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--kv-transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:hover {
            background: var(--kv-gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 151, 31, 0.3);
        }

        .btn-wa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #25D366;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: var(--kv-radius-sm);
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            transition: var(--kv-transition);
            border: none;
            cursor: pointer;
        }
        .btn-wa:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.3);
        }

        .btn-secondary {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--kv-muted);
            text-decoration: underline;
            transition: var(--kv-transition);
            background: none;
            border: none;
            cursor: pointer;
        }
        .btn-secondary:hover {
            color: var(--kv-gold);
        }

        .btn-retry {
            display: inline-block;
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--kv-muted);
            text-decoration: underline;
            transition: var(--kv-transition);
            background: none;
            border: none;
            cursor: pointer;
        }
        .btn-retry:hover {
            color: var(--kv-gold);
        }

        /* ── STATUS BADGE ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            margin-bottom: 0.75rem;
        }
        .status-badge--success {
            background: var(--kv-green-soft);
            color: var(--kv-green);
        }
        .status-badge--error {
            background: #FEF2F2;
            color: var(--kv-red);
        }
        .status-badge--pending {
            background: #FEF3C7;
            color: #92400E;
        }
        .status-badge--info {
            background: #EFF6FF;
            color: #2563EB;
        }

        /* ── PROGRESS BAR ── */
        .progress-bar-wrap {
            width: 100%;
            height: 4px;
            background: var(--kv-border);
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .progress-bar {
            height: 100%;
            background: var(--kv-gold);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
            animation: progressAnim 2s ease-in-out forwards;
        }
        @keyframes progressAnim {
            0% { width: 0%; }
            30% { width: 30%; }
            60% { width: 65%; }
            85% { width: 85%; }
            100% { width: 100%; }
        }

        /* ── LOADING DOTS ── */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 4px;
        }
        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--kv-muted);
            border-radius: 50%;
            animation: dotBounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loading-dots span:nth-child(3) { animation-delay: 0s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .download-card {
                padding: 1.75rem 1.25rem;
            }
            .icon-wrap {
                width: 52px;
                height: 52px;
                font-size: 1.4rem;
            }
            .download-title {
                font-size: 1.05rem;
            }
            .doc-box {
                font-size: 0.78rem;
                padding: 0.6rem 0.75rem;
                flex-wrap: wrap;
            }
            .doc-box .doc-id {
                margin-left: 0;
                width: 100%;
            }
        }

        /* ── UTILITY ── */
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .text-center { text-align: center; }
        .flex { display: flex; align-items: center; gap: 0.5rem; }
        .flex-center { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
    </style>
</head>
<body>

<!-- ════════════════════════════════════════ -->
<!-- FLAG STRIPE -->
<!-- ════════════════════════════════════════ -->
<div class="flag-stripe">
    <div class="stripe-black"></div>
    <div class="stripe-red"></div>
    <div class="stripe-green"></div>
    <div class="stripe-white"></div>
</div>

<!-- ════════════════════════════════════════ -->
<!-- DOWNLOAD CARD -->
<!-- ════════════════════════════════════════ -->
<div class="download-card" id="downloadCard">
    
    <!-- Dynamic Content Area -->
    <div id="downloadContent">
        <!-- Initial Loading State -->
        <div class="icon-wrap icon-wrap--pending">
            <div class="spinner"></div>
        </div>
        
        <span class="status-badge status-badge--pending">
            <i class="bi bi-clock-history"></i> Processing
        </span>
        
        <h1 class="download-title download-title--pending" id="statusTitle">
            Preparing Your Download
        </h1>
        
        <p class="download-subtitle" id="statusMessage">
            Your document is being prepared. Please wait...
        </p>

        <div class="progress-bar-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="doc-box" id="docInfoBox">
            <i class="bi bi-file-earmark-text"></i>
            <span id="docTitle">Loading document information...</span>
            <span class="doc-id" id="docId">#---</span>
        </div>

        <!-- Action buttons will be dynamically shown/hidden -->
        <div id="actionButtons">
            <!-- Download button (shown on success) -->
            <button class="btn-primary" id="downloadBtn" style="display: none;">
                <i class="bi bi-download"></i> Download Now
            </button>

            <!-- WhatsApp button (shown on file missing) -->
            <a href="#" class="btn-wa" id="whatsappBtn" target="_blank" style="display: none;">
                <i class="bi bi-whatsapp"></i> Receive File on WhatsApp
            </a>

            <!-- Retry button -->
            <button class="btn-secondary" id="retryBtn" onclick="location.reload()" style="display: none;">
                <i class="bi bi-arrow-repeat"></i> Click here to retry download
            </button>

            <!-- Back to shop -->
            <a href="/shop.html" class="btn-secondary" id="backToShopBtn" style="display: none;">
                <i class="bi bi-arrow-left"></i> Back to Shop
            </a>
        </div>
    </div>

</div>

<!-- ════════════════════════════════════════ -->
<!-- SCRIPT -->
<!-- ════════════════════════════════════════ -->
<script>
(function() {
    'use strict';

    // ── CONFIG ──────────────────────────────────────────────────
    // Simulate different states for demo purposes
    // Possible states: 'success', 'error', 'missing', 'pending'
    const DEMO_STATE = 'success'; // Change this to test different states
    
    // Mock document data
    const mockDocument = {
        id: 12345,
        title: 'Grade 7 Mathematics Schemes of Work - Term 1',
        filename: 'grade_7_maths_schemes_term_1.docx',
        price: 150,
        isFree: false
    };

    // ── DOM REFS ──────────────────────────────────────────────
    const statusTitle = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');
    const docTitle = document.getElementById('docTitle');
    const docId = document.getElementById('docId');
    const docInfoBox = document.getElementById('docInfoBox');
    const downloadBtn = document.getElementById('downloadBtn');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const retryBtn = document.getElementById('retryBtn');
    const backToShopBtn = document.getElementById('backToShopBtn');
    const progressBar = document.getElementById('progressBar');
    const statusBadge = document.querySelector('.status-badge');
    const iconWrap = document.querySelector('.icon-wrap');

    // ── HELPERS ──────────────────────────────────────────────
    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            token: params.get('token'),
            id: params.get('id'),
            email: params.get('email')
        };
    }

    function getStateFromParams() {
        const params = getUrlParams();
        // If we have token, id, and email, try to simulate success
        if (params.token && params.id && params.email) {
            return 'success';
        }
        // If we have id only, simulate checking
        if (params.id) {
            return 'pending';
        }
        // Default to showing error
        return 'error';
    }

    function updateUI(state, documentData) {
        const doc = documentData || mockDocument;
        
        // Update document info
        docTitle.textContent = doc.title || 'Unknown Document';
        docId.textContent = '# ' + (doc.id || '---');

        // Reset all buttons
        downloadBtn.style.display = 'none';
        whatsappBtn.style.display = 'none';
        retryBtn.style.display = 'none';
        backToShopBtn.style.display = 'none';

        // Update progress bar
        if (progressBar) {
            if (state === 'success') {
                progressBar.style.width = '100%';
            } else if (state === 'pending') {
                progressBar.style.width = '65%';
            } else {
                progressBar.style.width = '0%';
            }
        }

        switch (state) {
            case 'success':
                iconWrap.className = 'icon-wrap icon-wrap--success';
                iconWrap.innerHTML = '<i class="bi bi-check-circle-fill"></i>';
                statusBadge.className = 'status-badge status-badge--success';
                statusBadge.innerHTML = '<i class="bi bi-check-circle"></i> Ready for Download';
                statusTitle.className = 'download-title download-title--success';
                statusTitle.textContent = 'Your Document is Ready!';
                statusMessage.textContent = 'Your document has been prepared. Click the button below to download it instantly.';
                downloadBtn.style.display = 'flex';
                backToShopBtn.style.display = 'inline-block';
                
                // Set up download button
                downloadBtn.onclick = function() {
                    // Simulate download
                    statusMessage.textContent = 'Starting download...';
                    downloadBtn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Downloading...';
                    downloadBtn.disabled = true;
                    
                    setTimeout(function() {
                        // Create a fake download
                        const link = document.createElement('a');
                        link.href = '#';
                        link.download = doc.filename || 'document.pdf';
                        link.click();
                        
                        statusMessage.textContent = 'Download complete! Your file has been saved.';
                        downloadBtn.innerHTML = '<i class="bi bi-check-circle"></i> Downloaded';
                        downloadBtn.disabled = false;
                        
                        // Show back to shop
                        backToShopBtn.style.display = 'inline-block';
                    }, 1500);
                };
                break;

            case 'pending':
                iconWrap.className = 'icon-wrap icon-wrap--pending';
                iconWrap.innerHTML = '<div class="spinner"></div>';
                statusBadge.className = 'status-badge status-badge--pending';
                statusBadge.innerHTML = '<i class="bi bi-clock-history"></i> Processing';
                statusTitle.className = 'download-title download-title--pending';
                statusTitle.textContent = 'Preparing Your Download';
                statusMessage.textContent = 'Your document is being prepared. Please wait...';
                retryBtn.style.display = 'inline-block';
                retryBtn.textContent = 'Check Status';
                retryBtn.onclick = function() {
                    location.reload();
                };
                break;

            case 'missing':
                iconWrap.className = 'icon-wrap icon-wrap--error';
                iconWrap.innerHTML = '<i class="bi bi-file-earmark-excel"></i>';
                statusBadge.className = 'status-badge status-badge--error';
                statusBadge.innerHTML = '<i class="bi bi-exclamation-triangle"></i> File Unavailable';
                statusTitle.className = 'download-title download-title--error';
                statusTitle.textContent = 'File Preparing for Download';
                statusMessage.innerHTML = 'The file for your purchased item is being synchronized from archive. Your download token remains 100% active.';
                
                // Set up WhatsApp button
                const supportPhone = '254768515494';
                const waMsg = encodeURIComponent(
                    'Hello KenyaVault Support, I purchased Document #' + doc.id + 
                    ' ("' + doc.title.substring(0, 40) + '") but the file link needs a refresh. Please send me the file directly.'
                );
                whatsappBtn.href = 'https://wa.me/' + supportPhone + '?text=' + waMsg;
                whatsappBtn.style.display = 'flex';
                retryBtn.style.display = 'inline-block';
                retryBtn.textContent = 'Click here to retry download';
                retryBtn.onclick = function() {
                    location.reload();
                };
                break;

            case 'error':
            default:
                iconWrap.className = 'icon-wrap icon-wrap--error';
                iconWrap.innerHTML = '<i class="bi bi-x-circle-fill"></i>';
                statusBadge.className = 'status-badge status-badge--error';
                statusBadge.innerHTML = '<i class="bi bi-exclamation-circle"></i> Error';
                statusTitle.className = 'download-title download-title--error';
                statusTitle.textContent = 'Download Link Expired';
                statusMessage.innerHTML = 'Your download link has expired or is invalid. Please request a new link or contact support.';
                
                // Show both WhatsApp and back to shop
                const supportPhone2 = '254768515494';
                const waMsg2 = encodeURIComponent(
                    'Hello KenyaVault Support, I need a new download link for Document #' + doc.id + 
                    ' ("' + doc.title.substring(0, 40) + '"). Please assist.'
                );
                whatsappBtn.href = 'https://wa.me/' + supportPhone2 + '?text=' + waMsg2;
                whatsappBtn.style.display = 'flex';
                backToShopBtn.style.display = 'inline-block';
                break;
        }
    }

    // ── SIMULATE CHECKING STATUS ──────────────────────────────
    function checkDownloadStatus() {
        // Get the state from URL params or use demo state
        let state = getStateFromParams();
        
        // For demo purposes, override with DEMO_STATE if set
        if (window.DEMO_STATE) {
            state = window.DEMO_STATE;
        } else if (typeof DEMO_STATE !== 'undefined') {
            state = DEMO_STATE;
        }

        // Simulate a brief loading delay
        setTimeout(function() {
            updateUI(state, mockDocument);
        }, 800);
    }

    // ── INIT ──────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
        // Allow override via URL parameter: ?demo=success|error|missing|pending
        const params = new URLSearchParams(window.location.search);
        const demoState = params.get('demo');
        if (demoState && ['success', 'error', 'missing', 'pending'].includes(demoState)) {
            window.DEMO_STATE = demoState;
        }

        checkDownloadStatus();
    });

})();
</script>

</body>
</html>
